# Build Verification — builds the server image + boots the EE/SaaS bundle.
# Trunk model: runs on master pushes (post-merge gate) + manual dispatch (used
# at release cut), NOT on every PR — keeps PRs fast; heavy gates run at
# merge/release. The boot step is the #574 circular-dep regression guard.
name: Build Verify

# Full Suite calls this after merge and before release publication.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  # Every caller on a ref writes the same Docker build cache. Queue those
  # writers: a release fallback must never cancel the master-push evidence it
  # is meant to consume, and parallel writers can clobber the shared cache.
  group: build-verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

env:
  IMAGE_NAME: genfeed-server-verify

jobs:
  # Release-cut boot gate — builds the COMPILED api and workers bundles and
  # loads their compiled module graphs with BOOT_CHECK=1, which exits before
  # NestFactory connects to external services (no live DB or Redis). Kept out of
  # normal PR CI so pull requests stay fast, but still runs before Docker release
  # verification.
  api-boot-check:
    name: Server Bundle Boot Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build api and workers (compiled bundles)
        run: bunx turbo run build --filter=@genfeedai/api --filter=@genfeedai/workers
      - name: Verify compiled bundles and upgrade existing data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPGRADE_VERIFY_ADMIN_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
        run: |
          BOOT_CHECK=1 timeout 120 node apps/server/dist/apps/api/main.js
          NODE_ENV=production \
            PORT=3001 \
            DATABASE_URL=postgresql://localhost/boot_check \
            BOOT_CHECK=1 \
            timeout 120 node apps/server/dist/apps/workers/main.js
          previous_release="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -er '[.[][] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // error("No published stable server release")')"
          [[ "$previous_release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git fetch origin "refs/tags/${previous_release}:refs/tags/${previous_release}"
          bun run packages/prisma/scripts/verify-release-upgrade.ts --from="$previous_release"
      - name: Upload upgrade verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-upgrade-evidence
          path: ~/.codex/artifacts/release-upgrade-*/evidence.json
          retention-days: 7
          if-no-files-found: error

  build-and-boot:
    name: Build & Boot Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-boot-check
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR (for build cache)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build unified server image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}/server:buildcache
            type=registry,ref=ghcr.io/${{ github.repository }}/server:buildcache-verify
          platforms: linux/amd64
          # No Sentry secrets needed — verify-only build, sourcemaps not deployed

      - name: Verify build outputs exist
        run: |
          echo "Checking build outputs inside image..."
          docker run --rm ${{ env.IMAGE_NAME }}:test \
            sh -c '
              echo "Checking critical bundles..."
              test -f apps/server/dist/apps/api/main.js && echo "✅ API bundle" || (echo "❌ API bundle missing" && exit 1)
              test -f apps/server/dist/apps/workers/main.js && echo "✅ Workers bundle" || (echo "❌ Workers bundle missing" && exit 1)
              test -f apps/server/dist/apps/files/main.js && echo "✅ Files bundle" || (echo "❌ Files bundle missing" && exit 1)
              test -f apps/server/dist/apps/mcp/main.js && echo "✅ MCP bundle" || (echo "❌ MCP bundle missing" && exit 1)
              test -f apps/server/dist/apps/notifications/main.js && echo "✅ Notifications bundle" || (echo "❌ Notifications bundle missing" && exit 1)
              test -f apps/server/dist/apps/telegram/main.js && echo "✅ Telegram bundle" || (echo "❌ Telegram bundle missing" && exit 1)
              test -f apps/server/dist/apps/discord/main.js && echo "✅ Discord bundle" || (echo "❌ Discord bundle missing" && exit 1)
              test -f apps/server/dist/apps/slack/main.js && echo "✅ Slack bundle" || (echo "❌ Slack bundle missing" && exit 1)
              echo ""
              echo "All 8 service bundles verified ✅"

              # Check bundle sizes (catch empty/broken bundles)
              for svc in api workers files mcp notifications telegram discord slack; do
                SIZE=$(stat -c%s "apps/server/dist/apps/$svc/main.js" 2>/dev/null || echo "0")
                if [ "$SIZE" -lt 10000 ]; then
                  echo "❌ $svc bundle suspiciously small (${SIZE} bytes)"
                  exit 1
                fi
                echo "  $svc: $(( SIZE / 1024 ))KB"
              done
            '

      - name: Boot-check EE/SaaS server bundles (#574 circular-dep regression guard)
        run: |
          # The bundle-exists check above never RUNS the bundles. Load both
          # compiled entrypoints from the actual EE image with minimal config;
          # BOOT_CHECK exits after module evaluation and before Nest connects to
          # Postgres/Redis. This catches TDZ/circular-import crashes in the same
          # production artifacts that the release deploys.
          for service in api workers; do
            echo "Boot-checking EE/SaaS ${service} bundle..."
            docker run --rm \
              -e NODE_ENV=production \
              -e PORT=3001 \
              -e DATABASE_URL=postgresql://localhost/boot_check \
              -e BOOT_CHECK=1 \
              ${{ env.IMAGE_NAME }}:test \
              node "apps/server/dist/apps/${service}/main.js"
          done

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ✅ Build Verification Passed"
            echo ""
            echo "Docker image built + all 11 bundles verified; EE api and workers bundles loaded without module-init errors (#574 guard)."
          } >> "$GITHUB_STEP_SUMMARY"
