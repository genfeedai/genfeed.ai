name: Frontend Validation

on:
  workflow_call:
    inputs:
      run_heavy_tests:
        type: boolean
        required: false
        default: false
    secrets:
      TURBO_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  # The diff base for every "changed since base" step (turbo `--affected`,
  # vitest `--changed`, the PR test plan) is CI_BASE_SHA, resolved once by the
  # Plan job and passed to each job through `needs.plan.outputs.base`. Only
  # PRs and merge groups have one; other events run the full paths.
  CI_IS_CHANGE_RUN: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TZ: UTC

jobs:
  # Independent frontend graph: fork PRs retain read-only measurements even
  # when the test planner refuses untrusted code. Heavy reusable callers must
  # not repeat the bundle run already owned by the direct PR event.
  bundle-size:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && inputs.run_heavy_tests != true
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_bundle-size.yml
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  link-check-detect:
    permissions:
      contents: read
    name: Detect Link-Check Scope
    # Inapplicable detection is a cheap witness without source checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      website: ${{ steps.scope.outputs.website || steps.admission.outputs.website }}
      docs: ${{ steps.scope.outputs.docs || steps.admission.outputs.docs }}
    steps:
      - id: admission
        if: ${{ !(github.event_name == 'pull_request' && !github.event.pull_request.draft && inputs.run_heavy_tests != true) }}
        shell: bash
        run: |
          echo "website=false" >> "$GITHUB_OUTPUT"
          echo "docs=false" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && !github.event.pull_request.draft && inputs.run_heavy_tests != true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: scope
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && inputs.run_heavy_tests != true
        uses: ./.github/actions/detect-link-check-scope

  website-links:
    permissions:
      contents: read
    name: Website Links + Orphans + SEO
    runs-on: ubuntu-latest
    needs: link-check-detect
    if: needs.link-check-detect.outputs.website == 'true'
    # Existing complete workload: production build, 120s readiness, crawl/orphans and SEO.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/check-website-links

  docs-links:
    permissions:
      contents: read
    name: Docs + Markdown Dead Links
    runs-on: ubuntu-latest
    needs: link-check-detect
    if: needs.link-check-detect.outputs.docs == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/check-docs-links
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
