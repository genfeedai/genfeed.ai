name: CI

# No standalone `push` trigger: master pushes are validated by full-suite.yml,
# which calls this workflow with `run_heavy_tests: true`. A push trigger here
# ran the same commit twice per merge (standalone affected tier + the nested
# heavy tier under Full Suite). The push-gated jobs below (the tests-gate push
# arm, the master failure tracker, the merge-queue janitor) still fire on every
# master push inside that nested run, because a reusable workflow inherits the
# CALLER's originating event — `github.event_name` is `push` there.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # GitHub merge queue (#3143). Every PR that reaches `master` re-runs this
  # gate on the queue's temporary `gh-readonly-queue/master/...` merge commit
  # (its head is the *current* master + the PR), so a PR that went green on a
  # stale base can no longer red master. Required contexts must report on that
  # commit or the queue times out and drops the entry.
  merge_group:
    types: [checks_requested]
  # Allow this gate to be run as a reusable workflow (e.g. by full-suite.yml,
  # which chains CI → E2E on demand). Secrets are inherited.
  workflow_call:
    inputs:
      run_heavy_tests:
        # Gate for the heavy test matrix (packages, server services,
        # web/mobile, app + api shards). Desktop and extension checks are
        # temporarily dormant while those surfaces are not being delivered.
        # Callers on the release path (full-suite.yml) pass `true` to run the
        # remaining full suite.
        #
        # This is an explicit input — NOT a `github.event_name == 'workflow_call'`
        # check — because a reusable workflow inherits the CALLER's originating
        # event (e.g. `workflow_dispatch` from release.yml), so `event_name`
        # is never `workflow_call` here and the old gate silently skipped every
        # heavy test job on the release QA path.
        description: 'Run the full heavy test matrix (release QA path).'
        type: boolean
        required: false
        default: false

# The `ci-` prefix is REQUIRED. `github.workflow` resolves to the top-level
# workflow name even inside a `workflow_call`, so without a distinct prefix this
# group collides with a caller that uses the same `${{ github.workflow }}-${{
# github.ref }}` shape (release.yml → full-suite.yml). On the release
# path `ci` runs UNDER full-suite, both computed the same group with
# cancel-in-progress, and the nested `ci` cancelled itself at startup (0 jobs) —
# tripping cancel-doomed-run and silently killing every stable release. The
# prefix guarantees this group never matches a caller's group.
#
# `cancel-in-progress` is PULL-REQUEST ONLY. On a PR, a new push makes the
# running validation obsolete, so cancelling is free. Nested runs (merge queue,
# full-suite/release workflow_call) are never cancelled from HERE:
#   - `merge_group` entries each get their own `gh-readonly-queue/...` ref, so
#     the group is already unique per entry, and a cancelled run would time the
#     entry out of the queue.
#   - master pushes reach this workflow only via full-suite.yml's call, where
#     the group is `ci-<caller workflow>-refs/heads/master` and the event is
#     `push` (inherited) → cancel-in-progress false. Master-push supersession
#     is owned by full-suite.yml's OWN top-level group (master is cumulative,
#     newest run validates a superset), which cancels the whole caller run —
#     nested jobs included. History: on 2026-07-31, when this workflow still
#     had its own push trigger with unconditional cancel, NINE consecutive
#     master runs were cancelled mid-burst and a non-booting API (#2270) rode
#     master unreported for twenty minutes. Supersession must live at the
#     full-suite level, never here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  # Diff base for every "changed since base" step (secretlint scope, turbo
  # `--affected`, vitest `--changed`, the PR test plan). One expression, so a
  # new event type is wired in one place:
  #   pull_request → PR base (master at PR-head time)
  #   merge_group  → queue base (current master the entry is being tested on)
  #   push         → previous master head (`github.event.before`); arrives via
  #                  full-suite.yml's master-push call (event payload inherited)
  #   workflow_dispatch → '' → callers fall back to full runs / HEAD~1
  CI_BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before || '' }}
  # True when the run validates a proposed change against a base (PR or queue
  # entry) rather than a landed master commit; gates the "affected only" paths.
  CI_IS_CHANGE_RUN: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TZ: UTC

jobs:
  trust:
    name: Trust Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-trusted: ${{ steps.non_pr.outputs.trusted || steps.check.outputs.trusted }}
      # Single source of truth for "run the full heavy matrix on this run".
      # Every heavy gate below reads this instead of re-deriving the escalation
      # signals, so the tier can never disagree between jobs.
      heavy-tier: ${{ steps.tier.outputs.heavy }}
    steps:
      - name: Allow non-PR events
        id: non_pr
        if: github.event_name != 'pull_request'
        run: echo "trusted=true" >> "$GITHUB_OUTPUT"

      - name: Check contributor trust
        id: check
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const association = pr.author_association;
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isSameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isTrusted = isSameRepository || trustedRoles.includes(association);
            const hasLabel = pr.labels.some(l => l.name === 'run-ci');

            // Trust decides *whether* CI runs; this decides *how much* of it.
            // An external contributor stays external even once a maintainer
            // adds `run-ci`: the label buys them a run, not the light tier.
            core.setOutput('external', isTrusted ? 'false' : 'true');

            if (isTrusted) {
              const trustReason = isSameRepository
                ? 'same-repo PR'
                : `trusted contributor (${association})`;
              core.info(`${trustReason} - CI allowed`);
              core.setOutput('trusted', 'true');
            } else if (hasLabel) {
              core.info('External contributor with run-ci label - CI allowed');
              core.setOutput('trusted', 'true');
            } else {
              core.setOutput('trusted', 'false');
              core.setFailed(
                `External contributor (${association}) - add the \`run-ci\` label to allow CI. ` +
                'A maintainer must review the code and add the label.'
              );
            }

      # Trust-tiered heavy matrix (open-source PR policy).
      #
      # Maintainer and same-repo PRs run the affected tier: the planner picks
      # the shards the diff can actually break, and full-suite.yml runs the
      # complete matrix on the master push a few minutes later, so a maintainer
      # mistake is caught at most one merge behind.
      #
      # A fork PR from an external contributor gets no such safety net — nobody
      # is watching the post-merge signal on their behalf, and the affected-tier
      # planner trusts the diff to describe its own blast radius. Those PRs run
      # the full heavy matrix on the PR itself.
      #
      # `run_heavy_tests` (full-suite / release path) and the `full-suite` label
      # keep working as before, for anyone.
      - name: Resolve heavy test tier
        id: tier
        env:
          EXTERNAL_CONTRIBUTOR: ${{ steps.check.outputs.external }}
          FULL_SUITE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
          RUN_HEAVY_INPUT: ${{ inputs.run_heavy_tests }}
        run: |
          set -euo pipefail
          heavy=false
          reason='affected tier'
          if [ "${RUN_HEAVY_INPUT}" = "true" ]; then
            heavy=true
            reason='run_heavy_tests input'
          elif [ "${FULL_SUITE_LABEL}" = "true" ]; then
            heavy=true
            reason='full-suite label'
          elif [ "${EXTERNAL_CONTRIBUTOR}" = "true" ]; then
            heavy=true
            reason='external contributor PR'
          fi
          echo "heavy=${heavy}" >>"${GITHUB_OUTPUT}"
          echo "Heavy test tier: ${heavy} (${reason})"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trust
    # gitleaks-action does not support the `release` event ("The [release] event is
    # not yet supported") and hard-fails on it. Release-triggered runs (self-hosted
    # publish) skip it — the same commit was already secret-scanned on push to master.
    #
    # Dependabot runs read the Dependabot secret store, not the Actions one, so
    # `secrets.GITLEAKS_LICENSE` arrives empty and the action hard-fails with
    # "[genfeedai] is an organization. License key is required." It has failed on
    # every Dependabot PR, which is zero signal, not added safety: the diff is a
    # bot-authored manifest/lockfile bump, `Secretlint (changed files)` still runs,
    # and the history this job scans was already scanned on push to master.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && github.event_name != 'release'
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # gitleaks-action also hard-fails on `merge_group` ("The [merge_group]
        # event is not yet supported"), and Gitleaks is a required context on
        # the queue commit (#3143). Queue runs scan the same range below.
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Scan the queue entry with the gitleaks CLI
        if: github.event_name == 'merge_group'
        # The queue commit is master + the PR's commits, so `CI_BASE_SHA..HEAD`
        # is exactly what gitleaks-action scanned on the PR (minus the merge
        # commit itself, which carries no new content). The image is root with
        # `safe.directory '*'`; `.gitleaks.toml` and `.gitleaksignore` are read
        # from the mounted repo root, same as the action.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --log-opts="--no-merges ${CI_BASE_SHA}..HEAD" \
            --redact --verbose --exit-code=1

  # Format, secretlint, lint, typecheck, and the executable contracts run
  # sequentially in one runner slot (#1969). As five separate jobs each paid
  # its own checkout + Bun setup (~40s of a ~1-minute job) and together they
  # held four queue slots per run while the org pool was saturated. Build no
  # longer waits on them — the Tests Gate holds their failure semantics via
  # STATIC_CHECKS_RESULT, so the merge bar is unchanged.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Check formatting
        run: bun run format:check
      - name: Get changed files for secretlint
        id: changed
        run: |
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "$CI_BASE_SHA" HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|toml|sh|env.*)$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|toml|sh|env.*)$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No scannable files changed"
          else
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Scanning $(echo "$FILES" | wc -l | xargs) files"
          fi
      - name: Run secretlint on changed files
        if: steps.changed.outputs.files != ''
        run: echo "${{ steps.changed.outputs.files }}" | xargs bunx secretlint
        timeout-minutes: 5
      - name: Run lint
        run: |
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            TURBO_SCM_BASE="$CI_BASE_SHA" bunx turbo run lint --affected --concurrency=1
          else
            bun run lint
          fi
      - name: Run typecheck
        run: |
          set -o pipefail
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            TURBO_SCM_BASE="$CI_BASE_SHA" bunx turbo run type-check --affected --concurrency=1 \
              2>&1 | tee "${RUNNER_TEMP}/turbo-type-check.log"
          else
            bunx turbo run type-check --concurrency=1 \
              2>&1 | tee "${RUNNER_TEMP}/turbo-type-check.log"
          fi
      # Annotation only, never a gate: a rejected TURBO_TOKEN makes turbo print
      # one warning, exit 0, and rebuild every task cold, so the remote cache
      # can sit dead for months while CI stays green and slow.
      - name: Check Turbo remote cache is live
        if: ${{ !cancelled() && env.TURBO_TOKEN != '' }}
        continue-on-error: true
        run: node scripts/ci/check-turbo-remote-cache.mjs "${RUNNER_TEMP}/turbo-type-check.log"
      - name: Run executable contracts
        run: bun run test:executable-contracts

  # The Typecheck job above cannot see spec files: every backend workspace's
  # tsconfig.typecheck.json excludes them, and no vitest config enables
  # `typecheck`. #2369 shipped a spec calling a deleted method straight through
  # that hole. This job typechecks them against the same compiler options via
  # tsconfig.typecheck.specs.json and ratchets the pre-existing debt.
  #
  # On change runs (PR / merge queue) the scope step below narrows the ratchet
  # to the server workspaces the diff can actually affect, and skips the whole
  # tail (Bun setup, package build, loop) when nothing server-related changed —
  # the common frontend-only PR. Anything shared (packages/**, root configs,
  # apps/server files outside a single workspace, this workflow) escalates to
  # every workspace, as does a heavy run, the full-suite label, or a missing
  # diff base. Heavy full-suite runs on master push always cover all
  # workspaces, so any cross-workspace drift a scoped PR run misses lands at
  # most one merge behind. Each workspace is still checked in a fresh Bun
  # process so TypeScript can release the previous program's memory before
  # loading the next workspace; the CLI scopes the repo-wide baseline to the
  # requested workspace on each invocation.
  spec-typecheck:
    name: Spec Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine spec typecheck scope
        id: scope
        env:
          RUN_HEAVY: ${{ needs.trust.outputs.heavy-tier == 'true' }}
        run: |
          set -euo pipefail
          all_workspaces=()
          for config in apps/server/*/tsconfig.typecheck.specs.json; do
            workspace="${config#apps/server/}"
            all_workspaces+=("${workspace%%/*}")
          done

          emit() {
            echo "workspaces=$1" >>"${GITHUB_OUTPUT}"
            if [ -n "$1" ]; then
              echo "run_any=true" >>"${GITHUB_OUTPUT}"
            else
              echo "run_any=false" >>"${GITHUB_OUTPUT}"
            fi
            echo "Spec typecheck scope: ${1:-<none>} ($2)"
          }

          # Heavy tier, non-change runs (master push / release), and runs with
          # no usable diff base always check every workspace.
          if [ "${RUN_HEAVY}" = "true" ] || [ "${CI_IS_CHANGE_RUN}" != "true" ] || [ -z "${CI_BASE_SHA}" ]; then
            emit "${all_workspaces[*]}" "full: heavy tier or no diff base"
            exit 0
          fi

          if ! changed="$(git diff --name-only "${CI_BASE_SHA}...HEAD")"; then
            emit "${all_workspaces[*]}" "full: diff base unresolvable"
            exit 0
          fi

          declare -A affected=()
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            case "${file}" in
              apps/server/*/*)
                workspace="${file#apps/server/}"
                workspace="${workspace%%/*}"
                # A changed workspace without its own ratchet config feeds
                # every program.
                if [ -f "apps/server/${workspace}/tsconfig.typecheck.specs.json" ]; then
                  affected["${workspace}"]=1
                else
                  emit "${all_workspaces[*]}" "full: shared server surface ${file}"
                  exit 0
                fi
                ;;
              apps/server/*)
                # Shallow files under apps/server are the shared configs every
                # program extends (tsconfig.json, tsconfig.typecheck.base.json).
                # `case` globs span `/`, so these fall through apps/server/*/*
                # and would otherwise be swallowed by the apps/* branch below.
                emit "${all_workspaces[*]}" "full: shared server config ${file}"
                exit 0
                ;;
              apps/*)
                # Frontend/desktop apps never feed server spec programs.
                ;;
              *)
                # packages/**, root tsconfigs, scripts, lockfile, workflows —
                # anything outside apps/ can reshape every program: escalate.
                emit "${all_workspaces[*]}" "full: shared surface ${file}"
                exit 0
                ;;
            esac
          done <<<"${changed}"

          scoped=()
          for workspace in "${all_workspaces[@]}"; do
            if [ -n "${affected[${workspace}]:-}" ]; then
              scoped+=("${workspace}")
            fi
          done
          emit "${scoped[*]-}" "affected only"
      - name: Setup Bun environment
        if: steps.scope.outputs.run_any == 'true'
        uses: ./.github/actions/setup-bun-env
      - name: Spec Typecheck Guard Tests
        if: steps.scope.outputs.run_any == 'true'
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-spec-typecheck.test.ts
      # The typecheck base config resolves @genfeedai/enums and
      # @genfeedai/constants to their dist output, so the package graph has to
      # exist before any program is created.
      - name: Build packages
        if: steps.scope.outputs.run_any == 'true'
        run: bunx turbo run build --filter='./packages/*' --concurrency=1
      - name: Spec Typecheck Ratchet
        if: steps.scope.outputs.run_any == 'true'
        # Keep each TypeScript program in its own process. A single repo-wide
        # process retained enough compiler state to hit the runner shutdown
        # window without emitting a diagnostic.
        #
        # Every workspace runs even after one fails. `api` sorts first and holds
        # most of the debt, so a bare `set -e` loop aborted there and hid the
        # other eleven: #2758 reported 7 drifted entries in `api` while `files`
        # and `mcp` held 2 more that only a local regeneration surfaced. One
        # baseline fix would otherwise cost a CI round-trip per workspace.
        # Failures are collected and their diagnostics replayed together below.
        env:
          SCOPED_WORKSPACES: ${{ steps.scope.outputs.workspaces }}
        run: |
          set -euo pipefail
          log_dir="$(mktemp -d)"
          failed=()
          checked=0
          for workspace in ${SCOPED_WORKSPACES}; do
            checked=$((checked + 1))
            echo "::group::Spec typecheck: ${workspace}"
            # `if !` keeps `set -e` from aborting the loop on a failing
            # workspace; `pipefail` keeps `tee` from masking the real status.
            if ! bun run check:spec-typecheck --workspace "${workspace}" 2>&1 \
              | tee "${log_dir}/${workspace}.log"; then
              failed+=("${workspace}")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -eq 0 ]; then
            echo "Spec typecheck ratchet passed across ${checked} workspace(s)."
            exit 0
          fi

          # Replay outside the collapsed groups so every workspace's
          # diagnostics are visible without expanding the log by hand.
          echo "::error::Spec typecheck ratchet failed in ${#failed[@]} of ${checked} workspace(s): ${failed[*]}"
          for workspace in "${failed[@]}"; do
            echo "----- ${workspace} -----"
            cat "${log_dir}/${workspace}.log"
          done
          exit 1

  # Heavy test jobs key off this planner's outputs on every event: on pull
  # requests the diff base is the PR base, on merge-queue runs it is the queue
  # base (current master), on master pushes it is `github.event.before` (the
  # previous trunk tip) — all via `CI_BASE_SHA` — and the full-suite release
  # path escalates everything via the explicit `run_heavy_tests` input —
  # workflow_call inherits the CALLER's originating event, so an event-name
  # gate can never stand in for that input. Fast PR/master-push checks
  # (format, lint, typecheck, design, build) stay ungated above.
  test-scope:
    name: Test Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trust
    # Plan before allocating test runners. Vitest supplies the exact affected
    # app/API files; Turbo supplies affected workspace tasks. Lockfile, turbo,
    # vitest config, bun-setup, and the planner itself escalate to the full
    # sharded path. Editing ci.yml, package.json scripts, or docs does not.
    if: needs.trust.outputs.is-trusted == 'true'
    outputs:
      app: ${{ steps.plan.outputs.app }}
      api: ${{ steps.plan.outputs.api }}
      app_tests: ${{ steps.plan.outputs.app_tests }}
      api_tests: ${{ steps.plan.outputs.api_tests }}
      app_count: ${{ steps.plan.outputs.app_count }}
      api_count: ${{ steps.plan.outputs.api_count }}
      app_matrix: ${{ steps.plan.outputs.app_matrix }}
      api_matrix: ${{ steps.plan.outputs.api_matrix }}
      force_full: ${{ steps.plan.outputs.force_full }}
      packages: ${{ steps.plan.outputs.packages }}
      server_services: ${{ steps.plan.outputs.server_services }}
      web_desktop_mobile: ${{ steps.plan.outputs.web_desktop_mobile }}
      extensions: ${{ steps.plan.outputs.extensions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun environment
        if: needs.trust.outputs.heavy-tier != 'true'
        uses: ./.github/actions/setup-bun-env
      - name: Compute affected test plan
        id: plan
        # Merge-queue runs stay on the affected tier against the queue base
        # (current master) — the documented queue design in full-suite.yml.
        # The heavy matrix escalates only via the Trust Check's `heavy-tier`
        # verdict (`run_heavy_tests` on the full-suite / release path, the
        # explicit `full-suite` PR label, or an external-contributor PR);
        # master pushes get the complete heavy pass from full-suite.yml
        # immediately after the queue merges, so re-running it per queue entry
        # only serialized the queue (~20 min/entry) without adding coverage.
        run: node scripts/ci/pr-test-plan.mjs --event "${{ github.event_name }}" --base "$CI_BASE_SHA" --run-heavy "${{ needs.trust.outputs.heavy-tier }}"
      - name: Upload pull-request test plan
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-test-plan-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.manifest }}
          retention-days: 7

  test-packages:
    name: Test Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: genfeed_local
          POSTGRES_USER: genfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && (needs.trust.outputs.heavy-tier == 'true'
        || needs.test-scope.outputs.packages == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Run tests
        run: |
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --continue --filter='./packages/*'
          else
            BASE="$CI_BASE_SHA"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --continue --affected --filter='./packages/*'
          fi

  test-server-services:
    name: Test Server Services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && (needs.trust.outputs.heavy-tier == 'true'
        || needs.test-scope.outputs.server_services == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Run server service tests
        run: |
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --continue --filter='./apps/server/*' --filter='!@genfeedai/api'
          else
            BASE="$CI_BASE_SHA"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --continue --affected --filter='./apps/server/*' --filter='!@genfeedai/api'
          fi

  test-web-desktop-mobile:
    name: Test Web and Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && (needs.trust.outputs.heavy-tier == 'true'
        || needs.test-scope.outputs.web_desktop_mobile == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Run web and mobile tests
        run: |
          # Temporarily disabled while desktop is not an active delivery surface:
          # --filter=@genfeedai/desktop
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --continue --filter=@genfeedai/website --filter=@genfeedai/docs --filter=@genfeedai/mobile
          else
            BASE="$CI_BASE_SHA"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --continue --affected --filter=@genfeedai/website --filter=@genfeedai/docs --filter=@genfeedai/mobile
          fi

  test-extensions:
    name: Test Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [trust, test-scope]
    # Temporarily disabled while extensions are not active delivery surfaces.
    # Re-enable by setting ENABLE_EXTENSION_CI=true and removing `extensions`
    # from TEMPORARILY_DISABLED_TEST_GROUPS in scripts/ci/pr-test-plan.mjs.
    #
    # BOTH gates are load-bearing, and neither is a `full-suite` bug (#2486):
    # the label escalates the other heavy jobs by way of the planner's
    # --run-heavy flag, but the planner forces a dormant group inapplicable, and
    # the vars gate below short-circuits this job regardless. Tests Gate reports
    # the skip as "dormant (paused surface)" so the pause stays visible.
    if: >-
      vars.ENABLE_EXTENSION_CI == 'true'
      && needs.trust.outputs.is-trusted == 'true'
      && (needs.trust.outputs.heavy-tier == 'true'
        || needs.test-scope.outputs.extensions == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Run extension tests
        run: |
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --continue --filter=@genfeedai/extension-browser --filter=extension-ide
          else
            BASE="$CI_BASE_SHA"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --continue --affected --filter=@genfeedai/extension-browser --filter=extension-ide
          fi

  test-app:
    name: Test App (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    # Full sharded suite is explicit: release/deploy QA or a planner escalation
    # for validation machinery and root dependency changes.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.app == 'true'
      && needs.test-scope.outputs.force_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build app workspace
        run: bunx turbo run build --filter='./apps/app...'
      - name: Run app test shard
        run: cd apps/app && bunx vitest run --config ./vitest.config.mts --maxWorkers=2 --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test

  # Focused, blocking app tests on master push and every ordinary PR. The
  # planner counts the exact Vitest changed graph and selects one, two, or four
  # shards. Full-suite workflow calls and validation-machinery changes use the
  # static full matrix above.
  test-app-changed:
    name: Test App (changed shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Setup/build currently consume ~3 minutes before the changed Vitest graph
    # starts. Keep parity with the API changed-test job so a healthy app suite
    # is not cancelled while its assertions are still running.
    timeout-minutes: 30
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.app_tests == 'true'
      && needs.test-scope.outputs.force_full != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.test-scope.outputs.app_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build app workspace
        run: bunx turbo run build --filter='./apps/app...'
      - name: Mark test start
        run: echo "COVERAGE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run changed app tests
        id: tests
        run: |
          BASE="$CI_BASE_SHA"
          # Force-push / new-branch pushes report an all-zero "before"; fall back
          # to the previous commit so --changed always has a valid diff base.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "Running app tests changed since $BASE"
          # Pull requests instrument this same run for the #1849 observation
          # ratchet (folded from the standalone Changed Coverage jobs, #1969);
          # master pushes and merge-queue runs skip the instrumentation cost.
          COVERAGE_ARGS=()
          if [ "$WITH_COVERAGE" = "true" ]; then
            # Vitest does not finalize LCOV inside a sharded run. Persist its
            # blob report and merge all shards in Changed Coverage Report.
            COVERAGE_ARGS=(--coverage --coverage.enabled=true --coverage.provider=v8 --coverage.all=false --reporter=default --reporter=blob)
          fi
          cd apps/app && bunx vitest run --config ./vitest.config.mts \
            --maxWorkers=2 --passWithNoTests --changed "$BASE" \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            "${COVERAGE_ARGS[@]}"
        env:
          NODE_ENV: test
          WITH_COVERAGE: ${{ github.event_name == 'pull_request' }}
      - name: Stage app coverage shard
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p coverage-shard
          # Seconds cover the shard's full test+coverage wall clock: the
          # instrumented run is the same run that gates, so there is no
          # separate coverage-only timing left to take. A shard cancelled
          # before "Mark test start" has no clock: it stages no latency and
          # the report reads the missing file as null instead of the epoch.
          if [ -n "${COVERAGE_STARTED:-}" ]; then
            echo "$(( $(date +%s) - COVERAGE_STARTED ))" > coverage-shard/seconds
          fi
          echo '${{ steps.tests.outcome }}' > coverage-shard/outcome
          shopt -s nullglob
          reports=(apps/app/.vitest-reports/blob-*.json)
          if [ '${{ steps.tests.outcome }}' = 'success' ] && { [ "${#reports[@]}" -ne 1 ] || [ ! -s "${reports[0]:-}" ]; }; then
            echo "::error::Changed app shard passed but produced ${#reports[@]} non-empty Vitest blob reports; expected one"
            exit 1
          fi
          if [ "${#reports[@]}" -gt 0 ]; then
            cp "${reports[@]}" coverage-shard/
          fi
      - name: Upload app coverage blob
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-code-coverage-blob-app-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: coverage-shard
          if-no-files-found: warn
          retention-days: 7

  # Focused, blocking API tests mirror the app planner. Large changed graphs are
  # sharded rather than serialized on one two-worker runner; full-suite workflow
  # calls and validation-machinery changes use the static full matrix below.
  test-api-changed:
    name: Test API (changed shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.api_tests == 'true'
      && needs.test-scope.outputs.force_full != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.test-scope.outputs.api_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build API dependencies
        run: bunx turbo run build --filter=./packages/**
      - name: Mark test start
        run: echo "COVERAGE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run changed API tests
        id: tests
        run: |
          BASE="$CI_BASE_SHA"
          # Force-push / new-branch pushes report an all-zero "before"; fall back
          # to the previous commit so --changed always has a valid diff base.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "Running API tests changed since $BASE"
          # Pull requests instrument this same run for the #1849 observation
          # ratchet (folded from the standalone Changed Coverage jobs, #1969);
          # master pushes and merge-queue runs skip the instrumentation cost.
          COVERAGE_ARGS=()
          if [ "$WITH_COVERAGE" = "true" ]; then
            # Shards emit mergeable Vitest blobs. LCOV is finalized once in
            # Changed Coverage Report after every successful shard arrives.
            # Pass the same explicit flags the app lane uses: a bare --coverage
            # left the API shards reporting `All files | 0 | 0 | 0 | 0`, so the
            # merge job had nothing to turn into LCOV and failed the report.
            COVERAGE_ARGS=(--coverage --coverage.enabled=true --coverage.provider=v8 --coverage.all=false --reporter=default --reporter=blob)
          fi
          cd apps/server/api && bunx vitest run --config vitest.config.ts \
            --maxWorkers=2 --passWithNoTests --changed "$BASE" \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            "${COVERAGE_ARGS[@]}"
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          WITH_COVERAGE: ${{ github.event_name == 'pull_request' }}
          # Suppresses the API suite's whole-repository coverage thresholds. They
          # describe the full suite; a diff-scoped subset would trip every one of
          # them and the failure would carry no information. Harmless on runs
          # without instrumentation — the config also suppresses them for any
          # sharded run, and this job always shards.
          CHANGED_CODE_COVERAGE: '1'
      - name: Stage api coverage shard
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p coverage-shard
          # Seconds cover the shard's full test+coverage wall clock: the
          # instrumented run is the same run that gates, so there is no
          # separate coverage-only timing left to take. A shard cancelled
          # before "Mark test start" has no clock: it stages no latency and
          # the report reads the missing file as null instead of the epoch.
          if [ -n "${COVERAGE_STARTED:-}" ]; then
            echo "$(( $(date +%s) - COVERAGE_STARTED ))" > coverage-shard/seconds
          fi
          echo '${{ steps.tests.outcome }}' > coverage-shard/outcome
          shopt -s nullglob
          reports=(apps/server/api/.vitest-reports/blob-*.json)
          if [ '${{ steps.tests.outcome }}' = 'success' ] && { [ "${#reports[@]}" -ne 1 ] || [ ! -s "${reports[0]:-}" ]; }; then
            echo "::error::Changed API shard passed but produced ${#reports[@]} non-empty Vitest blob reports; expected one"
            exit 1
          fi
          if [ "${#reports[@]}" -gt 0 ]; then
            cp "${reports[@]}" coverage-shard/
          fi
      - name: Upload api coverage blob
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-code-coverage-blob-api-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: coverage-shard
          if-no-files-found: warn
          retention-days: 7

  test-api:
    name: Test API (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    # Full sharded suite is explicit: release/deploy QA or a planner escalation
    # for validation machinery and root dependency changes.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.api == 'true'
      && needs.test-scope.outputs.force_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build API dependencies
        run: bunx turbo run build --filter=./packages/**
      - name: Run API test shard
        run: cd apps/server/api && bunx vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}

  # OpenAPI documentation gate (#1247). The spec is a generated artifact and is
  # NOT committed (gitignored): this job emits it fresh from the compiled bundle
  # (headless emit — no DB/Redis, exits before the listener), fails when the
  # emit is non-deterministic or invalid, and uploads the result for review.
  # The live API serves /v1/openapi.json dynamically, so nothing consumes a
  # committed copy.
  openapi-drift:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [trust, test-scope]
    if: needs.trust.outputs.is-trusted == 'true' && needs.test-scope.outputs.api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build api (compiled bundle)
        # The api package emits to apps/server/dist, outside apps/server/api.
        # Force a real build so a Turbo cache-hit replay cannot skip restoring
        # the compiled bundle the emit gate loads (same rationale as
        # build-verify.yml api-boot-check).
        run: bunx turbo run build --filter=@genfeedai/api --force
      - name: Emit spec twice — must be byte-identical
        run: |
          cd apps/server/api
          bun run scripts/emit-openapi.ts --skip-build --out=/tmp/openapi-emit-1.json
          bun run scripts/emit-openapi.ts --skip-build --out=/tmp/openapi-emit-2.json
          cmp /tmp/openapi-emit-1.json /tmp/openapi-emit-2.json
      - name: Upload generated OpenAPI spec
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/openapi-emit-1.json
          retention-days: 7
      - name: Validate spec (operationId coverage/uniqueness + allowlist)
        run: cd apps/server/api && bun run openapi:validate -- --spec=/tmp/openapi-emit-1.json

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build no longer queues behind the static checks (#1969): they gate the
    # merge through the Tests Gate, not through this job's dependency edge, so
    # the build starts as soon as trust clears instead of after the slowest
    # static job.
    needs: [trust]
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Run build
        run: |
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            TURBO_SCM_BASE="$CI_BASE_SHA" bunx turbo run build --filter='./packages/*' --filter=@genfeedai/docs --affected
          else
            bun run build
          fi

  # Stable aggregate for the test/build portion of CI. Every upstream job is
  # declared explicitly so an expression error that leaves an applicable job
  # skipped cannot produce a false-green gate. Full-suite and changed-test jobs
  # are mutually exclusive; plan-filtered skips are accepted only when the
  # exact test plan marked them non-applicable.
  #
  # Runs on pull requests AND master pushes (#2510): the push event only fires
  # for `branches: [master]`, so the second arm is exactly the trunk. Without
  # it a merge train could go red with no conclusive aggregate — eight green
  # shard jobs made run 31200491364 look complete while the heavy tier was
  # absent. The release path (workflow_call inherits the caller's originating
  # event, e.g. workflow_dispatch) stays gated by its own callers, unchanged.
  #
  # `spec-typecheck` belongs here for the same reason: this aggregate is what
  # the master failure tracker below keys off, so a job missing from `needs`
  # cannot raise the alarm. Run 32971423541 went red on Spec Typecheck with a
  # green Tests Gate, which skipped the reporter and let the resolve arm close
  # the open trackers on a red trunk.
  tests-gate:
    name: Tests Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - static-checks
      - spec-typecheck
      - test-scope
      - test-packages
      - test-server-services
      - test-web-desktop-mobile
      - test-extensions
      - test-app
      - test-app-changed
      - test-api
      - test-api-changed
      - openapi-drift
      - build
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate test and build results
        env:
          TEST_SCOPE_APP: ${{ needs.test-scope.outputs.app }}
          TEST_SCOPE_API: ${{ needs.test-scope.outputs.api }}
          TEST_SCOPE_APP_TESTS: ${{ needs.test-scope.outputs.app_tests }}
          TEST_SCOPE_API_TESTS: ${{ needs.test-scope.outputs.api_tests }}
          TEST_SCOPE_PACKAGES: ${{ needs.test-scope.outputs.packages }}
          TEST_SCOPE_SERVER_SERVICES: ${{ needs.test-scope.outputs.server_services }}
          TEST_SCOPE_WEB_DESKTOP_MOBILE: ${{ needs.test-scope.outputs.web_desktop_mobile }}
          TEST_SCOPE_EXTENSIONS: ${{ needs.test-scope.outputs.extensions }}
          FULL_SUITE: ${{ needs.test-scope.outputs.force_full }}
          TEST_SCOPE_RESULT: ${{ needs.test-scope.result }}
          TEST_PACKAGES_RESULT: ${{ needs.test-packages.result }}
          TEST_SERVER_SERVICES_RESULT: ${{ needs.test-server-services.result }}
          TEST_WEB_DESKTOP_MOBILE_RESULT: ${{ needs.test-web-desktop-mobile.result }}
          TEST_EXTENSIONS_RESULT: ${{ needs.test-extensions.result }}
          TEST_APP_RESULT: ${{ needs.test-app.result }}
          TEST_APP_CHANGED_RESULT: ${{ needs.test-app-changed.result }}
          TEST_API_RESULT: ${{ needs.test-api.result }}
          TEST_API_CHANGED_RESULT: ${{ needs.test-api-changed.result }}
          OPENAPI_DRIFT_RESULT: ${{ needs.openapi-drift.result }}
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          SPEC_TYPECHECK_RESULT: ${{ needs.spec-typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: node scripts/ci/tests-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Changed-code coverage — OBSERVATION ONLY (#1849) ────────────────────────
  #
  # Coverage rides the changed-test shards above (#1969): on pull requests the
  # Test App/API (changed) jobs run their exact same Vitest graph with lcov
  # instrumentation enabled, so the measurement costs zero extra runners and
  # zero extra wall clock beyond the instrumentation overhead itself. The
  # report job below aggregates the shards' staged lcov and stays deliberately
  # absent from `tests-gate.needs` while the committed baseline says
  # `mode: "observation"` — it measures, it never gates. Promotion to a merge
  # requirement is a separate reviewed change (flip the baseline `mode`, then
  # add "Changed Coverage Report" to the branch ruleset) — see
  # scripts/ci/changed-code-coverage.baseline.json.
  #
  # Full-repository coverage stays in the weekly Coverage workflow: its matrix
  # costs 21-24 minutes and must never enter pull-request CI.
  #
  # Two accepted observation gaps come with the fold: a planner escalation to
  # the full suite (force_full) and a surface whose changed graph selected no
  # tests both skip the changed jobs, so those PRs report `skipped` surfaces
  # instead of a standalone measurement. The report already models skipped
  # surfaces; the ratchet aggregation tolerates them.
  coverage-changed-report:
    name: Changed Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [trust, test-app-changed, test-api-changed]
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-env
      # One download per surface so each surface resolves to a directory holding
      # only its own shards. Both surfaces can legitimately be skipped (a
      # docs-only or packages-only diff), leaving nothing to download; a missing
      # artifact is a surface state the report already models, not a step failure.
      - name: Download app coverage shards
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: changed-code-coverage-blob-app-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-*
          path: .changed-coverage/app
      - name: Download api coverage shards
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: changed-code-coverage-blob-api-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-*
          path: .changed-coverage/api
      - name: Intersect coverage with the pull-request diff
        env:
          # Only distinguishes "surface ran at all" from "surface was skipped".
          # Whether the measurement is usable, and how long it took, come from
          # the shards' own staged outcome/seconds — a matrix job's outputs are
          # last-writer-wins, so the job result alone cannot say which shard
          # produced what.
          APP_RESULT: ${{ needs.test-app-changed.result }}
          API_RESULT: ${{ needs.test-api-changed.result }}
          CHANGED_CODE_COVERAGE: '1'
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          merge_surface() {
            local surface="$1"
            local workspace="$2"
            local config="$3"
            local job_result="$4"
            local reports=(.changed-coverage/"$surface"/*/blob-*.json)

            # A red/cancelled matrix can leave partial blobs behind. Preserve
            # its shard outcomes for the normalized report, but never merge a
            # partial test selection into a misleading coverage percentage.
            if [ "$job_result" != 'success' ] || [ "${#reports[@]}" -eq 0 ]; then
              return
            fi

            mkdir -p "$workspace/.vitest-reports"
            cp "${reports[@]}" "$workspace/.vitest-reports/"
            (
              cd "$workspace"
              bunx vitest --merge-reports .vitest-reports \
                --coverage \
                --coverage.all=false \
                --coverage.reporter=lcovonly \
                --config "$config"
            )
            cp "$workspace/coverage/lcov.info" ".changed-coverage/$surface/lcov.info"
            if [ ! -s ".changed-coverage/$surface/lcov.info" ]; then
              echo "::error::$surface changed-code coverage merge produced no LCOV"
              exit 1
            fi
          }

          merge_surface app apps/app ./vitest.config.mts "$APP_RESULT"
          merge_surface api apps/server/api vitest.config.ts "$API_RESULT"

          node scripts/ci/changed-code-coverage.mjs \
            --base "$CI_BASE_SHA" \
            --head HEAD \
            --surface "app=${APP_RESULT}=.changed-coverage/app" \
            --surface "api=${API_RESULT}=.changed-coverage/api" \
            --out changed-code-coverage.json \
            --annotate
      - name: Upload changed-code coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-code-coverage-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: changed-code-coverage.json
          if-no-files-found: warn
          # Observation evidence: the first ratchet is derived by aggregating
          # these artifacts, so they outlive the usual 7-day CI retention.
          retention-days: 90

  # ── Master push failure tracker (#2510) ─────────────────────────────────────
  #
  # A red trunk must not depend on someone opening the Actions tab. When the
  # Tests Gate fails on a master push, file (or update) ONE `master-ci-failure`
  # tracking issue at native issue Priority P0; when the next push is green, close
  # every open tracker automatically — same contract as the self-hosted release
  # E2E tracker. Push-only by construction: these fire inside full-suite.yml's
  # master-push run (workflow_call inherits the caller's originating `push`
  # event). Pull requests surface a red gate on the PR itself, and the release
  # path (workflow_dispatch) never matches `push`.
  #
  # `!cancelled()` is load-bearing on the failure arm twice over: an `if:`
  # without a status function implicitly ANDs `success()`, which is false the
  # moment tests-gate fails — and `always()` would fire on a cancelled run,
  # filing a phantom tracker for jobs that never got to report.
  master-failure-report:
    name: Report master CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: master-ci-failure-tracker
      cancel-in-progress: false
    needs: [tests-gate]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.tests-gate.result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update tracking issue (Priority P0)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          # This trusted master-only job reuses the existing maintainer PAT so
          # Native org issue-field and Project #12 writes are possible;
          # GITHUB_TOKEN is repository-scoped.
          github-token: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              buildMasterCiFailureBody,
              reportMasterCiFailure,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/master-ci-failure-reporter.mjs',
                ),
              ).href,
            );

            const date = new Date().toISOString().slice(0, 10);
            const headline =
              (process.env.HEAD_COMMIT_MESSAGE || '').split('\n')[0] ||
              'unresolved';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = buildMasterCiFailureBody({
              date,
              sha: context.sha,
              headline,
              runUrl,
            });

            const result = await reportMasterCiFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
              date,
              core,
            });
            core.info(JSON.stringify(result));

  # Auto-close open master-ci-failure trackers when a master push is green so a
  # recovered trunk cannot keep a stale P0 on the board.
  #
  # `!cancelled()` is load-bearing HERE TOO, and for a less obvious reason than
  # on the failure arm: skip propagation is transitive. `tests-gate` runs under
  # `always()` and reports `success`, but its own needs include lanes that are
  # routinely skipped (extensions, the app/api full shards) —
  # and a dependent whose `if:` carries no status function inherits the implicit
  # `success()` over that graph, so this job was skipped on EVERY green master
  # push from #2580 until 2026-08-09. #2625 stayed open through five green
  # pushes because of it. Do not drop the status function to "simplify" this
  # condition; `always()` is the wrong one (a cancelled run would close a
  # tracker that nothing re-verified).
  master-failure-resolve:
    name: Resolve master CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: master-ci-failure-tracker
      cancel-in-progress: false
    needs: [tests-gate]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.tests-gate.result == 'success'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Close open master-ci-failure trackers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { resolveMasterCiFailure } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/master-ci-failure-reporter.mjs',
                ),
              ).href,
            );

            const date = new Date().toISOString().slice(0, 10);
            const headline =
              (process.env.HEAD_COMMIT_MESSAGE || '').split('\n')[0] ||
              'unresolved';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Tests Gate is green on \`master\`** on \`${date}\`.`,
              ``,
              `- Commit: \`${context.sha}\` — ${headline}`,
              `- Green run: ${runUrl}`,
              ``,
              `Closing automatically. A future red master push will file a new tracker at Priority P0.`,
            ].join('\n');

            const result = await resolveMasterCiFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
              core,
            });
            core.info(JSON.stringify(result));

  # ── Merge-queue zombie-run janitor (#1969) ──────────────────────────────────
  #
  # When a queue entry merges, GitHub deletes its temporary
  # `gh-readonly-queue/master/...` ref — but `merge_group` workflow runs still
  # queued or in progress on that ref are not cancelled with it. Each zombie
  # held a runner slot until the 6-hour workflow timeout, which starved the
  # org-wide runner pool at peak (measured while auditing #1850). Every queue
  # merge lands on `master` as a push (reaching this workflow through
  # full-suite.yml's call, which inherits the `push` event), so this job sweeps
  # on exactly that signal: cancel active merge_group runs whose queue ref no
  # longer resolves, and leave runs on live queue refs alone. Independent of
  # the test graph by design — a red gate must not keep zombies alive.
  merge-queue-janitor:
    name: Merge Queue Janitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout janitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cancel zombie merge-queue runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { cleanMergeQueueRuns } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/merge-queue-janitor.mjs',
                ),
              ).href,
            );

            const result = await cleanMergeQueueRuns({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              core,
            });
            core.info(JSON.stringify(result));
