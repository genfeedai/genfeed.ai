name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # Allow this gate to be run as a reusable workflow (e.g. by full-suite.yml,
  # which chains CI → E2E on demand). Secrets are inherited.
  workflow_call:
    inputs:
      run_heavy_tests:
        # Gate for the heavy test matrix (packages, server services,
        # web/mobile, app + api shards). Desktop and extension checks are
        # temporarily dormant while those surfaces are not being delivered.
        # Callers on the release path (full-suite.yml) pass `true` to run the
        # remaining full suite.
        #
        # This is an explicit input — NOT a `github.event_name == 'workflow_call'`
        # check — because a reusable workflow inherits the CALLER's originating
        # event (e.g. `workflow_dispatch` from release.yml), so `event_name`
        # is never `workflow_call` here and the old gate silently skipped every
        # heavy test job on the release QA path.
        description: 'Run the full heavy test matrix (release QA path).'
        type: boolean
        required: false
        default: false

# The `ci-` prefix is REQUIRED. `github.workflow` resolves to the top-level
# workflow name even inside a `workflow_call`, so without a distinct prefix this
# group collides with a caller that uses the same `${{ github.workflow }}-${{
# github.ref }}` shape (release.yml → full-suite.yml). On the release
# path `ci` runs UNDER full-suite, both computed the same group with
# cancel-in-progress, and the nested `ci` cancelled itself at startup (0 jobs) —
# tripping cancel-doomed-run and silently killing every stable release. The
# prefix keeps push-CI dedup ("ci-CI-<ref>") while never matching a caller group.
#
# `cancel-in-progress` is PULL-REQUEST ONLY. On a PR, a new push makes the
# running validation obsolete, so cancelling is free. On `master` it is not:
# every merge shares the group `ci-CI-refs/heads/master`, so an unconditional
# `true` meant each merge killed the previous commit's validation before it
# could report. On 2026-07-31 fifteen merges landed in three hours and NINE
# consecutive master runs were cancelled — a non-booting API
# (`Cannot access 'CredentialsCoreModule' before initialization`, #2270) rode
# master for twenty minutes because no run ever survived long enough to fail.
# Each master commit now validates to completion, and `workflow_call` (the
# release path, which inherits the caller's event) is likewise never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TZ: UTC

jobs:
  trust:
    name: Trust Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-trusted: ${{ steps.non_pr.outputs.trusted || steps.check.outputs.trusted }}
    steps:
      - name: Allow non-PR events
        id: non_pr
        if: github.event_name != 'pull_request'
        run: echo "trusted=true" >> "$GITHUB_OUTPUT"

      - name: Check contributor trust
        id: check
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const association = pr.author_association;
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isSameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isTrusted = isSameRepository || trustedRoles.includes(association);
            const hasLabel = pr.labels.some(l => l.name === 'run-ci');

            if (isTrusted) {
              const trustReason = isSameRepository
                ? 'same-repo PR'
                : `trusted contributor (${association})`;
              core.info(`${trustReason} - CI allowed`);
              core.setOutput('trusted', 'true');
            } else if (hasLabel) {
              core.info('External contributor with run-ci label - CI allowed');
              core.setOutput('trusted', 'true');
            } else {
              core.setOutput('trusted', 'false');
              core.setFailed(
                `External contributor (${association}) - add the \`run-ci\` label to allow CI. ` +
                'A maintainer must review the code and add the label.'
              );
            }

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trust
    # gitleaks-action does not support the `release` event ("The [release] event is
    # not yet supported") and hard-fails on it. Release-triggered runs (self-hosted
    # publish) skip it — the same commit was already secret-scanned on push to master.
    #
    # Dependabot runs read the Dependabot secret store, not the Actions one, so
    # `secrets.GITLEAKS_LICENSE` arrives empty and the action hard-fails with
    # "[genfeedai] is an organization. License key is required." It has failed on
    # every Dependabot PR, which is zero signal, not added safety: the diff is a
    # bot-authored manifest/lockfile bump, `Secretlint (changed files)` still runs,
    # and the history this job scans was already scanned on push to master.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && github.event_name != 'release'
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  secretlint:
    name: Secretlint (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|toml|sh|env.*)$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|toml|sh|env.*)$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No scannable files changed"
          else
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Scanning $(echo "$FILES" | wc -l | xargs) files"
          fi

      - name: Setup Bun environment
        if: steps.changed.outputs.files != ''
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
          cache-turbo: 'false'

      - name: Run secretlint on changed files
        if: steps.changed.outputs.files != ''
        run: echo "${{ steps.changed.outputs.files }}" | xargs bunx secretlint
        timeout-minutes: 5

  guards:
    name: Executable Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
          cache-turbo: 'false'
      # The executable form of "new hard-coded content automation is blocked in
      # CI" (#1011 FR8/FR9, success criterion 6). These three shipped in #1034
      # but ran nowhere: the check:architecture aggregate that carried them was
      # dropped from this job by #2127, leaving them as package.json scripts
      # that enforced nothing. Restoring the whole aggregate is blocked on
      # unrelated debt (deterministic-locale and agent-decomposition
      # violations), so the automation-boundary guards are wired directly.
      - name: Platform Cron Boundary
        run: bun run check:cron-boundary
      - name: Legacy Cron Jobs Surface
        run: bun run check:legacy-cron-surface
      - name: Product Workflow Boundary
        run: bun run check:product-workflow-boundary
      - name: Bull Board Queue Parity
        run: bun run check:bull-board-parity
      - name: Bull Board Queue Parity Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-bull-board-queue-parity.test.ts
      - name: DI Value Imports
        run: bun run check:di-value-imports
      # `@billing-providers` must resolve to the flavor on disk. The tsconfig
      # paths mapping points at the OSS stub and used to beat resolve.alias,
      # which shipped OSS billing stubs inside the SaaS image (#2751).
      - name: Billing Flavor Resolution
        run: bun run check:billing-flavor
      - name: Untranslated String Ratchet
        run: bun run check:untranslated-strings
      - name: Untranslated String Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-untranslated-strings.test.ts
      - name: Type Assertion Ratchet
        run: bun run check:type-assertions
      - name: Relation Alias Reads
        run: bun run check:relation-alias-reads
      - name: Relation Alias Read Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-relation-alias-reads.test.ts
      - name: Relation Alias Writes
        run: bun run check:relation-alias-writes
      - name: Controller Route Shadowing
        run: bun run check:route-shadowing
      - name: Product Route Inventory
        run: bun run check:route-inventory
      - name: Tenant Scope (API + shared server)
        run: bun run check:tenant-scope
      - name: Cross-Org Unsafe Hatch Ratchet
        run: bun run check:cross-org-unsafe
      - name: Cross-Org Unsafe Hatch Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-cross-org-unsafe.test.ts
      # The agent half of the curated action catalog contract. MCP crashes on
      # boot when its surface and dispatch disagree; the agent had no such
      # check, and five live credit-costed tools drifted outside the catalog.
      - name: Agent Tool Dispatch Coverage
        run: bun run check:agent-tool-dispatch
      - name: Agent Tool Dispatch Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-agent-tool-dispatch.test.ts
      # `uses:` refs cannot read a version from anywhere — GitHub resolves them
      # before expressions exist — so an action version is duplicated across
      # every workflow and composite action by force, and `deps:update` never
      # sees any of it. This holds the only property that can be held: one tag
      # version per action, repository-wide. Wired directly rather than through
      # check:architecture, which does not run in this job.
      - name: GitHub Action Version Consistency
        run: bun run check:action-versions
      - name: GitHub Action Version Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-github-action-versions.test.ts
      # Turbo derives build order from package.json, `tsc --build` follows
      # tsconfig `references`. Where the two disagree, two compilers write one
      # package's dist concurrently and fail with errors that contradict the
      # source. Invisible behind a cache hit, so it lands on an unrelated PR.
      - name: Project Reference Dependency Parity
        run: bun run check:project-references
      - name: Project Reference Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-project-reference-deps.test.ts
      # CLAUDE.md and lint-staged.config.mjs both described these as CI-enforced
      # while neither ran in any workflow: the repo-wide half of the raw-control
      # and design-token contracts was dark, leaving only a pre-commit hook that
      # `--no-verify` or an unstaged file walks straight past.
      - name: UI Guards (raw controls, primitives, nav sinks)
        run: bun run check:ui-guards
      - name: Design System Contracts
        run: bun run design:check
      # Temporarily disabled while desktop is not an active delivery surface.
      # Re-enable these two lines when desktop work resumes.
      # - name: Desktop Schema Drift
      #   run: bun run check:desktop-schema-drift
      - name: Serializer Drift Regression Tests
        run: bunx vitest run --config scripts/serializer-drift/vitest.config.ts
      - name: Serializer Drift
        run: bun run check:serializer-drift
      - name: SQL Risk Audit
        run: bun run audit:api:sql:ci
      - name: Public Package Manifests
        run: bun run check:public-packages
      - name: npm Release Enrollment
        run: bun run check:npm-release
      - name: Package Release Scripts
        run: bunx vitest run --config scripts/package-release/vitest.config.ts
      - name: CI Workflow Contracts
        run: node --test scripts/ci/changed-code-coverage.test.mjs scripts/ci/hosted-saas-handoff.test.mjs scripts/ci/master-ci-failure-reporter.test.mjs scripts/ci/pr-test-plan.test.mjs scripts/ci/pr-validation-workflows.test.mjs scripts/ci/release-e2e-failure-reporter.test.mjs scripts/ci/setup-bun-env.test.mjs scripts/ci/tests-gate.test.mjs scripts/ci/vercel-bun.test.mjs
      - name: Coverage Workspace Contract
        run: bunx vitest run --config scripts/ci/vitest.config.ts coverage-workspaces.test.ts
      # Fail the build if the committed Prisma model metadata (enum-field-map)
      # has drifted from schema.prisma — soft-delete filtering + enum
      # normalization under the Prisma 7 driver adapter depend on it, and it
      # previously had zero CI enforcement (silent-regression risk).
      - name: Prisma model metadata drift
        run: bun run --filter=@genfeedai/prisma check:model-metadata

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
          cache-turbo: 'false'
      - run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" bunx turbo run lint --affected
          else
            bun run lint
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" bunx turbo run type-check --affected
            # ee-billing type-checks apps/server/api sources through @api/* TS path
            # aliases, a coupling invisible to --affected's package graph (see #1105).
            # Run it explicitly; its turbo.json $TURBO_ROOT$ inputs keep this a cache
            # hit unless the aliased backend sources actually changed.
            bunx turbo run type-check --filter=@genfeedai/ee-billing
          else
            bun run type-check
          fi

  # The Typecheck job above cannot see spec files: every backend workspace's
  # tsconfig.typecheck.json excludes them, and no vitest config enables
  # `typecheck`. #2369 shipped a spec calling a deleted method straight through
  # that hole. This job typechecks them against the same compiler options via
  # tsconfig.typecheck.specs.json and ratchets the pre-existing debt.
  #
  # It runs unconditionally rather than through turbo's --affected. Each
  # workspace is checked in a fresh Bun process so TypeScript can release the
  # previous program's memory before loading the next workspace; the CLI scopes
  # the repo-wide baseline to the requested workspace on each invocation.
  spec-typecheck:
    name: Spec Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: trust
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Spec Typecheck Guard Tests
        run: bunx vitest run --config scripts/architecture/vitest.config.ts check-spec-typecheck.test.ts
      # The typecheck base config resolves @genfeedai/enums and
      # @genfeedai/constants to their dist output, so the package graph has to
      # exist before any program is created.
      - name: Build packages
        run: bunx turbo run build --filter='./packages/*' --filter='./ee/packages/*'
      - name: Spec Typecheck Ratchet
        # Keep each TypeScript program in its own process. A single repo-wide
        # process retained enough compiler state to hit the runner shutdown
        # window without emitting a diagnostic.
        #
        # Every workspace runs even after one fails. `api` sorts first and holds
        # most of the debt, so a bare `set -e` loop aborted there and hid the
        # other eleven: #2758 reported 7 drifted entries in `api` while `files`
        # and `mcp` held 2 more that only a local regeneration surfaced. One
        # baseline fix would otherwise cost a CI round-trip per workspace.
        # Failures are collected and their diagnostics replayed together below.
        run: |
          set -euo pipefail
          log_dir="$(mktemp -d)"
          failed=()
          checked=0
          for config in apps/server/*/tsconfig.typecheck.specs.json; do
            workspace="${config#apps/server/}"
            workspace="${workspace%%/*}"
            checked=$((checked + 1))
            echo "::group::Spec typecheck: ${workspace}"
            # `if !` keeps `set -e` from aborting the loop on a failing
            # workspace; `pipefail` keeps `tee` from masking the real status.
            if ! bun run check:spec-typecheck --workspace "${workspace}" 2>&1 \
              | tee "${log_dir}/${workspace}.log"; then
              failed+=("${workspace}")
            fi
            echo "::endgroup::"
          done

          if [ "${#failed[@]}" -eq 0 ]; then
            echo "Spec typecheck ratchet passed across ${checked} workspace(s)."
            exit 0
          fi

          # Replay outside the collapsed groups so every workspace's
          # diagnostics are visible without expanding the log by hand.
          echo "::error::Spec typecheck ratchet failed in ${#failed[@]} of ${checked} workspace(s): ${failed[*]}"
          for workspace in "${failed[@]}"; do
            echo "----- ${workspace} -----"
            cat "${log_dir}/${workspace}.log"
          done
          exit 1

  # Heavy test jobs key off this planner's outputs on every event: on pull
  # requests the diff base is the PR base, on master pushes it is
  # `github.event.before` (the previous trunk tip), and the full-suite release
  # path escalates everything via the explicit `run_heavy_tests` input —
  # workflow_call inherits the CALLER's originating event, so an event-name
  # gate can never stand in for that input. Fast PR/master-push checks
  # (format, lint, typecheck, design, build) stay ungated above.
  test-scope:
    name: Test Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: trust
    # Plan before allocating test runners. Vitest supplies the exact affected
    # app/API files; Turbo supplies affected workspace tasks. Validation
    # machinery and root dependency changes escalate to the full sharded path.
    if: needs.trust.outputs.is-trusted == 'true'
    outputs:
      app: ${{ steps.plan.outputs.app }}
      api: ${{ steps.plan.outputs.api }}
      app_tests: ${{ steps.plan.outputs.app_tests }}
      api_tests: ${{ steps.plan.outputs.api_tests }}
      app_count: ${{ steps.plan.outputs.app_count }}
      api_count: ${{ steps.plan.outputs.api_count }}
      app_matrix: ${{ steps.plan.outputs.app_matrix }}
      api_matrix: ${{ steps.plan.outputs.api_matrix }}
      app_coverage_matrix: ${{ steps.plan.outputs.app_coverage_matrix }}
      api_coverage_matrix: ${{ steps.plan.outputs.api_coverage_matrix }}
      force_full: ${{ steps.plan.outputs.force_full }}
      packages: ${{ steps.plan.outputs.packages }}
      server_services: ${{ steps.plan.outputs.server_services }}
      web_desktop_mobile: ${{ steps.plan.outputs.web_desktop_mobile }}
      extensions: ${{ steps.plan.outputs.extensions }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun environment
        if: >-
          inputs.run_heavy_tests != true
          && !contains(github.event.pull_request.labels.*.name, 'full-suite')
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Compute affected test plan
        id: plan
        run: node scripts/ci/pr-test-plan.mjs --event "${{ github.event_name }}" --base "${{ github.event.pull_request.base.sha || github.event.before }}" --run-heavy "${{ inputs.run_heavy_tests || contains(github.event.pull_request.labels.*.name, 'full-suite') }}"
      - name: Upload pull-request test plan
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pr-test-plan-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.manifest }}
          retention-days: 7

  test-packages:
    name: Test Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: genfeed_local
          POSTGRES_USER: genfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && (inputs.run_heavy_tests
        || needs.test-scope.outputs.packages == 'true')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run tests
        run: |
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --filter='./packages/*' --filter='./ee/packages/*'
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --affected --filter='./packages/*' --filter='./ee/packages/*'
          fi

  test-server-services:
    name: Test Server Services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && (inputs.run_heavy_tests
        || needs.test-scope.outputs.server_services == 'true')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run server service tests
        run: |
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --filter='./apps/server/*' --filter='!@genfeedai/api'
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --affected --filter='./apps/server/*' --filter='!@genfeedai/api'
          fi

  test-web-desktop-mobile:
    name: Test Web and Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && (inputs.run_heavy_tests
        || needs.test-scope.outputs.web_desktop_mobile == 'true')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run web and mobile tests
        run: |
          # Temporarily disabled while desktop is not an active delivery surface:
          # --filter=@genfeedai/desktop
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --filter=@genfeedai/website --filter=@genfeedai/docs --filter=@genfeedai/mobile
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --affected --filter=@genfeedai/website --filter=@genfeedai/docs --filter=@genfeedai/mobile
          fi

  test-extensions:
    name: Test Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [trust, test-scope]
    # Temporarily disabled while extensions are not active delivery surfaces.
    # Re-enable by setting ENABLE_EXTENSION_CI=true and removing `extensions`
    # from TEMPORARILY_DISABLED_TEST_GROUPS in scripts/ci/pr-test-plan.mjs.
    #
    # BOTH gates are load-bearing, and neither is a `full-suite` bug (#2486):
    # the label escalates the other heavy jobs by way of the planner's
    # --run-heavy flag, but the planner forces a dormant group inapplicable, and
    # the vars gate below short-circuits this job regardless. Tests Gate reports
    # the skip as "dormant (paused surface)" so the pause stays visible.
    if: >-
      vars.ENABLE_EXTENSION_CI == 'true'
      && needs.trust.outputs.is-trusted == 'true'
      && (inputs.run_heavy_tests
        || needs.test-scope.outputs.extensions == 'true')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run extension tests
        run: |
          if [ "${{ needs.test-scope.outputs.force_full }}" = "true" ]; then
            bunx turbo run test --filter=@genfeedai/extension-browser --filter=extension-ide
          else
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            # Force-push / new-branch pushes report an all-zero "before"; fall back
            # to the previous commit so --affected always has a valid diff base.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
            TURBO_SCM_BASE="$BASE" bunx turbo run test --affected --filter=@genfeedai/extension-browser --filter=extension-ide
          fi

  test-app:
    name: Test App (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    # Full sharded suite is explicit: release/deploy QA or a planner escalation
    # for validation machinery and root dependency changes.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.app == 'true'
      && needs.test-scope.outputs.force_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build app workspace
        run: bunx turbo run build --filter='./apps/app...'
      - name: Run app test shard
        run: cd apps/app && bunx vitest run --config ./vitest.config.mts --maxWorkers=2 --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test

  # Focused, blocking app tests on master push and every ordinary PR. The
  # planner counts the exact Vitest changed graph and selects one, two, or four
  # shards. Full-suite workflow calls and validation-machinery changes use the
  # static full matrix above.
  test-app-changed:
    name: Test App (changed shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Setup/build currently consume ~3 minutes before the changed Vitest graph
    # starts. Keep parity with the API changed-test job so a healthy app suite
    # is not cancelled while its assertions are still running.
    timeout-minutes: 30
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.app_tests == 'true'
      && needs.test-scope.outputs.force_full != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.test-scope.outputs.app_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build app workspace
        run: bunx turbo run build --filter='./apps/app...'
      - name: Run changed app tests
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Force-push / new-branch pushes report an all-zero "before"; fall back
          # to the previous commit so --changed always has a valid diff base.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "Running app tests changed since $BASE"
          cd apps/app && bunx vitest run --config ./vitest.config.mts \
            --maxWorkers=2 --passWithNoTests --changed "$BASE" \
            --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          NODE_ENV: test

  # Focused, blocking API tests mirror the app planner. Large changed graphs are
  # sharded rather than serialized on one two-worker runner; full-suite workflow
  # calls and validation-machinery changes use the static full matrix below.
  test-api-changed:
    name: Test API (changed shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.api_tests == 'true'
      && needs.test-scope.outputs.force_full != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.test-scope.outputs.api_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build API dependencies
        run: bunx turbo run build --filter=./packages/**
      - name: Run changed API tests
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Force-push / new-branch pushes report an all-zero "before"; fall back
          # to the previous commit so --changed always has a valid diff base.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          echo "Running API tests changed since $BASE"
          cd apps/server/api && bunx vitest run --config vitest.config.ts \
            --maxWorkers=2 --passWithNoTests --changed "$BASE" \
            --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}

  test-api:
    name: Test API (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    # Full sharded suite is explicit: release/deploy QA or a planner escalation
    # for validation machinery and root dependency changes.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && needs.test-scope.outputs.api == 'true'
      && needs.test-scope.outputs.force_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build API dependencies
        run: bunx turbo run build --filter=./packages/**
      - name: Run API test shard
        run: cd apps/server/api && bunx vitest run --config vitest.config.ts --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}

  # OpenAPI documentation gate (#1247). The spec is a generated artifact and is
  # NOT committed (gitignored): this job emits it fresh from the compiled bundle
  # (headless emit — no DB/Redis, exits before the listener), fails when the
  # emit is non-deterministic or invalid, and uploads the result for review.
  # The live API serves /v1/openapi.json dynamically, so nothing consumes a
  # committed copy.
  openapi-drift:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [trust, test-scope]
    if: needs.trust.outputs.is-trusted == 'true' && needs.test-scope.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build api (compiled bundle)
        # The api package emits to apps/server/dist, outside apps/server/api.
        # Force a real build so a Turbo cache-hit replay cannot skip restoring
        # the compiled bundle the emit gate loads (same rationale as
        # build-verify.yml api-boot-check).
        run: bunx turbo run build --filter=@genfeedai/api --force
      - name: Emit spec twice — must be byte-identical
        run: |
          cd apps/server/api
          bun run scripts/emit-openapi.ts --skip-build --out=/tmp/openapi-emit-1.json
          bun run scripts/emit-openapi.ts --skip-build --out=/tmp/openapi-emit-2.json
          cmp /tmp/openapi-emit-1.json /tmp/openapi-emit-2.json
      - name: Upload generated OpenAPI spec
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/openapi-emit-1.json
          retention-days: 7
      - name: Validate spec (operationId coverage/uniqueness + allowlist)
        run: cd apps/server/api && bun run openapi:validate -- --spec=/tmp/openapi-emit-1.json

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, format, lint, guards, typecheck]
    if: needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Run build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" bunx turbo run build --filter='./packages/*' --filter=@genfeedai/docs --affected
          else
            bun run build
          fi

  # Stable aggregate for the test/build portion of CI. Every upstream job is
  # declared explicitly so an expression error that leaves an applicable job
  # skipped cannot produce a false-green gate. Full-suite and changed-test jobs
  # are mutually exclusive; plan-filtered skips are accepted only when the
  # exact test plan marked them non-applicable.
  #
  # Runs on pull requests AND master pushes (#2510): the push event only fires
  # for `branches: [master]`, so the second arm is exactly the trunk. Without
  # it a merge train could go red with no conclusive aggregate — eight green
  # shard jobs made run 31200491364 look complete while the heavy tier was
  # absent. The release path (workflow_call inherits the caller's originating
  # event, e.g. workflow_dispatch) stays gated by its own callers, unchanged.
  tests-gate:
    name: Tests Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test-scope
      - test-packages
      - test-server-services
      - test-web-desktop-mobile
      - test-extensions
      - test-app
      - test-app-changed
      - test-api
      - test-api-changed
      - openapi-drift
      - build
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Aggregate test and build results
        env:
          TEST_SCOPE_APP: ${{ needs.test-scope.outputs.app }}
          TEST_SCOPE_API: ${{ needs.test-scope.outputs.api }}
          TEST_SCOPE_APP_TESTS: ${{ needs.test-scope.outputs.app_tests }}
          TEST_SCOPE_API_TESTS: ${{ needs.test-scope.outputs.api_tests }}
          TEST_SCOPE_PACKAGES: ${{ needs.test-scope.outputs.packages }}
          TEST_SCOPE_SERVER_SERVICES: ${{ needs.test-scope.outputs.server_services }}
          TEST_SCOPE_WEB_DESKTOP_MOBILE: ${{ needs.test-scope.outputs.web_desktop_mobile }}
          TEST_SCOPE_EXTENSIONS: ${{ needs.test-scope.outputs.extensions }}
          FULL_SUITE: ${{ needs.test-scope.outputs.force_full }}
          TEST_SCOPE_RESULT: ${{ needs.test-scope.result }}
          TEST_PACKAGES_RESULT: ${{ needs.test-packages.result }}
          TEST_SERVER_SERVICES_RESULT: ${{ needs.test-server-services.result }}
          TEST_WEB_DESKTOP_MOBILE_RESULT: ${{ needs.test-web-desktop-mobile.result }}
          TEST_EXTENSIONS_RESULT: ${{ needs.test-extensions.result }}
          TEST_APP_RESULT: ${{ needs.test-app.result }}
          TEST_APP_CHANGED_RESULT: ${{ needs.test-app-changed.result }}
          TEST_API_RESULT: ${{ needs.test-api.result }}
          TEST_API_CHANGED_RESULT: ${{ needs.test-api-changed.result }}
          OPENAPI_DRIFT_RESULT: ${{ needs.openapi-drift.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: node scripts/ci/tests-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Changed-code coverage — OBSERVATION ONLY (#1849) ────────────────────────
  #
  # These three jobs are deliberately absent from `tests-gate.needs` above and
  # must stay that way while the committed baseline says `mode: "observation"`.
  # They measure; they never gate. Promotion to a merge requirement is a separate
  # reviewed change (flip the baseline `mode`, then add "Changed Coverage Report"
  # to the branch ruleset) — see scripts/ci/changed-code-coverage.baseline.json.
  #
  # Full-repository coverage stays in the weekly Coverage workflow: its matrix
  # costs 21-24 minutes and must never enter pull-request CI. What runs here is
  # the SAME already-affected scope the changed-shard jobs run, re-executed with
  # instrumentation and sharded the same way, so the shards' merged lcov covers
  # the whole changed graph without any one runner carrying all of it.
  #
  # Sharding is the load-bearing part of the 20-minute budget, not a nicety. A
  # diff touching a widely-imported shared package makes `--changed` pull in most
  # of a suite; instrumented and unsharded that overran the budget and the
  # job-level timeout cancelled it, reporting red on a job that is meant never to
  # gate. The budget now lives on the *step*, where `continue-on-error` can
  # absorb it: an over-budget shard records a failed surface, and the report job
  # publishes `infrastructure-failed` instead of the pull request growing an X.
  coverage-changed-app:
    name: Changed Coverage (app shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Backstop only — must stay above the step budget plus setup, so that the
    # thing which fires on a slow suite is the step, never the job.
    timeout-minutes: 30
    needs: [trust, test-scope]
    # Keys off `app`, not `app_tests`: a planner escalation to the full suite
    # sets app_tests=false while app stays true, and the diff is still worth
    # measuring. `--changed` bounds the work either way.
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && github.event_name == 'pull_request'
      && needs.test-scope.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-scope.outputs.app_coverage_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build app workspace
        run: bunx turbo run build --filter='./apps/app...'
      - name: Mark coverage start
        run: echo "COVERAGE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run changed app tests with coverage
        id: coverage
        # Never fails the job: a red surface is recorded as a surface result and
        # reported downstream, not raised as a pull-request failure. The budget
        # is a step timeout for the same reason — a job timeout would cancel the
        # job outright and `continue-on-error` could not absorb it.
        timeout-minutes: 20
        continue-on-error: true
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          cd apps/app && bunx vitest run --config ./vitest.config.mts \
            --maxWorkers=2 --passWithNoTests --changed "$BASE" \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --coverage --coverage.enabled=true --coverage.provider=v8 \
            --coverage.all=false --coverage.reporter=lcovonly
        env:
          NODE_ENV: test
      - name: Stage app coverage shard
        if: always()
        run: |
          mkdir -p coverage-shard
          # Timing is taken here rather than inside the run step so that an
          # over-budget shard still reports its true wall clock: the step it
          # would otherwise have been recorded in is the one that got killed.
          echo "$(( $(date +%s) - COVERAGE_STARTED ))" > coverage-shard/seconds
          echo '${{ steps.coverage.outcome }}' > coverage-shard/outcome
          cp apps/app/coverage/lcov.info coverage-shard/lcov.info || true
      - name: Upload app lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-code-coverage-lcov-app-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: coverage-shard
          if-no-files-found: warn
          retention-days: 7

  coverage-changed-api:
    name: Changed Coverage (api shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [trust, test-scope]
    if: >-
      needs.trust.outputs.is-trusted == 'true'
      && github.event_name == 'pull_request'
      && needs.test-scope.outputs.api == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-scope.outputs.api_coverage_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          bun-version: '1.3.14'
      - name: Build API dependencies
        run: bunx turbo run build --filter=./packages/**
      - name: Mark coverage start
        run: echo "COVERAGE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run changed API tests with coverage
        id: coverage
        timeout-minutes: 20
        continue-on-error: true
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          cd apps/server/api && bunx vitest run --config vitest.config.ts \
            --maxWorkers=2 --passWithNoTests --changed "$BASE" \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            --coverage --coverage.reporter=lcovonly
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          # Suppresses the API suite's whole-repository coverage thresholds. They
          # describe the full suite; a diff-scoped subset would trip every one of
          # them and the failure would carry no information.
          CHANGED_CODE_COVERAGE: '1'
      - name: Stage api coverage shard
        if: always()
        run: |
          mkdir -p coverage-shard
          echo "$(( $(date +%s) - COVERAGE_STARTED ))" > coverage-shard/seconds
          echo '${{ steps.coverage.outcome }}' > coverage-shard/outcome
          cp apps/server/api/coverage/lcov.info coverage-shard/lcov.info || true
      - name: Upload api lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-code-coverage-lcov-api-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: coverage-shard
          if-no-files-found: warn
          retention-days: 7

  coverage-changed-report:
    name: Changed Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [trust, coverage-changed-app, coverage-changed-api]
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.trust.outputs.is-trusted == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # One download per surface so each surface resolves to a directory holding
      # only its own shards. Both surfaces can legitimately be skipped (a
      # docs-only or packages-only diff), leaving nothing to download; a missing
      # artifact is a surface state the report already models, not a step failure.
      - name: Download app coverage shards
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: changed-code-coverage-lcov-app-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-*
          path: .changed-coverage/app
      - name: Download api coverage shards
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: changed-code-coverage-lcov-api-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-shard-*
          path: .changed-coverage/api
      - name: Intersect coverage with the pull-request diff
        env:
          # Only distinguishes "surface ran at all" from "surface was skipped".
          # Whether the measurement is usable, and how long it took, come from
          # the shards' own staged outcome/seconds — a matrix job's outputs are
          # last-writer-wins, and step-level `continue-on-error` keeps a failed
          # coverage step from ever showing up in the job result.
          APP_RESULT: ${{ needs.coverage-changed-app.result }}
          API_RESULT: ${{ needs.coverage-changed-api.result }}
        shell: bash
        run: |
          node scripts/ci/changed-code-coverage.mjs \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD \
            --surface "app=${APP_RESULT}=.changed-coverage/app" \
            --surface "api=${API_RESULT}=.changed-coverage/api" \
            --out changed-code-coverage.json \
            --annotate
      - name: Upload changed-code coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-code-coverage-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: changed-code-coverage.json
          if-no-files-found: warn
          # Observation evidence: the first ratchet is derived by aggregating
          # these artifacts, so they outlive the usual 7-day CI retention.
          retention-days: 90

  # ── Master push failure tracker (#2510) ─────────────────────────────────────
  #
  # A red trunk must not depend on someone opening the Actions tab. When the
  # Tests Gate fails on a master push, file (or update) ONE `master-ci-failure`
  # tracking issue at Project Priority P0; when the next push is green, close
  # every open tracker automatically — same contract as the self-hosted release
  # E2E tracker. Push-only by construction: pull requests surface a red gate on
  # the PR itself, and the release path never fires these (workflow_call
  # inherits the caller's originating event, which is not `push`).
  #
  # `!cancelled()` is load-bearing on the failure arm twice over: an `if:`
  # without a status function implicitly ANDs `success()`, which is false the
  # moment tests-gate fails — and `always()` would fire on a cancelled run,
  # filing a phantom tracker for jobs that never got to report.
  master-failure-report:
    name: Report master CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: master-ci-failure-tracker
      cancel-in-progress: false
    needs: [tests-gate]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.tests-gate.result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Open or update tracking issue (Priority P0)
        uses: actions/github-script@v9
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              buildMasterCiFailureBody,
              reportMasterCiFailure,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/master-ci-failure-reporter.mjs',
                ),
              ).href,
            );

            const date = new Date().toISOString().slice(0, 10);
            const headline =
              (process.env.HEAD_COMMIT_MESSAGE || '').split('\n')[0] ||
              'unresolved';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = buildMasterCiFailureBody({
              date,
              sha: context.sha,
              headline,
              runUrl,
            });

            const result = await reportMasterCiFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
              date,
              core,
            });
            core.info(JSON.stringify(result));

  # Auto-close open master-ci-failure trackers when a master push is green so a
  # recovered trunk cannot keep a stale P0 on the board.
  #
  # `!cancelled()` is load-bearing HERE TOO, and for a less obvious reason than
  # on the failure arm: skip propagation is transitive. `tests-gate` runs under
  # `always()` and reports `success`, but its own needs include lanes that are
  # routinely skipped (extensions, the app/api full shards) —
  # and a dependent whose `if:` carries no status function inherits the implicit
  # `success()` over that graph, so this job was skipped on EVERY green master
  # push from #2580 until 2026-08-09. #2625 stayed open through five green
  # pushes because of it. Do not drop the status function to "simplify" this
  # condition; `always()` is the wrong one (a cancelled run would close a
  # tracker that nothing re-verified).
  master-failure-resolve:
    name: Resolve master CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: master-ci-failure-tracker
      cancel-in-progress: false
    needs: [tests-gate]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.tests-gate.result == 'success'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Close open master-ci-failure trackers
        uses: actions/github-script@v9
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { resolveMasterCiFailure } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/master-ci-failure-reporter.mjs',
                ),
              ).href,
            );

            const date = new Date().toISOString().slice(0, 10);
            const headline =
              (process.env.HEAD_COMMIT_MESSAGE || '').split('\n')[0] ||
              'unresolved';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Tests Gate is green on \`master\`** on \`${date}\`.`,
              ``,
              `- Commit: \`${context.sha}\` — ${headline}`,
              `- Green run: ${runUrl}`,
              ``,
              `Closing automatically. A future red master push will file a new tracker at Priority P0.`,
            ].join('\n');

            const result = await resolveMasterCiFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
              core,
            });
            core.info(JSON.stringify(result));
