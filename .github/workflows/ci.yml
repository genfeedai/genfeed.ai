name: CI
run-name: "${{ github.event_name == 'pull_request' && format('CI · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || format('CI · {0}', github.ref_name) }}"

# Domains share entrypoints but retain independent cancellation and secrets.
# Required names belong only to applicable leaves. Job names are static: GitHub
# cannot evaluate an expression for a skipped job and prints it raw. A skipped
# job also reports success, so "Tests Gate" must never be skippable; triggers
# below decide when it exists, not a job-level `if:`. The PR title check lives
# in pr-title.yml for the same reason.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      run_heavy_tests:
        type: boolean
        required: false
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      GITLEAKS_LICENSE:
        required: false
      BETTER_AUTH_SECRET:
        required: false

permissions: {}

jobs:
  server-image:
    name: Build Server Image
    if: ${{ !cancelled() && (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)) }}
    permissions:
      contents: read
    concurrency:
      group: server-image-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Bootstrap/filter have three minutes each; complete image build retains forty.
    timeout-minutes: 46
    steps:
      - name: Bootstrap image scope
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        timeout-minutes: 3
        with:
          filters: |
            image:
              - 'docker/Dockerfile.server'
              - '.dockerignore'
              - '.bun-version'
              - '.node-version'
              - 'configs/**'
              - 'patches/**'
              - 'webpack.base.config.js'
              - 'tsconfig.json'
              - 'tsconfig.server.decorators.json'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-pr-server-image/**'
              - '.github/actions/node-version/**'

      - name: Validate image scope detection
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DETECT_RESULT: ${{ steps.changes.outcome }}
          IMAGE_CHANGED: ${{ steps.changes.outputs.image }}
        run: |
          if [ "$DETECT_RESULT" != "success" ] || { [ "$IMAGE_CHANGED" != "true" ] && [ "$IMAGE_CHANGED" != "false" ]; }; then
            echo "::error::Invalid server image scope detection."
            exit 1
          fi
      - name: Skip (no image-definition change)
        if: steps.changes.outputs.image == 'false'
        run: echo "No image-definition path changed; nothing to build."
      - name: Build complete server image
        if: steps.changes.outputs.image == 'true'
        timeout-minutes: 40
        uses: ./.github/actions/build-pr-server-image

  core:
    name: Core Validation
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_ci-validation.yml
    with:
      run_heavy_tests: ${{ inputs.run_heavy_tests == true }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  frontend:
    name: Frontend Validation
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_ci-frontend.yml
    with:
      run_heavy_tests: ${{ inputs.run_heavy_tests == true }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  tests-gate:
    name: Tests Gate
    needs: core
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Suites that call this workflow from a dispatch or schedule (release,
      # nightly) have no pull request or merge group to qualify; the job must
      # still run, so they require the core result directly.
      - name: Require core validation for called suites
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'push' }}
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: test "$CORE_RESULT" = success
      # A superseded bridge can finish only its own verdict within this ceiling.
      - name: Qualify genuine current-attempt validation verdict
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/ci-job-verdict.mjs
