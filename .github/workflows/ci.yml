name: CI

# Domains share entrypoints but retain independent cancellation and secrets.
# Required names belong only to applicable leaves.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      called_workflow:
        type: boolean
        required: false
        default: true
      run_heavy_tests:
        type: boolean
        required: false
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      GITLEAKS_LICENSE:
        required: false
      BETTER_AUTH_SECRET:
        required: false

permissions: {}

jobs:
  conventional-title:
    name: ${{ (github.event_name == 'pull_request_target' && contains(fromJSON('["opened","edited","synchronize","reopened"]'), github.event.action)) && 'PR Title' || 'Not selected - PR title' }}
    if: github.event_name == 'pull_request_target' && contains(fromJSON('["opened","edited","synchronize","reopened"]'), github.event.action)
    permissions:
      pull-requests: read
    concurrency:
      group: PR Title-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Conventional Commits title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md → Pull-request contract and cliff.toml.
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            build
            ci
            perf
          requireScope: false
          # Lowercase imperative summary. `type(scope)!: summary` marks a breaking change
          # and is accepted by the action's default header pattern.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start lowercase and read as an imperative
            (e.g. "feat(studio): add batch generate"). See CONTRIBUTING.md → Pull-request contract.

  server-image:
    name: ${{ github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) && 'Build Server Image' || 'Not selected - server image' }}
    if: ${{ !cancelled() && (github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)) }}
    permissions:
      contents: read
    concurrency:
      group: server-image-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Bootstrap/filter have three minutes each; complete image build retains forty.
    timeout-minutes: 46
    steps:
      - name: Bootstrap image scope
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        timeout-minutes: 3
        with:
          filters: |
            image:
              - 'docker/Dockerfile.server'
              - '.dockerignore'
              - '.bun-version'
              - 'configs/**'
              - 'patches/**'
              - 'webpack.base.config.js'
              - 'tsconfig.json'
              - 'tsconfig.server.decorators.json'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/server-image-pr.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-pr-server-image/**'

      - name: Validate image scope detection
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DETECT_RESULT: ${{ steps.changes.outcome }}
          IMAGE_CHANGED: ${{ steps.changes.outputs.image }}
        run: |
          if [ "$DETECT_RESULT" != "success" ] || { [ "$IMAGE_CHANGED" != "true" ] && [ "$IMAGE_CHANGED" != "false" ]; }; then
            echo "::error::Invalid server image scope detection."
            exit 1
          fi
      - name: Skip (no image-definition change)
        if: steps.changes.outputs.image == 'false'
        run: echo "No image-definition path changed; nothing to build."
      - name: Build complete server image
        if: steps.changes.outputs.image == 'true'
        timeout-minutes: 40
        uses: ./.github/actions/build-pr-server-image

  core:
    name: Core Validation
    if: github.event_name != 'pull_request_target' && (inputs.called_workflow == true || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'master' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_ci-validation.yml
    with:
      run_heavy_tests: ${{ inputs.run_heavy_tests == true }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  frontend:
    name: Frontend Validation
    if: github.event_name != 'pull_request_target' && (inputs.called_workflow == true || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'master' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_ci-frontend.yml
    with:
      run_heavy_tests: ${{ inputs.run_heavy_tests == true }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  tests-gate:
    name: ${{ (github.event_name != 'pull_request_target' && (inputs.called_workflow == true || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'master' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))) && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') && 'Tests Gate' || 'Not selected - source gate' }}
    needs: core
    if: ${{ always() && ((github.event_name != 'pull_request_target' && (inputs.called_workflow == true || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.base_ref == 'master' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)))) && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A superseded bridge can finish only its own verdict within this ceiling.
      - name: Qualify genuine current-attempt validation verdict
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/ci-job-verdict.mjs
