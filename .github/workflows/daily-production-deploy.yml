name: Daily Production Deploy

# Deploy-only fallback for unreleased master changes. Stable releases use the
# canonical Release workflow, which publishes community and SaaS from one SHA.
#
# Off switch: repository variable DAILY_PRODUCTION_DEPLOY_ENABLED must be the
# string "true" to activate the cron. Default (unset/anything else) is a
# clean no-op — pause this workflow from repo Settings > Variables without
# editing or removing this file.

on:
  # Run once daily at 02:17 Europe/Malta. The :17 offset avoids GitHub Actions'
  # top-of-hour schedule backlog, and the explicit timezone keeps CET/CEST
  # transitions out of repo-local shell guards.
  schedule:
    - cron: "17 2 * * *"
      timezone: "Europe/Malta"
  workflow_dispatch:

concurrency:
  group: daily-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_WORKFLOW: ci.yml
  DEPLOY_WORKFLOW: deploy-ecs.yml
  FASTLANE_WORKFLOW: deploy-ecs-fastlane.yml
  FULL_SUITE_WORKFLOW: full-suite.yml
  RELEASE_WORKFLOW: release.yml

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      should_deploy: ${{ steps.preflight.outputs.should_deploy }}
      issue_needed: ${{ steps.preflight.outputs.issue_needed }}
      outcome: ${{ steps.preflight.outputs.outcome }}
      skipped_reason: ${{ steps.preflight.outputs.skipped_reason }}
      failure_reason: ${{ steps.preflight.outputs.failure_reason }}
      failure_stage: ${{ steps.preflight.outputs.failure_stage }}
      master_sha: ${{ steps.preflight.outputs.master_sha }}
      ci_run_url: ${{ steps.preflight.outputs.ci_run_url }}
      gate_run_url: ${{ steps.preflight.outputs.gate_run_url }}
      deploy_marker_url: ${{ steps.preflight.outputs.deploy_marker_url }}
      deployed_sha: ${{ steps.preflight.outputs.deployed_sha }}
    steps:
      - name: Guard DAILY_PRODUCTION_DEPLOY_ENABLED
        id: enabled_guard
        run: |
          set -euo pipefail

          if [ "${{ vars.DAILY_PRODUCTION_DEPLOY_ENABLED }}" != "true" ]; then
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "skipped_reason=Daily production deploy is disabled: repository variable DAILY_PRODUCTION_DEPLOY_ENABLED is not 'true'." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_continue=true" >> "$GITHUB_OUTPUT"
          echo "skipped_reason=" >> "$GITHUB_OUTPUT"

      - name: Checkout workflow helpers
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve origin/master
        id: master
        if: steps.enabled_guard.outputs.should_continue == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          master_sha="$(git rev-parse origin/master)"
          echo "sha=${master_sha}" >> "$GITHUB_OUTPUT"
          echo "origin/master: ${master_sha}"
          echo "workflow sha: ${GITHUB_SHA}"

      - name: Evaluate deploy preflight
        id: preflight
        uses: actions/github-script@v9
        env:
          SHOULD_CONTINUE: ${{ steps.enabled_guard.outputs.should_continue }}
          PRECHECK_SKIPPED_REASON: ${{ steps.enabled_guard.outputs.skipped_reason }}
          MASTER_SHA: ${{ steps.master.outputs.sha }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { evaluateDeployPreflight } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/daily-deploy-orchestration.mjs',
                ),
              ).href,
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const masterSha = process.env.MASTER_SHA || '';

            async function listRuns(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: 'master',
                per_page: 100,
              });
              return response.data.workflow_runs;
            }

            try {
              const [deployRuns, fastlaneRuns, releaseRuns, ciRuns, fullSuiteRuns] =
                process.env.SHOULD_CONTINUE === 'true'
                  ? await Promise.all([
                      listRuns(process.env.DEPLOY_WORKFLOW),
                      listRuns(process.env.FASTLANE_WORKFLOW),
                      listRuns(process.env.RELEASE_WORKFLOW),
                      listRuns(process.env.CI_WORKFLOW),
                      listRuns(process.env.FULL_SUITE_WORKFLOW),
                    ])
                  : [[], [], [], [], []];

              const result = evaluateDeployPreflight({
                shouldContinue: process.env.SHOULD_CONTINUE === 'true',
                precheckSkippedReason: process.env.PRECHECK_SKIPPED_REASON,
                masterSha,
                workflowRef: context.ref,
                workflowSha: context.sha,
                currentRunId: context.runId,
                activeWorkflowRuns: [
                  { label: 'Deploy ECS (production)', runs: deployRuns },
                  { label: 'Deploy ECS fastlane', runs: fastlaneRuns },
                  { label: 'Release', runs: releaseRuns },
                ],
                successfulWorkflowMarkers: [
                  { label: 'Deploy ECS (production)', runs: deployRuns },
                  { label: 'Deploy ECS fastlane', runs: fastlaneRuns },
                  {
                    label: 'the canonical Release workflow',
                    runs: releaseRuns,
                  },
                ],
                ciRuns,
                fullSuiteRuns,
              });
              for (const [key, value] of Object.entries(result)) {
                core.setOutput(key, value || '');
              }
            } catch (error) {
              const reason = `Daily deploy preflight failed unexpectedly: ${error.message}`;
              for (const [key, value] of Object.entries({
                should_deploy: 'false',
                issue_needed: 'true',
                outcome: 'blocked',
                skipped_reason: '',
                failure_reason: reason,
                failure_stage: 'preflight',
                master_sha: masterSha,
                ci_run_url: '',
                gate_run_url: '',
                deploy_marker_url: '',
                deployed_sha: '',
              })) {
                core.setOutput(key, value);
              }
              core.setFailed(error);
            }

  dispatch-deploy:
    name: Dispatch normal production deploy
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    outputs:
      issue_needed: ${{ steps.deploy.outputs.issue_needed }}
      outcome: ${{ steps.deploy.outputs.outcome }}
      failure_reason: ${{ steps.deploy.outputs.failure_reason }}
      failure_stage: ${{ steps.deploy.outputs.failure_stage }}
      failure_job_name: ${{ steps.deploy.outputs.failure_job_name }}
      failure_job_url: ${{ steps.deploy.outputs.failure_job_url }}
      failure_step_name: ${{ steps.deploy.outputs.failure_step_name }}
      deploy_run_url: ${{ steps.deploy.outputs.deploy_run_url }}
      deployed_sha: ${{ steps.deploy.outputs.deployed_sha }}
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch and watch Deploy ECS (production)
        id: deploy
        uses: actions/github-script@v9
        env:
          MASTER_SHA: ${{ needs.preflight.outputs.master_sha }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const helpers = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/daily-deploy-orchestration.mjs',
                ),
              ).href,
            );
            const {
              classifyDeployRunFailure,
              createDeployRunTitle,
              formatDeployFailure,
              selectCorrelatedDeployRun,
            } = helpers;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const masterSha = process.env.MASTER_SHA;
            const workflowId = process.env.DEPLOY_WORKFLOW;
            const correlationId = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT || '1'}`;
            const expectedRunTitle = createDeployRunTitle(correlationId);
            const deadline = Date.now() + 170 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const result = {
              issue_needed: 'false',
              outcome: '',
              failure_reason: '',
              failure_stage: '',
              failure_job_name: '',
              failure_job_url: '',
              failure_step_name: '',
              deploy_run_url: '',
              deployed_sha: '',
            };

            function setOutputs() {
              for (const [key, value] of Object.entries(result)) {
                core.setOutput(key, value || '');
              }
            }

            function fail(reason, classification = {}, outcome = 'failed') {
              result.issue_needed = 'true';
              result.outcome = outcome;
              result.failure_reason = reason;
              result.failure_stage = classification.stage || 'unknown';
              result.failure_job_name = classification.jobName || '';
              result.failure_job_url = classification.jobUrl || '';
              result.failure_step_name = classification.stepName || '';
              setOutputs();
              core.setFailed(reason);
            }

            async function findDispatchedRun() {
              // Poll longer than the GitHub Actions dispatch propagation lag
              // under schedule backlog (observed multi-minute delays).
              for (let attempt = 1; attempt <= 60; attempt += 1) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  branch: 'master',
                  event: 'workflow_dispatch',
                  per_page: 100,
                });
                const selection = selectCorrelatedDeployRun(
                  runs.data.workflow_runs,
                  { correlationId },
                );
                if (selection.matchCount > 1) {
                  return { ambiguousCount: selection.matchCount, run: null };
                }
                if (selection.run) {
                  return { ambiguousCount: 0, run: selection.run };
                }
                core.info(`Waiting for dispatched deploy run to appear (${attempt}/60)...`);
                await sleep(5000);
              }
              return { ambiguousCount: 0, run: null };
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowId,
              ref: 'master',
              inputs: {
                orchestrator_run_id: correlationId,
                expected_master_sha: masterSha,
              },
            });

            const selection = await findDispatchedRun();
            if (selection.ambiguousCount > 1) {
              fail(
                `Dispatch correlation ${correlationId} matched ${selection.ambiguousCount} child runs; refusing an ambiguous attachment.`,
                { stage: 'dispatch-discovery' },
              );
              return;
            }
            const run = selection.run;
            if (!run) {
              fail(
                `Deploy ECS (production) dispatch did not produce correlated run ${expectedRunTitle} for ${masterSha}.`,
                { stage: 'dispatch-discovery' },
              );
              return;
            }

            result.deploy_run_url = run.html_url;
            setOutputs();
            core.info(`Watching deploy run: ${run.html_url}`);

            if (run.head_sha !== masterSha) {
              fail(
                `Correlated child run ${run.html_url} resolved ${run.head_sha}, but preflight selected ${masterSha}; master advanced before dispatch and the child was blocked by its expected-SHA guard.`,
                { stage: 'dispatch-discovery' },
                'blocked',
              );
              return;
            }

            let current = run;
            while (current.status !== 'completed') {
              if (Date.now() > deadline) {
                fail(`Deploy ECS (production) did not complete before the 170 minute watcher deadline: ${run.html_url}`);
                return;
              }
              await sleep(30000);
              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              current = response.data;
              core.info(`Deploy run status: ${current.status}${current.conclusion ? ` / ${current.conclusion}` : ''}`);
            }

            if (current.conclusion === 'success') {
              result.outcome = 'deployed';
              result.deployed_sha = masterSha;
              setOutputs();
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              },
            );
            const classification = classifyDeployRunFailure(jobs, {
              childConclusion: current.conclusion,
            });
            fail(
              `Deploy ECS (production) ${formatDeployFailure(
                classification,
                current.conclusion,
              )}`,
              classification,
            );

  report-failure:
    name: Report blocking failure
    needs: [preflight, dispatch-deploy]
    if: ${{ always() && (needs.preflight.outputs.issue_needed == 'true' || needs.dispatch-deploy.outputs.issue_needed == 'true' || needs.preflight.result == 'failure' || needs.preflight.result == 'cancelled' || needs.dispatch-deploy.result == 'failure' || needs.dispatch-deploy.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      issue_url: ${{ steps.issue.outputs.issue_url }}
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Open or update tracking issue
        id: issue
        uses: actions/github-script@v9
        env:
          MASTER_SHA: ${{ needs.preflight.outputs.master_sha || needs.dispatch-deploy.outputs.deployed_sha || 'unknown' }}
          PREFLIGHT_OUTCOME: ${{ needs.preflight.outputs.outcome }}
          DISPATCH_OUTCOME: ${{ needs.dispatch-deploy.outputs.outcome }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          DISPATCH_RESULT: ${{ needs.dispatch-deploy.result }}
          FAILURE_REASON: ${{ needs.dispatch-deploy.outputs.failure_reason || needs.preflight.outputs.failure_reason || 'Daily deploy workflow failed before it could record a reason.' }}
          FAILURE_STAGE: ${{ needs.dispatch-deploy.outputs.failure_stage || needs.preflight.outputs.failure_stage || 'unknown' }}
          FAILURE_JOB_NAME: ${{ needs.dispatch-deploy.outputs.failure_job_name }}
          FAILURE_JOB_URL: ${{ needs.dispatch-deploy.outputs.failure_job_url }}
          FAILURE_STEP_NAME: ${{ needs.dispatch-deploy.outputs.failure_step_name }}
          CI_RUN_URL: ${{ needs.preflight.outputs.ci_run_url }}
          GATE_RUN_URL: ${{ needs.preflight.outputs.gate_run_url }}
          DEPLOY_RUN_URL: ${{ needs.dispatch-deploy.outputs.deploy_run_url }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              buildDailyDeployFailureBody,
              reportDailyDeployFailure,
              resolveDailyDeployOutcome,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/daily-deploy-orchestration.mjs',
                ),
              ).href,
            );
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome = resolveDailyDeployOutcome({
              preflightOutcome: process.env.PREFLIGHT_OUTCOME,
              dispatchOutcome: process.env.DISPATCH_OUTCOME,
              preflightResult: process.env.PREFLIGHT_RESULT,
              dispatchResult: process.env.DISPATCH_RESULT,
            });
            const body = buildDailyDeployFailureBody({
              runId: context.runId,
              date,
              runUrl,
              masterSha: process.env.MASTER_SHA,
              outcome,
              failureReason: process.env.FAILURE_REASON,
              failureStage: process.env.FAILURE_STAGE,
              failureJobName: process.env.FAILURE_JOB_NAME,
              failureJobUrl: process.env.FAILURE_JOB_URL,
              failureStepName: process.env.FAILURE_STEP_NAME,
              ciRunUrl: process.env.CI_RUN_URL,
              gateRunUrl: process.env.GATE_RUN_URL,
              deployRunUrl: process.env.DEPLOY_RUN_URL,
            });
            const report = await reportDailyDeployFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              runId: context.runId,
              body,
              core,
            });
            core.setOutput('issue_url', report.issueUrl || '');

  summary:
    name: Summary
    needs: [preflight, dispatch-deploy, report-failure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Write deployment attempt summary
        uses: actions/github-script@v9
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          DISPATCH_RESULT: ${{ needs.dispatch-deploy.result }}
          REPORT_RESULT: ${{ needs.report-failure.result }}
          PREFLIGHT_ISSUE_NEEDED: ${{ needs.preflight.outputs.issue_needed }}
          DEPLOY_ISSUE_NEEDED: ${{ needs.dispatch-deploy.outputs.issue_needed }}
          SHOULD_DEPLOY: ${{ needs.preflight.outputs.should_deploy }}
          PREFLIGHT_OUTCOME: ${{ needs.preflight.outputs.outcome }}
          DISPATCH_OUTCOME: ${{ needs.dispatch-deploy.outputs.outcome }}
          MASTER_SHA: ${{ needs.preflight.outputs.master_sha }}
          DEPLOYED_SHA: ${{ needs.dispatch-deploy.outputs.deployed_sha || needs.preflight.outputs.deployed_sha }}
          SKIPPED_REASON: ${{ needs.preflight.outputs.skipped_reason }}
          FAILURE_REASON: ${{ needs.dispatch-deploy.outputs.failure_reason || needs.preflight.outputs.failure_reason }}
          FAILURE_STAGE: ${{ needs.dispatch-deploy.outputs.failure_stage || needs.preflight.outputs.failure_stage }}
          FAILURE_JOB_NAME: ${{ needs.dispatch-deploy.outputs.failure_job_name }}
          FAILURE_JOB_URL: ${{ needs.dispatch-deploy.outputs.failure_job_url }}
          FAILURE_STEP_NAME: ${{ needs.dispatch-deploy.outputs.failure_step_name }}
          CI_RUN_URL: ${{ needs.preflight.outputs.ci_run_url }}
          GATE_RUN_URL: ${{ needs.preflight.outputs.gate_run_url }}
          DEPLOY_MARKER_URL: ${{ needs.preflight.outputs.deploy_marker_url }}
          DEPLOY_RUN_URL: ${{ needs.dispatch-deploy.outputs.deploy_run_url }}
          ISSUE_URL: ${{ needs.report-failure.outputs.issue_url }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { buildDailyDeploySummary } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/daily-deploy-orchestration.mjs',
                ),
              ).href,
            );
            const summary = buildDailyDeploySummary({
              preflightOutcome: process.env.PREFLIGHT_OUTCOME,
              dispatchOutcome: process.env.DISPATCH_OUTCOME,
              preflightResult: process.env.PREFLIGHT_RESULT,
              dispatchResult: process.env.DISPATCH_RESULT,
              reportResult: process.env.REPORT_RESULT,
              masterSha: process.env.MASTER_SHA,
              deployedSha: process.env.DEPLOYED_SHA,
              skippedReason: process.env.SKIPPED_REASON,
              failureReason: process.env.FAILURE_REASON,
              failureStage: process.env.FAILURE_STAGE,
              failureJobName: process.env.FAILURE_JOB_NAME,
              failureJobUrl: process.env.FAILURE_JOB_URL,
              failureStepName: process.env.FAILURE_STEP_NAME,
              ciRunUrl: process.env.CI_RUN_URL,
              gateRunUrl: process.env.GATE_RUN_URL,
              deployMarkerUrl: process.env.DEPLOY_MARKER_URL,
              deployRunUrl: process.env.DEPLOY_RUN_URL,
              issueUrl: process.env.ISSUE_URL,
            });
            await core.summary.addRaw(summary).write();

            if (
              process.env.PREFLIGHT_ISSUE_NEEDED === 'true' ||
              process.env.DEPLOY_ISSUE_NEEDED === 'true' ||
              ['failure', 'cancelled'].includes(process.env.REPORT_RESULT)
            ) {
              core.setFailed('Daily production deploy was blocked or failed.');
            }
