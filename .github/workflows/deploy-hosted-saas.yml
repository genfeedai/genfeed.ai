name: Deploy hosted SaaS
run-name: Deploy hosted SaaS | ${{ inputs.source_sha }} | ${{ inputs.correlation_id || 'manual' }}

# Public-repo hosted SaaS lane. Jobs, OpenTofu, and deploy scripts all live
# here so GitHub bills free public minutes. Do not clone console.genfeed.ai.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Product release tag; empty for unreleased deployments"
        required: false
        default: ""
        type: string
      source_sha:
        description: "exact public genfeed.ai source SHA to deploy (must be on master)"
        required: true
        type: string
      marketplace_source_sha:
        description: "exact marketplace.genfeed.ai SHA (empty = skip marketplace)"
        required: false
        default: ""
        type: string
      image_tag:
        description: "optional existing server image tag (defaults to source_sha)"
        required: false
        default: ""
        type: string
      allow_rollback:
        description: "allow image_tag to differ from source_sha"
        required: false
        default: false
        type: boolean
      correlation_id:
        description: "optional unique release/orchestrator correlation id"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Product release tag; empty for unreleased deployments"
        required: false
        default: ""
        type: string
      source_sha:
        description: "exact public genfeed.ai source SHA to deploy (must be on master)"
        required: true
        type: string
      marketplace_source_sha:
        description: "exact marketplace.genfeed.ai SHA (empty = skip marketplace)"
        required: false
        default: ""
        type: string
      image_tag:
        description: "optional existing server image tag (defaults to source_sha)"
        required: false
        default: ""
        type: string
      allow_rollback:
        description: "allow image_tag to differ from source_sha"
        required: false
        default: false
        type: boolean
      correlation_id:
        description: "optional unique release/orchestrator correlation id"
        required: false
        default: ""
        type: string
    secrets:
      MARKETPLACE_DEPLOY_TOKEN:
        required: false
      VERCEL_TOKEN:
        required: true
      NEXT_PUBLIC_POSTHOG_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      TURBO_TOKEN:
        required: false
      CONTENT_HARNESS_BUNDLE_URI:
        required: false
      CONTENT_HARNESS_BUNDLE_SHA256:
        required: false

concurrency:
  group: deploy-hosted-saas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-resolve:
    name: Validate public source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Require master for production deploys
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Hosted SaaS deploys must run from refs/heads/master (got ${GITHUB_REF})"
            exit 1
          fi

      - name: Validate inputs
        id: resolve
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MARKETPLACE_SOURCE_SHA: ${{ inputs.marketplace_source_sha }}
          MARKETPLACE_DEPLOY_TOKEN: ${{ secrets.MARKETPLACE_DEPLOY_TOKEN }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be an exact lowercase 40-character Git commit SHA."
            exit 1
          fi
          if [ -n "${CORRELATION_ID}" ] && ! printf '%s' "${CORRELATION_ID}" | grep -Eq '^[A-Za-z0-9._:-]{1,128}$'; then
            echo "::error::correlation_id contains unsupported characters or exceeds 128 characters."
            exit 1
          fi

          git init public-source
          git -C public-source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C public-source fetch --no-tags --filter=blob:none origin master
          git -C public-source fetch --no-tags --filter=blob:none origin "${SOURCE_SHA}"
          if ! git -C public-source merge-base --is-ancestor "${SOURCE_SHA}" origin/master; then
            echo "::error::source_sha ${SOURCE_SHA} is not reachable from ${GITHUB_REPOSITORY} master."
            exit 1
          fi

          if [ -n "${MARKETPLACE_SOURCE_SHA}" ]; then
            if ! printf '%s' "${MARKETPLACE_SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::marketplace_source_sha must be an exact lowercase 40-character Git commit SHA."
              exit 1
            fi
            if [ -z "${MARKETPLACE_DEPLOY_TOKEN}" ]; then
              echo "::error::MARKETPLACE_DEPLOY_TOKEN requires read access to genfeedai/marketplace.genfeed.ai."
              exit 1
            fi
            git init marketplace-source
            git -C marketplace-source remote add origin https://github.com/genfeedai/marketplace.genfeed.ai.git
            auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MARKETPLACE_DEPLOY_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth_header}"
            git -C marketplace-source -c "http.https://github.com/.extraheader=${auth_header}" fetch --no-tags --filter=blob:none origin master
            git -C marketplace-source -c "http.https://github.com/.extraheader=${auth_header}" fetch --no-tags --filter=blob:none origin "${MARKETPLACE_SOURCE_SHA}"
            if ! git -C marketplace-source merge-base --is-ancestor "${MARKETPLACE_SOURCE_SHA}" origin/master; then
              echo "::error::marketplace_source_sha must be reachable from Marketplace master."
              exit 1
            fi
          fi

          echo "source_sha=${SOURCE_SHA}" >>"${GITHUB_OUTPUT}"

  deploy:
    name: Deploy hosted SaaS
    needs: validate-and-resolve
    permissions:
      id-token: write
      contents: read
      packages: write
      issues: write
    uses: ./.github/workflows/_deploy-hosted-saas-core.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      source_sha: ${{ needs.validate-and-resolve.outputs.source_sha }}
      marketplace_source_sha: ${{ inputs.marketplace_source_sha }}
      image_tag: ${{ inputs.image_tag }}
      allow_rollback: ${{ inputs.allow_rollback }}
    secrets:
      MARKETPLACE_DEPLOY_TOKEN: ${{ secrets.MARKETPLACE_DEPLOY_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      CONTENT_HARNESS_BUNDLE_URI: ${{ secrets.CONTENT_HARNESS_BUNDLE_URI }}
      CONTENT_HARNESS_BUNDLE_SHA256: ${{ secrets.CONTENT_HARNESS_BUNDLE_SHA256 }}
