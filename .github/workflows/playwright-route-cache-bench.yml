# Playwright route cache benchmark (temporary, measurement only)
#
# Any page.route()/context.route() makes Playwright send
# Network.setCacheDisabled for the page, which turns off Chromium's HTTP cache
# (microsoft/playwright#22865, still open on 1.64.x). Every mocked e2e test
# registers routes, so this job measures what that costs the real suite: it runs
# the same specs on one runner with stock Playwright (A) and with the cache
# disable call patched out of node_modules (B), then writes the timings to the
# job summary.
#
# Not a gate and not meant to merge. Delete with the PR once the numbers are in.

name: Playwright Route Cache Bench

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/playwright-route-cache-bench.yml
      - .github/scripts/playwright-route-cache-bench.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  subset:
    name: Navigation-heavy specs (A B A B)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app

      - name: Benchmark
        run: bash .github/scripts/playwright-route-cache-bench.sh subset
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          E2E_EXPECT_TIMEOUT_MS: '15000'
          E2E_RETRIES: '0'
          BETTER_AUTH_SECRET: test-better-auth-secret
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: route-cache-bench-subset
          path: bench-results/
          retention-days: 7
          if-no-files-found: ignore

  core:
    name: Full core tier (A B)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app

      - name: Benchmark
        run: bash .github/scripts/playwright-route-cache-bench.sh core
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          E2E_EXPECT_TIMEOUT_MS: '15000'
          E2E_RETRIES: '0'
          BETTER_AUTH_SECRET: test-better-auth-secret
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: route-cache-bench-core
          path: bench-results/
          retention-days: 7
          if-no-files-found: ignore
