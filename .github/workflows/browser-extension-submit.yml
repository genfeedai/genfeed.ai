name: Browser Extension - Submit to Web Store

on:
  workflow_dispatch:
  push:
    tags:
      - "extension-browser-v*"
    paths:
      - "apps/extensions/browser/**"

concurrency:
  group: browser-extension-submit-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  test:
    name: Test Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Run extension tests
        run: bun run test --filter="./apps/extensions/browser/*"

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"

      - name: Build the extension
        run: bun run build
        working-directory: apps/extensions/browser/app

      - name: Package the extension into a zip artifact
        run: bun run package
        working-directory: apps/extensions/browser/app

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension-build
          path: apps/extensions/browser/app/build/chrome-mv3-prod.zip

  submit:
    name: Submit Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-extension-build
          path: apps/extensions/browser/app/build

      - name: Browser Platform Publish
        env:
          EXTENSION_SUBMIT_KEYS: ${{ secrets.EXTENSION_SUBMIT_KEYS }}
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158
        with:
          keys: ${{ env.EXTENSION_SUBMIT_KEYS }}
          artifact: apps/extensions/browser/app/build/chrome-mv3-prod.zip
