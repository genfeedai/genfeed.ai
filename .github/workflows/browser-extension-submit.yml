name: Browser Extension - Package and Submit

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the matching release tag to Chrome Web Store (otherwise package only)
        type: boolean
        default: false
  push:
    tags:
      - "extension-browser-v*"

concurrency:
  group: browser-extension-submit-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  test:
    name: Test Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env

      - name: Validate delivery version
        run: node scripts/ci/delivery-readiness.mjs browser

      - name: Run extension tests
        run: bunx turbo run test --filter=@genfeedai/extension-browser

  build:
    name: Build Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"

      - name: Build the extension
        run: bunx turbo run build --force --filter=@genfeedai/extension-browser

      - name: Package the extension into a zip artifact
        run: bun run package
        working-directory: apps/extensions/browser/app

      # The Chrome Web Store rejects uploads whose manifest has a `key` field.
      # It stays in package.json so local builds keep a stable extension ID.
      - name: Remove the development key from the store package
        working-directory: apps/extensions/browser/app/build
        run: |
          mkdir unpacked
          unzip -q chrome-mv3-prod.zip -d unpacked
          node -e "const f='unpacked/manifest.json',m=JSON.parse(require('fs').readFileSync(f,'utf8'));delete m.key;require('fs').writeFileSync(f,JSON.stringify(m))"
          rm chrome-mv3-prod.zip
          (cd unpacked && zip -q -r ../chrome-mv3-prod.zip .)
          rm -rf unpacked
          unzip -p chrome-mv3-prod.zip manifest.json | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));if('key' in m){console.error('manifest still has a key');process.exit(1)}"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-extension-build
          path: apps/extensions/browser/app/build/chrome-mv3-prod.zip
          if-no-files-found: error
          retention-days: 14

  submit:
    if: startsWith(github.ref, 'refs/tags/extension-browser-v') && (github.event_name == 'push' || inputs.submit)
    name: Submit Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Validate store prerequisites
        env:
          SUBMIT: 'true'
          EXTENSION_SUBMIT_KEYS: ${{ secrets.EXTENSION_SUBMIT_KEYS }}
        run: node scripts/ci/delivery-readiness.mjs browser

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-extension-build
          path: apps/extensions/browser/app/build

      - name: Browser Platform Publish
        env:
          EXTENSION_SUBMIT_KEYS: ${{ secrets.EXTENSION_SUBMIT_KEYS }}
        uses: PlasmoHQ/bpp@c15984c0a74f452851c605cab46f34d9fd6cb158
        with:
          keys: ${{ env.EXTENSION_SUBMIT_KEYS }}
          artifact: apps/extensions/browser/app/build/chrome-mv3-prod.zip
