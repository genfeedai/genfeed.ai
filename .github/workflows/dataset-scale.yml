name: Dataset Scale
on:
  # Weekly on Sunday at 03:00 UTC.
  schedule:
    - cron: '0 3 * * 0'
permissions:
  contents: read
concurrency:
  group: dataset-scale-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scale:
    name: Weekly 100k Dataset Scale
    permissions:
      contents: read
    uses: ./.github/workflows/_dataset-acceptance.yml
    with:
      group: dataset-scale
      candidate_sha: ${{ github.sha }}
