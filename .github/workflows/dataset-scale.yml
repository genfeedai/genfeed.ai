name: Dataset Scale
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Optional exact candidate commit; weekly/manual default is the current master SHA.'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: dataset-scale-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scale:
    name: Weekly 100k Dataset Scale
    permissions:
      contents: read
    uses: ./.github/workflows/_dataset-acceptance.yml
    with:
      group: dataset-scale
      candidate_sha: ${{ inputs.candidate_sha || github.sha }}
