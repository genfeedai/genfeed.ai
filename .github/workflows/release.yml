name: Release
run-name: Release ${{ inputs.tag }}

# Canonical stable-release entry point. A maintainer chooses the version and
# dispatches this workflow from master. The workflow pins that master SHA,
# verifies it once — reusing exact-SHA connected acceptance when qualified,
# otherwise requesting that connected suite — publishes community and SaaS from the same commit,
# and only then makes the GitHub release public.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "stable release tag (vX.Y.Z)"
        required: true
        type: string
      recovery_run_id:
        description: "Optional failed Release run ID whose unpublished draft and proved-green gates must be recovered at the original SHA"
        required: false
        type: string
      repair_published_release:
        description: "Repair this incomplete latest release from current master: redraft it, replace its tag only after every gate is green, and republish the same version"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release and create draft
    runs-on: ubuntu-latest
    # Includes bounded discovery and waiting for existing exact-SHA evidence.
    # A still-active suite exhausts this validation window without starting
    # a duplicate; retry release validation after that suite completes.
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    outputs:
      archive_asset_digest: ${{ steps.release.outputs.archive_asset_digest }}
      archive_asset_id: ${{ steps.release.outputs.archive_asset_id }}
      archive_asset_size: ${{ steps.release.outputs.archive_asset_size }}
      changelog_asset_digest: ${{ steps.release.outputs.changelog_asset_digest }}
      changelog_asset_id: ${{ steps.release.outputs.changelog_asset_id }}
      changelog_asset_size: ${{ steps.release.outputs.changelog_asset_size }}
      checksum_asset_digest: ${{ steps.release.outputs.checksum_asset_digest }}
      checksum_asset_id: ${{ steps.release.outputs.checksum_asset_id }}
      checksum_asset_size: ${{ steps.release.outputs.checksum_asset_size }}
      draft_body_sha256: ${{ steps.release.outputs.draft_body_sha256 }}
      draft_id: ${{ steps.release.outputs.draft_id }}
      draft_title: ${{ steps.release.outputs.draft_title }}
      # Reviewed historical image digest for npm-source-noop. Empty on a normal
      # release and on attachment-failure recovery. Later promotion uses the
      # verified image_digest from publish-community or verify-recovered-assets.
      image_digest: ${{ steps.release.outputs.image_digest }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      major_minor_tag: ${{ steps.release.outputs.major_minor_tag }}
      repair_mode: ${{ steps.release.outputs.repair_mode }}
      recovery_kind: ${{ steps.release.outputs.recovery_kind }}
      recovery_mode: ${{ steps.release.outputs.recovery_mode }}
      recovery_run_id: ${{ steps.release.outputs.recovery_run_id }}
      recovery_saas_verified: ${{ steps.release.outputs.recovery_saas_verified }}
      recovery_suite_verified: ${{ steps.release.outputs.recovery_suite_verified }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      suite_verified: ${{ steps.suite.outputs.suite_verified }}
    steps:
      - name: Validate production ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Stable releases must run from refs/heads/master (got ${GITHUB_REF})"
            exit 1
          fi

      - name: Validate release tag shape
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tag must use vX.Y.Z: ${REQUESTED_TAG}"
            exit 1
          fi

      - name: Checkout release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve release source and recovery evidence
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          REPAIR_PUBLISHED_RELEASE: ${{ inputs.repair_published_release }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${RECOVERY_RUN_ID}" ] && [ "${REPAIR_PUBLISHED_RELEASE}" = 'true' ]; then
            echo "::error::Historical run recovery and published-release repair are mutually exclusive."
            exit 1
          fi

          if [ -z "${RECOVERY_RUN_ID}" ]; then
            {
              echo "artifact_job_id="
              echo "archive_asset_digest="
              echo "archive_asset_id="
              echo "archive_asset_size="
              echo "changelog_asset_digest="
              echo "changelog_asset_id="
              echo "changelog_asset_size="
              echo "checksum_asset_digest="
              echo "checksum_asset_id="
              echo "checksum_asset_size="
              echo "draft_body_sha256="
              echo "draft_id="
              echo "draft_title="
              echo "image_digest="
              echo "repair_mode=${REPAIR_PUBLISHED_RELEASE}"
              echo "recovery_kind="
              echo "recovery_mode=false"
              echo "recovery_run_id="
              echo "recovery_saas_verified=false"
              echo "recovery_suite_verified=false"
              echo "release_sha=${GITHUB_SHA}"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/ci/release-recovery-evidence.mjs
          echo "repair_mode=false" >>"${GITHUB_OUTPUT}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" >/dev/null 2>&1; then
            echo "::error::Recovery refuses ${REQUESTED_TAG} because its Git tag already exists."
            exit 1
          fi

      - name: Checkout pinned master SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.source.outputs.release_sha }}

      - name: Verify recovery source remains on master
        if: ${{ inputs.recovery_run_id != '' }}
        env:
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/master || {
            echo "::error::Historical release SHA ${RELEASE_SHA} is no longer reachable from master."
            exit 1
          }

      # One repo version (RELEASING.md → Version contract): the root package.json
      # is bumped in a normal PR and the dispatched tag must name that version.
      - name: Verify root package.json version matches the release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(jq -r '.version' package.json)"
          if [ "v${package_version}" != "${REQUESTED_TAG}" ]; then
            echo "::error::Root package.json is ${package_version} but the release tag is ${REQUESTED_TAG}. Bump the root version in a PR, merge it, then dispatch Release with the matching tag."
            exit 1
          fi

      # Changelog is generated, never hand-edited: the release body is the
      # git-cliff section for this tag, and the full CHANGELOG.md is attached to
      # the release as an asset. cliff.toml owns grouping and PR links.
      - name: Generate release notes
        if: ${{ inputs.recovery_run_id == '' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ inputs.tag }} --strip header
        env:
          OUTPUT: release-notes.md

      - name: Generate full changelog
        if: ${{ inputs.recovery_run_id == '' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag ${{ inputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Validate version and create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_ARCHIVE_ASSET_DIGEST: ${{ steps.source.outputs.archive_asset_digest }}
          RECOVERY_ARCHIVE_ASSET_ID: ${{ steps.source.outputs.archive_asset_id }}
          RECOVERY_ARCHIVE_ASSET_SIZE: ${{ steps.source.outputs.archive_asset_size }}
          RECOVERY_CHANGELOG_ASSET_DIGEST: ${{ steps.source.outputs.changelog_asset_digest }}
          RECOVERY_CHANGELOG_ASSET_ID: ${{ steps.source.outputs.changelog_asset_id }}
          RECOVERY_CHANGELOG_ASSET_SIZE: ${{ steps.source.outputs.changelog_asset_size }}
          RECOVERY_CHECKSUM_ASSET_DIGEST: ${{ steps.source.outputs.checksum_asset_digest }}
          RECOVERY_CHECKSUM_ASSET_ID: ${{ steps.source.outputs.checksum_asset_id }}
          RECOVERY_CHECKSUM_ASSET_SIZE: ${{ steps.source.outputs.checksum_asset_size }}
          RECOVERY_DRAFT_BODY_SHA256: ${{ steps.source.outputs.draft_body_sha256 }}
          RECOVERY_DRAFT_ID: ${{ steps.source.outputs.draft_id }}
          RECOVERY_DRAFT_TITLE: ${{ steps.source.outputs.draft_title }}
          RECOVERY_IMAGE_DIGEST: ${{ steps.source.outputs.image_digest }}
          RECOVERY_KIND: ${{ steps.source.outputs.recovery_kind }}
          RECOVERY_MODE: ${{ steps.source.outputs.recovery_mode }}
          RECOVERY_RUN_ID: ${{ steps.source.outputs.recovery_run_id }}
          RECOVERY_SAAS_VERIFIED: ${{ steps.source.outputs.recovery_saas_verified }}
          RECOVERY_SUITE_VERIFIED: ${{ steps.source.outputs.recovery_suite_verified }}
          REPAIR_MODE: ${{ steps.source.outputs.repair_mode }}
          REQUESTED_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          set -euo pipefail

          release_tag="${REQUESTED_TAG}"
          release_sha="${SOURCE_SHA}"
          if [[ ! "${release_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Stable release tag must use vX.Y.Z: ${release_tag}"
            exit 1
          fi

          image_tag="${release_tag#v}"
          major_minor_tag="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          release_json="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp |
              jq --arg tag "${release_tag}" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -n "${latest_tag}" ]; then
            highest="$(printf '%s\n%s\n' "${latest_tag#v}" "${image_tag}" | sort -V | tail -n 1)"
            if [ "${REPAIR_MODE}" = 'true' ]; then
              if [ -z "${release_json}" ] || [ "${highest}" != "${image_tag}" ]; then
                echo "::error::Published-release repair requires an existing release that is not older than ${latest_tag}."
                exit 1
              fi
            elif [ "${highest}" != "${image_tag}" ] || [ "${latest_tag#v}" = "${image_tag}" ]; then
              echo "::error::Release ${release_tag} must be newer than latest published release ${latest_tag}."
              exit 1
            fi
          elif [ "${REPAIR_MODE}" = 'true' ] && [ -z "${release_json}" ]; then
            echo "::error::Published-release repair requires an existing release for ${release_tag}."
            exit 1
          fi

          if [ -n "${release_json}" ]; then
            if [ "${REPAIR_MODE}" = 'true' ]; then
              if [ "$(jq -r '.draft' <<<"${release_json}")" != 'true' ]; then
                install_asset_count="$(jq '[.assets[] | select(
                  .name == "genfeed-selfhosted.tar.gz"
                  or .name == "genfeed-selfhosted.tar.gz.sha256"
                )] | length' <<<"${release_json}")"
                if [ "${install_asset_count}" -eq 2 ]; then
                  echo "::error::Release ${release_tag} already has the complete public install contract; refusing destructive repair."
                  exit 1
                fi
              fi

              # Hide the broken public release while rebuilding it. The tag is
              # removed only after the release is safely a draft; final publish
              # recreates it at the fully verified current master SHA.
              gh release edit "${release_tag}" \
                --draft \
                --notes-file release-notes.md \
                --target "${release_sha}" \
                --title "${release_tag}"
              if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}"
              fi

              release_json="$(
                gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp |
                  jq --arg tag "${release_tag}" '[.[][] | select(.tag_name == $tag)] | first // empty'
              )"
              if [ -z "${release_json}" ] || \
                 [ "$(jq -r '.draft' <<<"${release_json}")" != 'true' ] || \
                 [ "$(jq -r '.published_at // ""' <<<"${release_json}")" != '' ] || \
                 [ "$(jq -r '.target_commitish // ""' <<<"${release_json}")" != "${release_sha}" ]; then
                echo "::error::Release ${release_tag} did not become an unpublished draft at ${release_sha}."
                exit 1
              fi
              echo "Repairing published release ${release_tag} from current master SHA ${release_sha}."
            else
              if [ "$(jq -r '.draft' <<<"${release_json}")" != "true" ]; then
                echo "::error::Release ${release_tag} is already published."
                exit 1
              fi

              draft_target="$(jq -r '.target_commitish' <<<"${release_json}")"
              if [ "${draft_target}" != "${release_sha}" ]; then
                echo "::error::Draft ${release_tag} targets ${draft_target}, not pinned master SHA ${release_sha}."
                exit 1
              fi
            fi
            if [ "${RECOVERY_MODE}" = 'true' ]; then
              draft_id="$(jq -r '.id' <<<"${release_json}")"
              draft_title="$(jq -r '.name // ""' <<<"${release_json}")"
              draft_body_sha256="$(jq -j '.body // ""' <<<"${release_json}" | sha256sum | awk '{print $1}')"
              if [ "${draft_id}" != "${RECOVERY_DRAFT_ID}" ] || \
                 [ "${draft_title}" != "${RECOVERY_DRAFT_TITLE}" ] || \
                 [ "${draft_title}" != "${release_tag}" ] || \
                 [ "${draft_body_sha256}" != "${RECOVERY_DRAFT_BODY_SHA256}" ]; then
                echo "::error::Recovery draft identity, title, or notes changed after historical evidence validation."
                exit 1
              fi

              assert_frozen_asset() {
                local asset_name="$1"
                local expected_id="$2"
                local expected_digest="$3"
                local expected_size="$4"
                local matches asset_json
                matches="$(jq -c --arg name "${asset_name}" \
                  '[.assets[] | select(.name == $name)]' <<<"${release_json}")"
                if [ "$(jq 'length' <<<"${matches}")" -ne 1 ]; then
                  echo "::error::npm-source-noop draft asset ${asset_name} is missing or duplicated."
                  exit 1
                fi
                asset_json="$(jq -c '.[0]' <<<"${matches}")"
                if [ "$(jq -r '.id | tostring' <<<"${asset_json}")" != "${expected_id}" ] || \
                   [ "$(jq -r '.digest // ""' <<<"${asset_json}")" != "${expected_digest}" ] || \
                   [ "$(jq -r '.size | tostring' <<<"${asset_json}")" != "${expected_size}" ] || \
                   [ "$(jq -r '.state // ""' <<<"${asset_json}")" != 'uploaded' ]; then
                  echo "::error::npm-source-noop draft asset ${asset_name} changed after historical evidence validation."
                  exit 1
                fi
              }

              if [ "${RECOVERY_KIND}" = 'attachment-failure' ]; then
                install_asset_count="$(jq '[.assets[] | select(
                  .name == "genfeed-selfhosted.tar.gz"
                  or .name == "genfeed-selfhosted.tar.gz.sha256"
                )] | length' <<<"${release_json}")"
                if [ "${install_asset_count}" -ne 0 ]; then
                  echo "::error::Recovery draft gained a versioned install asset before bundle rebuild."
                  exit 1
                fi
              elif [ "${RECOVERY_KIND}" = 'npm-source-noop' ]; then
                if [ "$(jq '[.assets[]] | length' <<<"${release_json}")" -ne 3 ]; then
                  echo "::error::npm-source-noop draft must contain exactly the changelog and two install assets."
                  exit 1
                fi
                assert_frozen_asset \
                  CHANGELOG.md \
                  "${RECOVERY_CHANGELOG_ASSET_ID}" \
                  "${RECOVERY_CHANGELOG_ASSET_DIGEST}" \
                  "${RECOVERY_CHANGELOG_ASSET_SIZE}"
                assert_frozen_asset \
                  genfeed-selfhosted.tar.gz \
                  "${RECOVERY_ARCHIVE_ASSET_ID}" \
                  "${RECOVERY_ARCHIVE_ASSET_DIGEST}" \
                  "${RECOVERY_ARCHIVE_ASSET_SIZE}"
                assert_frozen_asset \
                  genfeed-selfhosted.tar.gz.sha256 \
                  "${RECOVERY_CHECKSUM_ASSET_ID}" \
                  "${RECOVERY_CHECKSUM_ASSET_DIGEST}" \
                  "${RECOVERY_CHECKSUM_ASSET_SIZE}"
              else
                echo "::error::Recovery kind ${RECOVERY_KIND:-<empty>} is not attachment-failure or npm-source-noop."
                exit 1
              fi

              changelog_matches="$(jq -c '[.assets[] | select(.name == "CHANGELOG.md")]' <<<"${release_json}")"
              if [ "$(jq 'length' <<<"${changelog_matches}")" -ne 1 ]; then
                echo "::error::Recovery draft no longer has exactly one CHANGELOG.md asset."
                exit 1
              fi
              changelog_json="$(jq -c '.[0]' <<<"${changelog_matches}")"
              if [ "$(jq -r '.id | tostring' <<<"${changelog_json}")" != "${RECOVERY_CHANGELOG_ASSET_ID}" ] || \
                 [ "$(jq -r '.digest // ""' <<<"${changelog_json}")" != "${RECOVERY_CHANGELOG_ASSET_DIGEST}" ] || \
                 [ "$(jq -r '.size | tostring' <<<"${changelog_json}")" != "${RECOVERY_CHANGELOG_ASSET_SIZE}" ] || \
                 [ "$(jq -r '.state // ""' <<<"${changelog_json}")" != 'uploaded' ]; then
                echo "::error::Recovery changelog asset changed after historical evidence validation."
                exit 1
              fi
              echo "Reusing draft release ${release_tag} at ${release_sha}. Preserving its existing title and release notes."
            elif [ "${REPAIR_MODE}" != 'true' ]; then
              gh release edit "${release_tag}" --notes-file release-notes.md
              echo "Reusing draft release ${release_tag} at ${release_sha}; refreshed release notes."
            fi
          else
            if [ "${RECOVERY_MODE}" = 'true' ] || [ "${REPAIR_MODE}" = 'true' ]; then
              echo "::error::Expected repair/recovery release ${release_tag} disappeared after validation."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${release_tag} already exists without a reusable draft release."
              exit 1
            fi

            gh release create "${release_tag}" \
              --draft \
              --notes-file release-notes.md \
              --target "${release_sha}" \
              --title "${release_tag}"
            echo "Created draft release ${release_tag} at ${release_sha}."
          fi

          if [ "${RECOVERY_MODE}" != 'true' ]; then
            gh release upload "${release_tag}" CHANGELOG.md --clobber
          fi

          # Draft releases are invisible to /releases/tags/{tag}. List can also
          # return the CHANGELOG asset before GitHub attaches a sha256 digest.
          # Poll until the draft is found and the changelog is content-addressed.
          changelog_asset_id=""
          changelog_asset_digest=""
          changelog_asset_size=""
          changelog_asset_state=""
          release_json=""
          for _attempt in 1 2 3 4 5 6 7 8; do
            release_json="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp |
                jq --arg tag "${release_tag}" '[.[][] | select(.tag_name == $tag)] | first // empty'
            )"
            if [ -z "${release_json}" ]; then
              sleep 2
              continue
            fi

            install_asset_count="$(jq '[.assets[]? | select(
              .name == "genfeed-selfhosted.tar.gz"
              or .name == "genfeed-selfhosted.tar.gz.sha256"
            )] | length' <<<"${release_json}")"
            if [ "${RECOVERY_KIND}" = 'attachment-failure' ] && [ "${install_asset_count}" -ne 0 ]; then
              echo "::error::Draft ${release_tag} must contain no versioned install assets before immutable attachment."
              exit 1
            fi
            if [ "${RECOVERY_KIND}" = 'npm-source-noop' ] && \
              [ "$(jq '[.assets[]?] | length' <<<"${release_json}")" -ne 3 ]; then
              echo "::error::npm-source-noop draft must contain exactly the changelog and two install assets."
              exit 1
            fi

            changelog_matches="$(jq -c '[.assets[]? | select(.name == "CHANGELOG.md")]' <<<"${release_json}")"
            if [ "$(jq 'length' <<<"${changelog_matches}")" != '1' ]; then
              sleep 2
              continue
            fi
            changelog_json="$(jq -c '.[0]' <<<"${changelog_matches}")"
            changelog_asset_id="$(jq -r '.id | tostring' <<<"${changelog_json}")"
            changelog_asset_digest="$(jq -r '.digest // ""' <<<"${changelog_json}")"
            changelog_asset_size="$(jq -r '.size | tostring' <<<"${changelog_json}")"
            changelog_asset_state="$(jq -r '.state // ""' <<<"${changelog_json}")"
            if [[ "${changelog_asset_id}" =~ ^[1-9][0-9]*$ ]] && \
              [[ "${changelog_asset_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && \
              [[ "${changelog_asset_size}" =~ ^[1-9][0-9]*$ ]] && \
              [ "${changelog_asset_state}" = 'uploaded' ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${release_json}" ]; then
            echo "::error::Draft ${release_tag} disappeared after changelog upload."
            exit 1
          fi
          if [[ ! "${changelog_asset_id}" =~ ^[1-9][0-9]*$ ]] || \
            [[ ! "${changelog_asset_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
            [[ ! "${changelog_asset_size}" =~ ^[1-9][0-9]*$ ]] || \
            [ "${changelog_asset_state}" != 'uploaded' ]; then
            echo "::error::Draft ${release_tag} changelog must be non-empty, uploaded, and content-addressed."
            exit 1
          fi

          if [ "${RECOVERY_MODE}" = 'true' ] && {
            [ "${changelog_asset_id}" != "${RECOVERY_CHANGELOG_ASSET_ID}" ] ||
            [ "${changelog_asset_digest}" != "${RECOVERY_CHANGELOG_ASSET_DIGEST}" ] ||
            [ "${changelog_asset_size}" != "${RECOVERY_CHANGELOG_ASSET_SIZE}" ];
          }; then
            echo "::error::Recovery changelog asset changed before draft validation completed."
            exit 1
          fi
          if [ "${RECOVERY_KIND}" = 'npm-source-noop' ]; then
            assert_frozen_asset \
              genfeed-selfhosted.tar.gz \
              "${RECOVERY_ARCHIVE_ASSET_ID}" \
              "${RECOVERY_ARCHIVE_ASSET_DIGEST}" \
              "${RECOVERY_ARCHIVE_ASSET_SIZE}"
            assert_frozen_asset \
              genfeed-selfhosted.tar.gz.sha256 \
              "${RECOVERY_CHECKSUM_ASSET_ID}" \
              "${RECOVERY_CHECKSUM_ASSET_DIGEST}" \
              "${RECOVERY_CHECKSUM_ASSET_SIZE}"
          fi

          draft_id="$(jq -r '.id // ""' <<<"${release_json}")"
          draft_title="$(jq -r '.name // ""' <<<"${release_json}")"
          draft_target="$(jq -r '.target_commitish // ""' <<<"${release_json}")"
          draft_body_sha256="$(jq -j '.body // ""' <<<"${release_json}" | sha256sum | awk '{print $1}')"
          [[ "${draft_id}" =~ ^[0-9]+$ ]] || {
            echo "::error::Validated draft ${release_tag} no longer has a stable release ID."
            exit 1
          }
          if [ "${draft_title}" != "${release_tag}" ]; then
            echo "::error::Draft ${release_tag} has title ${draft_title}, expected ${release_tag}."
            exit 1
          fi
          if [ "${RECOVERY_MODE}" = 'true' ] && {
            [ "${draft_id}" != "${RECOVERY_DRAFT_ID}" ] ||
            [ "${draft_title}" != "${RECOVERY_DRAFT_TITLE}" ] ||
            [ "${draft_title}" != "${release_tag}" ] ||
            [ "${draft_target}" != "${release_sha}" ] ||
            [ "${draft_body_sha256}" != "${RECOVERY_DRAFT_BODY_SHA256}" ];
          }; then
            echo "::error::Recovery draft identity, title, target, or notes changed before asset work."
            exit 1
          fi

          {
            echo "archive_asset_digest=${RECOVERY_ARCHIVE_ASSET_DIGEST}"
            echo "archive_asset_id=${RECOVERY_ARCHIVE_ASSET_ID}"
            echo "archive_asset_size=${RECOVERY_ARCHIVE_ASSET_SIZE}"
            echo "changelog_asset_digest=${changelog_asset_digest}"
            echo "changelog_asset_id=${changelog_asset_id}"
            echo "changelog_asset_size=${changelog_asset_size}"
            echo "checksum_asset_digest=${RECOVERY_CHECKSUM_ASSET_DIGEST}"
            echo "checksum_asset_id=${RECOVERY_CHECKSUM_ASSET_ID}"
            echo "checksum_asset_size=${RECOVERY_CHECKSUM_ASSET_SIZE}"
            echo "draft_body_sha256=${draft_body_sha256}"
            echo "draft_id=${draft_id}"
            echo "draft_title=${draft_title}"
            echo "image_digest=${RECOVERY_IMAGE_DIGEST}"
            echo "image_tag=${image_tag}"
            echo "major_minor_tag=${major_minor_tag}"
            echo "repair_mode=${REPAIR_MODE}"
            echo "recovery_kind=${RECOVERY_KIND}"
            echo "recovery_mode=${RECOVERY_MODE}"
            echo "recovery_run_id=${RECOVERY_RUN_ID}"
            echo "recovery_saas_verified=${RECOVERY_SAAS_VERIFIED}"
            echo "recovery_suite_verified=${RECOVERY_SUITE_VERIFIED}"
            echo "release_sha=${release_sha}"
            echo "release_tag=${release_tag}"
          } >>"${GITHUB_OUTPUT}"

      # Reuse exact-SHA qualified standalone Full Suite or prior successful
      # normal Release evidence. Both require the latest final connected gate;
      # routine push runs leave it disabled. Exclude this Release run, and wait
      # for standalone in-flight evidence only within the bounded window;
      # missing or unqualified evidence requests the connected fallback below.
      # Hard-red evidence blocks release. Historical recovery uses its own proof.
      - name: Check for existing Full Suite evidence
        id: suite
        if: ${{ inputs.recovery_run_id == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: node scripts/ci/full-suite-evidence.mjs

  verify-suite:
    name: Full Suite
    if: ${{ inputs.recovery_run_id == '' && needs.validate-release.outputs.suite_verified != 'true' }}
    needs: validate-release
    permissions:
      actions: write
      contents: read
      issues: write
      packages: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/full-suite.yml
    with:
      run_runtime_acceptance: true
    secrets: inherit

  publish-community:
    name: Publish Community
    needs: [validate-release, verify-suite]
    if: |
      always() &&
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.recovery_kind != 'npm-source-noop' &&
      (
        (needs.validate-release.outputs.recovery_mode == 'true' &&
          needs.validate-release.outputs.recovery_suite_verified == 'true' &&
          needs.verify-suite.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_mode != 'true' &&
          (needs.verify-suite.result == 'success' ||
            (needs.verify-suite.result == 'skipped' &&
              needs.validate-release.outputs.suite_verified == 'true')))
      )
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_publish-selfhosted-core.yml
    with:
      advance_latest: false
      attach_assets: true
      checkout_ref: ${{ needs.validate-release.outputs.release_sha }}
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      major_minor_tag: ""
      release_tag: ${{ needs.validate-release.outputs.release_tag }}
      reuse_existing_image: ${{ needs.validate-release.outputs.recovery_mode == 'true' }}

  # npm-source-noop assets were already attached by the historical run. Check
  # out the current controller, not the historical SHA: this verifier does not
  # exist at the recovered commit. Read the frozen asset bytes and the public
  # image. Do not rebuild, upload, retag, or log in to GHCR.
  verify-recovered-assets:
    name: Verify recovered release assets
    needs: [validate-release, verify-suite]
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.recovery_kind == 'npm-source-noop' &&
      needs.validate-release.outputs.recovery_suite_verified == 'true' &&
      needs.verify-suite.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      archive_asset_digest: ${{ steps.assets.outputs.archive_asset_digest }}
      archive_asset_id: ${{ steps.assets.outputs.archive_asset_id }}
      archive_asset_size: ${{ steps.assets.outputs.archive_asset_size }}
      checksum_asset_digest: ${{ steps.assets.outputs.checksum_asset_digest }}
      checksum_asset_id: ${{ steps.assets.outputs.checksum_asset_id }}
      checksum_asset_size: ${{ steps.assets.outputs.checksum_asset_size }}
      image_digest: ${{ steps.assets.outputs.image_digest }}
    steps:
      - name: Checkout current release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prove this checkout is the current release controller
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Recovered asset verification checked out ${head_sha}, not the current controller ${GITHUB_SHA}."
            exit 1
          fi
          if [ ! -f scripts/ci/recovered-release-assets.mjs ]; then
            echo "::error::Recovered asset verification is missing the controller copy of scripts/ci/recovered-release-assets.mjs."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify frozen install assets and Community image
        id: assets
        env:
          ARCHIVE_ASSET_DIGEST: ${{ needs.validate-release.outputs.archive_asset_digest }}
          ARCHIVE_ASSET_ID: ${{ needs.validate-release.outputs.archive_asset_id }}
          ARCHIVE_ASSET_SIZE: ${{ needs.validate-release.outputs.archive_asset_size }}
          CHANGELOG_ASSET_DIGEST: ${{ needs.validate-release.outputs.changelog_asset_digest }}
          CHANGELOG_ASSET_ID: ${{ needs.validate-release.outputs.changelog_asset_id }}
          CHANGELOG_ASSET_SIZE: ${{ needs.validate-release.outputs.changelog_asset_size }}
          CHECKSUM_ASSET_DIGEST: ${{ needs.validate-release.outputs.checksum_asset_digest }}
          CHECKSUM_ASSET_ID: ${{ needs.validate-release.outputs.checksum_asset_id }}
          CHECKSUM_ASSET_SIZE: ${{ needs.validate-release.outputs.checksum_asset_size }}
          DRAFT_BODY_SHA256: ${{ needs.validate-release.outputs.draft_body_sha256 }}
          DRAFT_ID: ${{ needs.validate-release.outputs.draft_id }}
          DRAFT_TITLE: ${{ needs.validate-release.outputs.draft_title }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.validate-release.outputs.image_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.validate-release.outputs.image_tag }}
          RELEASE_CONTROLLER_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: node scripts/ci/recovered-release-assets.mjs

  deploy-saas:
    name: Deploy hosted SaaS
    # A skipped need normally skips the dependent job, so this condition must
    # be explicit about verify-suite: accept success, or skipped when
    # validate-release confirmed green Full Suite evidence for the release SHA.
    # A failed or evidence-less skipped verify-suite still blocks the deploy.
    if: |
      !cancelled() &&
      inputs.recovery_run_id == '' &&
      needs.validate-release.result == 'success' &&
      (needs.verify-suite.result == 'success' ||
        (needs.verify-suite.result == 'skipped' &&
          needs.validate-release.outputs.suite_verified == 'true'))
    needs: [validate-release, verify-suite]
    permissions:
      id-token: write
      contents: read
      packages: write
      issues: write
    uses: ./.github/workflows/deploy-hosted-saas.yml
    with:
      release_tag: ${{ needs.validate-release.outputs.release_tag }}
      source_sha: ${{ needs.validate-release.outputs.release_sha }}
      correlation_id: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.validate-release.outputs.release_sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      CONTENT_HARNESS_BUNDLE_URI: ${{ secrets.CONTENT_HARNESS_BUNDLE_URI }}
      CONTENT_HARNESS_BUNDLE_SHA256: ${{ secrets.CONTENT_HARNESS_BUNDLE_SHA256 }}

  promote-community:
    name: Promote Community release channels
    needs:
      - validate-release
      - publish-community
      - verify-recovered-assets
      - deploy-saas
      - publish-packages
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.publish-packages.result == 'success' &&
      (
        (needs.publish-community.result == 'success' &&
          needs.verify-recovered-assets.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_kind == 'npm-source-noop' &&
          needs.verify-recovered-assets.result == 'success' &&
          needs.publish-community.result == 'skipped')
      ) &&
      (
        (needs.validate-release.outputs.recovery_mode == 'true' &&
          needs.validate-release.outputs.recovery_saas_verified == 'true' &&
          needs.deploy-saas.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_mode != 'true' &&
          needs.deploy-saas.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.image_digest || needs.publish-community.outputs.image_digest }}
      IMAGE_TAG: ${{ needs.validate-release.outputs.image_tag }}
      MAJOR_MINOR_TAG: ${{ needs.validate-release.outputs.major_minor_tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Advance stable Community channels
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Community publisher returned an invalid image digest: ${IMAGE_DIGEST}"
            exit 1
          }
          actual_digest="$(
            docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' |
              jq -r .
          )"
          [[ "${actual_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Immutable image ${IMAGE}:${IMAGE_TAG} did not resolve to a registry manifest digest."
            exit 1
          }
          if [ "${actual_digest}" != "${IMAGE_DIGEST}" ]; then
            echo "::error::Immutable image ${IMAGE}:${IMAGE_TAG} moved from ${IMAGE_DIGEST} to ${actual_digest}."
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE}:${MAJOR_MINOR_TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${IMAGE_DIGEST}"

  # npm is the one irreversible lane. Normal releases and attachment recovery
  # reach it after the Community rebuild is green. npm-source-noop recovery
  # reaches it after the read-only asset check, still before Community channel
  # promotion and GitHub publication. The called workflow publishes nothing
  # unless its registry-drift plan is empty.
  publish-packages:
    name: Publish npm Packages
    needs:
      - validate-release
      - publish-community
      - verify-recovered-assets
      - deploy-saas
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      (
        (needs.publish-community.result == 'success' &&
          needs.verify-recovered-assets.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_kind == 'npm-source-noop' &&
          needs.verify-recovered-assets.result == 'success' &&
          needs.publish-community.result == 'skipped')
      ) &&
      (
        (needs.validate-release.outputs.recovery_mode == 'true' &&
          needs.validate-release.outputs.recovery_saas_verified == 'true' &&
          needs.deploy-saas.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_mode != 'true' &&
          needs.deploy-saas.result == 'success')
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yml
    with:
      checkout_ref: ${{ needs.validate-release.outputs.release_sha }}
      dry_run: false
      recovery_run_id: ${{ needs.validate-release.outputs.recovery_run_id }}
      trusted_release_call: true
      validated_historical_recovery: ${{ needs.validate-release.outputs.recovery_mode == 'true' }}
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs:
      - validate-release
      - publish-community
      - verify-recovered-assets
      - deploy-saas
      - promote-community
      - publish-packages
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.promote-community.result == 'success' &&
      needs.publish-packages.result == 'success' &&
      (
        (needs.publish-community.result == 'success' &&
          needs.verify-recovered-assets.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_kind == 'npm-source-noop' &&
          needs.verify-recovered-assets.result == 'success' &&
          needs.publish-community.result == 'skipped')
      ) &&
      (
        (needs.validate-release.outputs.recovery_mode == 'true' &&
          needs.validate-release.outputs.recovery_saas_verified == 'true' &&
          needs.deploy-saas.result == 'skipped') ||
        (needs.validate-release.outputs.recovery_mode != 'true' &&
          needs.deploy-saas.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_ARCHIVE_ASSET_DIGEST: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.archive_asset_digest || needs.publish-community.outputs.archive_asset_digest }}
      EXPECTED_ARCHIVE_ASSET_ID: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.archive_asset_id || needs.publish-community.outputs.archive_asset_id }}
      EXPECTED_ARCHIVE_ASSET_SIZE: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.archive_asset_size || '' }}
      EXPECTED_CHANGELOG_ASSET_DIGEST: ${{ needs.validate-release.outputs.changelog_asset_digest }}
      EXPECTED_CHANGELOG_ASSET_ID: ${{ needs.validate-release.outputs.changelog_asset_id }}
      EXPECTED_CHANGELOG_ASSET_SIZE: ${{ needs.validate-release.outputs.changelog_asset_size }}
      EXPECTED_CHECKSUM_ASSET_DIGEST: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.checksum_asset_digest || needs.publish-community.outputs.checksum_asset_digest }}
      EXPECTED_CHECKSUM_ASSET_ID: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.checksum_asset_id || needs.publish-community.outputs.checksum_asset_id }}
      EXPECTED_CHECKSUM_ASSET_SIZE: ${{ needs.validate-release.outputs.recovery_kind == 'npm-source-noop' && needs.verify-recovered-assets.outputs.checksum_asset_size || '' }}
      RECOVERY_KIND: ${{ needs.validate-release.outputs.recovery_kind }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_DRAFT_BODY_SHA256: ${{ needs.validate-release.outputs.draft_body_sha256 }}
      EXPECTED_DRAFT_ID: ${{ needs.validate-release.outputs.draft_id }}
      EXPECTED_DRAFT_TITLE: ${{ needs.validate-release.outputs.draft_title }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
    steps:
      - name: Publish verified release
        run: |
          set -euo pipefail

          release_pages="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_matches="$(jq -c --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)]' <<<"${release_pages}")"
          test "$(jq 'length' <<<"${release_matches}")" -eq 1
          release_json="$(jq -c '.[0]' <<<"${release_matches}")"
          test "$(jq -r '.id' <<<"${release_json}")" = "${EXPECTED_DRAFT_ID}"
          test "$(jq -r '.name // ""' <<<"${release_json}")" = "${EXPECTED_DRAFT_TITLE}"
          test "$(jq -r '.name // ""' <<<"${release_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.draft' <<<"${release_json}")" = 'true'
          test "$(jq -r '.published_at // ""' <<<"${release_json}")" = ''
          test "$(jq -r '.target_commitish' <<<"${release_json}")" = "${RELEASE_SHA}"

          draft_body_sha256="$(jq -j '.body // ""' <<<"${release_json}" | sha256sum | awk '{print $1}')"
          test "${draft_body_sha256}" = "${EXPECTED_DRAFT_BODY_SHA256}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${RELEASE_TAG} appeared before the verified draft was published."
            exit 1
          fi
          if [ "${RECOVERY_KIND}" = 'npm-source-noop' ]; then
            if [ -z "${EXPECTED_ARCHIVE_ASSET_SIZE}" ] || [ -z "${EXPECTED_CHECKSUM_ASSET_SIZE}" ]; then
              echo "::error::npm-source-noop publication is missing frozen install asset sizes."
              exit 1
            fi
          elif [ -n "${RECOVERY_KIND}" ] && [ "${RECOVERY_KIND}" != 'attachment-failure' ]; then
            echo "::error::Recovery kind ${RECOVERY_KIND} is not attachment-failure or npm-source-noop."
            exit 1
          fi

          verify_asset_identity() {
            local asset_name="$1"
            local expected_id="$2"
            local expected_digest="$3"
            local expected_size="${4:-}"
            local matches asset_json actual_id actual_digest actual_size

            matches="$(jq -c --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)]' <<<"${release_json}")"
            if [ "$(jq 'length' <<<"${matches}")" -ne 1 ]; then
              echo "::error::Draft ${RELEASE_TAG} must contain exactly one ${asset_name} asset."
              exit 1
            fi
            asset_json="$(jq -c '.[0]' <<<"${matches}")"
            actual_id="$(jq -r '.id | tostring' <<<"${asset_json}")"
            actual_digest="$(jq -r '.digest // ""' <<<"${asset_json}")"
            actual_size="$(jq -r '.size | tostring' <<<"${asset_json}")"

            [[ "${expected_id}" =~ ^[1-9][0-9]*$ ]] && \
              [[ "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && \
              [ "${actual_id}" = "${expected_id}" ] && \
              [ "${actual_digest}" = "${expected_digest}" ] && \
              [[ "${actual_size}" =~ ^[1-9][0-9]*$ ]] && \
              [ "$(jq -r '.state // ""' <<<"${asset_json}")" = 'uploaded' ] || {
                echo "::error::Draft ${RELEASE_TAG} asset ${asset_name} changed after verification."
                exit 1
              }
            if [ -n "${expected_size}" ] && [ "${actual_size}" != "${expected_size}" ]; then
              echo "::error::Draft ${RELEASE_TAG} asset ${asset_name} changed size after verification."
              exit 1
            fi
          }

          verify_asset_identity \
            CHANGELOG.md \
            "${EXPECTED_CHANGELOG_ASSET_ID}" \
            "${EXPECTED_CHANGELOG_ASSET_DIGEST}" \
            "${EXPECTED_CHANGELOG_ASSET_SIZE}"
          verify_asset_identity \
            genfeed-selfhosted.tar.gz \
            "${EXPECTED_ARCHIVE_ASSET_ID}" \
            "${EXPECTED_ARCHIVE_ASSET_DIGEST}" \
            "${EXPECTED_ARCHIVE_ASSET_SIZE}"
          verify_asset_identity \
            genfeed-selfhosted.tar.gz.sha256 \
            "${EXPECTED_CHECKSUM_ASSET_ID}" \
            "${EXPECTED_CHECKSUM_ASSET_DIGEST}" \
            "${EXPECTED_CHECKSUM_ASSET_SIZE}"

          gh release edit "${RELEASE_TAG}" --draft=false --latest

          resolve_published_tag_sha() {
            local ref_json=""
            local object_sha=""
            local object_type=""
            local tag_json=""

            # Publishing a draft can recreate a missing lightweight tag. Poll
            # the ref because the release edit and Git-data APIs are only
            # eventually consistent, then peel annotated tags if GitHub ever
            # returns one for this release name.
            for _attempt in 1 2 3 4 5 6 7 8; do
              if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
                break
              fi
              sleep 2
            done
            if [ -z "${ref_json}" ]; then
              echo "::error::Published release ${RELEASE_TAG} did not recreate its Git tag." >&2
              return 1
            fi

            object_sha="$(jq -r '.object.sha // ""' <<<"${ref_json}")"
            object_type="$(jq -r '.object.type // ""' <<<"${ref_json}")"
            for _depth in 1 2 3 4; do
              if [ "${object_type}" = 'commit' ]; then
                printf '%s\n' "${object_sha}"
                return 0
              fi
              if [ "${object_type}" != 'tag' ] || [ -z "${object_sha}" ]; then
                echo "::error::Git tag ${RELEASE_TAG} resolved to unsupported object type ${object_type:-missing}." >&2
                return 1
              fi

              tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_sha="$(jq -r '.object.sha // ""' <<<"${tag_json}")"
              object_type="$(jq -r '.object.type // ""' <<<"${tag_json}")"
            done

            echo "::error::Git tag ${RELEASE_TAG} exceeded the annotated-tag peel limit." >&2
            return 1
          }

          rollback_published_release() {
            # Keep every failed publication repairable: return the release to
            # draft before removing the tag that this publish attempt created.
            gh release edit "${RELEASE_TAG}" --draft
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
            fi
          }

          if ! published_tag_sha="$(resolve_published_tag_sha)"; then
            rollback_published_release
            exit 1
          fi
          if [ "${published_tag_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Published Git tag ${RELEASE_TAG} resolves to ${published_tag_sha}, not ${RELEASE_SHA}."
            rollback_published_release
            exit 1
          fi
          {
            echo "## Release published"
            echo ""
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- SHA: \`${RELEASE_SHA}\`"
            echo "- Community: published and smoke-tested"
            echo "- SaaS: ECS, Vercel frontends, and production smoke completed"
            echo "- npm: enrolled public packages published from this SHA"
          } >>"${GITHUB_STEP_SUMMARY}"
