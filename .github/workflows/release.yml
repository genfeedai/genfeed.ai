name: Release
run-name: Release ${{ inputs.tag }}

# Canonical stable-release entry point. A maintainer chooses the version and
# dispatches this workflow from master. The workflow pins that master SHA,
# verifies it once, publishes community and SaaS from the same commit, and only
# then makes the GitHub release public.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "stable release tag (vX.Y.Z)"
        required: true
        type: string
      saas_lane:
        description: "Where hosted SaaS deploy compute runs. monorepo = public-repo jobs (default). operations = paid private console dispatch."
        required: false
        type: choice
        options:
          - monorepo
          - operations
        default: monorepo

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release and create draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      major_minor_tag: ${{ steps.release.outputs.major_minor_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Validate production ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Stable releases must run from refs/heads/master (got ${GITHUB_REF})"
            exit 1
          fi

      - name: Validate release tag shape
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable release tag must use vX.Y.Z: ${REQUESTED_TAG}"
            exit 1
          fi

      - name: Checkout pinned master SHA
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # One repo version (RELEASING.md → Version contract): the root package.json
      # is bumped in a normal PR and the dispatched tag must name that version.
      - name: Verify root package.json version matches the release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(jq -r '.version' package.json)"
          if [ "v${package_version}" != "${REQUESTED_TAG}" ]; then
            echo "::error::Root package.json is ${package_version} but the release tag is ${REQUESTED_TAG}. Bump the root version in a PR, merge it, then dispatch Release with the matching tag."
            exit 1
          fi

      # Changelog is generated, never hand-edited: the release body is the
      # git-cliff section for this tag, and the full CHANGELOG.md is attached to
      # the release as an asset. cliff.toml owns grouping and PR links.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ inputs.tag }} --strip header
        env:
          OUTPUT: release-notes.md

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ inputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Validate version and create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          release_tag="${REQUESTED_TAG}"
          release_sha="${GITHUB_SHA}"
          if [[ ! "${release_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Stable release tag must use vX.Y.Z: ${release_tag}"
            exit 1
          fi

          image_tag="${release_tag#v}"
          major_minor_tag="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -n "${latest_tag}" ]; then
            highest="$(printf '%s\n%s\n' "${latest_tag#v}" "${image_tag}" | sort -V | tail -n 1)"
            if [ "${highest}" != "${image_tag}" ] || [ "${latest_tag#v}" = "${image_tag}" ]; then
              echo "::error::Release ${release_tag} must be newer than latest published release ${latest_tag}."
              exit 1
            fi
          fi

          release_json="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp |
              jq --arg tag "${release_tag}" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"
          if [ -n "${release_json}" ]; then
            if [ "$(jq -r '.draft' <<<"${release_json}")" != "true" ]; then
              echo "::error::Release ${release_tag} is already published."
              exit 1
            fi

            draft_target="$(jq -r '.target_commitish' <<<"${release_json}")"
            if [ "${draft_target}" != "${release_sha}" ]; then
              echo "::error::Draft ${release_tag} targets ${draft_target}, not pinned master SHA ${release_sha}."
              exit 1
            fi
            gh release edit "${release_tag}" --notes-file release-notes.md
            echo "Reusing draft release ${release_tag} at ${release_sha}; refreshed release notes."
          else
            if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${release_tag} already exists without a reusable draft release."
              exit 1
            fi

            gh release create "${release_tag}" \
              --draft \
              --notes-file release-notes.md \
              --target "${release_sha}" \
              --title "${release_tag}"
            echo "Created draft release ${release_tag} at ${release_sha}."
          fi

          gh release upload "${release_tag}" CHANGELOG.md --clobber

          {
            echo "image_tag=${image_tag}"
            echo "major_minor_tag=${major_minor_tag}"
            echo "release_sha=${release_sha}"
            echo "release_tag=${release_tag}"
          } >>"${GITHUB_OUTPUT}"

  verify-suite:
    name: Full Suite
    needs: validate-release
    permissions:
      actions: write
      contents: read
      issues: write
      packages: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/full-suite.yml
    secrets: inherit

  publish-community:
    name: Publish Community
    needs: [validate-release, verify-suite]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_publish-selfhosted-core.yml
    with:
      advance_latest: false
      attach_assets: true
      checkout_ref: ${{ needs.validate-release.outputs.release_sha }}
      image_tag: ${{ needs.validate-release.outputs.image_tag }}
      major_minor_tag: ""
      release_tag: ${{ needs.validate-release.outputs.release_tag }}
    secrets: inherit

  deploy-saas:
    name: Deploy hosted SaaS
    if: ${{ inputs.saas_lane != 'operations' }}
    needs: [validate-release, verify-suite]
    permissions:
      id-token: write
      contents: read
      packages: read
      issues: write
    uses: ./.github/workflows/deploy-hosted-saas.yml
    with:
      source_sha: ${{ needs.validate-release.outputs.release_sha }}
      correlation_id: release-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.validate-release.outputs.release_sha }}
    secrets: inherit

  deploy-saas-via-operations:
    name: Deploy hosted SaaS through private operations
    if: ${{ inputs.saas_lane == 'operations' }}
    needs: [validate-release, verify-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CONSOLE_REPOSITORY: genfeedai/console.genfeed.ai
      CONSOLE_WORKFLOW: deploy-hosted-saas.yml
      GH_TOKEN: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
    steps:
      - name: Checkout the pinned release SHA
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-release.outputs.release_sha }}

      - name: Preflight capability and dispatch the pinned release
        id: dispatch
        run: node scripts/ci/dispatch-hosted-saas.mjs

      - name: Resolve the exact private deployment run
        id: resolve
        env:
          EXPECTED_TITLE: ${{ steps.dispatch.outputs.expected_title }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 30); do
            runs="$({ gh api \
              --method GET \
              "repos/${CONSOLE_REPOSITORY}/actions/workflows/${CONSOLE_WORKFLOW}/runs" \
              -f event=workflow_dispatch \
              -f branch=master \
              -f per_page=100; } | jq \
                --arg title "${EXPECTED_TITLE}" \
                '[.workflow_runs[] | select(.display_title == $title and .event == "workflow_dispatch" and .head_branch == "master")]')"
            count="$(jq 'length' <<<"${runs}")"

            if [ "${count}" -gt 1 ]; then
              echo "::error::Ambiguous private deploy handoff: ${count} runs match ${EXPECTED_TITLE}."
              exit 1
            fi
            if [ "${count}" -eq 1 ]; then
              run_id="$(jq -r '.[0].id' <<<"${runs}")"
              run_url="$(jq -r '.[0].html_url' <<<"${runs}")"
              if [[ ! "${run_id}" =~ ^[0-9]+$ ]] || [ -z "${run_url}" ] || [ "${run_url}" = "null" ]; then
                echo "::error::Private deploy match returned an invalid run identity."
                exit 1
              fi
              {
                echo "run_id=${run_id}"
                echo "run_url=${run_url}"
              } >>"${GITHUB_OUTPUT}"
              echo "Matched private deployment run ${run_url}."
              exit 0
            fi

            sleep 10
          done

          echo "::error::No private deployment run matched ${EXPECTED_TITLE} within five minutes."
          exit 1

      - name: Wait for the exact private deployment result
        env:
          EXPECTED_TITLE: ${{ steps.dispatch.outputs.expected_title }}
          PRIVATE_RUN_ID: ${{ steps.resolve.outputs.run_id }}
          PRIVATE_RUN_URL: ${{ steps.resolve.outputs.run_url }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 340); do
            run="$(gh api "repos/${CONSOLE_REPOSITORY}/actions/runs/${PRIVATE_RUN_ID}")"
            title="$(jq -r '.display_title' <<<"${run}")"
            event="$(jq -r '.event' <<<"${run}")"
            branch="$(jq -r '.head_branch' <<<"${run}")"
            status="$(jq -r '.status' <<<"${run}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${run}")"

            if [ "${title}" != "${EXPECTED_TITLE}" ] || [ "${event}" != "workflow_dispatch" ] || [ "${branch}" != "master" ]; then
              echo "::error::Private run identity changed or does not represent the requested release SHA."
              exit 1
            fi
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "::error::Private hosted SaaS deployment concluded ${conclusion}: ${PRIVATE_RUN_URL}"
                exit 1
              fi
              {
                echo "## Hosted SaaS deployment"
                echo ""
                echo "Private operations deployed public release SHA \`${RELEASE_SHA}\` successfully."
                echo "Run: ${PRIVATE_RUN_URL}"
              } >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            sleep 30
          done

          echo "::error::Private hosted SaaS deployment timed out after 170 minutes: ${PRIVATE_RUN_URL}"
          exit 1

  promote-community:
    name: Promote Community release channels
    needs:
      - validate-release
      - publish-community
      - deploy-saas
      - deploy-saas-via-operations
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.publish-community.result == 'success' &&
      (needs.deploy-saas.result == 'success' || needs.deploy-saas-via-operations.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ needs.validate-release.outputs.image_tag }}
      MAJOR_MINOR_TAG: ${{ needs.validate-release.outputs.major_minor_tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Advance stable Community channels
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${MAJOR_MINOR_TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${IMAGE_TAG}"

  # npm is the one irreversible lane, so it runs after community and SaaS are
  # green rather than beside them. It publishes every enrolled package whose
  # repo version the registry has not seen, which is what keeps npm from drifting
  # behind master between releases.
  publish-packages:
    name: Publish npm Packages
    needs:
      - validate-release
      - publish-community
      - deploy-saas
      - deploy-saas-via-operations
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.publish-community.result == 'success' &&
      (needs.deploy-saas.result == 'success' || needs.deploy-saas-via-operations.result == 'success')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yml
    with:
      checkout_ref: ${{ needs.validate-release.outputs.release_sha }}
      dry_run: false
      trusted_release_call: true
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs:
      - validate-release
      - publish-community
      - deploy-saas
      - deploy-saas-via-operations
      - promote-community
      - publish-packages
    if: |
      always() &&
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.publish-community.result == 'success' &&
      needs.promote-community.result == 'success' &&
      needs.publish-packages.result == 'success' &&
      (needs.deploy-saas.result == 'success' || needs.deploy-saas-via-operations.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
    steps:
      - name: Publish verified release
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false --latest
          {
            echo "## Release published"
            echo ""
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- SHA: \`${RELEASE_SHA}\`"
            echo "- Community: published and smoke-tested"
            echo "- SaaS: ECS, Vercel frontends, and production smoke completed"
            echo "- npm: enrolled public packages published from this SHA"
          } >>"${GITHUB_STEP_SUMMARY}"
