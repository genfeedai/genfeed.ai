# Nightly Playwright full tier — reporting only.
#
# Discovers every Playwright spec except explicit quarantines
# (scripts/playwright-e2e-tiers.manifest.mjs), shards the run, uploads merged
# reports / traces / screenshots / a discovered-executed-quarantined summary,
# and opens exactly one deduplicated tracking issue when the scheduled run is
# red. Canonical tier names: docs/e2e-tiers.md (`core`, `authed`, `full`).
#
# This workflow is NOT reusable. full-suite.yml and release.yml
# must never uses/needs it. Production uses the required browser/API core gates;
# authenticated E2E stays non-blocking on the release path.

name: Nightly Playwright Full Tier

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *" # 02:47 UTC — after e2e.yml core/authed (02:17), does not change deploy schedule

concurrency:
  group: playwright-full-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  discover:
    name: Discover Playwright full tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Record discovered / quarantined inventory
        run: node scripts/playwright-e2e-tiers.mjs --list

      - name: Upload full-tier discovery summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-full-tier-discovery
          path: playwright/artifacts/report/full-tier-summary.json
          retention-days: 7

  e2e-frontend-full:
    name: Playwright Full (Shard ${{ matrix.shard }}/8)
    needs: [discover]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          cache-playwright: "true"

      - name: Build app
        run: bunx turbo run build --filter=@genfeedai/app
        env:
          NEXT_PUBLIC_PLAYWRIGHT_TEST: "true"
          NEXT_PUBLIC_GENFEED_CLOUD: "false"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}
          NEXT_PUBLIC_API_ENDPOINT: https://api.genfeed.ai/v1
          E2E_COVERAGE: "1"

      - name: Run full E2E shard ${{ matrix.shard }}/8
        # Do not pass `--reporter=blob` here — that CLI flag replaces the
        # config reporters and drops results.json, which made summarize lie
        # with Executed: 0. Blob + JSON both come from playwright.config.ts
        # when E2E_SHARD_INDEX is set.
        run: node scripts/playwright-e2e-tiers.mjs -- --trace retain-on-failure
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_ENDPOINT: https://api.genfeed.ai/v1
          E2E_EXPECT_TIMEOUT_MS: "15000"
          E2E_RETRIES: "0"
          E2E_SHARD_INDEX: ${{ matrix.shard }}
          E2E_TOTAL_SHARDS: "8"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Upload shard JSON inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-full-json-${{ matrix.shard }}
          path: playwright/artifacts/report/results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload blob report (full shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blob-report-full-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload traces and screenshots (full shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-full-results-${{ matrix.shard }}
          path: playwright/artifacts/results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-merge-reports:
    name: Merge Playwright full reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e-frontend-full]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          cache-turbo: "false"

      - name: Download all blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-full-*
          merge-multiple: true
          path: all-blob-reports/

      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter=html,github ./all-blob-reports
        continue-on-error: true

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-full-merged
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Download shard traces and screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: always()
        with:
          pattern: playwright-full-results-*
          merge-multiple: true
          path: all-full-results/

      - name: Upload merged traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-full-traces
          path: all-full-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload merged screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-full-screenshots
          path: all-full-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  summarize:
    name: Write full-tier inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [discover, e2e-frontend-full, e2e-merge-reports]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Download discovery summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: playwright-full-tier-discovery
          path: playwright/artifacts/report/

      - name: Download shard JSON reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          # Every artifact contains results.json; separate directories prevent
          # later shards from overwriting earlier ones before recursive summary.
          pattern: playwright-full-json-*
          path: playwright/artifacts/report/shards/

      - name: Write discovered / executed / quarantined summary
        env:
          FULL_TIER_RESULT: ${{ needs.e2e-frontend-full.result }}
        run: |
          set -euo pipefail
          status="failed"
          if [ "${FULL_TIER_RESULT}" = "success" ]; then
            status="passed"
          fi
          node scripts/playwright-e2e-tiers.mjs --summarize --status="${status}" --playwright-reports-dir=playwright/artifacts/report/shards

      - name: Upload full-tier summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-full-tier-summary
          path: playwright/artifacts/report/full-tier-summary.json
          retention-days: 7

  nightly-failure-report:
    name: Report nightly Playwright full-tier failure
    needs: [e2e-frontend-full, summarize]
    if: >-
      !cancelled()
      && github.event_name == 'schedule'
      && (needs.e2e-frontend-full.result == 'failure'
        || needs.e2e-frontend-full.result == 'cancelled'
        || needs.summarize.result == 'failure'
        || needs.summarize.result == 'cancelled')
    concurrency:
      group: nightly-playwright-full-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download full-tier summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: playwright-full-tier-summary
          path: playwright/artifacts/report/

      - name: Create or update the bounded Playwright full-tier tracker
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FULL_TIER_RESULT: ${{ needs.e2e-frontend-full.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              buildPlaywrightFullExcerpt,
              collectScheduledRunFailures,
              reportNightlyPlaywrightFullFailure,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/nightly-playwright-full-failure-reporter.mjs',
                ),
              ).href,
            );
            let inventory = 'Inventory artifact was not available.';
            const summaryPath = path.join(
              process.env.GITHUB_WORKSPACE,
              'playwright/artifacts/report/full-tier-summary.json',
            );
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              inventory = [
                `- Discovered files: ${summary.discoveredFileCount}`,
                `- Selected files: ${summary.selectedFileCount}`,
                `- Executed files: ${summary.executedFileCount ?? 'n/a'}`,
                `- Executed tests: ${summary.executedTestCount ?? 'n/a'}`,
                `- Quarantined files: ${summary.quarantinedFileCount}`,
                `- Files assigned to other lanes: ${summary.laneExcludedFileCount}`,
                `- Failed tests: ${summary.failedTestCount ?? 'n/a'}`,
                `- Skipped tests: ${summary.skippedTestCount ?? 'n/a'}`,
                `- Flaky tests: ${summary.flakyTestCount ?? 'n/a'}`,
                `- First-attempt failures: ${summary.firstAttemptFailureCount ?? 'n/a'}`,
                `- Report errors: ${summary.reportErrorCount ?? 'n/a'}`,
              ].join('\n');
            }
            const fallbackExcerpt = buildPlaywrightFullExcerpt({
              result: process.env.FULL_TIER_RESULT,
              inventory,
            });
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: Number(process.env.RUN_ID),
                filter: 'latest',
                per_page: 100,
              },
            );
            const failedShards = jobs.filter(
              (job) =>
                /^Playwright Full \(Shard \d+\/8\)$/u.test(job.name) &&
                ['failure', 'cancelled', 'timed_out'].includes(job.conclusion),
            );
            const summaryJobs = jobs.filter(
              (job) =>
                job.name === 'Write full-tier inventory' &&
                ['failure', 'cancelled', 'timed_out'].includes(job.conclusion),
            );
            const jobsForTracking =
              failedShards.length > 0
                ? failedShards.map((job) => ({
                    ...job,
                    trackerJob: 'e2e-frontend-full',
                    fallbackExcerpt,
                  }))
                : summaryJobs.map((job) => ({
                    ...job,
                    trackerJob: 'summarize',
                    fallbackExcerpt:
                      'Missing Playwright full-tier summary report or artifact.',
                  }));
            const failures = await collectScheduledRunFailures({
              github,
              owner,
              repo,
              jobs: jobsForTracking,
              core,
            });
            for (const failure of failures) {
              await reportNightlyPlaywrightFullFailure({
                github,
                owner,
                repo,
                ...failure,
                sha: process.env.SOURCE_SHA,
                runId: Number(process.env.RUN_ID),
                runAttempt: Number(process.env.RUN_ATTEMPT),
                runUrl: process.env.RUN_URL,
                core,
              });
            }

  nightly-recovery-report:
    name: Record nightly Playwright full-tier recovery
    needs: [e2e-frontend-full, summarize]
    if: >-
      !cancelled()
      && github.event_name == 'schedule'
      && needs.e2e-frontend-full.result == 'success'
      && needs.summarize.result == 'success'
    concurrency:
      group: nightly-playwright-full-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record one consecutive scheduled green
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { resolveNightlyPlaywrightFullFailures } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/nightly-playwright-full-failure-reporter.mjs',
                ),
              ).href,
            );
            const { owner, repo } = context.repo;
            await resolveNightlyPlaywrightFullFailures({
              github,
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runUrl: process.env.RUN_URL,
              core,
            });
