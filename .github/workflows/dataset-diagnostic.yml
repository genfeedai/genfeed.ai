name: Dataset Diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run bounded 10k smoke first; profile is the optional 10k/100k diagnostic.'
        type: choice
        default: smoke
        options:
          - smoke
          - profile
      candidate_sha:
        description: 'Exact inspected dataset candidate commit (40 lowercase hexadecimal characters).'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: dataset-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Bounded Dataset Diagnostic
    permissions:
      contents: read
    uses: ./.github/workflows/_dataset-acceptance.yml
    with:
      group: ${{ inputs.mode == 'profile' && 'dataset-diagnostic' || 'dataset-smoke' }}
      candidate_sha: ${{ inputs.candidate_sha }}
