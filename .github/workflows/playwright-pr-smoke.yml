# Playwright PR Smoke
#
# Runs the Playwright `core` tier (mocked app, see docs/e2e-tiers.md) on pull
# requests that change the app or anything it depends on, so a UI change that
# breaks a browser spec is red on the PR instead of on master after the merge.
#
# One runner, no sharding: a PR pays about one test-app shard of runner time,
# not the four shards plus API suites the deploy gate in e2e.yml uses. The
# workspace graph (detect-frontend-scope) selects the app, so docs-only,
# website-only and API-only PRs skip it.
#
# Advisory by design: `continue-on-error` keeps the job off the required
# checks while it earns trust. It never feeds full-suite.yml or release.yml,
# and it does not run the `full` tier (Nightly Playwright Full).

name: Playwright PR Smoke

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TZ: UTC

jobs:
  detect:
    name: Detect App Changes
    # Draft pull requests run nothing; CI runs once the PR is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/detect-frontend-scope

  core-smoke:
    name: Playwright Core Smoke
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.app == 'true'
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app
        with:
          better-auth-secret: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          better-auth-enabled: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Run core tier
        # The sharded runner owns core selection (PLAYWRIGHT_E2E_CORE_PATHS);
        # 1/1 is the whole tier on this runner. Retries stay at the config's
        # CI default so a single timing flake does not paint the PR red.
        run: bun run test:e2e:sharded
        env:
          CI: true
          E2E_SHARD: 1/1
          APP_BASE_URL: http://localhost:3000
          E2E_EXPECT_TIMEOUT_MS: '15000'
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-pr-smoke-report
          path: |
            playwright/artifacts/report/
            playwright/artifacts/results/
          retention-days: 3
          if-no-files-found: ignore
