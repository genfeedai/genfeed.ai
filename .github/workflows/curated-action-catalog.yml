# Reviewer-facing diff report for the curated Agent/MCP action catalog.
#
# packages/actions/src/registry/curated-action-catalog.ts is the single source of
# truth for whether a product action is exposed on the in-app Agent surface, the
# MCP surface, or both (.agents/memory/curated_agent_mcp_actions.md). Additions,
# removals, and surface transitions must be intentional, but a sorted 200-line
# array reviews poorly by eye — a one-word `surfaces` edit buried mid-file looks
# identical to a rename.
#
# packages/actions/scripts/report-curated-action-catalog.ts parses the catalog on
# both sides of the pull request and emits `::warning` annotations (inline, on
# the changed lines) plus a step-summary table. It shipped with unit coverage and
# a `catalog:changes` package script, but nothing ever invoked it, so every
# surface transition landed with no automated report.
#
# The script depends only on node: builtins, so this needs no `bun install` and
# no monorepo build — checkout, extract the base copy, run.
name: Curated action catalog

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - "packages/actions/src/registry/curated-action-catalog.ts"
      - "packages/actions/scripts/report-curated-action-catalog.ts"
      - ".github/workflows/curated-action-catalog.yml"

permissions:
  contents: read

concurrency:
  group: curated-action-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Report catalog changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CATALOG_PATH: packages/actions/src/registry/curated-action-catalog.ts
    steps:
      # Full history: the base commit has to be present locally for `git show`
      # to read the pre-change catalog out of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The reporter diffs two catalog FILES, not two git refs, so the base copy
      # is materialized here. Either side may legitimately be absent — the
      # catalog being added, or deleted — and the parser treats empty input as an
      # empty catalog, which reports every action as added or removed rather than
      # crashing the report.
      - name: Materialize base and head catalogs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:$CATALOG_PATH" > "$RUNNER_TEMP/base-catalog.ts" \
            || : > "$RUNNER_TEMP/base-catalog.ts"
          cp "$CATALOG_PATH" "$RUNNER_TEMP/head-catalog.ts" \
            || : > "$RUNNER_TEMP/head-catalog.ts"

      # `bun run --filter` executes with the package directory as its cwd, so the
      # paths passed here are absolute.
      #
      # This step fails when an entry is not in the canonical single-line form the
      # parser accepts. That is deliberate: the catalog's review value depends on
      # entries staying greppable and diff-legible, and a shape the reporter
      # cannot read is a shape reviewers cannot skim either.
      - name: Report curated action catalog changes
        run: |
          bun run --filter=@genfeedai/actions catalog:changes \
            --before="$RUNNER_TEMP/base-catalog.ts" \
            --after="$RUNNER_TEMP/head-catalog.ts" \
            --summary="$GITHUB_STEP_SUMMARY"
