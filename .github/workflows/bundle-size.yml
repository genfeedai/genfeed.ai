# Master pushes publish the immutable per-app baseline. Actions → Bundle Size
# → Run workflow remains the manual absolute/baseline comparison entrypoint.
# Pull requests invoke the same graph from CI, with no separate PR workflow.
name: Bundle Size

on:
  push:
    branches: [master]
  workflow_dispatch:

# Debounced by concurrency, without cancelling: at most one run is in progress
# and one is pending, and a newer push replaces the pending one before it
# starts. Cancelling a build part way published no baseline for that commit
# and threw away the minutes it had used (95 of 262 master runs in the week of
# 2026-11-10).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle-size:
    # Reusable permission ceiling includes the same-repo PR comment job even
    # though push/manual events skip it. Detection and builds stay read-only.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_bundle-size.yml
    secrets: inherit
