# Master pushes publish the immutable per-app baseline. Actions → Bundle Size
# → Run workflow remains the manual absolute/baseline comparison entrypoint.
# Pull requests invoke the same graph from CI, with no separate PR workflow.
name: Bundle Size

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-size:
    # Reusable permission ceiling includes the same-repo PR comment job even
    # though push/manual events skip it. Detection and builds stay read-only.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_bundle-size.yml
    secrets: inherit
