# PR Title
#
# The repository is squash-only, so the PR title becomes the commit subject on
# master and, through git-cliff (cliff.toml), the changelog line. This check
# enforces the Conventional Commits shape from CONTRIBUTING.md → Pull-request
# contract. It runs on `pull_request_target` so fork PRs get the verdict without
# waiting for the `run-ci` approval; it never checks out or executes PR code.
#
# Add "PR Title" to the required checks in the master ruleset (issue #2999).

name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Conventional Commits title
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md → Pull-request contract and cliff.toml.
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            build
            ci
            perf
          requireScope: false
          # Lowercase imperative summary. `type(scope)!: summary` marks a breaking change
          # and is accepted by the action's default header pattern.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start lowercase and read as an imperative
            (e.g. "feat(studio): add batch generate"). See CONTRIBUTING.md → Pull-request contract.
