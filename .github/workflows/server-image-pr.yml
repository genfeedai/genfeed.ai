name: Server Image PR Guard

# Scoped to the image DEFINITION, not server source. Source changes under
# apps/server/** and packages/** are validated by normal CI (typecheck, tests,
# webpack via build-verify on master push), and build-server-image.yml rebuilds
# the image on every master push — so a source-only PR breaking the Docker
# build surfaces within one merge, while the ~15-30 min docker build stops
# taxing every server-touching PR. Changes to the Dockerfile or bundler config
# still must prove the image builds before merging.
#
# "Build Server Image" is a required status check on master, so the workflow
# runs on every pull request: `detect` decides whether the image definition
# changed, and `build` is skipped (which satisfies the required check) when it
# did not. A path filter on the trigger would leave the check unreported and
# block unrelated pull requests forever (#6189 merged with a red image build
# because the check was not required).
on:
  pull_request:

concurrency:
  group: server-image-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Server Image Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        name: Detect image definition changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Bundler config decides what lands in the server bundles, so a change
          # here must exercise the image build even when no server source changed.
          IMAGE_INPUTS: |
            docker/Dockerfile.server
            .dockerignore
            .bun-version
            configs/*
            patches/*
            webpack.base.config.js
            tsconfig.json
            tsconfig.server.decorators.json
            bun.lock
            package.json
            .github/workflows/server-image-pr.yml
        run: |
          set -euo pipefail
          image=false
          while IFS= read -r changed; do
            [ -n "$changed" ] || continue
            while IFS= read -r pattern; do
              [ -n "$pattern" ] || continue
              # shellcheck disable=SC2053 # pattern is an intentional glob
              if [[ "$changed" == $pattern ]]; then
                image=true
                break 2
              fi
            done <<< "$IMAGE_INPUTS"
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Server image definition changed: $image"

  build:
    name: Build Server Image
    needs: detect
    if: needs.detect.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build unified server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          cache-from: type=gha,scope=server-image-pr
          # PR validation needs a successful image build, not an unbounded
          # export of every intermediate layer. Exact-head baseline runs spent
          # 6-26 minutes exporting the mode=max cache after the build itself
          # had finished. Keep the smaller final-image cache useful for later
          # commits on the same PR, but cap cache-service latency and never
          # convert a successful build into a cache-infrastructure failure.
          cache-to: type=gha,mode=min,scope=server-image-pr,timeout=3m,ignore-error=true
