name: IDE Extension CI

on:
  workflow_dispatch:

concurrency:
  group: ide-extension-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type-check, Test, Build, Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"

      - name: Lint extension
        run: bunx turbo run lint --filter=extension-ide

      - name: Type-check extension
        run: bunx turbo run type-check --filter=extension-ide

      - name: Unit tests
        run: bunx turbo run test --filter=extension-ide

      - name: E2E tests
        run: bun run --cwd apps/extensions/ide/app test:e2e

      - name: Build extension
        run: bunx turbo run build --filter=extension-ide

      - name: Package VSIX
        working-directory: apps/extensions/ide/app
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ide-extension-vsix
          path: apps/extensions/ide/app/*.vsix
          if-no-files-found: error
          retention-days: 14
