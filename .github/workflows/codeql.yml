name: CodeQL Security Analysis

on:
  workflow_dispatch:
  schedule:
    # Weekly Tuesday 05:40 UTC — off-peak, staggered from other weekly jobs
    - cron: '40 5 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          config: |
            paths:
              - apps/server/
              - packages/
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/*.e2e-spec.ts'
              - '**/test/**'
              - '**/tests/**'
              - '**/__tests__/**'
              - '**/mocks/**'
              - '**/fixtures/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
