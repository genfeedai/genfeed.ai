name: Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

env:
  TZ: UTC

jobs:
  # ── Matrix job for standard packages ──
  coverage-packages:
    name: Coverage — ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/agent
          - packages/client
          - packages/config
          - packages/contracts
          - packages/contexts
          - packages/helpers
          - packages/integrations
          - packages/models
          - packages/serializers
          - packages/services
          - packages/ui
          - packages/utils
          - packages/workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"

      - name: Build workspace
        run: bunx turbo run build --filter='./${{ matrix.package }}...'

      - name: Run coverage
        id: coverage
        # Prefer the workspace test script so packages/contracts and friends stay
        # on the same entrypoint as package CI (#1829).
        run: |
          set -euo pipefail
          cd "${{ matrix.package }}"
          # A `test` script that wraps vitest in `sh -c` (packages/ui runs four
          # shards that way) drops the appended --coverage flag, so a package
          # that needs its own coverage entrypoint declares `test:cov`.
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts['test:cov']?0:1)"; then
            bun run test:cov
          elif node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.test?0:1)"; then
            bun run test -- --coverage
          else
            bunx vitest run --coverage
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.package }}/coverage/
          retention-days: 7

      - name: Assert package coverage report exists
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: bash scripts/ci/assert-coverage-report.sh "${{ matrix.package }}/coverage"

  # ── Hooks — needs custom vitest config flag ──
  coverage-hooks:
    name: Coverage — packages/hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"

      - name: Build workspace
        run: bunx turbo run build --filter='./packages/hooks...'

      - name: Run coverage
        id: coverage
        run: cd packages/hooks && bunx vitest run --coverage --config vitest.config.mts

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-hooks
          path: packages/hooks/coverage/
          retention-days: 7

      - name: Assert hooks coverage report exists
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: bash scripts/ci/assert-coverage-report.sh packages/hooks/coverage

  # ── App — sharded 4-way to keep Next/Vitest memory bounded ──
  coverage-app:
    name: Coverage — apps/app (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"

      - name: Build workspace
        run: bunx turbo run build --filter='./apps/app...'

      - name: Run coverage
        id: coverage
        run: cd apps/app && bun run test:cov:shard -- --reporter=blob --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}-4.json --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test

      - name: Assert app blob report exists
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(apps/app/.vitest-reports/blob-*.json)
          if [ "${#reports[@]}" -ne 1 ] || [ ! -s "${reports[0]:-}" ]; then
            echo "::error::apps/app shard ${{ matrix.shard }}/4 tests passed but expected one non-empty Vitest blob report; found ${#reports[@]}"
            exit 1
          fi

      - name: Upload blob report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-app-blob-${{ matrix.shard }}
          path: apps/app/.vitest-reports/
          # .vitest-reports is a dotfolder. upload-artifact excludes hidden
          # files by default, which silently produced empty blob artifacts and
          # starved the merge job (ENOENT on .vitest-reports).
          include-hidden-files: true
          retention-days: 7

  coverage-app-merge:
    name: Coverage — apps/app (merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: coverage-app
    if: ${{ needs.coverage-app.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"

      - name: Download blob report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-app-blob-*
          path: apps/app/.vitest-reports
          merge-multiple: true

      - name: Assert all app blob reports exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(apps/app/.vitest-reports/blob-*.json)
          if [ "${#reports[@]}" -ne 4 ]; then
            echo "::error::Expected four apps/app Vitest blob reports before merge; found ${#reports[@]}"
            exit 1
          fi
          for report in "${reports[@]}"; do
            if [ ! -s "$report" ]; then
              echo "::error::App coverage blob report is empty: $report"
              exit 1
            fi
          done

      - name: Merge coverage reports
        id: merge
        run: cd apps/app && bunx vitest --merge-reports .vitest-reports --coverage --config ./vitest.config.mts
        env:
          NODE_ENV: test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-app
          path: apps/app/coverage/
          retention-days: 7

      - name: Assert app coverage report exists
        if: ${{ always() && steps.merge.outcome == 'success' }}
        run: bash scripts/ci/assert-coverage-report.sh apps/app/coverage

  # ── API — sharded 4-way; needs BETTER_AUTH_SECRET env ──
  coverage-api:
    name: Coverage — apps/server/api (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same backing services as the `Test API` job in ci.yml: the Postgres- and
    # Redis-backed specs fail their suite (they no longer self-skip in CI)
    # when the services or their URLs are missing, which failed every API
    # shard that happened to receive one of those files.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: genfeed_local
          POSTGRES_USER: genfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KNOWLEDGE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      WORKFLOW_BILLING_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      CRUN_TEST_REDIS_URL: redis://localhost:6379
      BILLING_ACCOUNT_SCOPE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/billing_scope_test
      CREDIT_BALANCE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/credit_balance_test
      REDIS_URL: redis://localhost:6379
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"

      # Every shard provisions both databases: `vitest --shard` does not let us
      # know ahead of time which shard receives a *.postgres.spec.ts file.
      - name: Provision billing-account-scope and credit-balance test databases
        env:
          PGPASSWORD: genfeed_local
        run: bash scripts/ci/provision-api-test-databases.sh

      - name: Build workspace
        run: bunx turbo run build --filter=./packages/**

      - name: Run coverage
        id: coverage
        run: cd apps/server/api && bunx vitest run --reporter=blob --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}-4.json --coverage --shard=${{ matrix.shard }}/4
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}

      - name: Assert API blob report exists
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(apps/server/api/.vitest-reports/blob-*.json)
          if [ "${#reports[@]}" -ne 1 ] || [ ! -s "${reports[0]:-}" ]; then
            echo "::error::apps/server/api shard ${{ matrix.shard }}/4 tests passed but expected one non-empty Vitest blob report; found ${#reports[@]}"
            exit 1
          fi

      - name: Upload blob report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-api-blob-${{ matrix.shard }}
          path: apps/server/api/.vitest-reports/
          # .vitest-reports is a dotfolder. upload-artifact excludes hidden
          # files by default, which silently produced empty blob artifacts and
          # starved the merge job (ENOENT on .vitest-reports).
          include-hidden-files: true
          retention-days: 7

  coverage-api-merge:
    name: Coverage — apps/server/api (merge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: coverage-api
    if: ${{ needs.coverage-api.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"

      - name: Download blob report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-api-blob-*
          path: apps/server/api/.vitest-reports
          merge-multiple: true

      - name: Assert all API blob reports exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(apps/server/api/.vitest-reports/blob-*.json)
          if [ "${#reports[@]}" -ne 4 ]; then
            echo "::error::Expected four apps/server/api Vitest blob reports before merge; found ${#reports[@]}"
            exit 1
          fi
          for report in "${reports[@]}"; do
            if [ ! -s "$report" ]; then
              echo "::error::API coverage blob report is empty: $report"
              exit 1
            fi
          done

      - name: Merge coverage reports
        id: merge
        run: cd apps/server/api && bunx vitest --merge-reports .vitest-reports --coverage
        env:
          NODE_ENV: test
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-api
          path: apps/server/api/coverage/
          retention-days: 7

      - name: Assert API coverage report exists
        if: ${{ always() && steps.merge.outcome == 'success' }}
        run: bash scripts/ci/assert-coverage-report.sh apps/server/api/coverage

  # ── Frontend E2E coverage — sharded 4-way (V8 → monocart) ──
  # Lives here, NOT in e2e.yml, so a slow/cancelled coverage run can never turn
  # the E2E gate red. Inherits this workflow's triggers (workflow_dispatch +
  # weekly Mon 6am UTC) and runs the mocked app-core suite only. Each shard is an
  # isolated machine publishing its own lcov artifact (e2e-coverage-shard-N).
  coverage-e2e:
    name: Coverage — apps/app E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app
        with:
          better-auth-secret: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          better-auth-enabled: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Run E2E coverage shard ${{ matrix.shard }}/4
        id: coverage
        # No --reporter override here so the monocart reporter (lcov + v8) from
        # playwright-coverage.config.ts runs in full. --shard splits app-core.
        # Shards collect data; the merged report owns threshold enforcement.
        run: bun run test:e2e:coverage -- --shard=${{ matrix.shard }}/4
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Upload coverage artifact (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-coverage-shard-${{ matrix.shard }}
          path: playwright-report/coverage/
          retention-days: 7

      - name: Assert E2E coverage report exists
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: |
          set -euo pipefail
          report="playwright-report/coverage/lcov.info"
          if [ ! -s "$report" ]; then
            echo "::error::apps/app E2E shard ${{ matrix.shard }}/4 tests passed but no non-empty LCOV report was generated at $report"
            exit 1
          fi

  coverage-e2e-merge:
    name: Coverage — apps/app E2E (merge)
    needs: coverage-e2e
    if: ${{ needs.coverage-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install --frozen-lockfile"
      - name: Download all Playwright shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-coverage-shard-*
          path: .e2e-coverage-shards
      - name: Merge and validate Playwright coverage
        run: node scripts/ci/playwright-coverage.mjs merge .e2e-coverage-shards playwright-report/merged-coverage
      - name: Preserve merged baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage-merged
          path: playwright-report/merged-coverage/
          if-no-files-found: error
          retention-days: 90

  scheduled-failure-report:
    name: Report or recover scheduled coverage failures
    needs:
      - coverage-packages
      - coverage-hooks
      - coverage-app
      - coverage-app-merge
      - coverage-api
      - coverage-api-merge
      - coverage-e2e
      - coverage-e2e-merge
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    concurrency:
      group: scheduled-coverage-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint reporter token (Genfeed bot App)
        id: reporter-token
        uses: ./.github/actions/reporter-token
        with:
          client-id: ${{ secrets.GENFEED_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GENFEED_BOT_PRIVATE_KEY }}

      - name: Create, update, or recover bounded coverage trackers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.reporter-token.outputs.token }}
          script: |
            const repositoryGithub = getOctokit(process.env.REPOSITORY_TOKEN);
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              collectScheduledRunFailures,
              reportCoverageFailures,
              resolveCoverageFailures,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/coverage-failure-reporter.mjs',
                ),
              ).href,
            );
            const { owner, repo } = context.repo;
            const jobs = await repositoryGithub.paginate(
              repositoryGithub.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: Number(process.env.RUN_ID),
                filter: 'latest',
                per_page: 100,
              },
            );
            const failedJobs = jobs.filter((job) =>
              ['failure', 'cancelled', 'timed_out'].includes(job.conclusion),
            );
            if (failedJobs.length === 0) {
              await resolveCoverageFailures({
                github: repositoryGithub,
                owner,
                repo,
                sha: process.env.SOURCE_SHA,
                runId: Number(process.env.RUN_ID),
                runUrl: process.env.RUN_URL,
                core,
              });
              return;
            }
            const jobsForTracking = failedJobs.map((job) => {
              const failedStep = job.steps?.find((step) =>
                ['failure', 'cancelled', 'timed_out'].includes(step.conclusion),
              );
              const stepName = failedStep?.name ?? 'unknown step';
              let excerpt = `Coverage workflow job failed in ${stepName}.`;
              if (/assert.*report|download.*report|merge.*report/i.test(stepName)) {
                excerpt = `Missing coverage report or artifact in step: ${stepName}.`;
              } else if (/coverage/i.test(stepName)) {
                excerpt = `Coverage test or threshold step failed: ${stepName}.`;
              } else if (job.conclusion === 'cancelled' || job.conclusion === 'timed_out') {
                excerpt = `Runner cancellation or timeout in coverage step: ${stepName}.`;
              }
              return {
                ...job,
                trackerJob: job.name.replace(/ \(shard \d+\/4\)$/i, ''),
                fallbackExcerpt: excerpt,
              };
            });
            const failures = await collectScheduledRunFailures({
              github: repositoryGithub,
              owner,
              repo,
              jobs: jobsForTracking,
              core,
            });
            await reportCoverageFailures({
              github: repositoryGithub,
              projectGithub: github,
              owner,
              repo,
              failures,
              sha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runAttempt: Number(process.env.RUN_ATTEMPT),
              runUrl: process.env.RUN_URL,
              core,
            });
