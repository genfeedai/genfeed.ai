name: OpenTofu validation

on:
  pull_request:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/tofu-validate.yml"
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/tofu-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.2"
          tofu_wrapper: false

      - name: Initialize providers without remote state
        working-directory: infra/terraform/genfeed-prod
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        working-directory: infra/terraform/genfeed-prod
        run: tofu validate
