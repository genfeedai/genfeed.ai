# Reusable community/self-hosted release publisher.
#
# Callers own release/version validation and the shared Full Suite gate. This
# workflow owns the self-hosted image boot check, immutable image publication,
# public install-bundle smoke, and release-asset attachment.
name: Publish Self-Hosted core (reusable)

on:
  workflow_call:
    inputs:
      advance_latest:
        required: true
        type: boolean
      attach_assets:
        required: true
        type: boolean
      checkout_ref:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      major_minor_tag:
        required: false
        default: ""
        type: string
      release_tag:
        required: false
        default: ""
        type: string
      reuse_existing_image:
        description: "Reuse and verify the already-published immutable version tag instead of rebuilding it"
        required: false
        default: false
        type: boolean
    outputs:
      archive_asset_digest:
        description: "Verified digest of the immutable self-hosted archive release asset"
        value: ${{ jobs.publish-install-artifact.outputs.archive_asset_digest }}
      archive_asset_id:
        description: "GitHub release asset ID for the immutable self-hosted archive"
        value: ${{ jobs.publish-install-artifact.outputs.archive_asset_id }}
      checksum_asset_digest:
        description: "Verified digest of the immutable self-hosted checksum release asset"
        value: ${{ jobs.publish-install-artifact.outputs.checksum_asset_digest }}
      checksum_asset_id:
        description: "GitHub release asset ID for the immutable self-hosted checksum"
        value: ${{ jobs.publish-install-artifact.outputs.checksum_asset_id }}
      image_digest:
        description: "Verified immutable digest behind the versioned Community image tag"
        value: ${{ jobs.publish-install-artifact.outputs.image_digest }}

# Reusable-workflow GITHUB_TOKEN is the intersection of caller + this
# file. A workflow-level `contents: read` caps every job at read, so
# `softprops/action-gh-release` can GET the draft but cannot PATCH
# assets (Resource not accessible by integration / update-a-release).
permissions:
  contents: write
  packages: write

jobs:
  verify-selfhosted:
    name: Self-Hosted Build Verify
    if: ${{ inputs.reuse_existing_image != true }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-verify-selfhosted.yml

  build-and-push:
    name: Build & Push Self-Hosted Image
    if: ${{ inputs.reuse_existing_image != true }}
    needs: verify-selfhosted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=${{ inputs.major_minor_tag }},enable=${{ inputs.major_minor_tag != '' }}
            type=raw,value=latest,enable=${{ inputs.advance_latest }}
          labels: |
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.revision=${{ inputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.selfhosted
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=selfhosted
          cache-to: type=gha,mode=max,scope=selfhosted

  publish-install-artifact:
    name: Publish & Smoke Public Install Artifact
    if: |
      always() &&
      inputs.attach_assets &&
      (
        (inputs.reuse_existing_image == true &&
          needs.verify-selfhosted.result == 'skipped' &&
          needs.build-and-push.result == 'skipped') ||
        (inputs.reuse_existing_image != true &&
          needs.verify-selfhosted.result == 'success' &&
          needs.build-and-push.result == 'success')
      )
    needs: [verify-selfhosted, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      archive_asset_digest: ${{ steps.verify-assets.outputs.archive_asset_digest }}
      archive_asset_id: ${{ steps.verify-assets.outputs.archive_asset_id }}
      checksum_asset_digest: ${{ steps.verify-assets.outputs.checksum_asset_digest }}
      checksum_asset_id: ${{ steps.verify-assets.outputs.checksum_asset_id }}
      image_digest: ${{ steps.verify-image.outputs.image_digest }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Setup create package
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          cache-turbo: "false"
          install-command: "bun install --filter @genfeedai/create --frozen-lockfile --ignore-scripts"

      - name: Test and build create package
        run: |
          bun run --cwd packages/create test
          bun run --cwd packages/create check
          bun run --cwd packages/create build

      - name: Build version-pinned release bundle
        id: bundle
        run: scripts/sh/create-selfhosted-release-bundle.sh "${RELEASE_TAG}" "release/${RELEASE_TAG}"

      - name: Smoke create against the release bundle
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/create-package" "${RUNNER_TEMP}/create-runner"
          (
            cd packages/create
            bun pm pack --destination "${RUNNER_TEMP}/create-package" --ignore-scripts
          )
          create_archive="$(find "${RUNNER_TEMP}/create-package" -maxdepth 1 -name '*.tgz' -print -quit)"
          (
            cd "${RUNNER_TEMP}/create-runner"
            bun add "${create_archive}" --ignore-scripts
          )
          create_bin="${RUNNER_TEMP}/create-runner/node_modules/.bin/genfeedai"
          test "$("${create_bin}" --version)" = "$(jq -r '.version' packages/create/package.json)"

          python3 -m http.server 8765 --directory release >"${RUNNER_TEMP}/genfeed-release-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT

          GENFEED_RELEASE_DOWNLOAD_BASE_URL=http://127.0.0.1:8765 \
            "${create_bin}" "${RUNNER_TEMP}/genfeed-install" \
              --release "${RELEASE_TAG}" --no-start

          test "$(jq -r '.releaseTag' "${RUNNER_TEMP}/genfeed-install/release.json")" = "${RELEASE_TAG}"
          test "$(jq -r '.image' "${RUNNER_TEMP}/genfeed-install/release.json")" = \
            "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          docker compose \
            --env-file "${RUNNER_TEMP}/genfeed-install/.env" \
            -f "${RUNNER_TEMP}/genfeed-install/compose.yml" \
            config --images | grep -Fx \
              "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"

      - name: Anonymous exact-image pull and metadata check
        id: verify-image
        env:
          EXPECTED_REVISION: ${{ inputs.checkout_ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          docker pull "${image}"

          actual_version="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          actual_revision="$(docker image inspect "${image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          test "${actual_version}" = "${IMAGE_TAG}"
          test "${actual_revision}" = "${EXPECTED_REVISION}"

          canonical_repo="ghcr.io/${GITHUB_REPOSITORY}"
          repo_digest="$(
            docker image inspect "${image}" --format '{{json .RepoDigests}}' |
              jq -r --arg repo "${canonical_repo}" '
                map(select(startswith($repo + "@"))) | first // empty
              '
          )"
          image_digest="${repo_digest##*@}"
          [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Exact Community image ${image} did not resolve to an immutable sha256 digest."
            exit 1
          }
          echo "image_digest=${image_digest}" >>"${GITHUB_OUTPUT}"

      - name: Refuse pre-existing versioned install assets
        if: ${{ inputs.reuse_existing_image == true }}
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.checkout_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_pages="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_matches="$(jq -c --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)]' <<<"${release_pages}")"
          if [ "$(jq 'length' <<<"${release_matches}")" -ne 1 ]; then
            echo "::error::Expected exactly one draft release for ${RELEASE_TAG} before asset attachment."
            exit 1
          fi
          release_json="$(jq -c '.[0]' <<<"${release_matches}")"
          if [ "$(jq -r '.draft' <<<"${release_json}")" != 'true' ] || \
             [ "$(jq -r '.published_at // ""' <<<"${release_json}")" != '' ] || \
             [ "$(jq -r '.target_commitish // ""' <<<"${release_json}")" != "${EXPECTED_RELEASE_SHA}" ]; then
            echo "::error::Release ${RELEASE_TAG} is not the expected unpublished draft at ${EXPECTED_RELEASE_SHA}."
            exit 1
          fi
          install_asset_count="$(jq '[.assets[] | select(
            .name == "genfeed-selfhosted.tar.gz"
            or .name == "genfeed-selfhosted.tar.gz.sha256"
          )] | length' <<<"${release_json}")"
          if [ "${install_asset_count}" -ne 0 ]; then
            echo "::error::Versioned install assets already exist; immutable release assets are never replaced."
            exit 1
          fi

      - name: Attach install bundle to draft GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ inputs.checkout_ref }}
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: ${{ inputs.reuse_existing_image != true }}
          files: |
            ${{ steps.bundle.outputs.archive }}
            ${{ steps.bundle.outputs.checksum }}

      - name: Verify immutable install asset identities
        id: verify-assets
        env:
          ARCHIVE_PATH: ${{ steps.bundle.outputs.archive }}
          CHECKSUM_PATH: ${{ steps.bundle.outputs.checksum }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_pages="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_matches="$(jq -c --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)]' <<<"${release_pages}")"
          if [ "$(jq 'length' <<<"${release_matches}")" -ne 1 ]; then
            echo "::error::Expected exactly one draft release for ${RELEASE_TAG} after asset attachment."
            exit 1
          fi
          release_json="$(jq -c '.[0]' <<<"${release_matches}")"

          verify_asset() {
            local asset_name="$1"
            local local_path="$2"
            local output_prefix="$3"
            local matches asset_json asset_id asset_digest asset_size local_digest local_size

            matches="$(jq -c --arg name "${asset_name}" \
              '[.assets[] | select(.name == $name)]' <<<"${release_json}")"
            if [ "$(jq 'length' <<<"${matches}")" -ne 1 ]; then
              echo "::error::Draft ${RELEASE_TAG} must contain exactly one ${asset_name} asset."
              exit 1
            fi
            asset_json="$(jq -c '.[0]' <<<"${matches}")"
            asset_id="$(jq -r '.id | tostring' <<<"${asset_json}")"
            asset_digest="$(jq -r '.digest // ""' <<<"${asset_json}")"
            asset_size="$(jq -r '.size | tostring' <<<"${asset_json}")"
            local_digest="sha256:$(sha256sum "${local_path}" | awk '{print $1}')"
            local_size="$(stat -c '%s' "${local_path}")"

            [[ "${asset_id}" =~ ^[1-9][0-9]*$ ]] && \
              [[ "${asset_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && \
              [ "${asset_digest}" = "${local_digest}" ] && \
              [ "${asset_size}" = "${local_size}" ] && \
              [ "$(jq -r '.state // ""' <<<"${asset_json}")" = 'uploaded' ] || {
                echo "::error::Uploaded ${asset_name} identity does not match the locally verified artifact."
                exit 1
              }

            {
              echo "${output_prefix}_asset_digest=${asset_digest}"
              echo "${output_prefix}_asset_id=${asset_id}"
            } >>"${GITHUB_OUTPUT}"
          }

          verify_asset 'genfeed-selfhosted.tar.gz' "${ARCHIVE_PATH}" archive
          verify_asset 'genfeed-selfhosted.tar.gz.sha256' "${CHECKSUM_PATH}" checksum
