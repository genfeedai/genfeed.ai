name: Desktop QA

on:
  # The desktop shell boots the canonical `apps/app` bundle (#2371), so the
  # honest blast radius of a desktop regression is nearly every frontend
  # change — the old pull_request path filter matched apps/app/** plus 13
  # bundled packages, i.e. effectively every PR, each paying a ~30 min
  # macos-latest (10× Linux billing) run while the desktop surface is dormant
  # (its heavy CI lanes are already disabled behind ENABLE_DESKTOP_CI). A
  # nightly run keeps the binary honest with at most one day of drift; the
  # desktop release path still runs this via workflow_call, and any PR that
  # needs the signal can dispatch it manually.
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC — off the top-of-hour rush
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Nightly/dispatch/call runs key on the complete ref so distinct tags and
  # branches cannot cancel each other; a fresh nightly supersedes a stale one.
  group: desktop-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GENFEED_DESKTOP_RELEASE: ${{ github.sha }}
  TZ: UTC

jobs:
  desktop-release-qa:
    name: Desktop Release QA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: '24.x'
          install-command: 'bun install --frozen-lockfile'

      - name: Run desktop release QA
        # Must go through turbo, not `bun run --filter`: the latter runs the
        # script directly and skips the `^build` dependency, leaving the
        # workspace packages unbuilt for the type-check step.
        run: bunx turbo run qa:release --filter=@genfeedai/desktop

      - name: QA summary
        if: always()
        run: |
          {
            echo "## Desktop QA"
            echo ""
            echo "- Checklist: apps/desktop/RELEASE_QA.md"
            echo "- Command: \`bunx turbo run qa:release --filter=@genfeedai/desktop\`"
            echo "- Release SHA: \`${GENFEED_DESKTOP_RELEASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
