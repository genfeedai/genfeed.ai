name: Desktop QA

on:
  # Keep the dormant desktop build checked weekly; releases always call QA.
  schedule:
    - cron: '17 3 * * 1' # Monday, 03:17 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Callers and triggers remain isolated: weekly QA cannot cancel release QA.
  # A fresh run replaces only an older run from the same lane and complete ref.
  group: desktop-qa-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GENFEED_DESKTOP_RELEASE: ${{ github.sha }}
  TZ: UTC

jobs:
  desktop-release-qa:
    name: Desktop Release QA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: '24.x'
          install-command: 'bun install --frozen-lockfile'

      - name: Run desktop release QA
        # Must go through turbo, not `bun run --filter`: the latter runs the
        # script directly and skips the `^build` dependency, leaving the
        # workspace packages unbuilt for the type-check step.
        run: bunx turbo run qa:release --filter=@genfeedai/desktop

      - name: Build app for Electron runtime acceptance
        uses: ./.github/actions/setup-playwright-app

      - name: Verify Electron runtime transitions
        run: bunx playwright test --config playwright/configs/playwright-desktop-runtime-electron.config.ts

      - name: Upload Electron runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-electron-runtime
          path: playwright/artifacts/electron-runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: QA summary
        if: always()
        run: |
          {
            echo "## Desktop QA"
            echo ""
            echo "- Checklist: apps/desktop/RELEASE_QA.md"
            echo "- Command: \`bunx turbo run qa:release --filter=@genfeedai/desktop\`"
            echo "- Release SHA: \`${GENFEED_DESKTOP_RELEASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
