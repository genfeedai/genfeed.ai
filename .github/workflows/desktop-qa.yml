name: Desktop QA

on:
  # The desktop shell now boots the canonical `apps/app` bundle (#2371), so the
  # blast radius of a desktop regression is everything that build inlines — not
  # just `apps/desktop/**`. A path filter narrower than the bundle would let a
  # change to the app, its auth client, or its deployment config ship a broken
  # desktop binary with a green PR.
  pull_request:
    paths:
      - "apps/app/**"
      - "apps/desktop/**"
      - "packages/desktop-contracts/**"
      - "packages/desktop-core/**"
      - "packages/desktop-prisma/**"
      # Every workspace package `apps/app` bundles: a change to any of them
      # lands inside the standalone build the shell serves.
      - "packages/agent/**"
      - "packages/auth-client/**"
      - "packages/client/**"
      - "packages/config/**"
      - "packages/constants/**"
      - "packages/enums/**"
      - "packages/helpers/**"
      - "packages/interfaces/**"
      - "packages/next-config/**"
      - "packages/props/**"
      - "packages/types/**"
      - "packages/ui/**"
      - "packages/workflows/**"
      - ".github/workflows/desktop-qa.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR numbers are repository-unique; head branch names are not (two forks can
  # both open `fix/desktop`). Non-PR callers fall back to the complete ref so
  # distinct tags and branches cannot cancel each other.
  group: desktop-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GENFEED_DESKTOP_RELEASE: ${{ github.sha }}
  TZ: UTC

jobs:
  desktop-release-qa:
    name: Desktop Release QA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: '24.x'
          bun-version: '1.3.14'
          install-command: 'bun install --frozen-lockfile'

      - name: Run desktop release QA
        # Must go through turbo, not `bun run --filter`: the latter runs the
        # script directly and skips the `^build` dependency, leaving the
        # workspace packages unbuilt for the type-check step.
        run: bunx turbo run qa:release --filter=@genfeedai/desktop

      - name: QA summary
        if: always()
        run: |
          {
            echo "## Desktop QA"
            echo ""
            echo "- Checklist: apps/desktop/RELEASE_QA.md"
            echo "- Command: \`bunx turbo run qa:release --filter=@genfeedai/desktop\`"
            echo "- Release SHA: \`${GENFEED_DESKTOP_RELEASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
