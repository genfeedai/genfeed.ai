name: PR Full Suite

on:
  pull_request:
    branches: [master]
    types: [labeled]

concurrency:
  group: pr-full-suite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  full-suite:
    name: Dispatch Full Suite
    if: github.event.label.name == 'full-suite' || github.event.label.name == 'run-ci'
    # GitHub validates nested permissions before evaluating job conditions.
    # Match the failure tracker's ceiling even though PRs skip that job.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    with:
      run_heavy_tests: true
    secrets: inherit
