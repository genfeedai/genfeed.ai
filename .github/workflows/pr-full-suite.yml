name: PR Full Suite

on:
  pull_request:
    branches: [master]
    types: [labeled]

concurrency:
  group: pr-full-suite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  full-suite:
    name: Dispatch Full Suite
    if: github.event.label.name == 'full-suite'
    uses: ./.github/workflows/ci.yml
    with:
      run_heavy_tests: true
    secrets: inherit
