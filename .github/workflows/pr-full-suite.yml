name: PR Full Suite

on:
  pull_request:
    branches: [master]
    types: [labeled]

concurrency:
  group: pr-full-suite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  full-suite:
    name: Dispatch Full Suite
    if: github.event.label.name == 'full-suite' || github.event.label.name == 'run-ci'
    # Reusable ci.yml includes a push-only merge-queue janitor. GitHub validates
    # its actions:write grant before evaluating that event gate, so the caller
    # must provide the ceiling even though PR runs skip the janitor itself.
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    with:
      run_heavy_tests: true
    secrets: inherit
