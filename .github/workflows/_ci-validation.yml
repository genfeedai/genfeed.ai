name: Core Validation

on:
  workflow_call:
    inputs:
      run_heavy_tests:
        type: boolean
        required: false
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      GITLEAKS_LICENSE:
        required: false
      BETTER_AUTH_SECRET:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  # The diff base for every "changed since base" step (turbo `--affected`,
  # vitest `--changed`, the PR test plan) is CI_BASE_SHA, resolved once by the
  # Plan job and passed to each job through `needs.plan.outputs.base`. Only
  # PRs and merge groups have one; other events run the full paths.
  CI_IS_CHANGE_RUN: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TZ: UTC

jobs:
  # Trust, heavy tier, test plan, and spec-typecheck scope in one runner slot.
  # Every test job below needs this one, so an untrusted fork PR (the trust step
  # fails the job) skips the whole graph and the Tests Gate fails closed.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      base: ${{ steps.base.outputs.sha }}
      setup_benchmark: ${{ steps.plan.outputs.setup_benchmark }}
      heavy-tier: ${{ steps.tier.outputs.heavy }}
      app: ${{ steps.plan.outputs.app }}
      api: ${{ steps.plan.outputs.api }}
      app_tests: ${{ steps.plan.outputs.app_tests }}
      api_tests: ${{ steps.plan.outputs.api_tests }}
      mcp_auth_runtime: ${{ steps.plan.outputs.mcp_auth_runtime }}
      app_matrix: ${{ steps.plan.outputs.app_matrix }}
      api_matrix: ${{ steps.plan.outputs.api_matrix }}
      force_full: ${{ steps.plan.outputs.force_full }}
      workspace_tests: ${{ steps.plan.outputs.workspace_tests }}
      workspace_matrix: ${{ steps.plan.outputs.workspace_matrix }}
      spec_run: ${{ steps.spec-selection.outputs.run }}
      spec_workspaces: ${{ steps.spec-selection.outputs.workspaces }}
      spec_build_filters: ${{ steps.turbo-scope.outputs.build_filters }}
    steps:
      - name: Check contributor trust
        id: check
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const association = pr.author_association;
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isSameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isTrusted = isSameRepository || trustedRoles.includes(association);
            const hasLabel = pr.labels.some(l => l.name === 'run-ci');

            // Trust decides *whether* CI runs; this decides *how much* of it.
            // An external contributor stays external even once a maintainer
            // adds `run-ci`: the label buys them a run, not the light tier.
            core.setOutput('external', isTrusted ? 'false' : 'true');

            if (isTrusted) {
              const trustReason = isSameRepository
                ? 'same-repo PR'
                : `trusted contributor (${association})`;
              core.info(`${trustReason} - CI allowed`);
            } else if (hasLabel) {
              core.info('External contributor with run-ci label - CI allowed');
            } else {
              core.setFailed(
                `External contributor (${association}) - add the \`run-ci\` label to allow CI. ` +
                'A maintainer must review the code and add the label.'
              );
            }

      # Trust-tiered heavy matrix (open-source PR policy). Maintainer and
      # same-repo PRs run the affected tier; the on-demand Full Suite runs the
      # complete matrix. A fork PR from an external contributor gets
      # the full heavy matrix on the PR itself. `run_heavy_tests` (full-suite /
      # release path) and the `full-suite` label escalate for anyone.
      - name: Resolve heavy test tier
        id: tier
        env:
          EXTERNAL_CONTRIBUTOR: ${{ steps.check.outputs.external }}
          FULL_SUITE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
          RUN_HEAVY_INPUT: ${{ inputs.run_heavy_tests }}
        run: |
          set -euo pipefail
          heavy=false
          reason='affected tier'
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            heavy=true
            reason='merge group (preserve all member escalations)'
          elif [ "${RUN_HEAVY_INPUT}" = "true" ]; then
            heavy=true
            reason='run_heavy_tests input'
          elif [ "${FULL_SUITE_LABEL}" = "true" ]; then
            heavy=true
            reason='full-suite label'
          elif [ "${EXTERNAL_CONTRIBUTOR}" = "true" ]; then
            heavy=true
            reason='external contributor PR'
          fi
          echo "heavy=${heavy}" >>"${GITHUB_OUTPUT}"
          echo "Heavy test tier: ${heavy} (${reason})"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Blobless clone: full history (merge-base, --changed, --affected) without
          # downloading every historical file blob. Not a shallow clone, so git
          # history readers keep working. Static Checks stays full: gitleaks reads blobs.
          filter: blob:none
          persist-credentials: false
      # A pull request checks out GitHub's merge commit, whose first parent is
      # the base it was actually built on. The event payload's
      # `pull_request.base.sha` can be far older: diffing against it drags every
      # commit merged since into the "changed" set and escalated ordinary PRs
      # to the full tier (e.g. a `.claude/launch.json` change on master forced
      # a full spec typecheck on an unrelated website PR, 2026-09-27).
      - name: Resolve diff base
        id: base
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base=''
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
          elif [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            base="${MERGE_GROUP_BASE_SHA}"
            if ! [[ "${base}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid merge group base SHA"
              exit 1
            fi
            if ! git merge-base --is-ancestor "${base}" HEAD; then
              echo "::error::Merge group base is not an ancestor of HEAD"
              exit 1
            fi
          fi
          echo "sha=${base}" >>"${GITHUB_OUTPUT}"
          echo "CI_BASE_SHA=${base}" >>"${GITHUB_ENV}"
          echo "Diff base: ${base:-<none, full paths>}"
      - name: Setup Bun environment
        if: steps.tier.outputs.heavy != 'true'
        uses: ./.github/actions/setup-bun-env
        with:
          cache-prisma-client: 'true'
      # Recorded seconds per test file, saved by the nightly Full Suite on
      # master (record-test-timings below). The planner fills the shards with
      # them; a miss only costs an even split.
      - name: Restore recorded test timings
        if: steps.tier.outputs.heavy != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-timings
          key: test-timings-v1-unused
          restore-keys: test-timings-v1-
      # Vitest supplies the exact affected app/API files; Turbo supplies the
      # affected workspace tasks. Lockfile, turbo, vitest config, bun-setup, and
      # the planner itself escalate to the full sharded path.
      - name: Compute affected test plan
        id: plan
        run: node scripts/ci/pr-test-plan.mjs --event "${{ github.event_name }}" --base "$CI_BASE_SHA" --run-heavy "${{ steps.tier.outputs.heavy }}"
      - name: Upload pull-request test plan
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-test-plan-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.plan.outputs.manifest }}
          retention-days: 7

      # Spec files are invisible to the Typecheck step inside Static Checks:
      # every workspace tsconfig excludes them. The spec typecheck
      # checks them per workspace (tsconfig.typecheck.specs.json). On change
      # runs this narrows the check to the workspaces the diff can affect; a
      # `packages/**` change resolves through turbo's dependency graph below.
      # Anything genuinely global (root configs, scripts, the lockfile, this
      # workflow, shared apps/server files) escalates to every workspace, as do
      # heavy runs and runs without a diff base.
      - name: Determine spec typecheck scope
        id: scope
        env:
          RUN_HEAVY: ${{ steps.tier.outputs.heavy == 'true' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          all_workspaces=()
          for config in apps/server/*/tsconfig.typecheck.specs.json \
            apps/*/tsconfig.typecheck.specs.json \
            packages/*/tsconfig.typecheck.specs.json; do
            workspace="${config%/tsconfig.typecheck.specs.json}"
            all_workspaces+=("${workspace##*/}")
          done
          shopt -u nullglob

          emit() {
            echo "workspaces=$1" >>"${GITHUB_OUTPUT}"
            echo "needs_turbo=false" >>"${GITHUB_OUTPUT}"
            echo "Spec typecheck scope: ${1:-<none>} ($2)"
          }

          if [ "${RUN_HEAVY}" = "true" ] || [ "${CI_IS_CHANGE_RUN}" != "true" ] || [ -z "${CI_BASE_SHA}" ]; then
            emit "${all_workspaces[*]}" "full: heavy tier or no diff base"
            exit 0
          fi

          if ! changed="$(git diff --name-only "${CI_BASE_SHA}...HEAD")"; then
            emit "${all_workspaces[*]}" "full: diff base unresolvable"
            exit 0
          fi

          declare -A affected=()
          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            case "${file}" in
              apps/server/*/*)
                workspace="${file#apps/server/}"
                workspace="${workspace%%/*}"
                # A changed workspace without its own spec config feeds
                # every program.
                if [ -f "apps/server/${workspace}/tsconfig.typecheck.specs.json" ]; then
                  affected["${workspace}"]=1
                else
                  emit "${all_workspaces[*]}" "full: shared server surface ${file}"
                  exit 0
                fi
                ;;
              apps/server/*)
                # Shallow files under apps/server are the shared configs every
                # program extends. `case` globs span `/`, so these fall through
                # apps/server/*/* and would otherwise be swallowed by apps/*.
                emit "${all_workspaces[*]}" "full: shared server config ${file}"
                exit 0
                ;;
              apps/*/*)
                # Not every app is enrolled in the spec typecheck, so a missing config
                # means "not part of this guard" rather than "escalate".
                workspace="${file#apps/}"
                workspace="${workspace%%/*}"
                if [ -f "apps/${workspace}/tsconfig.typecheck.specs.json" ]; then
                  affected["${workspace}"]=1
                fi
                ;;
              docs/*|.agents/*|*.md)
                ;;
              apps/*)
                ;;
              packages/*/*)
                # Which package(s) and their dependents is turbo's job below.
                packages_touched=1
                ;;
              *)
                # Root tsconfigs, scripts, the lockfile, this workflow: no
                # dependency graph to consult, so escalate.
                emit "${all_workspaces[*]}" "full: shared surface ${file}"
                exit 0
                ;;
            esac
          done <<<"${changed}"

          scoped=()
          for workspace in "${all_workspaces[@]}"; do
            if [ -n "${affected[${workspace}]:-}" ]; then
              scoped+=("${workspace}")
            fi
          done

          if [ "${packages_touched:-0}" = "1" ]; then
            echo "needs_turbo=true" >>"${GITHUB_OUTPUT}"
            echo "apps_affected=${scoped[*]-}" >>"${GITHUB_OUTPUT}"
            echo "Spec typecheck scope: apps=${scoped[*]:-<none>}, packages touched — resolving affected packages via turbo"
          else
            emit "${scoped[*]-}" "affected only"
          fi
      # turbo's own dependency graph (package.json dependencies) is the
      # "cheaply derivable" affected-set turbo already computes for every
      # other --affected call in this workflow (lint, type-check, test
      # sharding above). `--affected` returns each changed package under
      # packages/** plus every workspace — app or package — that
      # (transitively) depends on it, so a leaf utility change stays small
      # while a widely-imported package (e.g. contracts) still fans out to
      # most of the monorepo — correctly, since that IS what could break.
      # The merge logic (which workspaces end up in scope, and whether the
      # "Build packages" step below can narrow itself to just the affected
      # packages) lives in scripts/ci/spec-typecheck-scope.ts, unit-tested
      # directly in scripts/ci/spec-typecheck-scope.test.ts (#5315) instead
      # of only through assertions on this workflow's own YAML.
      - name: Resolve turbo-affected packages
        id: turbo-scope
        if: steps.scope.outputs.needs_turbo == 'true'
        env:
          APPS_AFFECTED: ${{ steps.scope.outputs.apps_affected }}
        run: bun run scripts/ci/spec-typecheck-scope.ts
      # One job checks the whole scope. `bun check` covers all 33 spec configs
      # in under a minute, so the three pools this step used to build spent 219
      # of their 304 runner-seconds on three installs (median of 49 runs,
      # 2026-11-16, #10276).
      - name: Select spec typecheck workspaces
        id: spec-selection
        env:
          SCOPED_WORKSPACES: ${{ steps.turbo-scope.outputs.workspaces || steps.scope.outputs.workspaces }}
        run: node scripts/ci/spec-typecheck-selection.mjs
      # The jobs below start with the run instead of behind this one (#10272).
      # They repeat the trust gate, install while this job plans, and read the
      # plan from this artifact: its outputs when the job succeeds, a failure
      # marker when it does not, so a failed Plan fails them at once.
      - name: Write the plan for the jobs that start beside this job
        if: ${{ success() }}
        env:
          PLAN_MANIFEST: ${{ steps.plan.outputs.manifest }}
          PLAN_BASE: ${{ steps.base.outputs.sha }}
          PLAN_HEAVY: ${{ steps.tier.outputs.heavy }}
          PLAN_SPEC_RUN: ${{ steps.spec-selection.outputs.run }}
          PLAN_SPEC_WORKSPACES: ${{ steps.spec-selection.outputs.workspaces }}
          PLAN_SPEC_BUILD_FILTERS: ${{ steps.turbo-scope.outputs.build_filters }}
          PLAN_OUTPUTS_FILE: ${{ runner.temp }}/test-plan-outputs/plan.json
        run: node scripts/ci/test-plan-handoff.mjs publish
      - name: Write the plan failure marker
        if: ${{ failure() }}
        run: |
          mkdir -p "${RUNNER_TEMP}/test-plan-outputs"
          echo '{"ok":false}' > "${RUNNER_TEMP}/test-plan-outputs/plan.json"
      - name: Publish the plan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-plan-outputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-plan-outputs/plan.json
          retention-days: 7
          if-no-files-found: error

  # Measurements only when the shared action changes. Two isolated Linux
  # runners compare complete frozen installs; no node_modules reuse or skipped
  # lifecycle hooks. Results do not alter the validation topology automatically.
  setup-benchmark:
    name: Setup Benchmark (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.setup_benchmark == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mode: warm
            cache: 'true'
          - mode: cold
            cache: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start setup clock
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Measure shared setup
        id: setup
        uses: ./.github/actions/setup-bun-env
        with:
          cache-dependencies: ${{ matrix.cache }}
      - name: Record setup measurement
        env:
          SETUP_MODE: ${{ matrix.mode }}
          SETUP_BUN_VERSION: ${{ steps.setup.outputs.resolved-bun-version }}
          SETUP_CACHE_HIT: ${{ steps.setup.outputs.dependency-cache-hit }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const result = {
            sourceSha: process.env.GITHUB_SHA,
            mode: process.env.SETUP_MODE,
            seconds: Math.round(Date.now() / 1000 - Number(process.env.SETUP_STARTED)),
            bunVersion: process.env.SETUP_BUN_VERSION,
            nodeVersion: process.version,
            exactCacheHit: process.env.SETUP_CACHE_HIT === 'true',
          };
          writeFileSync('setup-measurement.json', JSON.stringify(result, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Setup ${result.mode}: **${result.seconds}s**, Bun ${result.bunVersion}, exact cache hit ${result.exactCacheHit}.\n`);
          NODE
      - name: Upload setup measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-measurement-${{ matrix.mode }}
          path: setup-measurement.json
          retention-days: 7

  # Gitleaks, format, secretlint, lint, typecheck, and the executable contracts
  # share one runner slot (#1969), with bounded independent work overlapping.
  # Each separate job paid its own
  # checkout + Bun setup and held a queue slot while the runner pool was
  # saturated. The Tests Gate holds their failure semantics.
  # Starts with the Plan job instead of behind it. Nothing here reads a Plan
  # output: the diff base and the contributor trust gate are repeated below
  # (scripts/ci/pr-validation-workflows.test.mjs keeps them identical to the
  # Plan copies), which takes the Plan job's runner start, checkout and install
  # off the critical path. A draft or untrusted pull request still skips or
  # fails here exactly as it does in Plan, and the verdict reads this job.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Check contributor trust
        id: check
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const association = pr.author_association;
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isSameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isTrusted = isSameRepository || trustedRoles.includes(association);
            const hasLabel = pr.labels.some(l => l.name === 'run-ci');

            // Trust decides *whether* CI runs; this decides *how much* of it.
            // An external contributor stays external even once a maintainer
            // adds `run-ci`: the label buys them a run, not the light tier.
            core.setOutput('external', isTrusted ? 'false' : 'true');

            if (isTrusted) {
              const trustReason = isSameRepository
                ? 'same-repo PR'
                : `trusted contributor (${association})`;
              core.info(`${trustReason} - CI allowed`);
            } else if (hasLabel) {
              core.info('External contributor with run-ci label - CI allowed');
            } else {
              core.setFailed(
                `External contributor (${association}) - add the \`run-ci\` label to allow CI. ` +
                'A maintainer must review the code and add the label.'
              );
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request checks out GitHub's merge commit, whose first parent is
      # the base it was actually built on. The event payload's
      # `pull_request.base.sha` can be far older: diffing against it drags every
      # commit merged since into the "changed" set and escalated ordinary PRs
      # to the full tier (e.g. a `.claude/launch.json` change on master forced
      # a full spec typecheck on an unrelated website PR, 2026-09-27).
      - name: Resolve diff base
        id: base
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base=''
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
          elif [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            base="${MERGE_GROUP_BASE_SHA}"
            if ! [[ "${base}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid merge group base SHA"
              exit 1
            fi
            if ! git merge-base --is-ancestor "${base}" HEAD; then
              echo "::error::Merge group base is not an ancestor of HEAD"
              exit 1
            fi
          fi
          echo "sha=${base}" >>"${GITHUB_OUTPUT}"
          echo "CI_BASE_SHA=${base}" >>"${GITHUB_ENV}"
          echo "Diff base: ${base:-<none, full paths>}"
      # Pull requests scan their own commits; the release path scans history.
      # The Full Suite skips it: every master commit arrived through a
      # scanned pull request. Dependabot runs read the Dependabot secret store,
      # where GITLEAKS_LICENSE is empty and the action hard-fails; their
      # manifest/lockfile diffs still pass through secretlint below. Fork pull
      # requests get no repository secrets either, so they run the open-source
      # CLI below instead of the licensed action (#8333).
      - name: Scan for secrets with gitleaks
        if: github.event_name != 'push' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Scan fork pull request for secrets with gitleaks CLI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_LINUX_X64_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          if [ -z "${CI_BASE_SHA:-}" ]; then
            echo "::error::The Plan job did not resolve a base SHA for this pull request."
            exit 1
          fi
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="${CI_BASE_SHA}..HEAD" \
            --redact --verbose --no-banner --exit-code 1
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          cache-prisma-client: 'true'
      - name: Guard destructive migration release compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test --test-concurrency=1 scripts/ci/migration-safety.test.mjs scripts/deploy/hosted-saas/verify-serving-schema.test.mjs
          node scripts/ci/migration-safety.mjs --base "${CI_BASE_SHA:-HEAD^1}"
      # A PR cannot go green by appending its own violation to a ratchet
      # baseline (#7137). Shrinking and relocating entries stay green.
      - name: Check ratchet baselines did not grow
        run: bun run check:ratchet-growth --base "${CI_BASE_SHA:-HEAD^1}"
      # Same-PR rule: a change that removes or rewrites copy, preset ids or
      # fixture values must update the Playwright specs that assert them in the
      # same PR. Reads the diff and spec sources only; no browser, no extra job.
      # Opt out with an `E2E-Spec-Impact: none - <reason>` commit trailer.
      - name: Check e2e specs follow UI changes
        if: github.event_name == 'pull_request'
        run: node scripts/ci/e2e-spec-impact.mjs --base "${CI_BASE_SHA}"
      - name: Check pinned product skill catalog
        run: bun run check:skills-catalog
      - name: Check pinned presets catalog
        run: bun run check:presets-pin
      - name: Check skill trusted-builtin allowlist
        run: bun run check:skill-trusted-builtin-allowlist
      - name: Check env files and .env.example drift
        run: bun run env:check
      # Formatting reads files only and can overlap secretlint/lint. Explicit
      # wait propagates its failure before memory-intensive typechecking.
      - name: Check formatting
        id: formatting
        background: true
        run: bun run format:check
      - name: Get changed files for secretlint
        id: changed
        run: |
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "$CI_BASE_SHA" HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|toml|sh|env.*)$' || true)
          else
            FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|yml|yaml|toml|sh|env.*)$' || true)
          fi
          if [ -z "$FILES" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No scannable files changed"
          else
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Scanning $(echo "$FILES" | wc -l | xargs) files"
          fi
      - name: Run secretlint on changed files
        if: steps.changed.outputs.files != ''
        # PR-controlled filenames reach the shell only as data, never as
        # interpolated script text; one file per line, whitespace-safe.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: printf '%s\n' "$CHANGED_FILES" | xargs -d '\n' bunx secretlint
        timeout-minutes: 5
      - name: Run lint
        run: |
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            TURBO_SCM_BASE="$CI_BASE_SHA" bunx turbo run lint --affected --concurrency=1
          else
            bun run lint
          fi
      - name: Wait for formatting
        wait: formatting
      # `--affected` follows package.json dependencies only. The scope adds
      # workspaces whose type-check hashes a changed sibling source through a
      # tsconfig-alias input (scripts/ci/typecheck-affected-scope.ts).
      - name: Run typecheck
        run: |
          set -o pipefail
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            filters="$(bun run scripts/ci/typecheck-affected-scope.ts)"
            if [ -n "${filters}" ]; then
              # shellcheck disable=SC2086 # intentional word-splitting of --filter args
              bunx turbo run type-check ${filters} --concurrency=1 \
                2>&1 | tee "${RUNNER_TEMP}/turbo-type-check.log"
            else
              # Selects nothing, but turbo still logs its remote cache status.
              TURBO_SCM_BASE="$CI_BASE_SHA" bunx turbo run type-check --affected --concurrency=1 \
                2>&1 | tee "${RUNNER_TEMP}/turbo-type-check.log"
            fi
          else
            bunx turbo run type-check --concurrency=1 \
              2>&1 | tee "${RUNNER_TEMP}/turbo-type-check.log"
          fi
      # Annotation only, never a gate: a rejected TURBO_TOKEN makes turbo print
      # one warning, exit 0, and rebuild every task cold, so the remote cache
      # can sit dead for months while CI stays green and slow.
      - name: Check Turbo remote cache is live
        if: ${{ !cancelled() && env.TURBO_TOKEN != '' }}
        continue-on-error: true
        run: node scripts/ci/check-turbo-remote-cache.mjs "${RUNNER_TEMP}/turbo-type-check.log"
      # Real workspace imports resolve the contracts package dist exports even
      # when metadata-only changes select no affected typecheck build tasks.
      - name: Build contracts for executable imports
        run: bun run --cwd packages/contracts build
      # The repository contracts run in the Source Contracts job.
      - name: Run executable contracts
        run: bun run test:executable-contracts:static
      - name: Check scoring provenance and optional calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/ci/calibration-gate.ts

  # The repository contracts (architecture guards, ratchets, UI and design
  # checks, import cycles) are CPU bound and were the longest step of Static
  # Checks. They read the checked-out tree and nothing from Plan, so they run
  # beside it on their own runner. The gate reads this job directly, so a red
  # contract still fails the verdict.
  source-contracts:
    name: Source Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Check contributor trust
        id: check
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const association = pr.author_association;
            const trustedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isSameRepository =
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isTrusted = isSameRepository || trustedRoles.includes(association);
            const hasLabel = pr.labels.some(l => l.name === 'run-ci');

            // Trust decides *whether* CI runs; this decides *how much* of it.
            // An external contributor stays external even once a maintainer
            // adds `run-ci`: the label buys them a run, not the light tier.
            core.setOutput('external', isTrusted ? 'false' : 'true');

            if (isTrusted) {
              const trustReason = isSameRepository
                ? 'same-repo PR'
                : `trusted contributor (${association})`;
              core.info(`${trustReason} - CI allowed`);
            } else if (hasLabel) {
              core.info('External contributor with run-ci label - CI allowed');
            } else {
              core.setFailed(
                `External contributor (${association}) - add the \`run-ci\` label to allow CI. ` +
                'A maintainer must review the code and add the label.'
              );
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          cache-prisma-client: 'true'
      # Real workspace imports resolve the contracts package dist exports.
      - name: Build contracts for executable imports
        run: bun run --cwd packages/contracts build
      - name: Run repository contracts
        run: bun run test:repository-contracts

  # Typechecks spec/test files against each workspace's compiler options; the
  # pass condition is zero errors. The Plan job decides the scope (see "Select
  # spec typecheck workspaces") and this one job checks all of it. Each
  # workspace is checked in its own process, and every workspace runs even
  # after one fails so one fix never costs a CI round-trip per workspace.
  spec-typecheck:
    name: Spec Typecheck
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Starts with the Plan job: trust gate, install, then the plan's scope.
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: spec-typecheck
          run-heavy: ${{ inputs.run_heavy_tests }}
      # The typecheck base config resolves @genfeedai/contracts to its dist
      # output, so the package graph has to exist before any program is
      # created. A packages-only scope builds just the turbo-affected packages.
      - name: Build packages
        if: steps.start.outputs.run == 'true'
        env:
          BUILD_FILTERS: ${{ fromJSON(steps.start.outputs.plan).spec_build_filters }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_FILTERS}" ]; then
            # shellcheck disable=SC2086 # intentional word-splitting of --filter args
            bunx turbo run build ${BUILD_FILTERS} --concurrency=1
          else
            bunx turbo run build --filter='./packages/*' --concurrency=1
          fi
      # `bun check` reports the same errors as tsc, on every CPU core: all 33
      # spec configs take about 30 s, against about 6 min for the compiler-API
      # script this step used (#10270). Each workspace is its own process and
      # every workspace runs even after one fails. The pass condition is zero
      # errors; the ratchet baseline that allowed known errors is empty.
      - name: Spec Typecheck
        if: steps.start.outputs.run == 'true'
        env:
          SCOPED_WORKSPACES: ${{ fromJSON(steps.start.outputs.plan).spec_workspaces }}
        run: bun run check:spec-typecheck ${SCOPED_WORKSPACES}

  # Packages, server services (everything under apps/server except the API),
  # and web/mobile. One job definition, one matrix leg per applicable group:
  # run as a single turbo invocation the three groups contended for one
  # runner's CPUs and took ~25 minutes, the slowest job in the graph. The
  # planner owns the legs and their filters, including dormant-surface
  # exclusion.
  test-workspaces:
    name: Test Workspaces (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      # Up to three balanced legs (packages, web and the extension) plus the
      # server leg, or four UI pools plus the server leg (five). Bound
      # simultaneous setup and test workers rather than allowing an unbounded
      # fan-out; the planner sizes the matrix so a run needs one wave of five.
      #
      # The legs start with the run, before the plan exists, so the matrix is
      # the widest one the planner can produce: pool N runs the plan's Nth
      # balanced leg, `server` the server leg, and a slot the plan leaves empty
      # ends right after the install. The names are the full tier's.
      max-parallel: 5
      matrix:
        include:
          - name: workspaces-1/4
            slot: '1'
          - name: workspaces-2/4
            slot: '2'
          - name: workspaces-3/4
            slot: '3'
          - name: workspaces-4/4
            slot: '4'
          - name: server
            slot: server
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: genfeed_local
          POSTGRES_USER: genfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # #5252 review: the real-Redis pending-execution-reconciler integration
      # spec (apps/server/workers) otherwise skips silently in CI.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      KNOWLEDGE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      WORKFLOW_BILLING_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      # The deleted-brand-handle migration test builds its own schema, so the
      # bare service database is enough; without this it self-skips.
      BRAND_DELETE_SAFETY_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      CRUN_TEST_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: workspaces
          slot: ${{ matrix.slot }}
          run-heavy: ${{ inputs.run_heavy_tests }}
      - name: Run workspace tests
        if: steps.start.outputs.run == 'true'
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base }}
          FORCE_FULL: ${{ fromJSON(steps.start.outputs.plan).force_full }}
          WORKSPACE_FILTERS: ${{ fromJSON(steps.start.outputs.leg).filters }}
        run: |
          set -euo pipefail
          # UI-only and extension-only legs have no ordinary Turbo filters. An
          # empty filter would select the entire repository, so never invoke it.
          if [ -z "${WORKSPACE_FILTERS}" ]; then exit 0; fi
          # shellcheck disable=SC2086 # intentional word-splitting of --filter args
          if [ "${FORCE_FULL}" = "true" ] || [ -z "${CI_BASE_SHA}" ]; then
            bunx turbo run test --continue --concurrency=1 ${WORKSPACE_FILTERS}
          else
            TURBO_SCM_BASE="${CI_BASE_SHA}" bunx turbo run test --continue --concurrency=1 --affected ${WORKSPACE_FILTERS}
          fi
      # The extension always runs in full; --affected never narrows it.
      - name: Run browser extension tests
        if: ${{ !cancelled() && steps.start.outputs.run == 'true' && fromJSON(steps.start.outputs.leg).extension == 'true' }}
        run: bunx turbo run test --continue --concurrency=1 --filter=@genfeedai/extension
      - name: Run UI shard
        if: ${{ !cancelled() && steps.start.outputs.run == 'true' && fromJSON(steps.start.outputs.leg).ui_shard != '' }}
        env:
          UI_SHARD: ${{ fromJSON(steps.start.outputs.leg).ui_shard }}
        run: |
          set -euo pipefail
          bunx turbo run test:shard --filter=@genfeedai/ui --concurrency=1 -- "$UI_SHARD"
      # Workers cron specs run under their own Vitest config
      # (apps/server/workers/vitest.cron.config.ts), outside `test`.
      - name: Run workers cron specs
        if: ${{ !cancelled() && steps.start.outputs.run == 'true' && fromJSON(steps.start.outputs.leg).group == 'server' }}
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base }}
          FORCE_FULL: ${{ fromJSON(steps.start.outputs.plan).force_full }}
        run: |
          set -euo pipefail
          if [ "${FORCE_FULL}" = "true" ] || [ -z "${CI_BASE_SHA}" ]; then
            bunx turbo run test:cron --filter=@genfeedai/workers
          else
            TURBO_SCM_BASE="${CI_BASE_SHA}" bunx turbo run test:cron --affected --filter=@genfeedai/workers
          fi
      # MCP e2e specs (apps/server/mcp/test/e2e) run under their own Vitest
      # config, outside `test`. They boot the real MCP request path against an
      # in-process fake API, so they need no database or Redis.
      - name: Run MCP e2e specs
        if: ${{ !cancelled() && steps.start.outputs.run == 'true' && fromJSON(steps.start.outputs.leg).group == 'server' }}
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base }}
          FORCE_FULL: ${{ fromJSON(steps.start.outputs.plan).force_full }}
        run: |
          set -euo pipefail
          if [ "${FORCE_FULL}" = "true" ] || [ -z "${CI_BASE_SHA}" ]; then
            bunx turbo run test:e2e --filter=@genfeedai/mcp
          else
            TURBO_SCM_BASE="${CI_BASE_SHA}" bunx turbo run test:e2e --affected --filter=@genfeedai/mcp
          fi

  # App tests. The planner emits the shard matrix: on the affected tier it
  # resolves the exact Vitest changed graph, picks one, two, or four shards and
  # gives each shard its files; on the full tier it emits four shards over the
  # whole suite.
  test-app:
    name: Test App (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      max-parallel: 4
      # The widest matrix the planner can produce (the full tier's four
      # shards), so the legs start with the run. Shard N runs the plan's Nth
      # shard; a shard the plan leaves empty ends right after the install.
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: app
          slot: ${{ matrix.shard }}
          run-heavy: ${{ inputs.run_heavy_tests }}
      - name: Build app workspace
        if: steps.start.outputs.run == 'true'
        run: bunx turbo run build --filter='@genfeedai/web^...'
      # The shard runs the files Plan assigned to it; the full tier runs the
      # whole suite split by Vitest (scripts/ci/test-shard-selection.mjs).
      - name: Run app tests
        id: app-tests
        if: steps.start.outputs.run == 'true'
        env:
          API_TEST_TIMINGS_OUTPUT: ${{ runner.temp }}/app-test-timings/shard-${{ matrix.shard }}.json
          CI_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base }}
          FORCE_FULL: ${{ fromJSON(steps.start.outputs.plan).force_full }}
          NODE_ENV: test
          SHARD: ${{ fromJSON(steps.start.outputs.leg).shard }}
          SHARD_TOTAL: ${{ fromJSON(steps.start.outputs.leg).total }}
          SHARD_ROOT: apps/web
          SHARD_FILE_COUNT: ${{ fromJSON(steps.start.outputs.leg).count }}
          SHARD_FILES: ${{ fromJSON(steps.start.outputs.leg).files }}
        run: |
          set -euo pipefail
          node scripts/ci/test-shard-selection.mjs > "${RUNNER_TEMP}/shard-selection.txt"
          mapfile -t SELECTION < "${RUNNER_TEMP}/shard-selection.txt"
          cd apps/web && bunx vitest run --config ./vitest.config.mts \
            --maxWorkers=2 "${SELECTION[@]}" \
            --reporter=default \
            --reporter="$GITHUB_WORKSPACE/scripts/ci/api-test-timings-reporter.mjs"
      - name: Upload app test timings
        if: always() && steps.app-tests.outcome != 'skipped' && steps.app-tests.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/app-test-timings/shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  # API tests mirror the app job: the planner's matrix, the files the plan
  # gave the shard on the affected tier, the whole suite on the full tier.
  # The full tier uses eight shards (the affected tier never exceeds four), so
  # max-parallel must cover all eight or the extra shards just queue behind
  # the first four.
  test-api:
    name: Test API (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: genfeed_local
          POSTGRES_USER: genfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # #5252 review: the real-Redis integration specs (queue isolation,
      # pending-execution reconciler) otherwise skip silently in CI.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KNOWLEDGE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      WORKFLOW_BILLING_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      CRUN_TEST_REDIS_URL: redis://localhost:6379
      # Separate, fully-migrated databases on the same Postgres service
      # (#5217 / #5191): these run `prisma migrate deploy` for real, so the
      # billing-account-scope and credit-balance *.postgres.spec.ts suites get
      # an actual schema instead of self-skipping.
      BILLING_ACCOUNT_SCOPE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/billing_scope_test
      CREDIT_BALANCE_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/credit_balance_test
      # Brand delete safety (#5295) needs a migrated database; the post link
      # import list spec (#7823) only accepts this exact disposable database
      # name and builds temp tables. Without these the suites self-skip.
      BRAND_DELETE_SAFETY_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/brand_delete_safety_test
      AGENT_MASTER_THREAD_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/agent_master_thread_test
      POST_LINK_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/genfeed_7823_disposable
      PUBLIC_POSTS_ORDER_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/public_posts_order_test
      REDIS_URL: redis://localhost:6379
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      max-parallel: 8
      # The widest matrix the planner can produce (the full tier's eight
      # shards), so the legs start with the run. Shard N runs the plan's Nth
      # shard; the affected tier never plans more than four, so on most runs
      # the rest end before their install.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: api
          slot: ${{ matrix.shard }}
          run-heavy: ${{ inputs.run_heavy_tests }}
      # `working-directory: packages/prisma` + `bun x` (not root `bunx`): the
      # pinned `prisma` is workspace-local and Prisma 7 reads the datasource URL
      # only from packages/prisma/prisma.config.mjs. Migrate once, then copy the
      # second database with `CREATE DATABASE ... TEMPLATE` (a file-level copy).
      # Every shard provisions both: `vitest list --shard` ignores the shard, so
      # which shard gets a *.postgres.spec.ts file is not knowable ahead of time.
      - name: Provision billing-account-scope, credit-balance, brand-delete and post-link test databases
        if: steps.start.outputs.run == 'true'
        working-directory: packages/prisma
        env:
          PGPASSWORD: genfeed_local
        run: |
          psql -h localhost -U genfeed -d test -c "CREATE DATABASE billing_scope_test;"
          DATABASE_URL="$BILLING_ACCOUNT_SCOPE_TEST_DATABASE_URL" bun x prisma migrate deploy
          psql -h localhost -U genfeed -d test -c "CREATE DATABASE credit_balance_test TEMPLATE billing_scope_test;"
          psql -h localhost -U genfeed -d test -c "CREATE DATABASE brand_delete_safety_test TEMPLATE billing_scope_test;"
          psql -h localhost -U genfeed -d test -c "CREATE DATABASE agent_master_thread_test TEMPLATE billing_scope_test;"
          psql -h localhost -U genfeed -d test -c "CREATE DATABASE public_posts_order_test TEMPLATE billing_scope_test;"
          psql -h localhost -U genfeed -d test -c "CREATE DATABASE genfeed_7823_disposable;"
      - name: Build API dependencies
        if: steps.start.outputs.run == 'true'
        run: bunx turbo run build --filter=./packages/**
      - name: Run API tests
        id: api-tests
        if: steps.start.outputs.run == 'true'
        env:
          API_TEST_TIMINGS_OUTPUT: ${{ runner.temp }}/api-test-timings/shard-${{ matrix.shard }}.json
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          CI_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base }}
          FORCE_FULL: ${{ fromJSON(steps.start.outputs.plan).force_full }}
          NODE_ENV: test
          SHARD: ${{ fromJSON(steps.start.outputs.leg).shard }}
          SHARD_TOTAL: ${{ fromJSON(steps.start.outputs.leg).total }}
          SHARD_ROOT: apps/server/api
          SHARD_FILE_COUNT: ${{ fromJSON(steps.start.outputs.leg).count }}
          SHARD_FILES: ${{ fromJSON(steps.start.outputs.leg).files }}
        run: |
          set -euo pipefail
          node scripts/ci/test-shard-selection.mjs > "${RUNNER_TEMP}/shard-selection.txt"
          mapfile -t SELECTION < "${RUNNER_TEMP}/shard-selection.txt"
          cd apps/server/api && bunx vitest run --config vitest.config.ts \
            --maxWorkers=2 "${SELECTION[@]}" \
            --reporter=default \
            --reporter=github-actions \
            --reporter="$GITHUB_WORKSPACE/scripts/ci/api-test-timings-reporter.mjs"
      - name: Summarize API test timings
        if: always() && steps.api-tests.outcome != 'skipped' && steps.api-tests.outcome != ''
        env:
          API_TEST_TIMINGS_OUTPUT: ${{ runner.temp }}/api-test-timings/shard-${{ matrix.shard }}.json
        run: node scripts/ci/api-test-timings-reporter.mjs "$API_TEST_TIMINGS_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API test timings
        if: always() && steps.api-tests.outcome != 'skipped' && steps.api-tests.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/api-test-timings/shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  cloud-tenant-guard:
    name: Cloud Tenant Guard Sweep
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: cloud-tenant-guard
          run-heavy: ${{ inputs.run_heavy_tests }}
      - name: Fetch trusted baseline commit
        if: steps.start.outputs.run == 'true'
        env:
          CLOUD_SWEEP_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base || github.sha }}
        run: |
          git fetch origin "$CLOUD_SWEEP_BASE_SHA" --depth=1
          echo "CLOUD_SWEEP_BASE_SHA=${CLOUD_SWEEP_BASE_SHA}" >> "$GITHUB_ENV"
      # Build uploads only OpenAPI, not API dist. Keep this job independent:
      # waiting for all of Build would serialize unrelated package/docs work.
      # Workflow-level TURBO_TOKEN/TURBO_TEAM apply here; cache hits are expected.
      # Runtime CLOUD configuration is loaded only after compilation.
      - name: Build API (compiled bundle)
        if: steps.start.outputs.run == 'true'
        run: bunx turbo run build --filter=@genfeedai/api
      - name: Validate synthetic CLOUD configuration
        if: steps.start.outputs.run == 'true'
        run: node --test scripts/ci/cloud-tenant-guard-sweep/*.test.mjs
      - name: Load job-local placeholder environment
        if: steps.start.outputs.run == 'true'
        run: |
          sed '/^#/d; /^$/d' scripts/ci/cloud-tenant-guard-sweep/cloud-sweep.placeholders >> "$GITHUB_ENV"
      - name: Create owned private evidence directory
        if: steps.start.outputs.run == 'true'
        run: |
          set -euo pipefail
          sweep_run_dir="$(mktemp -d "$RUNNER_TEMP/cloud-tenant-XXXXXX")"
          chmod 700 "$sweep_run_dir"
          echo "CLOUD_SWEEP_RUN_DIR=$sweep_run_dir" >> "$GITHUB_ENV"
          echo "CLOUD_SWEEP_DIAGNOSTICS=1" >> "$GITHUB_ENV"
          echo "CLOUD_SWEEP_CPU_PROFILE=0" >> "$GITHUB_ENV"
          echo "CLOUD_SWEEP_API_LOG=$sweep_run_dir/api.log" >> "$GITHUB_ENV"
          echo "CLOUD_SWEEP_REPORT=$sweep_run_dir/cloud-tenant-guard-report.json" >> "$GITHUB_ENV"
      - name: Apply Prisma migrations to test DB
        if: steps.start.outputs.run == 'true'
        run: bun x prisma migrate deploy
        working-directory: packages/prisma
      - name: Prepare required verification policy before API boot
        if: steps.start.outputs.run == 'true'
        run: bun scripts/ci/cloud-tenant-guard-sweep/prepare-fixture.mjs
      - name: Start restricted verification transport
        if: steps.start.outputs.run == 'true'
        run: |
          set -euo pipefail
          node scripts/ci/cloud-tenant-guard-sweep/local-mail-stub.mjs > "$CLOUD_SWEEP_RUN_DIR/mail.log" 2>&1 &
          echo "$!" > "$CLOUD_SWEEP_RUN_DIR/mail.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS -H "Authorization: Bearer $GENFEEDAI_API_KEY" http://localhost:3011/v1/internal/email-deliveries | node -e 'let value="";process.stdin.on("data",chunk=>value+=chunk);process.stdin.on("end",()=>process.exit(JSON.parse(value).isConfigured===true?0:1))'; then
              exit 0
            fi
            if ! kill -0 "$(cat "$CLOUD_SWEEP_RUN_DIR/mail.pid")" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "::error::Restricted verification transport unavailable"
          exit 1
      - name: Start real API in CLOUD mode
        id: cloud-api
        if: steps.start.outputs.run == 'true'
        run: |
          set -euo pipefail
          node --import ./scripts/ci/cloud-tenant-guard-sweep/api-observer.mjs apps/server/dist/apps/api/main.js > "$CLOUD_SWEEP_API_LOG" 2>&1 &
          echo "$!" > "$CLOUD_SWEEP_RUN_DIR/cloud-api.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3010/v1/health >/dev/null 2>&1; then
              echo "CLOUD API healthy after ~$((attempt * 2))s"
              exit 0
            fi
            if ! kill -0 "$(cat "$CLOUD_SWEEP_RUN_DIR/cloud-api.pid")" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          echo "::error::CLOUD API did not become healthy within 120s"
          exit 1
      - name: Sweep handlers with tenant enforcement enabled
        if: steps.start.outputs.run == 'true'
        timeout-minutes: 10
        run: bun run ci:cloud-tenant-guard-sweep
      - name: Stop API
        if: ${{ always() && steps.start.outputs.run == 'true' }}
        run: |
          if [ -f "$CLOUD_SWEEP_RUN_DIR/cloud-api.pid" ]; then
            kill "$(cat "$CLOUD_SWEEP_RUN_DIR/cloud-api.pid")" 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! kill -0 "$(cat "$CLOUD_SWEEP_RUN_DIR/cloud-api.pid")" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$(cat "$CLOUD_SWEEP_RUN_DIR/cloud-api.pid")" 2>/dev/null; then
              echo "::error::Owned CLOUD API did not stop within existing bound"
              exit 1
            fi
            (umask 077; printf 'stopped\n' > "$CLOUD_SWEEP_RUN_DIR/api-stopped")
          fi
      - name: Scan final API stdout for swallowed tenant errors
        if: ${{ always() && steps.start.outputs.run == 'true' }}
        env:
          CLOUD_SWEEP_API_BOOT_OUTCOME: ${{ steps.cloud-api.outcome }}
        run: node scripts/ci/cloud-tenant-guard-sweep/scan-log.mjs
      - name: Stop restricted verification transport
        if: ${{ always() && steps.start.outputs.run == 'true' }}
        run: |
          if [ -f "$CLOUD_SWEEP_RUN_DIR/mail.pid" ]; then
            kill "$(cat "$CLOUD_SWEEP_RUN_DIR/mail.pid")" 2>/dev/null || true
          fi
      - name: Upload sanitized CLOUD tenant diagnostic summary
        if: ${{ always() && steps.start.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-tenant-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CLOUD_SWEEP_RUN_DIR }}/diagnostic-summary.json
          retention-days: 7

  # Build, plus the OpenAPI documentation gate (#1247) whenever the API is in
  # scope. The spec is a generated artifact and is NOT committed: it is emitted
  # fresh from the compiled bundle (headless — no DB/Redis), must be
  # byte-identical across two emits, must validate, and is uploaded for review.
  build:
    name: Build
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: build
          run-heavy: ${{ inputs.run_heavy_tests }}
      - name: Run build
        if: steps.start.outputs.run == 'true'
        env:
          CI_BASE_SHA: ${{ fromJSON(steps.start.outputs.plan).base }}
        run: |
          if [ "$CI_IS_CHANGE_RUN" = "true" ]; then
            TURBO_SCM_BASE="$CI_BASE_SHA" bunx turbo run build --filter='./packages/*' --filter=@genfeedai/docs --affected
          else
            bun run build
          fi
      - name: Build api (compiled bundle)
        if: fromJSON(steps.start.outputs.plan).api == 'true'
        run: bunx turbo run build --filter=@genfeedai/api
      - name: Emit OpenAPI spec twice — must be byte-identical
        if: fromJSON(steps.start.outputs.plan).api == 'true'
        run: |
          cd apps/server/api
          bun run scripts/emit-openapi.ts --skip-build --out=/tmp/openapi-emit-1.json
          bun run scripts/emit-openapi.ts --skip-build --out=/tmp/openapi-emit-2.json
          cmp /tmp/openapi-emit-1.json /tmp/openapi-emit-2.json
      - name: Upload generated OpenAPI spec
        if: fromJSON(steps.start.outputs.plan).api == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-spec-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/openapi-emit-1.json
          retention-days: 7
      - name: Validate OpenAPI spec (operationId coverage/uniqueness + allowlist)
        if: fromJSON(steps.start.outputs.plan).api == 'true'
        run: cd apps/server/api && bun run openapi:validate -- --spec=/tmp/openapi-emit-1.json

  # Stable aggregate and the required status check. Every upstream job is
  # declared explicitly so an expression error that leaves an applicable job
  # skipped cannot produce a false-green gate; plan-filtered skips are accepted
  # only when the exact plan marked them non-applicable.
  #
  # Runs on every pull request and merge group. A skipped required check is
  # merge-acceptable to GitHub: drafts must fail this cheap gate so their same
  # head cannot auto-merge while ready_for_review validation is still running.
  # The `push` arm is dormant
  # since the Full Suite stopped running on master pushes: it would only match a
  # Full Suite called from a push. The Full Suite paths (workflow_dispatch,
  # release) are gated by the Master
  # SHA Verdict job in full-suite.yml.
  mcp-auth-runtime:
    name: MCP Auth Runtime
    runs-on: ubuntu-latest
    # The start step reads the Plan job's artifact, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Start test job
        id: start
        uses: ./.github/actions/start-test-leg
        with:
          kind: mcp-auth-runtime
          run-heavy: ${{ inputs.run_heavy_tests }}
      - name: Build real API and MCP packages
        if: steps.start.outputs.run == 'true'
        run: bunx turbo run build --filter=@genfeedai/api --filter=@genfeedai/mcp --concurrency=2
      - name: Select owned report path
        if: steps.start.outputs.run == 'true'
        shell: bash
        run: echo "MCP_AUTH_STATE=$RUNNER_TEMP/mcp-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Execute isolated real auth and brand policy journey
        if: steps.start.outputs.run == 'true'
        shell: bash
        run: |
          tested_sha="$(git rev-parse HEAD)"
          node scripts/ci/mcp-auth-runtime.mjs --case-family brand-access --candidate-sha "$tested_sha" --tested-sha "$tested_sha" --state "$MCP_AUTH_STATE"
      - name: Upload sanitized runtime receipt
        if: ${{ always() && steps.start.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-auth-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MCP_AUTH_STATE }}/report.json
          if-no-files-found: error
          retention-days: 7

  tests-gate:
    name: Validation Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - plan
      - static-checks
      - source-contracts
      - spec-typecheck
      - test-workspaces
      - test-app
      - test-api
      - cloud-tenant-guard
      - mcp-auth-runtime
      - build
    if: >-
      ${{ always()
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Require a ready pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        shell: bash
        run: |
          echo "::error::Draft pull request: mark ready to run validation before merging."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull request run is cancelled when a newer push supersedes it. Its
      # jobs then read "cancelled" and, without this, the gate paints the old
      # commit red although nothing failed. Only a run whose PR head has since
      # moved counts as superseded; a failed lookup fails closed.
      - name: Detect a pull request run superseded by a newer push
        id: supersession
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null || true)"
          if [ -n "${current_head}" ] && [ "${current_head}" != "${RUN_HEAD_SHA}" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "superseded_by=${current_head}" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # The test jobs start with the run, before the plan exists, and a job
      # the plan leaves nothing for ends as a success. So a success does not
      # show that a planned job ran: this does. It reads the plan and fails
      # when a job it called for ended idle.
      - name: Verify every planned test job did its work
        if: ${{ needs.plan.result == 'success' && steps.supersession.outputs.superseded != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/test-plan-handoff.mjs verify

      - name: Aggregate test and build results
        env:
          RUN_SUPERSEDED: ${{ steps.supersession.outputs.superseded }}
          SUPERSEDED_BY: ${{ steps.supersession.outputs.superseded_by }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_APP_TESTS: ${{ needs.plan.outputs.app_tests }}
          PLAN_API_TESTS: ${{ needs.plan.outputs.api_tests }}
          PLAN_WORKSPACE_TESTS: ${{ needs.plan.outputs.workspace_tests }}
          PLAN_SPEC_TYPECHECK: ${{ needs.plan.outputs.spec_run }}
          STATIC_CHECKS_RESULT: ${{ needs.static-checks.result }}
          SOURCE_CONTRACTS_RESULT: ${{ needs.source-contracts.result }}
          SPEC_TYPECHECK_RESULT: ${{ needs.spec-typecheck.result }}
          TEST_WORKSPACES_RESULT: ${{ needs.test-workspaces.result }}
          TEST_APP_RESULT: ${{ needs.test-app.result }}
          TEST_API_RESULT: ${{ needs.test-api.result }}
          CLOUD_TENANT_GUARD_RESULT: ${{ needs.cloud-tenant-guard.result }}
          PLAN_MCP_AUTH_RUNTIME: ${{ needs.plan.outputs.mcp_auth_runtime }}
          MCP_AUTH_RUNTIME_RESULT: ${{ needs.mcp-auth-runtime.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: node scripts/ci/tests-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  # The nightly Full Suite on master runs every test file, so its receipts give
  # the seconds per file the planner fills shards with. The merged file lives in
  # the Actions cache of master, which every pull request can read. Not part of
  # the verdict: a failure here only leaves the previous timings in place.
  record-test-timings:
    name: Record Test Timings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    needs: [plan, test-app, test-api]
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/master'
      && needs.plan.outputs.force_full == 'true'
      && needs.test-app.result == 'success'
      && needs.test-api.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download app timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/receipts/app
      - name: Download API timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: api-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/receipts/api
      # The restore takes the newest earlier file; the post step saves the
      # merged one under this run's key.
      - name: Restore the previous timings
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-timings
          key: test-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-timings-v1-
      - name: Merge this run into the timings
        run: |
          set -euo pipefail
          # download-artifact puts each artifact in a folder named after it.
          node scripts/ci/test-timings.mjs merge \
            --previous "${RUNNER_TEMP}/test-timings/test-timings.json" \
            --app "${RUNNER_TEMP}/receipts/app" \
            --api "${RUNNER_TEMP}/receipts/api" \
            --out "${RUNNER_TEMP}/test-timings/test-timings.json"
