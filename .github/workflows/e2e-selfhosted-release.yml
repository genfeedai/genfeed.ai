name: Self-Hosted Release E2E

# Tests the latest public self-hosted RELEASE, not the mutable :latest tag. The
# job downloads the release bundle without credentials and pulls its exact image
# without a GHCR login, matching the public installation path.
#
# This verifies the published installation path. build-verify-selfhosted.yml
# also runs the real API, frontend, and Postgres before publication.
#
# Failure reporting is fail-closed for the board: open one `release-e2e` tracker,
# set native issue Priority=P0, and auto-close that tracker when the suite is green
# again so red CI cannot rot silently in Backlog.

on:
  # Nightly, 05:23 UTC (off-:00 hygiene).
  schedule:
    - cron: "23 5 * * *"
  # Immediate verification after a GitHub release is published. Canonical
  # release.yml attaches install assets to the draft BEFORE publishing, so this
  # event should see a complete public contract. Residual races still poll assets.
  release:
    types: [published]
  # Manual non-blocking run against an explicit GitHub release tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to test (for example, v0.5.0)"
        required: false
        default: ""

concurrency:
  group: e2e-selfhosted-release
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  APP_BASE_URL: http://localhost:3000
  API_BASE_URL: http://localhost:3010

jobs:
  release-e2e:
    name: Release E2E (LOCAL mode)
    # Desktop / mobile tags are separate surfaces; only community vX.Y.Z.
    if: >-
      github.event_name != 'release'
      || (
        !github.event.release.draft
        && !github.event.release.prerelease
        && startsWith(github.event.release.tag_name, 'v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      failure_class: ${{ steps.classify.outputs.failure_class }}
    steps:
      - name: Resolve exact public release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          release_tag="${REQUESTED_RELEASE_TAG}"
          if [ -z "${release_tag}" ]; then
            release_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a GitHub release tag like v0.5.0, received: ${release_tag}"
            exit 1
          fi

          {
            echo "release_tag=${release_tag}"
            echo "image_tag=${release_tag#v}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout released source and matching tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Download and verify public install bundle
        id: bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/genfeed-release"
          mkdir -p "${install_root}"

          # Public install contract: both assets must exist. Canonical release.yml
          # attaches them before publish, but residual publish races and hand-cut
          # releases can still lag. Poll up to ~10 minutes before failing closed.
          deadline=$((SECONDS + 600))
          while true; do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              > "${install_root}/release.json"
            missing=0
            for asset_name in genfeed-selfhosted.tar.gz genfeed-selfhosted.tar.gz.sha256; do
              asset_url="$(jq -r --arg name "${asset_name}" \
                '.assets[] | select(.name == $name) | .browser_download_url' \
                "${install_root}/release.json")"
              if [ -z "${asset_url}" ] || [ "${asset_url}" = "null" ]; then
                missing=1
                break
              fi
            done
            if [ "${missing}" -eq 0 ]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Release ${RELEASE_TAG} is missing the public install bundle after 10m (genfeed-selfhosted.tar.gz + .sha256). Public users cannot install this release. Dispatch the canonical Release workflow from final master with the same tag and repair_published_release=true."
              echo "failure_class=missing-install-assets" >> "${GITHUB_OUTPUT}"
              exit 1
            fi
            echo "Install assets not published yet for ${RELEASE_TAG}; waiting 20s..."
            sleep 20
          done

          for asset_name in genfeed-selfhosted.tar.gz genfeed-selfhosted.tar.gz.sha256; do
            asset_url="$(jq -r --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .browser_download_url' \
              "${install_root}/release.json")"
            # No Authorization header: this must work exactly as it does for a
            # public user following the README.
            curl -fsSL "${asset_url}" -o "${install_root}/${asset_name}"
          done

          (
            cd "${install_root}"
            sha256sum -c genfeed-selfhosted.tar.gz.sha256
            tar -xzf genfeed-selfhosted.tar.gz
          )

          bundle_dir="${install_root}/genfeed-selfhosted-${RELEASE_TAG}"
          test "$(jq -r '.releaseTag' "${bundle_dir}/release.json")" = "${RELEASE_TAG}"
          test "$(jq -r '.image' "${bundle_dir}/release.json")" = \
            "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
          cp "${bundle_dir}/.env.example" "${bundle_dir}/.env"

          {
            echo "COMPOSE_FILE=${bundle_dir}/compose.yml"
            echo "COMPOSE_ENV_FILE=${bundle_dir}/.env"
            echo "IMAGE_TAG=${IMAGE_TAG}"
          } >> "${GITHUB_ENV}"

          docker compose --env-file "${bundle_dir}/.env" -f "${bundle_dir}/compose.yml" \
            config --images | grep -Fx "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"

          echo "failure_class=none" >> "${GITHUB_OUTPUT}"

      - name: Boot public exact image + Postgres
        id: boot
        run: |
          echo "Testing public image tag: ${IMAGE_TAG}"
          docker compose --env-file "${COMPOSE_ENV_FILE}" -f "${COMPOSE_FILE}" up -d --quiet-pull

      # Readiness gate — the #1 false-green risk. Migrate + seed run async on
      # boot, so liveness can be green before the DB is usable. Fail loud on
      # timeout; never let the specs run against a half-booted stack.
      - name: Readiness — stage 1 (liveness, <=120s)
        id: ready1
        run: |
          deadline=$((SECONDS + 120))
          until curl -fsS "${API_BASE_URL}/v1/health/ready" >/dev/null \
             && curl -fsS "${APP_BASE_URL}/playwright-ready" >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::Liveness gate timed out after 120s — processes not answering"
              exit 1
            fi
            sleep 3
          done
          echo "Liveness OK — API + app processes answering."

      - name: Readiness — stage 2 (DB + seed + auth gate, <=180s)
        id: ready2
        run: |
          # Poll bootstrap until it returns the SEEDED admin. This drives
          # LOCAL-mode auth injection -> Prisma -> SelfHostedSeedService rows,
          # so it only greens once DB + migrations + seed + auth are ALL live.
          deadline=$((SECONDS + 180))
          until curl -fsS "${API_BASE_URL}/v1/auth/bootstrap" | grep -q 'admin@localhost'; do
            if (( SECONDS >= deadline )); then
              echo "::error::Bootstrap/seed gate timed out after 180s — DB + migrate + seed + auth not all ready"
              exit 1
            fi
            sleep 3
          done
          echo "Bootstrap + seed OK — seeded admin@localhost reachable."

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"
          cache-playwright: "true"

      - name: Run release E2E specs
        id: specs
        run: bun run test:e2e:release
        env:
          CI: true

      - name: Classify failure
        id: classify
        if: always()
        env:
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          BOOT_OUTCOME: ${{ steps.boot.outcome }}
          READY1_OUTCOME: ${{ steps.ready1.outcome }}
          READY2_OUTCOME: ${{ steps.ready2.outcome }}
          SPECS_OUTCOME: ${{ steps.specs.outcome }}
          BUNDLE_CLASS: ${{ steps.bundle.outputs.failure_class }}
        run: |
          set -euo pipefail
          if [ "${BUNDLE_OUTCOME}" = "failure" ]; then
            echo "failure_class=${BUNDLE_CLASS:-bundle-verify}" >> "${GITHUB_OUTPUT}"
          elif [ "${BOOT_OUTCOME}" = "failure" ]; then
            echo "failure_class=image-boot" >> "${GITHUB_OUTPUT}"
          elif [ "${READY1_OUTCOME}" = "failure" ]; then
            echo "failure_class=liveness-timeout" >> "${GITHUB_OUTPUT}"
          elif [ "${READY2_OUTCOME}" = "failure" ]; then
            echo "failure_class=bootstrap-seed-timeout" >> "${GITHUB_OUTPUT}"
          elif [ "${SPECS_OUTCOME}" = "failure" ]; then
            echo "failure_class=playwright-specs" >> "${GITHUB_OUTPUT}"
          else
            echo "failure_class=none" >> "${GITHUB_OUTPUT}"
          fi

      - name: Dump container logs (on failure)
        if: failure() && env.COMPOSE_FILE != ''
        run: |
          docker compose --env-file "${COMPOSE_ENV_FILE}" -f "${COMPOSE_FILE}" logs --no-color > compose-logs.txt 2>&1 || true
          echo "===== compose logs (tail) ====="
          tail -n 200 compose-logs.txt || true

      - name: Upload container logs (on failure)
        if: failure() && env.COMPOSE_FILE != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-e2e-compose-logs
          path: compose-logs.txt
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-e2e-playwright-report
          path: playwright/artifacts/report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down stack
        if: always() && env.COMPOSE_FILE != ''
        run: docker compose --env-file "${COMPOSE_ENV_FILE}" -f "${COMPOSE_FILE}" down -v

  # File a deduped tracking issue when the release E2E fails, and force native
  # issue Priority P0 so the board cannot park a broken public install contract in
  # Backlog with no priority.
  report-failure:
    name: Report failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release-e2e]
    if: failure() && needs.release-e2e.result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always use master reporter so a broken released tag still files P0.
          ref: master
          persist-credentials: false

      - name: Open or update tracking issue (Priority P0)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE_TAG: ${{ needs.release-e2e.outputs.image_tag }}
          RELEASE_TAG: ${{ needs.release-e2e.outputs.release_tag }}
          FAILURE_CLASS: ${{ needs.release-e2e.outputs.failure_class }}
        with:
          # Reuse the existing maintainer PAT. Unlike the repository-scoped
          # GITHUB_TOKEN, it can be granted organization Projects write access.
          github-token: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              buildReleaseE2eFailureBody,
              reportReleaseE2eFailure,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/release-e2e-failure-reporter.mjs',
                ),
              ).href,
            );

            const imageTag = process.env.IMAGE_TAG || 'unresolved';
            const releaseTag = process.env.RELEASE_TAG || 'unresolved';
            const failureClass = process.env.FAILURE_CLASS || 'unknown';
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = buildReleaseE2eFailureBody({
              date,
              releaseTag,
              imageTag,
              runUrl,
              failureClass,
            });

            const result = await reportReleaseE2eFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
              date,
              core,
            });
            core.info(JSON.stringify(result));

  # Auto-close open release-e2e trackers when the suite is green so stale P0s
  # cannot sit in Backlog after the public contract recovers.
  report-success:
    name: Resolve tracking issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release-e2e]
    if: success()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout failure reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always use master reporter so green auto-close works even when the
          # released tag predates this automation.
          ref: master
          persist-credentials: false

      - name: Close open release-e2e trackers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE_TAG: ${{ needs.release-e2e.outputs.image_tag }}
          RELEASE_TAG: ${{ needs.release-e2e.outputs.release_tag }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { resolveReleaseE2eFailure } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/release-e2e-failure-reporter.mjs',
                ),
              ).href,
            );

            const imageTag = process.env.IMAGE_TAG || 'unresolved';
            const releaseTag = process.env.RELEASE_TAG || 'unresolved';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Self-hosted release E2E is green** on \`${new Date().toISOString().slice(0, 10)}\`.`,
              ``,
              `- GitHub release: \`${releaseTag}\``,
              `- Image tag verified: \`ghcr.io/genfeedai/genfeed.ai:${imageTag}\``,
              `- Green run: ${runUrl}`,
              ``,
              `Closing automatically. A future red run will reopen or create a new tracker at Priority P0.`,
            ].join('\n');

            const result = await resolveReleaseE2eFailure({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
              core,
            });
            core.info(JSON.stringify(result));
