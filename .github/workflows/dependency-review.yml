# Dependency Review
#
# Supply-chain gate for lockfile changes. `review` reads the dependency diff of
# a pull request (what bun.lock adds or upgrades, including transitive
# packages) and fails when a newly introduced package carries a known high or
# critical advisory. `audit` fails on any critical advisory in the full
# lockfile, on pull requests that touch a manifest or lockfile and on a weekly
# schedule, so a newly published advisory surfaces without blocking unrelated
# PRs. High advisories that already exist are tracked in issues, not gated here.
#
# Both jobs are read-only: no checkout of untrusted code runs with a write
# token, and the audit step installs nothing (it reads the lockfile only).

name: Dependency Review

on:
  pull_request:
    branches: [master]
  schedule:
    # Weekly Tuesday 06:20 UTC, staggered from CodeQL and Trivy
    - cron: '20 6 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  review:
    name: Review lockfile diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # Summary stays in the run page; commenting needs pull-requests: write.
          comment-summary-in-pr: never

  audit:
    name: Audit lockfile (critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: the PR merge commit and its first parent (the base).
          fetch-depth: 2
          persist-credentials: false

      - name: Detect manifest or lockfile changes
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^1 HEAD \
            | grep -qE '(^|/)(package\.json|bun\.lock)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Audit for critical advisories
        if: github.event_name != 'pull_request' || steps.scope.outputs.run == 'true'
        run: bun audit --audit-level=critical
