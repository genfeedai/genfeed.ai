name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  desktop-release-qa:
    name: Desktop Release QA
    uses: ./.github/workflows/desktop-qa.yml

  desktop-macos:
    # Signing and release secrets are only exposed for an actual desktop tag
    # push. A manual dispatch can still exercise the reusable QA job above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: desktop-release-qa
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      GENFEED_DESKTOP_RELEASE: ${{ github.sha }}
      GENFEED_DESKTOP_VISUAL_QA_ENABLED: ${{ secrets.GENFEED_DESKTOP_VISUAL_QA_SESSION != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate macOS signing secrets
        run: |
          missing=0
          for credential_name in \
            APPLE_API_PRIVATE_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD
          do
            if [ -z "${!credential_name}" ]; then
              echo "::error::Missing required credential: ${credential_name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"

      - name: Install App Store Connect API key
        run: |
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"

      - name: Install Apple signing certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/genfeed-desktop.keychain-db"
          CERT_PATH="$RUNNER_TEMP/genfeed-desktop-signing.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "${DEVELOPER_ID_P12_PASSWORD}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${DEVELOPER_ID_P12_PASSWORD}" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${DEVELOPER_ID_P12_PASSWORD}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${DEVELOPER_ID_P12_PASSWORD}" "$KEYCHAIN_PATH"

      # electron-builder reads the version from apps/desktop/app/package.json,
      # where it is a placeholder that nothing bumps. Stamping the tag onto it
      # before the build is what keeps the artifact filename, the updater feed
      # in latest-mac.yml, the release manifest, and the Homebrew cask URL
      # agreeing with the tag. Off a desktop tag this is a no-op.
      - name: Apply the release version from the tag
        run: bun run scripts/desktop/apply-release-version.ts

      # These four are turbo tasks and must run through turbo so their
      # `^build` dependency resolves; `bun run --filter` skips it and leaves
      # the workspace packages unbuilt. `smoke` and `release:mac` below are
      # not turbo tasks and stay on `bun run`.
      - name: Desktop lint
        run: bunx turbo run lint --filter=@genfeedai/desktop

      - name: Desktop type-check
        run: bunx turbo run type-check --filter=@genfeedai/desktop

      - name: Desktop tests
        run: bunx turbo run test --filter=@genfeedai/desktop

      - name: Desktop build
        run: bunx turbo run build --filter=@genfeedai/desktop

      - name: Desktop smoke test
        run: bun run --filter=@genfeedai/desktop smoke

      - name: Build macOS release artifact
        run: bun run --filter=@genfeedai/desktop release:mac

      - name: Notarize and staple macOS disk images
        run: |
          for dmg in apps/desktop/app/release/*.dmg; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --timeout 30m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # Stapling writes Apple's notarization ticket into the DMG, changing its
      # checksum after electron-builder generated latest-mac.yml and the release
      # manifest. Refresh final metadata from the bytes users actually download,
      # and remove the pre-staple DMG blockmap before publishing.
      - name: Finalize notarized release metadata
        run: |
          bun run --filter=@genfeedai/desktop release:metadata
          bun run --filter=@genfeedai/desktop release:manifest

      - name: Verify Developer ID signature, notarization, and app size
        run: |
          DMG_PATH="$(find apps/desktop/app/release -maxdepth 1 -name '*.dmg' -type f | head -1)"
          MOUNT_PATH="$(mktemp -d)"

          if [ -z "$DMG_PATH" ]; then
            echo "::error::macOS disk image was not created"
            exit 1
          fi

          cleanup() {
            hdiutil detach "$MOUNT_PATH" >/dev/null 2>&1 || true
            rmdir "$MOUNT_PATH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_PATH" "$DMG_PATH"
          APP_PATH="$(find "$MOUNT_PATH" -maxdepth 2 -name 'GenFeed.app' -type d | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::GenFeed.app was not found in the disk image"
            exit 1
          fi

          MAX_APP_SIZE_MIB=500
          APP_SIZE_KIB="$(du -sk "$APP_PATH" | awk '{print $1}')"
          APP_SIZE_MIB="$(( (APP_SIZE_KIB + 1023) / 1024 ))"

          {
            echo "## Desktop package size"
            echo
            echo "GenFeed.app: ${APP_SIZE_MIB} MiB (budget: ${MAX_APP_SIZE_MIB} MiB)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$APP_SIZE_MIB" -gt "$MAX_APP_SIZE_MIB" ]; then
            echo "::error::GenFeed.app is ${APP_SIZE_MIB} MiB and exceeds the 500 MiB release budget"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dvvv "$APP_PATH" 2>&1 | grep -F 'Authority=Developer ID Application'
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Capture packaged visual QA
        if: env.GENFEED_DESKTOP_VISUAL_QA_ENABLED == 'true'
        env:
          GENFEED_DESKTOP_VISUAL_QA_SESSION: ${{ secrets.GENFEED_DESKTOP_VISUAL_QA_SESSION }}
        run: bun run --filter=@genfeedai/desktop visual:qa:release

      - name: Record deferred authenticated visual QA
        if: env.GENFEED_DESKTOP_VISUAL_QA_ENABLED != 'true'
        run: |
          echo "::warning::GENFEED_DESKTOP_VISUAL_QA_SESSION is not configured — authenticated screenshot evidence is deferred."
          {
            echo "## Desktop visual QA"
            echo
            echo "Authenticated screenshot evidence was deferred because the optional release-only session fixture is not configured."
            echo "Desktop QA, smoke, signing, notarization, and Gatekeeper verification remain required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genfeed-desktop-macos
          path: |
            apps/desktop/app/release/*.dmg
            apps/desktop/app/release/*.zip
            apps/desktop/app/release/*.blockmap
            apps/desktop/app/release/*.yml
            apps/desktop/app/release/genfeed-desktop-release.json
          if-no-files-found: error

      - name: Upload visual QA screenshots
        if: env.GENFEED_DESKTOP_VISUAL_QA_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genfeed-desktop-visual-qa
          path: apps/desktop/app/visual-qa/*.png
          if-no-files-found: error

  publish-desktop-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: desktop-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: genfeed-desktop-macos
          path: release

      - name: Attach macOS artifacts to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/*

  # Homebrew's autobump only tracks casks inside Homebrew/homebrew-cask, and
  # that repository has a notability bar this project does not clear yet. Until
  # it does, `brew install --cask genfeedai/tap/genfeed` is served from our own
  # tap, which means we bump it ourselves on every desktop release.
  publish-homebrew-cask:
    name: Publish Homebrew cask
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: publish-desktop-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: genfeed-desktop-macos
          path: release

      # The checksum comes from the manifest the build wrote beside the
      # artifacts — the same bytes that were signed, notarized, and uploaded.
      - name: Render the cask
        run: |
          bun run scripts/desktop/render-cask.ts \
            release/genfeed-desktop-release.json \
            --out "$RUNNER_TEMP/genfeed.rb"

      # A missing token skips the tap rather than failing the run: the GitHub
      # release is already published at this point, and Homebrew is an extra
      # distribution channel, not a release gate.
      - name: Push the cask to genfeedai/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew tap update."
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/genfeedai/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"

          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp "$RUNNER_TEMP/genfeed.rb" "$RUNNER_TEMP/tap/Casks/genfeed.rb"

          cd "$RUNNER_TEMP/tap"

          if git diff --quiet -- Casks/genfeed.rb; then
            echo "Cask already matches this release — nothing to push."
            exit 0
          fi

          git config user.name "genfeed-release"
          git config user.email "release@genfeed.ai"
          git add Casks/genfeed.rb
          git commit -m "genfeed ${GITHUB_REF_NAME#desktop-v}"
          git push
