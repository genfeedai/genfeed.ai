# Weekly `bun run deps:update`. Replaces Dependabot so package bumps honor the
# ncu rejects (typescript, better-auth, @types/node, …) and Action pins move
# in the same PR.
name: Deps Update

on:
  workflow_dispatch:
  schedule:
    # Weekly Tuesday 6am UTC — same cadence Dependabot used
    - cron: '0 6 * * 2'

concurrency:
  group: deps-update
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  update:
    name: Run deps:update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24.x"
          install-command: "bun install"

      - name: Update packages and Action pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run deps:update

      - name: Open or refresh the weekly PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No dependency updates."
            exit 0
          fi

          branch="chore/deps-update"
          head_owner="${GITHUB_REPOSITORY%%/*}"
          list_weekly_pull_requests() {
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/pulls" \
              --raw-field state=open \
              --raw-field base=master \
              --raw-field head="${head_owner}:${branch}" \
              --raw-field per_page=2 \
              --jq '.[].number'
          }
          pull_request_numbers="$(list_weekly_pull_requests)"
          pull_requests=()
          if [[ -n "$pull_request_numbers" ]]; then
            mapfile -t pull_requests <<< "$pull_request_numbers"
          fi
          if (( ${#pull_requests[@]} > 1 )); then
            echo "::error::Expected at most one open weekly dependency PR, found ${#pull_requests[@]}. Close duplicates before retrying."
            exit 1
          fi

          previous_sha="$(
            git ls-remote --heads origin "refs/heads/${branch}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ -n "$previous_sha" ]]; then
            git fetch --no-tags origin "$previous_sha"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(deps): weekly deps:update"
          update_sha="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${branch}:${previous_sha}" \
            origin \
            "HEAD:refs/heads/${branch}"

          if (( ${#pull_requests[@]} == 1 )); then
            echo "Refreshed weekly dependency PR #${pull_requests[0]}."
            exit 0
          fi

          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$branch" \
            --title "chore(deps): weekly deps:update" \
            --body "$(cat <<'EOF'
          Single weekly bump from `bun run deps:update`: npm-check-updates with the repo rejects, lockfile install, and GitHub Action tag pins.

          Dependabot bun/actions PRs are retired so they stop fighting those rejects (`typescript`, `@types/node`, `better-auth`, …).
          EOF
          )"; then
            exit 0
          fi

          echo "::error::GitHub Actions could not create the weekly dependency PR. Enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests, then retry this workflow."
          if ! pull_request_numbers="$(list_weekly_pull_requests)"; then
            echo "::error::Could not verify whether GitHub created the PR after the CLI error; preserving ${branch} at ${update_sha} to avoid detaching a potentially-created PR."
            exit 1
          fi
          if [[ -n "$pull_request_numbers" ]]; then
            echo "Weekly dependency PR #${pull_request_numbers%%$'\n'*} became visible after the CLI error."
            exit 0
          fi

          if [[ -n "$previous_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${update_sha}" \
              origin \
              "${previous_sha}:refs/heads/${branch}"
          else
            git push \
              --force-with-lease="refs/heads/${branch}:${update_sha}" \
              origin \
              ":refs/heads/${branch}"
          fi
          exit 1
