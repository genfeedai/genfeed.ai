name: Diag release 403
on:
  push:
    branches:
      - claude/project-thread-y8t551
    paths:
      - .github/workflows/diag-release-403.yml
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe update-a-release variants on the v0.3.2 draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          api() { gh api "$@" 2>&1 | head -c 600; echo; }
          echo "== rulesets"; api "repos/${GITHUB_REPOSITORY}/rulesets"
          echo "== workflow permissions"; api "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow"
          echo "== release"
          rel="$(gh api "repos/${GITHUB_REPOSITORY}/releases/448455195")"
          jq '{id,tag_name,target_commitish,draft,prerelease,name,assets:[.assets[].name],immutable}' <<<"$rel"
          sha=12edcae57400547ffe336d6756e5c0da4ac29508
          probe() { echo "-- PATCH $1"; shift; gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/448455195" "$@" 2>&1 | head -c 400 | tr '\n' ' '; echo; }
          probe "draft=true" -F draft=true
          probe "name" -f name=v0.3.2
          probe "tag_name" -f tag_name=v0.3.2
          probe "target_commitish" -f target_commitish=$sha
          probe "prerelease=false" -F prerelease=false
          jq -r .body <<<"$rel" > body.txt
          probe "body" -F body=@body.txt
          probe "tag_name+target_commitish" -f tag_name=v0.3.2 -f target_commitish=$sha
          probe "all" -f tag_name=v0.3.2 -f target_commitish=$sha -f name=v0.3.2 -F body=@body.txt -F draft=true -F prerelease=false
