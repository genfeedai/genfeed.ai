name: Security Scan

on:
  workflow_dispatch:
  schedule:
    # Weekly Tuesday 06:10 UTC — off-peak, staggered from CodeQL
    - cron: '10 6 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile.server \
            -t genfeedai/server:scan \
            .

      - name: Run Trivy vulnerability scanner
        # v-prefixed: upstream stopped publishing the bare "0.x.y" tag alias
        # after 0.35.0, so an unprefixed pin past that fails to resolve at all.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "genfeedai/server:scan"
          format: "sarif"
          output: "trivy-server.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"
          # The filesystem job scans application dependencies separately.
          vuln-type: "os"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: "trivy-server.sarif"
          category: "trivy-server"

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"
          # .deepsec is a vendored side-project with its own pnpm lockfile — its
          # deps never ship. node_modules is already covered via the lockfiles.
          skip-dirs: ".deepsec,**/node_modules"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-filesystem"
