name: tmp instant-nav probe
on:
  pull_request:
    paths:
      - .github/workflows/tmp-instant-nav-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app
      - name: Full-tier shard 4/8 (same selection and env as Playwright Full)
        run: node scripts/playwright-e2e-tiers.mjs -- --trace retain-on-failure
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_ENDPOINT: https://api.genfeed.ai/v1
          E2E_EXPECT_TIMEOUT_MS: "15000"
          E2E_RETRIES: "0"
          E2E_SHARD_INDEX: "4"
          E2E_TOTAL_SHARDS: "8"
          BETTER_AUTH_SECRET: test-better-auth-secret
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: "true"
