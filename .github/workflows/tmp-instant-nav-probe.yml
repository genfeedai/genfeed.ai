name: tmp instant-nav probe
on:
  pull_request:
    paths:
      - .github/workflows/tmp-instant-nav-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app
      - name: Probe prefetch requests (prod build, 2 workers)
        run: bunx playwright test --config playwright/configs/playwright.config.ts --project=app-core playwright/e2e/tests/navigation/tmp-probe.spec.ts --repeat-each=4 --workers=2 --reporter=list
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_ENDPOINT: https://api.genfeed.ai/v1
          E2E_RETRIES: "0"
          BETTER_AUTH_SECRET: test-better-auth-secret
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: "true"
      - name: Real spec x10 (prod build, 2 workers)
        if: always()
        run: bunx playwright test --config playwright/configs/playwright.config.ts --project=app-core playwright/e2e/tests/navigation/instant-navigation.spec.ts -g "rail navigation" --repeat-each=10 --workers=2 --reporter=list
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_ENDPOINT: https://api.genfeed.ai/v1
          E2E_RETRIES: "0"
          BETTER_AUTH_SECRET: test-better-auth-secret
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: "true"
