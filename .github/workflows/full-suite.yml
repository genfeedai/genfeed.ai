# Full Suite — the complete validation pipeline, and the caller for release
# verification.
#
# On demand only: Actions → "Full Suite (CI + Release Gates + E2E)" → Run
# workflow → pick the branch. release.yml also calls it (workflow_call) for the
# exact release SHA when no green exact-SHA run exists to reuse.
#
# It does NOT run on a push to master. The complete heavy tier (full API/app
# shards, full spec typecheck, workspace tests, build & boot, E2E, ~40 jobs)
# competed with pull-request CI for the same runner pool, and on a day with
# dozens of merges the PR checks queued behind master runs that rarely
# finished (2026-10-03). Pull requests run the affected tier; deploys are
# manual at an exact SHA, and the release workflow verifies its own SHA here.
#
# A running suite is never cancelled: a newer dispatch only replaces the
# *pending* run for the same ref and event.
#
# The aggregate tracker below reports only complete verdicts for the current
# default-branch SHA. Historical and feature-branch dispatches cannot change it.
#
# Reuses existing workflows via workflow_call — no job logic is duplicated here;
# this file only orders the public release-prep gates. Community self-hosted image
# verification lives in build-verify-selfhosted.yml and runs independently.

name: Full Suite (CI + Release Gates + E2E)
run-name: Master SHA · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      run_runtime_acceptance:
        description: 'Run the final combined-source connected acceptance batch.'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      run_runtime_acceptance:
        description: 'Run the final combined-source connected acceptance batch.'
        type: boolean
        required: false
        default: false

concurrency:
  # Include the workflow name so a workflow_call invocation (where github.workflow
  # is the caller's name, e.g. the stable release) does not share a group with a
  # manual workflow_dispatch on the same ref, and the event name so a manual
  # run never shares a group with a release verifying that same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a running suite: a newer dispatch only replaces the *pending*
  # run for the same ref and event.
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    # Nested reusable workflows cannot elevate permissions past this job's
    # ceiling. Mirror ci.yml's requested token scopes explicitly so callers of
    # full-suite can validate the complete workflow graph at startup.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    # Release/full-suite path runs the full heavy test matrix. A reusable
    # workflow inherits the caller's originating event, so this must be an
    # explicit input — `github.event_name` is never `workflow_call` downstream.
    with:
      run_heavy_tests: true
    secrets: inherit

  build-verify:
    name: Build & Boot Check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-verify.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    # Only the image-build sourcemap credential crosses this boundary.

  e2e:
    name: E2E Suite
    # Deliberately NOT `needs: [ci, build-verify]`. e2e.yml checks out, builds,
    # and starts its own postgres/redis services, so the old dependency bought
    # ordering only — and ordering cost the v0.1.67 release three sequential
    # rounds: each unit-gate fix had to land and go green before anyone could
    # even see the E2E reds waiting behind it. Running both layers together
    # makes one red run report every broken layer at once.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/e2e.yml
    with:
      run_api_full: ${{ inputs.run_runtime_acceptance == true }}
      run_runtime_acceptance: ${{ inputs.run_runtime_acceptance == true }}
    secrets: inherit

  visual-connected:
    name: Connected Visual Acceptance
    if: inputs.run_runtime_acceptance == true
    permissions:
      contents: read
    uses: ./.github/workflows/visual-code-isolation.yml
    with:
      run_connected: true

  runtime-acceptance-gate:
    name: Final Connected Acceptance
    if: always() && inputs.run_runtime_acceptance == true
    needs: [ci, build-verify, e2e, visual-connected]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require completed connected receipts and uploads
        env:
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual-connected.result }}
          AGENT_RECEIPT: ${{ needs.e2e.outputs.agent_production_result }}
          BRAND_RECEIPT: ${{ needs.e2e.outputs.brand_acceptance_result }}
          RUNTIME_RECEIPT: ${{ needs.e2e.outputs.runtime_acceptance_result }}
          ISOLATION_RECEIPT: ${{ needs.visual-connected.outputs.isolation_acceptance_result }}
          VISUAL_RECEIPT: ${{ needs.visual-connected.outputs.connected_acceptance_result }}
        run: |
          set -euo pipefail
          test "$CI_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          test "$VISUAL_RESULT" = success
          test "$AGENT_RECEIPT" = passed
          test "$BRAND_RECEIPT" = passed
          test "$RUNTIME_RECEIPT" = passed
          test "$ISOLATION_RECEIPT" = passed
          test "$VISUAL_RECEIPT" = passed

  master-sha-verdict:
    name: Master SHA Verdict
    if: always()
    needs: [ci, build-verify, e2e, visual-connected, runtime-acceptance-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Require complete verification for this SHA
        env:
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual-connected.result }}
          CONNECTED_RESULT: ${{ needs.runtime-acceptance-gate.result }}
          RUN_CONNECTED: ${{ inputs.run_runtime_acceptance == true }}
        run: |
          set -euo pipefail
          test "$CI_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          if [ "$RUN_CONNECTED" = true ]; then
            test "$VISUAL_RESULT" = success
            test "$CONNECTED_RESULT" = success
          else
            test "$VISUAL_RESULT" = skipped
            test "$CONNECTED_RESULT" = skipped
          fi

  master-failure-tracker:
    name: Master CI failure tracker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reporting is best-effort: release.yml calls this workflow as verify-suite,
    # so a tracker API error must not turn a green suite red and block a release.
    continue-on-error: true
    concurrency:
      group: master-ci-failure-tracker
      cancel-in-progress: false
    needs: [master-sha-verdict, ci, build-verify, e2e, visual-connected, runtime-acceptance-gate]
    if: >-
      !cancelled()
      && (needs.master-sha-verdict.result == 'failure' || needs.master-sha-verdict.result == 'success')
      && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate current default-branch SHA
        id: trusted-head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: `heads/${context.payload.repository.default_branch}`,
            });
            core.setOutput('current', data.object.sha === context.sha ? 'true' : 'false');

      - name: Checkout failure reporter
        if: steps.trusted-head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read the validated commit subject
        if: steps.trusted-head.outputs.current == 'true'
        id: head
        run: echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Mint reporter token (Genfeed bot App)
        if: steps.trusted-head.outputs.current == 'true' && needs.master-sha-verdict.result == 'failure'
        id: reporter-token
        uses: ./.github/actions/reporter-token
        with:
          client-id: ${{ secrets.GENFEED_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GENFEED_BOT_PRIVATE_KEY }}

      - name: Reconcile aggregate tracking issue
        if: steps.trusted-head.outputs.current == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ steps.head.outputs.subject }}
          VERDICT: ${{ needs.master-sha-verdict.result }}
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual-connected.result }}
          CONNECTED_RESULT: ${{ needs.runtime-acceptance-gate.result }}
        with:
          github-token: ${{ steps.reporter-token.outputs.token || github.token }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { updateMasterCiFailureFromVerdict } = await import(
              pathToFileURL(path.join(
                process.env.GITHUB_WORKSPACE,
                'scripts/ci/master-ci-failure-reporter.mjs',
              )).href,
            );
            const result = await updateMasterCiFailureFromVerdict({
              github: getOctokit(process.env.REPOSITORY_TOKEN),
              projectGithub: github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              defaultBranch: context.payload.repository.default_branch,
              sha: context.sha,
              verdict: process.env.VERDICT,
              results: {
                ci: process.env.CI_RESULT,
                'build-verify': process.env.BUILD_RESULT,
                e2e: process.env.E2E_RESULT,
                'visual-connected': process.env.VISUAL_RESULT,
                'runtime-acceptance-gate': process.env.CONNECTED_RESULT,
              },
              date: new Date().toISOString().slice(0, 10),
              headline: process.env.HEAD_COMMIT_MESSAGE || 'unresolved',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              core,
            });
            core.info(JSON.stringify(result));
