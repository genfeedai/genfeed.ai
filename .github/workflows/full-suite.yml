# Full Suite — THE master-push pipeline (ci.yml has no push trigger of its
# own), and the caller for release verification.
#
# Runs on every push to master, plus on demand: Actions → "Full Suite
# (CI + Release Gates + E2E)" → Run workflow → pick the branch.
#
# Master push coverage exists because the merge queue only requires the light PR
# tier (tests gate, typecheck, lint, format, secret scans). Spec typecheck,
# executable contracts, package tests, the full API/app shards, and API E2E live
# here. Before v0.1.67 this workflow first ran at release cut, so a burst of
# merges could land unvalidated at that tier and the release then paid for every
# one of them at once — five attempts across roughly ten hours. Running on push
# surfaces a red master within one Full Suite of the merge that caused it.
#
# The nested CI Gate also carries ci.yml's push-gated master jobs — the
# tests-gate push arm, the master failure tracker (#2510), and the merge-queue
# janitor (#1969) — because a reusable workflow inherits the caller's
# originating `push` event. Removing this workflow's push trigger would
# silently disable all three.
#
# Reuses existing workflows via workflow_call — no job logic is duplicated here;
# this file only orders the public release-prep gates. Community self-hosted image
# verification lives in build-verify-selfhosted.yml and runs independently.

name: Full Suite (CI + Release Gates + E2E)

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  # Include the workflow name so a workflow_call invocation (where github.workflow
  # is the caller's name, e.g. the stable release) does not share a group with a
  # manual workflow_dispatch on the same ref, and the event name so a master push
  # never shares a group with a release verifying that same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Master pushes supersede each other: master is cumulative, so the newest run
  # validates a superset of every run it cancels, and a merge burst gets one
  # honest signal instead of a queue of stale ones. Release/deploy QA runs still
  # queue rather than cancelling — the caller owns any safe supersession rule.
  # (github.event_name resolves to the CALLER's event under workflow_call, and
  # both callers are workflow_dispatch, so a release can never match 'push'.)
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    # Nested reusable workflows cannot elevate permissions past this job's
    # ceiling. Mirror ci.yml's requested token scopes explicitly so callers of
    # full-suite can validate the complete workflow graph at startup.
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    # Release/full-suite path runs the full heavy test matrix. A reusable
    # workflow inherits the caller's originating event, so this must be an
    # explicit input — `github.event_name` is never `workflow_call` downstream.
    with:
      run_heavy_tests: true
    secrets: inherit

  build-verify:
    name: Build & Boot Check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-verify.yml
    # No `secrets: inherit` — build-verify.yml only uses GITHUB_TOKEN (GHCR
    # login), which every called workflow gets automatically. Inheriting the full
    # secret set here would over-scope it (least-privilege).

  e2e:
    name: E2E Suite
    # Deliberately NOT `needs: [ci, build-verify]`. e2e.yml checks out, builds,
    # and starts its own postgres/redis services, so the old dependency bought
    # ordering only — and ordering cost the v0.1.67 release three sequential
    # rounds: each unit-gate fix had to land and go green before anyone could
    # even see the E2E reds waiting behind it. Running both layers together
    # makes one red run report every broken layer at once.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  # Red-run fail-fast: once every gate has completed and at least one failed,
  # nothing downstream can succeed — cancel the whole run so downstream
  # release/deploy jobs cannot consume a failed gate.
  # `needs` waits for ALL listed jobs to finish, so every test shard still
  # reports its result before this fires — no failure visibility is lost. E2E is
  # in that list precisely because it now runs in parallel: cancelling on a unit
  # failure while E2E was still running would re-hide the E2E reds this workflow
  # exists to surface. On green runs `if: failure()` skips this job entirely.
  # Trade-off: the run's overall conclusion becomes "cancelled" instead of
  # "failure"; the failed jobs themselves still show red.
  cancel-doomed-run:
    name: Cancel doomed run
    needs: [ci, build-verify, e2e]
    if: failure()
    # Cancelling a run needs actions:write. A reusable workflow cannot elevate
    # past its caller's job grant, so every caller of full-suite.yml must also
    # grant actions:write on its job (release.yml, docker-publish.yml,
    # release.yml and docker-publish.yml).
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel ${{ github.run_id }} --repo "${GITHUB_REPOSITORY}"
