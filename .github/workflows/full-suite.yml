# Full Suite — THE master validation pipeline, and the caller for release
# verification.
#
# Runs hourly on master, plus on demand: Actions → "Full Suite (CI + Release
# Gates + E2E)" → Run workflow → pick the branch.
#
# Pull requests run the affected tier only. The complete heavy tier (full
# API/app shards, full spec typecheck, workspace tests, build & boot, E2E)
# validates master here. It used to run on every master push with
# cancel-in-progress, but a ~60-minute suite against a merge every ~23 minutes
# meant 51 of 60 runs were cancelled and master saw ~5 verdicts a day
# (2026-09-27 audit). Now it runs on a fixed cadence and is never cancelled, so
# every run finishes and covers everything merged since the previous one. A
# master head that already has a finished run is skipped, so idle hours cost
# one tiny job.
#
# The nested CI Gate carries ci.yml's master failure tracker (#2510), which
# keys off the `schedule` event this workflow passes down.
#
# Reuses existing workflows via workflow_call — no job logic is duplicated here;
# this file only orders the public release-prep gates. Community self-hosted image
# verification lives in build-verify-selfhosted.yml and runs independently.

name: Full Suite (CI + Release Gates + E2E)

on:
  schedule:
    - cron: '23 * * * *' # hourly, off the top-of-hour rush
  workflow_dispatch:
  workflow_call:

concurrency:
  # Include the workflow name so a workflow_call invocation (where github.workflow
  # is the caller's name, e.g. the stable release) does not share a group with a
  # manual workflow_dispatch on the same ref, and the event name so the hourly
  # run never shares a group with a release verifying that same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a running suite: a newer run only replaces the *pending* one,
  # and it validates a superset of what that pending run would have.
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Hourly runs skip a master head that already has a finished (green or red)
  # Full Suite: re-running identical code buys nothing, and a red head keeps
  # its open P0 tracker until a new commit lands. A cancelled run does not
  # count. Manual and release runs always proceed.
  freshness:
    name: Master Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Skip a master head that already has a finished Full Suite
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          finished="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full-suite.yml/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.conclusion == \"success\" or .conclusion == \"failure\")] | length")"
          if [ "${finished}" -gt 0 ]; then
            echo "run=false" >>"${GITHUB_OUTPUT}"
            echo "Master ${HEAD_SHA} already has a finished Full Suite; skipping."
          else
            echo "run=true" >>"${GITHUB_OUTPUT}"
          fi

  ci:
    name: CI Gate
    # Nested reusable workflows cannot elevate permissions past this job's
    # ceiling. Mirror ci.yml's requested token scopes explicitly so callers of
    # full-suite can validate the complete workflow graph at startup.
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    # Release/full-suite path runs the full heavy test matrix. A reusable
    # workflow inherits the caller's originating event, so this must be an
    # explicit input — `github.event_name` is never `workflow_call` downstream.
    with:
      run_heavy_tests: true
    secrets: inherit

  build-verify:
    name: Build & Boot Check
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-verify.yml
    # No `secrets: inherit` — build-verify.yml only uses GITHUB_TOKEN (GHCR
    # login), which every called workflow gets automatically. Inheriting the full
    # secret set here would over-scope it (least-privilege).

  e2e:
    name: E2E Suite
    needs: freshness
    if: needs.freshness.outputs.run == 'true'
    # Deliberately NOT `needs: [ci, build-verify]`. e2e.yml checks out, builds,
    # and starts its own postgres/redis services, so the old dependency bought
    # ordering only — and ordering cost the v0.1.67 release three sequential
    # rounds: each unit-gate fix had to land and go green before anyone could
    # even see the E2E reds waiting behind it. Running both layers together
    # makes one red run report every broken layer at once.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
