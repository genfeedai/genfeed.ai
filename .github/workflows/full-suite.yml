# Full Suite — THE master validation pipeline, and the caller for release
# verification.
#
# Runs on every push to master, plus on demand: Actions → "Full Suite (CI +
# Release Gates + E2E)" → Run workflow → pick the branch.
#
# Pull requests run the affected tier only. The complete heavy tier (full
# API/app shards, full spec typecheck, workspace tests, build & boot, E2E)
# validates master here. It used to cancel the running suite on every merge:
# a ~60-minute suite against a merge every ~23 minutes meant 51 of 60 runs
# were cancelled and master saw ~5 verdicts a day (2026-09-27 audit). Now a
# running suite always finishes; merges that land meanwhile collapse into one
# pending run for the newest head, which validates everything they added. An
# hourly cron was tried instead and dropped: this repository's scheduled
# workflows start hours late.
#
# The nested CI Gate carries ci.yml's master failure tracker (#2510), which
# keys off the `push` event this workflow passes down.
#
# Reuses existing workflows via workflow_call — no job logic is duplicated here;
# this file only orders the public release-prep gates. Community self-hosted image
# verification lives in build-verify-selfhosted.yml and runs independently.

name: Full Suite (CI + Release Gates + E2E)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_runtime_acceptance:
        description: 'Run the final combined-source connected acceptance batch.'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      run_runtime_acceptance:
        description: 'Run the final combined-source connected acceptance batch.'
        type: boolean
        required: false
        default: false

concurrency:
  # Include the workflow name so a workflow_call invocation (where github.workflow
  # is the caller's name, e.g. the stable release) does not share a group with a
  # manual workflow_dispatch on the same ref, and the event name so a master
  # push never shares a group with a release verifying that same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a running suite: a newer push only replaces the *pending*
  # run, and it validates a superset of what that pending run would have.
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    # Nested reusable workflows cannot elevate permissions past this job's
    # ceiling. Mirror ci.yml's requested token scopes explicitly so callers of
    # full-suite can validate the complete workflow graph at startup.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    # Release/full-suite path runs the full heavy test matrix. A reusable
    # workflow inherits the caller's originating event, so this must be an
    # explicit input — `github.event_name` is never `workflow_call` downstream.
    with:
      run_heavy_tests: true
    secrets: inherit

  build-verify:
    name: Build & Boot Check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-verify.yml
    # No `secrets: inherit` — build-verify.yml only uses GITHUB_TOKEN (GHCR
    # login), which every called workflow gets automatically. Inheriting the full
    # secret set here would over-scope it (least-privilege).

  e2e:
    name: E2E Suite
    # Deliberately NOT `needs: [ci, build-verify]`. e2e.yml checks out, builds,
    # and starts its own postgres/redis services, so the old dependency bought
    # ordering only — and ordering cost the v0.1.67 release three sequential
    # rounds: each unit-gate fix had to land and go green before anyone could
    # even see the E2E reds waiting behind it. Running both layers together
    # makes one red run report every broken layer at once.
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/e2e.yml
    with:
      run_runtime_acceptance: ${{ inputs.run_runtime_acceptance == true }}
    secrets: inherit

  visual-connected:
    name: Connected Visual Acceptance
    if: inputs.run_runtime_acceptance == true
    permissions:
      contents: read
    uses: ./.github/workflows/visual-code-isolation.yml
    with:
      run_connected: true

  runtime-acceptance-gate:
    name: Final Connected Acceptance
    if: always() && inputs.run_runtime_acceptance == true
    needs: [ci, build-verify, e2e, visual-connected]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require completed connected receipts and uploads
        env:
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual-connected.result }}
          AGENT_RECEIPT: ${{ needs.e2e.outputs.agent_production_result }}
          BRAND_RECEIPT: ${{ needs.e2e.outputs.brand_acceptance_result }}
          RUNTIME_RECEIPT: ${{ needs.e2e.outputs.runtime_acceptance_result }}
          ISOLATION_RECEIPT: ${{ needs.visual-connected.outputs.isolation_acceptance_result }}
          VISUAL_RECEIPT: ${{ needs.visual-connected.outputs.connected_acceptance_result }}
        run: |
          set -euo pipefail
          test "$CI_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          test "$VISUAL_RESULT" = success
          test "$AGENT_RECEIPT" = passed
          test "$BRAND_RECEIPT" = passed
          test "$RUNTIME_RECEIPT" = passed
          test "$ISOLATION_RECEIPT" = passed
          test "$VISUAL_RECEIPT" = passed
