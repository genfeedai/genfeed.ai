# Link Check
#
# Two complementary guards against dead links and orphan pages, split because no
# single tool covers both surfaces:
#
#   website-links — builds the marketing site, serves the production build, then
#     crawls it with apps/website/scripts/check-orphans.ts. Catches (a) internal
#     links that 3xx-redirect instead of pointing at the canonical URL — the bug
#     class fixed in PR #559 — and (b) orphan pages: URLs in sitemap.xml with no
#     inbound internal link. lychee cannot do either: it does not crawl rendered
#     HTML and, as a Docker action, cannot reach the runner's localhost.
#     The same job then runs check-seo.ts over that build — on-page SEO, structured
#     data, and soft 404s — replacing what a paid site audit would tell us.
#
#   docs-links — lychee scans Markdown/MDX docs + READMEs for dead external and
#     relative-file links. Root-relative app routes are excluded in lychee.toml
#     (the crawler above owns those).
#
# The workspace graph selects website consumers; path filters select docs.

name: Link Check

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TZ: UTC

jobs:
  detect:
    permissions:
      contents: read
    name: Detect Link-Check Scope
    # Draft pull requests run nothing; CI runs once the PR is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      website: ${{ steps.scope.outputs.website }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: scope
        uses: ./.github/actions/detect-link-check-scope

  website-links:
    permissions:
      contents: read
    name: Website Links + Orphans + SEO
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.website == 'true'
    # Existing complete workload: production build, 120s readiness, crawl/orphans and SEO.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/check-website-links

  docs-links:
    permissions:
      contents: read
    name: Docs + Markdown Dead Links
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.docs == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/check-docs-links
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
