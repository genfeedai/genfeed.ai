# Public-repo hosted-SaaS deployment engine (workflow_call only).
#
# Jobs, OpenTofu, and deploy scripts all live in this repository so GitHub
# bills free public minutes. Do not check out console.genfeed.ai.
#
# Flow: resolve server:<sha> in GHCR -> copy GHCR->ECR -> RDS pre-migration
# snapshot -> Prisma migrate task -> parallel API and workers boot-smoke -> OpenTofu apply rolls services (task defs are OpenTofu-managed with
# image digest) -> wait services-stable -> deploy Vercel frontends -> live
# post-deploy smoke.
#
# The caller validates the exact public source commit. This engine must use that
# source SHA for application code/images and never the console repository SHA.
name: Deploy hosted SaaS core (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: "exact public genfeed.ai source commit to deploy"
        required: true
        type: string
      image_tag:
        description: "server image tag to deploy (default: current SHA)"
        required: false
        default: ""
        type: string
      allow_rollback:
        description: "allow deploying an image tag different from current SHA"
        required: false
        default: false
        type: boolean
    secrets:
      VERCEL_TOKEN:
        required: true
      NEXT_PUBLIC_POSTHOG_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      TURBO_TOKEN:
        required: false

concurrency:
  group: hosted-saas-core-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_DIR: infra/tofu/hosted-saas
  DEPLOY_SCRIPTS_DIR: scripts/deploy/hosted-saas
  SERVER_IMAGE_REPOSITORY: ${{ vars.SERVER_IMAGE_REPOSITORY }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}
  RDS_INSTANCE_ID: ${{ vars.RDS_INSTANCE_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  PUBLIC_SUBNET_IDS: ${{ vars.PUBLIC_SUBNET_IDS }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_project: ${{ vars.PROJECT }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_vpc_id: ${{ vars.VPC_ID }}
  TF_VAR_nat_public_subnet_id: ${{ vars.NAT_PUBLIC_SUBNET_ID }}
  TF_VAR_rds_instance_id: ${{ vars.RDS_INSTANCE_ID }}
  TF_VAR_ssm_path: ${{ vars.SSM_PATH }}
  TF_VAR_owner_email: ${{ vars.HOSTED_OWNER_EMAIL }}
  TF_VAR_organization_label: ${{ vars.HOSTED_ORGANIZATION_LABEL }}
  TF_VAR_cdn_bucket: ${{ vars.CDN_BUCKET }}

jobs:
  deploy:
    name: Deploy ECS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image_digest: ${{ steps.copy-image.outputs.image_digest }}
    environment: production
    steps:
      - name: Require hosted SaaS site variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          PROJECT: ${{ vars.PROJECT }}
          DOMAIN: ${{ vars.DOMAIN }}
          VPC_ID: ${{ vars.VPC_ID }}
          NAT_PUBLIC_SUBNET_ID: ${{ vars.NAT_PUBLIC_SUBNET_ID }}
          SSM_PATH: ${{ vars.SSM_PATH }}
          HOSTED_OWNER_EMAIL: ${{ vars.HOSTED_OWNER_EMAIL }}
          HOSTED_ORGANIZATION_LABEL: ${{ vars.HOSTED_ORGANIZATION_LABEL }}
          CDN_BUCKET: ${{ vars.CDN_BUCKET }}
          APP_HOST: ${{ vars.APP_HOST }}
          WEB_HOST: ${{ vars.WEB_HOST }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_APP: ${{ vars.VERCEL_PROJECT_APP }}
          VERCEL_PROJECT_WEB: ${{ vars.VERCEL_PROJECT_WEB }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            AWS_REGION AWS_DEPLOY_ROLE_ARN PROJECT DOMAIN VPC_ID PUBLIC_SUBNET_IDS \
            NAT_PUBLIC_SUBNET_ID RDS_INSTANCE_ID SSM_PATH TF_STATE_BUCKET TF_STATE_KEY \
            SERVER_IMAGE_REPOSITORY ECR_REPOSITORY_NAME HOSTED_OWNER_EMAIL \
            HOSTED_ORGANIZATION_LABEL CDN_BUCKET APP_HOST WEB_HOST \
            VERCEL_ORG_ID VERCEL_PROJECT_APP VERCEL_PROJECT_WEB
          do
            eval "value=\${$name-}"
            if [ -z "${value}" ]; then
              echo "::error::Missing required hosted SaaS variable: ${name}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Set these on the production GitHub environment. There are no genfeed.ai defaults in this workflow."
            exit 1
          fi

      - name: Materialize list variables
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"${GITHUB_ENV}"
          import json
          import os

          ids = [part.strip() for part in os.environ["PUBLIC_SUBNET_IDS"].split(",") if part.strip()]
          if len(ids) < 1:
              raise SystemExit("PUBLIC_SUBNET_IDS must contain at least one subnet id")
          print(f"TF_VAR_public_subnet_ids={json.dumps(ids)}")
          PY

      - name: Checkout public deploy engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ops
          persist-credentials: false

      - name: Checkout exact public application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 50
          path: source
          persist-credentials: false

      # Bun + the one dependency the ECS poll script needs (@aws-sdk/client-ecs).
      # scripts/deploy/hosted-saas is a self-contained package with its own lockfile.
      # It is not a root workspace member, so this installs exactly one dependency tree — the
      # monorepo's heavy postinstall chain (prisma generate, ffmpeg, playwright,
      # …) never runs on the critical deploy path.
      - name: Setup Bun (ECS poll script)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: source/.bun-version

      - name: Install ECS poll script deps (isolated)
        working-directory: ops/scripts/deploy/hosted-saas
        run: bun install --frozen-lockfile

      - name: Resolve image tag
        id: tag
        env:
          # Read the dispatch input via env (never interpolate ${{ inputs }}
          # directly into a run script — that is a template-injection sink).
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
          DEFAULT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_IMAGE_TAG:-}"
          EXPLICIT_TAG=true
          if [ -z "$TAG" ]; then
            TAG="$DEFAULT_SHA"
            EXPLICIT_TAG=false
          fi
          # The tag flows into `docker buildx imagetools` and a terraform -var;
          # restrict it to a conservative image-tag charset so a crafted input
          # cannot inject shell or terraform. (The image must also exist in GHCR,
          # which imagetools enforces downstream.)
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid image_tag '$TAG' (allowed chars: A-Za-z0-9 . _ -)"; exit 1
          fi
          if [ "$EXPLICIT_TAG" = "true" ] && [ "$TAG" != "$DEFAULT_SHA" ] && [ "$ALLOW_ROLLBACK" != "true" ]; then
            echo "::error::Refusing to deploy image tag '$TAG' for source SHA '$DEFAULT_SHA'. Leave image_tag empty, or set allow_rollback=true for an intentional rollback."; exit 1
          fi
          if [ "$TAG" != "$DEFAULT_SHA" ]; then
            echo "::warning::Deploying non-current image tag '$TAG' from workflow SHA '$DEFAULT_SHA'."
          fi
          echo "Deploying server image tag: $TAG"
          echo "sha=$TAG" >> "$GITHUB_OUTPUT"
          echo "explicit=$EXPLICIT_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The hosted SaaS server image (`ghcr.io/genfeedai/genfeed.ai/server`) is
      # a private GHCR package. Authenticate before inspect/create. The public
      # Community image is `ghcr.io/genfeedai/genfeed.ai` — do not treat it as
      # this package, and do not change the server package to public.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Resolve available server image
        id: image
        env:
          EXPLICIT_TAG: ${{ steps.tag.outputs.explicit }}
          HEAD_SHA: ${{ inputs.source_sha }}
          REQUESTED_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          REPO="${SERVER_IMAGE_REPOSITORY}"

          image_exists() {
            # Quiet the manifest dump on stdout. Leave stderr open so a GHCR
            # authentication failure is visible instead of looking like a miss.
            docker buildx imagetools inspect "${REPO}:$1" >/dev/null
          }

          wait_for_image() {
            local tag="$1"
            for i in $(seq 1 20); do
              if image_exists "$tag"; then
                echo "Server image ready: ${tag}"
                return 0
              fi
              if [ "$i" = "20" ]; then
                break
              fi
              echo "Server image ${tag} not ready (attempt ${i}/20); waiting 30s..."
              sleep 30
            done
            return 1
          }

          # Explicit tag (rollback / pinned deploy): it must already exist.
          # Wait in case a build is still in flight, then fail closed.
          if [ "$EXPLICIT_TAG" = "true" ]; then
            if wait_for_image "$REQUESTED_TAG"; then
              echo "sha=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Requested server image ${REQUESTED_TAG} was not found in GHCR after waiting. Build it first or choose an existing image tag."
            exit 1
          fi

          # Deploying current HEAD. Fast path: server:<HEAD> already published —
          # use it immediately with no wait loop.
          if image_exists "$REQUESTED_TAG"; then
            echo "Server image ready: ${REQUESTED_TAG}"
            echo "sha=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No image for HEAD yet. Find the newest first-parent ancestor that has
          # an image, then branch on whether server-image inputs changed since it:
          #   unchanged -> frontend/workflow-only commit. build-server-image is
          #     paths-gated and NEVER builds a server:<HEAD> for it, so waiting
          #     would burn ~10m for an image that will never appear. Reuse the
          #     ancestor's immutable image immediately.
          #   changed   -> a server:<HEAD> build is expected/in-flight; wait for
          #     it (up to ~10m), then fail closed if it never lands.
          echo "No image for HEAD (${HEAD_SHA}); checking recent first-parent ancestors..."
          ANCESTOR=""
          for sha in $(git -C source rev-list --first-parent -n 50 "$HEAD_SHA" | tail -n +2); do
            if image_exists "$sha"; then
              ANCESTOR="$sha"
              break
            fi
          done

          if [ -z "$ANCESTOR" ]; then
            echo "No first-parent ancestor image found; waiting for server:${HEAD_SHA}..."
            if wait_for_image "$REQUESTED_TAG"; then
              echo "sha=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No server image found for HEAD or its recent first-parent ancestors."
            exit 1
          fi

          inputs_changed="$(node ops/scripts/ci/server-image-inputs.mjs --cwd source --base "$ANCESTOR" --head "$HEAD_SHA")"
          if [ "$inputs_changed" = "false" ]; then
            echo "::warning::server:${HEAD_SHA} was not built, but server-image inputs are unchanged since ${ANCESTOR}; deploying ${ANCESTOR} (no wait)."
            echo "sha=$ANCESTOR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Server-image inputs changed since ${ANCESTOR}; waiting for server:${HEAD_SHA} build..."
          if wait_for_image "$REQUESTED_TAG"; then
            echo "sha=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::server:${HEAD_SHA} was not found, and server-image inputs changed after newest available ancestor ${ANCESTOR}. Wait for the Build Server Image workflow for ${HEAD_SHA}, then re-dispatch."
          exit 1

      - name: Copy server:<sha> GHCR -> ECR (no rebuild)
        id: copy-image
        env:
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${IMAGE_SHA}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid image tag '${IMAGE_SHA}' (allowed chars: A-Za-z0-9 . _ -)"
            exit 1
          fi
          ECR="$(aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_NAME}" \
                 --query 'repositories[0].repositoryUri' --output text)"
          digest="$(docker buildx imagetools inspect "${SERVER_IMAGE_REPOSITORY}:${IMAGE_SHA}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          docker buildx imagetools create --prefer-index=false -t "${ECR}:${IMAGE_SHA}" "${SERVER_IMAGE_REPOSITORY}@${digest}"
          copied="$(docker buildx imagetools inspect "${ECR}:${IMAGE_SHA}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "$copied" = "$digest"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_image_digest=$digest" >> "$GITHUB_ENV"

      # OpenTofu, not Terraform — state is tofu in S3; mixing the two risks a
      # state-version mismatch.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.2"
          tofu_wrapper: false

      - name: Tofu init
        working-directory: ops/${{ env.TF_DIR }}
        run: |
          tofu init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Register migration, backfill, and boot-smoke task definitions
        working-directory: ops/${{ env.TF_DIR }}
        env:
          TF_VAR_enable_dns_cutover: "true"
        run: |
          # OpenTofu 1.12 forbids mixing -target and -exclude. Task defs read
          # the live Redis endpoint from a data source, so targeting them does
          # not also apply AUTH. AUTH/TLS stay off until the later Redis apply
          # after services roll with REDIS_PASSWORD.
          tofu apply -input=false -auto-approve \
            -target=aws_cloudwatch_log_group.migrate \
            -target=aws_ecs_task_definition.migrate \
            -target=aws_cloudwatch_log_group.boot_smoke \
            -target=aws_ecs_task_definition.boot_smoke \
            -target=aws_cloudwatch_log_group.worker_boot_smoke \
            -target=aws_ecs_task_definition.worker_boot_smoke \
            -target=aws_cloudwatch_log_group.credential_backfill \
            -target=aws_ecs_task_definition.credential_backfill \
            -target=aws_cloudwatch_log_group.articles_seed \
            -target=aws_ecs_task_definition.articles_seed

      - name: Snapshot RDS before migrations (fail-closed)
        env:
          RDS_INSTANCE_ID: ${{ vars.RDS_INSTANCE_ID }}
          # Read via env, never interpolate ${{ }} into the script body directly.
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
        run: |
          set -euo pipefail
          # Fail closed: never run migrations without a fresh pre-migration snapshot.
          # Mirrors the Vitae GCP db-migrate "Create pre-migration Cloud SQL backup".
          # If create/wait fails, the job stops HERE — before the migrate task can
          # touch the database — so a bad migration is always recoverable.
          # RDS snapshot identifiers allow only letters, digits and single
          # hyphens — but the image tag charset permits '.' and '_' (e.g.
          # release_2026.06.20), which would fail-closed the snapshot and block
          # the deploy. Sanitize for the id; keep the raw tag in git_sha below.
          SAFE_SHA="$(printf '%s' "${IMAGE_SHA}" | tr '._' '-' | tr -s '-' | sed 's/-$//')"
          SNAP_ID="pre-migrate-${SAFE_SHA}-$(date -u +%Y%m%d%H%M%S)"
          echo "Creating pre-migration snapshot ${SNAP_ID} of ${RDS_INSTANCE_ID}..."
          aws rds create-db-snapshot \
            --db-instance-identifier "$RDS_INSTANCE_ID" \
            --db-snapshot-identifier "$SNAP_ID" \
            --tags "Key=purpose,Value=pre-migration" \
                   "Key=git_sha,Value=${IMAGE_SHA}" \
                   "Key=run_id,Value=${GITHUB_RUN_ID}" >/dev/null
          echo "Waiting for snapshot ${SNAP_ID} to become available..."
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP_ID"
          echo "Pre-migration snapshot ready: ${SNAP_ID}"

      - name: Run DB migrations (one-off task, gated before services roll)
        working-directory: ops/${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          CLUSTER=$(tofu output -raw cluster_name)
          TASK_DEFINITION=$(tofu output -raw migrate_task_definition_arn)
          SUBNETS=$(tofu output -json task_subnets | jq -r 'join(",")')
          SG=$(tofu output -raw task_security_group)
          # FARGATE one-off task, wait for STOPPED, gate on exit code 0. The run +
          # native waiter + typed exit-code classification live in the tested
          # private deploy runner (15m window, was 900s here).
          bun "${GITHUB_WORKSPACE}/ops/scripts/deploy/hosted-saas/ecs-run-task-and-wait.ts" \
            --phase migrate \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --subnets "$SUBNETS" \
            --security-groups "$SG" \
            --timeout-seconds 900

      - name: Boot API and workers before services roll
        id: boot-smoke
        working-directory: ops/${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          CLUSTER=$(tofu output -raw cluster_name)
          API_TASK=$(tofu output -raw boot_smoke_task_definition_arn)
          WORKER_TASK=$(tofu output -raw worker_boot_smoke_task_definition_arn)
          SUBNETS=$(tofu output -json task_subnets | jq -r 'join(",")')
          SG=$(tofu output -raw task_security_group)
          runner="${GITHUB_WORKSPACE}/ops/scripts/deploy/hosted-saas/ecs-run-task-and-wait.ts"
          common=(--cluster "$CLUSTER" --subnets "$SUBNETS" --security-groups "$SG" --stop-on-timeout)
          bun "$runner" "${common[@]}" --phase boot-smoke \
            --task-definition "$API_TASK" --timeout-seconds 600 &
          api_pid=$!
          bun "$runner" "${common[@]}" --phase worker-boot-smoke \
            --task-definition "$WORKER_TASK" --timeout-seconds 900 &
          worker_pid=$!
          status=0
          wait "$api_pid" || status=1
          wait "$worker_pid" || status=1
          exit "$status"

      - name: Print boot-smoke logs on failure
        if: ${{ failure() && steps.boot-smoke.outcome == 'failure' }}
        run: |
          for task in boot-smoke worker-boot-smoke; do
            aws logs tail "/ecs/${TF_VAR_project}-production/${task}" \
              --since 30m --format short | tail -n 300 || true
          done

      - name: Tofu apply (roll services to new image)
        working-directory: ops/${{ env.TF_DIR }}
        env:
          TF_VAR_enable_dns_cutover: "true"
        run: |
          # Roll services with REDIS_PASSWORD first. Redis AUTH is applied after
          # this wait-services-stable step so old tasks are not locked out.
          tofu apply -input=false -auto-approve \
            -exclude=aws_elasticache_replication_group.redis

      - name: Wait for services stable
        id: wait-services
        working-directory: ops/${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          CLUSTER=$(tofu output -raw cluster_name)
          SERVICES=$(tofu output -json service_names | jq -r 'join(",")')
          bun "${GITHUB_WORKSPACE}/ops/scripts/deploy/hosted-saas/ecs-wait-services-stable.ts" \
            --cluster "$CLUSTER" \
            --services "$SERVICES" \
            --timeout-seconds 1200 \
            --poll-seconds 15

      - name: Require Redis TLS and AUTH
        working-directory: ops/${{ env.TF_DIR }}
        env:
          TF_VAR_enable_dns_cutover: "true"
        run: |
          set -euo pipefail
          # Tasks now present REDIS_PASSWORD. Tighten transport to required TLS
          # and set the AUTH token so unauthenticated clients are rejected.
          # AWS rejects SET when the cluster has never had a token: ROTATE the
          # first token in, then SET to drop the empty predecessor.
          RG_ID="${TF_VAR_project}-production-redis"
          AUTH_ENABLED="$(aws elasticache describe-replication-groups \
            --replication-group-id "${RG_ID}" \
            --query 'ReplicationGroups[0].AuthTokenEnabled' \
            --output text)"
          case "${AUTH_ENABLED}" in
            True|true) ;;
            *)
              echo "Redis AUTH is not enabled yet; rotating in the first token."
              TF_VAR_redis_auth_token_update_strategy=ROTATE \
                tofu apply -input=false -auto-approve \
                  -target=aws_elasticache_replication_group.redis
              ;;
          esac
          tofu apply -input=false -auto-approve \
            -target=aws_elasticache_replication_group.redis

      - name: Print active service logs on rollout failure
        if: ${{ failure() && steps.wait-services.outcome == 'failure' }}
        working-directory: ops/${{ env.TF_DIR }}
        run: |
          set -u
          CLUSTER=$(tofu output -raw cluster_name)
          for svc in $(tofu output -json service_names | jq -r '.[]'); do
            desired=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query 'services[0].desiredCount' --output text 2>/dev/null || echo 0)
            [ "$desired" = "0" ] && continue
            echo "::group::Recent CloudWatch logs — $svc"
            aws logs tail "/ecs/${TF_VAR_project}-production/$svc" \
              --since 30m --format short | tail -n 160 || true
            echo "::endgroup::"
          done

      - name: Run credential-encryption backfill (post-rollout, gated after services stable)
        # BLOCKING: encrypts legacy plaintext credential secrets at rest via the compiled
        # `migrate:credentials` target (dist/apps/api-credential-backfill/main), which now
        # ships in the production image. A real failure here
        # (missing TOKEN_ENCRYPTION_KEY, crypto error, DB error) SHOULD fail the deploy:
        # the encrypt-on-write boundary already protects NEW writes, but a silently-failing
        # backfill would leave legacy secrets plaintext at rest indefinitely.
        # ORDERING: runs AFTER services are stable — only the new app code can read the
        # ciphertext it writes. Idempotent: rows already in ciphertext are skipped.
        working-directory: ops/${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          CLUSTER=$(tofu output -raw cluster_name)
          TASK_DEFINITION=$(tofu output -raw credential_backfill_task_definition_arn)
          SUBNETS=$(tofu output -json task_subnets | jq -r 'join(",")')
          SG=$(tofu output -raw task_security_group)
          # 20m window (was 1200s here). --stop-on-timeout reclaims the task on
          # timeout, matching the old inline loop.
          bun "${GITHUB_WORKSPACE}/ops/scripts/deploy/hosted-saas/ecs-run-task-and-wait.ts" \
            --phase credential-backfill \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --subnets "$SUBNETS" \
            --security-groups "$SG" \
            --timeout-seconds 1200 \
            --stop-on-timeout

  deploy-vercel-frontends:
    name: Deploy Vercel frontends
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy-hosted-saas-vercel.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  post-deploy-smoke:
    name: Post-deploy smoke
    # Smoke the live API surface whenever the ECS deploy succeeded. A Vercel
    # frontend failure must not SKIP this job (default needs-failure behavior),
    # otherwise an API regression ships unverified when a frontend deploy flakes.
    needs: [deploy, deploy-vercel-frontends]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # Ceiling for the configured URL set. Per URL: (SMOKE_RETRY+1) attempts *
    # SMOKE_MAX_TIME plus SMOKE_RETRY * SMOKE_RETRY_DELAY. Five required URLs
    # worst-case ~17m; six with docs ~20m. Keep this above the printed budget.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Smoke live production endpoints
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          APP_HOST: ${{ vars.APP_HOST }}
          WEB_HOST: ${{ vars.WEB_HOST }}
          DOCS_HOST: ${{ vars.DOCS_HOST }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SMOKE_RETRY: "6"
          SMOKE_RETRY_DELAY: "10"
          SMOKE_MAX_TIME: "20"
          SMOKE_CONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/post-deploy-smoke"

          if ! printf '%s' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Invalid source SHA (expected exact lowercase 40-character commit)"
            exit 1
          fi

          smoke_url() {
            local name="$1"
            local url="$2"
            local expected="${3:-}"
            local body="${RUNNER_TEMP}/post-deploy-smoke/${name}.body"

            echo "Checking ${name}: ${url}"
            curl --fail --show-error --silent --location \
              --retry "${SMOKE_RETRY}" --retry-delay "${SMOKE_RETRY_DELAY}" --retry-all-errors \
              --connect-timeout "${SMOKE_CONNECT_TIMEOUT}" --max-time "${SMOKE_MAX_TIME}" \
              --output "${body}" \
              "${url}"

            if [ -n "${expected}" ] && ! grep -Fq "${expected}" "${body}"; then
              echo "::error::${name} response did not include expected marker: ${expected}"
              echo "Response tail:"
              tail -c 1200 "${body}" || true
              exit 1
            fi

            {
              echo "- ${name}: ${url}"
            } >> "${RUNNER_TEMP}/post-deploy-smoke/summary.md"
          }

          smoke_specs=(
            "api-ready|https://api.${DOMAIN}/v1/health/ready|\"status\":\"ready\""
            "mcp-health|https://mcp.${DOMAIN}/v1/health|\"status\":\"ok\""
            "notifications-health|https://notifications.${DOMAIN}/v1/health|\"status\":\"ok\""
            "app-login|https://${APP_HOST}/login|"
            "app-auth-proxy|https://${APP_HOST}/v1/auth/get-session|null"
            "website-home|https://${WEB_HOST}|"
          )
          if [ -n "${DOCS_HOST}" ]; then
            smoke_specs+=("docs-home|https://${DOCS_HOST}|")
          fi

          url_count="${#smoke_specs[@]}"
          attempts=$((SMOKE_RETRY + 1))
          per_url_seconds=$((attempts * SMOKE_MAX_TIME + SMOKE_RETRY * SMOKE_RETRY_DELAY))
          budget_seconds=$((url_count * per_url_seconds))
          echo "Smoke retry budget covers ${url_count} URL(s) at ${per_url_seconds}s each (${budget_seconds}s sequential worst case)."

          for spec in "${smoke_specs[@]}"; do
            IFS='|' read -r name url expected <<< "${spec}"
            smoke_url "${name}" "${url}" "${expected}"
          done

          {
            echo "## Post-deploy smoke"
            echo ""
            cat "${RUNNER_TEMP}/post-deploy-smoke/summary.md"
            echo ""
            echo "Public source SHA: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report-post-deploy-smoke-failure:
    name: Report post-deploy smoke failure
    needs: post-deploy-smoke
    if: always() && needs.post-deploy-smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA || '';
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error('Invalid source SHA (expected exact lowercase 40-character commit)');
            }
            const label = 'post-deploy-smoke';
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Post-deploy smoke failed - ${date}`;
            const body = [
              `**Post-deploy production smoke failed** on \`${date}\`.`,
              ``,
              `- Failed run: ${runUrl}`,
              `- Public source SHA: \`${sourceSha}\``,
              ``,
              `See the smoke job log on the failed run for the checked hosts.`,
              ``,
              `This means the production deploy completed but the live public surface did not pass smoke verification.`,
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'Production post-deploy smoke failures',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
              core.info(`Commented on existing post-deploy smoke issue #${number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.info(`Created post-deploy smoke issue #${created.data.number}`);


  promote-server-image:
    name: Promote verified server image
    needs: [deploy, deploy-vercel-frontends, post-deploy-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - env:
          IMAGE: ${{ vars.SERVER_IMAGE_REPOSITORY }}
          DIGEST: ${{ needs.deploy.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --prefer-index=false -t "${IMAGE}:production" -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
