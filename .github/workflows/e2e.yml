name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      run_api_full:
        description: 'Run the discovery-based full API E2E tier.'
        type: boolean
        required: false
        default: true
  # Allow the suite to be run as a reusable workflow (e.g. by full-suite.yml,
  # which runs it after the CI gate passes). Secrets are inherited from caller.
  workflow_call:
    inputs:
      run_api_full:
        description: 'Run the full API E2E tier in addition to the release-stable core tier.'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 2 * * *" # Nightly 02:17 UTC

# Include the workflow name in the group so a full-suite.yml workflow_call on the
# same ref does not cancel the weekly cron run of this workflow (and vice versa).
# The `e2e-` prefix is REQUIRED — same reason as ci.yml. `github.workflow`
# resolves to the top-level workflow name inside a `workflow_call`, so without a
# distinct prefix this group collides with the caller (full-suite.yml → the
# production deploy) that uses the same `${{ github.workflow }}-${{ github.ref }}`
# shape. On the deploy path E2E runs UNDER full-suite; both computed the same
# group with cancel-in-progress, so the nested E2E cancelled itself at startup
# (0 jobs) and failed the deploy. The prefix keeps E2E dedup while never matching
# a caller group.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Static route-coverage gate — fast, deterministic, no app build required.
  # Fails if dedicated route coverage drops below threshold (default 80%).
  e2e-route-coverage:
    name: E2E Route Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Check route coverage
        run: node scripts/e2e-route-coverage.mjs

  # API E2E core tier — stable release/deploy smoke gate for the real API test
  # graph. Keep this bounded until the full tier has demonstrated reliability.
  # The #702 blockers are resolved in-source: E2ETestModule provides the
  # files client mock, API E2E resolves the OSS billing provider alias, and the
  # payment integration spec uses the canonical subscription DI token.
  e2e-api:
    name: API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      # Mock all external service keys
      REPLICATE_API_TOKEN: test-mock-key
      STRIPE_SECRET_KEY: test-mock-key
      BETTER_AUTH_SECRET: test-better-auth-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      # Provision the schema on the ephemeral Postgres service container.
      # The E2E suite assumes a migrated DB (it truncates + reseeds per test,
      # it does not create the schema itself).
      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Run API E2E core tier
        run: bun run --cwd apps/server/api test:e2e:core
        env:
          NODE_ENV: test

      - name: Upload API E2E core report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-core-report
          path: apps/server/api/test-results/api-e2e/
          retention-days: 7

  # API E2E full tier — discovery-based coverage for every compatible API E2E
  # and integration spec. It runs on manual/nightly workflows, never inside the
  # production workflow_call path, so release deploys remain gated by core.
  e2e-api-full:
    name: API E2E Full
    if: github.event_name == 'schedule' || inputs.run_api_full == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      REPLICATE_API_TOKEN: test-mock-key
      STRIPE_SECRET_KEY: test-mock-key
      BETTER_AUTH_SECRET: test-better-auth-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Run API E2E full tier
        run: bun run --cwd apps/server/api test:e2e:full

      - name: Upload API E2E full report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-full-report
          path: apps/server/api/test-results/api-e2e/
          retention-days: 7

  # Isolated-DB publish lane — mint, enqueue, fake publish, fail-closed.
  # Nightly + workflow_dispatch only. Never attached to mocked Playwright core
  # or the production workflow_call path (#3836).
  e2e-isolated-publish:
    name: Isolated Publish E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      REPLICATE_API_TOKEN: test-mock-key
      STRIPE_SECRET_KEY: test-mock-key
      BETTER_AUTH_SECRET: test-better-auth-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Run isolated publish suite
        run: bun run --cwd apps/server/api test:e2e:isolated-publish

      - name: Upload isolated publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-isolated-publish-report
          path: apps/server/api/test-results/api-e2e/
          retention-days: 7

  # Frontend Core E2E — sharded 4-way. The CI "core" scope is only ~8 spec files
  # (smoke/ + core/ + the agent journey + two focused contracts; see
  # scripts/e2e-sharded.mjs), whose
  # actual test time is ~1 min. 12 shards spun up 12 VMs — 12 installs, 12 app
  # builds, 12 independent flake dice — for that ~1 min of work, and each job
  # rolls the ffmpeg/browser/timing dice that, via cancel-doomed-run, can cancel
  # the whole deploy. 4 shards (~2 files each) is the right balance: ~2 min more
  # test wall on a gate whose CI stage already takes 20+ min, minus 8 flake
  # sources from the deploy AND-gate. Each shard is independent (fail-fast:false),
  # so "Re-run failed jobs" carries the green shards forward unchanged.
  e2e-frontend:
    name: Frontend E2E (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          cache-playwright: "true"

      - name: Build app
        run: bunx turbo run build --filter=@genfeedai/app
        env:
          # Build the app in Playwright test mode. This NEXT_PUBLIC_* flag is
          # inlined at build time and is the master switch for the proxy.ts auth
          # bypass (middleware can't read a plain server env at request time on
          # edge) and disables live sockets (use-socket-manager).
          NEXT_PUBLIC_PLAYWRIGHT_TEST: "true"
          # The mocked core suite exercises the clean Community routes below
          # (for example /studio/clips). Explicitly pin that deployment mode so
          # the hosted mock API endpoint cannot make getDeployment() select the
          # SaaS shell and remove Community-only rewrites at build time.
          NEXT_PUBLIC_GENFEED_CLOUD: "false"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}
          # Correct var name (app reads NEXT_PUBLIC_API_ENDPOINT, not _API_URL).
          # NEXT_PUBLIC_* is inlined at build time. Point at the prod host the
          # api-interceptor mocks; localhost:3010 is NOT intercepted.
          NEXT_PUBLIC_API_ENDPOINT: https://api.genfeed.ai/v1
          # Browser source maps (next.config gates on this): the network guard
          # symbolicates uncaught page errors so a production-build crash names
          # its real source file instead of a minified chunk position.
          E2E_COVERAGE: "1"

      - name: Run core E2E shard ${{ matrix.shard }}/4
        # --reporter=blob (passed inline, overriding the config reporter) so the
        # merge job can stitch all shards into one HTML report. The helper keeps
        # local and CI sharding behavior identical.
        run: bun run test:e2e:sharded -- --reporter=blob
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          E2E_EXPECT_TIMEOUT_MS: "15000"
          # Retry policy is split by trigger, and E2E_RETRIES is now the SINGLE
          # source of truth (playwright.config.ts reads it directly;
          # scripts/e2e-sharded.mjs no longer injects a competing --retries=0).
          #  - deploy/dispatch/full-suite path → 2: this suite gates the whole
          #    production release via cancel-doomed-run, so one browser/timing
          #    flake would otherwise cancel the deploy. Playwright only retries on
          #    failure, so green shards pay zero cost.
          #  - nightly cron (schedule) → 0: retries there would mask flake and
          #    silence the alarm the nightly exists to raise. Keep it honest.
          # Written as `!= 'schedule' && '2' || '0'` on purpose: GitHub Actions
          # coerces the string '0' to falsy, so a `== 'schedule' && '0' || '2'`
          # form would wrongly yield 2 for the nightly. Keeping '0' in the `||`
          # fallback position (never the `&&` result) sidesteps that coercion.
          E2E_RETRIES: ${{ github.event_name != 'schedule' && '2' || '0' }}
          E2E_SHARD_INDEX: ${{ matrix.shard }}
          E2E_TOTAL_SHARDS: "4"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Upload blob report (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Always upload so the merge job has every shard, even failed ones.
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Merge the per-shard blob reports into a single browsable HTML report.
  e2e-merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e-frontend]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          cache-turbo: "false"

      - name: Download all blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports/

      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter=html,github ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 7

  # Gate aggregator — the single job that represents the E2E suite's pass/fail.
  # Fails if route coverage fails OR any frontend shard failed OR was cancelled
  # (a cancelled shard means it hung/timed out — surface it, never silently pass).
  e2e-gate:
    name: E2E Gate (all shards)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-route-coverage, e2e-frontend, e2e-api]
    if: always()
    steps:
      - name: Check shard results
        run: |
          echo "Route coverage: ${{ needs.e2e-route-coverage.result }}"
          echo "Frontend matrix: ${{ needs.e2e-frontend.result }}"
          echo "API E2E: ${{ needs.e2e-api.result }}"
          if [[ "${{ needs.e2e-route-coverage.result }}" == "failure" ]]; then
            echo "Route coverage gate failed" && exit 1
          fi
          if [[ "${{ needs.e2e-frontend.result }}" == "failure" || \
                "${{ needs.e2e-frontend.result }}" == "cancelled" ]]; then
            echo "One or more E2E shards failed or were cancelled" && exit 1
          fi
          if [[ "${{ needs.e2e-api.result }}" == "failure" || \
                "${{ needs.e2e-api.result }}" == "cancelled" ]]; then
            echo "API E2E boot gate failed or was cancelled" && exit 1
          fi
          echo "All required E2E checks passed."

  # Hermetic real-Better Auth authenticated smoke (Playwright `app-authed`
  # project). Exercises the GENUINE authMiddleware path — no proxy.ts bypass —
  # against a fully job-local stack: Postgres + Redis service containers,
  # migrated schema, and the real compiled API on :3010. auth.setup.ts mints a
  # fresh session per run (sign-up → onboarding completion), so the job needs
  # NO repo secrets and never touches production (#1448 — the previous design
  # validated sessions against api.genfeed.ai with a static prod token).
  # Gated behind the E2E_AUTHED_ENABLED repo variable. GATING on the nightly
  # cron — a real regression turns the nightly red and trips
  # nightly-failure-report below, instead of rotting unseen behind
  # continue-on-error (it sat red for 5+ June nightlies that way). On the
  # deploy path it stays non-gating so a flake can never cancel a production
  # release: continue-on-error is true for every event EXCEPT the scheduled
  # nightly.
  e2e-frontend-authed:
    name: Frontend Authed E2E (real Better Auth)
    if: ${{ vars.E2E_AUTHED_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ github.event_name != 'schedule' }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      # Synthetic signing secret — the whole auth stack is job-local, so this
      # is deliberately a literal, not a credential.
      BETTER_AUTH_SECRET: e2e-hermetic-better-auth-secret
      E2E_API_ENDPOINT: http://localhost:3010/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"
          cache-playwright: "true"

      - name: Build app (real Better Auth client, bypass OFF)
        run: bunx turbo run build --filter=@genfeedai/app
        env:
          # CRUCIAL: build with the bypass flag OFF so the app uses the real
          # Better Auth browser session path. NEXT_PUBLIC_* is inlined at build
          # time, so this MUST be set here — not just at runtime.
          NEXT_PUBLIC_PLAYWRIGHT_TEST: "false"
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: "true"
          # Point the app (client + proxy.ts) at the job-local API.
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:3010/v1

      - name: Build API (compiled bundle)
        # The api package emits to apps/server/dist, OUTSIDE apps/server/api,
        # so turbo's package-relative `dist/**` outputs never capture it and a
        # cache-hit replay restores nothing. Force a real build — same reason
        # as build-verify.yml's boot gate.
        run: bunx turbo run build --filter=@genfeedai/api --force

      # Provision the schema on the ephemeral Postgres service container —
      # same pattern as e2e-api above.
      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Start API (hermetic backend on :3010)
        # Boot the compiled webpack bundle directly (same invocation
        # build-verify.yml's boot gate uses). The api package's start:prod
        # preloads tsconfig-paths/register, which is not a declared dependency
        # anywhere in the workspace — path aliases are compiled into the bundle.
        run: |
          set -euo pipefail
          (node apps/server/dist/apps/api/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3010/v1/health >/dev/null 2>&1; then
              echo "API healthy after ~$((attempt * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy within 120s"
          tail -n 200 "$RUNNER_TEMP/api.log"
          exit 1
        env:
          NODE_ENV: test
          PORT: "3010"
          # Mock external provider keys — the spec's network guard blocks any
          # real external call regardless.
          REPLICATE_API_TOKEN: test-mock-key
          STRIPE_SECRET_KEY: test-mock-key

      - name: Run authed E2E (Better Auth setup + app-authed)
        run: bun run test:e2e:authed
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_PLAYWRIGHT_TEST: "false"
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: "true"
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:3010/v1
          # Unlocks the better-auth-setup + app-authed projects in
          # playwright.config.ts, which gate on process.env.E2E_AUTHED_ENABLED.
          # The job-level `if` checks the GitHub repo var; this plumbs the value
          # into the runner process so --project=app-authed actually resolves.
          E2E_AUTHED_ENABLED: "1"

      - name: Upload API log (on failure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: api-log-authed
          path: ${{ runner.temp }}/api.log
          retention-days: 7

      - name: Upload authed Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-authed
          path: playwright/artifacts/report/
          retention-days: 7

      - name: Upload authed traces (on failure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces-authed
          path: playwright/artifacts/results/
          retention-days: 7

  # Nightly-only failure reporter. Each failed job becomes one stable fingerprint;
  # repeated runs update its canonical bounded tracker, while the sibling recovery
  # job closes it only after three consecutive scheduled greens. Reporter failures
  # stay visible on their own step without replacing the source job result.
  # Runs ONLY on the standalone cron: a workflow_call from the deploy path inherits
  # the caller's event, so github.event_name is 'schedule' solely for the nightly.
  # Deploy gating is untouched. Keys off the aggregated gate AND the two
  # nightly-only jobs — the authed job and the API full tier — so any red
  # nightly surfaces exactly one issue. The full tier is deliberately absent
  # from e2e-gate (that gate is the deploy contract and must stay core-only),
  # so watching the gate alone let a red "API E2E Full" report nothing: on
  # 2026-08-01 the full tier failed and this job was skipped.
  nightly-failure-report:
    name: Report nightly E2E failure
    needs: [e2e-gate, e2e-frontend-authed, e2e-api-full, e2e-isolated-publish]
    # `!cancelled()` rather than `always()`: both keep the reporter eligible when
    # an upstream job goes red, but `always()` also fires when the whole run is
    # cancelled — which marks every job 'cancelled' and would file a phantom
    # failure issue. A job-level timeout does not cancel the run, so the
    # e2e-api-full 'cancelled' arm below still catches a hung full tier.
    if: >-
      !cancelled()
      && github.event_name == 'schedule'
      && (needs.e2e-gate.result == 'failure'
        || needs.e2e-frontend-authed.result == 'failure'
        || needs.e2e-api-full.result == 'failure'
        || needs.e2e-api-full.result == 'cancelled'
        || needs.e2e-isolated-publish.result == 'failure'
        || needs.e2e-isolated-publish.result == 'cancelled')
    # Serialize the complete label lookup + issue lookup/mutation path across
    # scheduled runs and rerun attempts. Keep all pending reporters queued.
    concurrency:
      group: nightly-e2e-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update bounded nightly-failure trackers
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GATE_RESULT: ${{ needs.e2e-gate.result }}
          AUTHED_RESULT: ${{ needs.e2e-frontend-authed.result }}
          API_FULL_RESULT: ${{ needs.e2e-api-full.result }}
          ISOLATED_PUBLISH_RESULT: ${{ needs.e2e-isolated-publish.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { reportNightlyE2eFailure } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/nightly-e2e-failure-reporter.mjs',
                ),
              ).href,
            );
            const failures = [];
            if (process.env.GATE_RESULT === 'failure') {
              failures.push({
                failedJob: 'e2e-gate',
                excerpt: 'Test suite failed: core E2E gate (route coverage, frontend shards, or API E2E).',
              });
            }
            if (process.env.AUTHED_RESULT === 'failure') {
              failures.push({
                failedJob: 'e2e-frontend-authed',
                excerpt: 'Test suite failed: authenticated E2E with real Better Auth.',
              });
            }
            if (process.env.API_FULL_RESULT === 'failure') {
              failures.push({
                failedJob: 'e2e-api-full',
                excerpt: 'Test suite failed: API E2E full tier.',
              });
            }
            if (process.env.API_FULL_RESULT === 'cancelled') {
              failures.push({
                failedJob: 'e2e-api-full',
                excerpt: 'Timed out: API E2E full tier was cancelled after hanging or exceeding its job limit.',
              });
            }
            if (process.env.ISOLATED_PUBLISH_RESULT === 'failure') {
              failures.push({
                failedJob: 'e2e-isolated-publish',
                excerpt: 'Test suite failed: isolated-DB publish path.',
              });
            }
            if (process.env.ISOLATED_PUBLISH_RESULT === 'cancelled') {
              failures.push({
                failedJob: 'e2e-isolated-publish',
                excerpt: 'Timed out: isolated-DB publish path was cancelled after hanging or exceeding its job limit.',
              });
            }
            const { owner, repo } = context.repo;
            await reportNightlyE2eFailure({
              github,
              owner,
              repo,
              failures,
              sha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runAttempt: Number(process.env.RUN_ATTEMPT),
              runUrl: process.env.RUN_URL,
              core,
            });

  nightly-recovery-report:
    name: Record nightly E2E recovery
    needs: [e2e-gate, e2e-frontend-authed, e2e-api-full, e2e-isolated-publish]
    if: >-
      !cancelled()
      && github.event_name == 'schedule'
      && needs.e2e-gate.result == 'success'
      && (needs.e2e-frontend-authed.result == 'success'
        || needs.e2e-frontend-authed.result == 'skipped')
      && needs.e2e-api-full.result == 'success'
      && needs.e2e-isolated-publish.result == 'success'
    concurrency:
      group: nightly-e2e-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record one consecutive scheduled green
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.CONSOLE_DEPLOY_TOKEN }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { resolveNightlyE2eFailures } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/nightly-e2e-failure-reporter.mjs',
                ),
              ).href,
            );
            const { owner, repo } = context.repo;
            await resolveNightlyE2eFailures({
              github,
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runUrl: process.env.RUN_URL,
              core,
            });
