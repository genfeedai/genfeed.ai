name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      acceptance_diagnostic:
        description: 'Diagnostic only: run one encrypted acceptance group; does not establish full-suite or release readiness.'
        type: choice
        required: false
        default: none
        options: [none, final, brand-acceptance]
      run_api_full:
        description: 'Run the discovery-based full API E2E tier.'
        type: boolean
        required: false
        default: true
  # Allow the suite to be run as a reusable workflow (e.g. by full-suite.yml,
  # which runs it after the CI gate passes). Secrets are inherited from caller.
  workflow_call:
    inputs:
      run_api_full:
        description: 'Run the full API E2E tier in addition to the release-stable core tier.'
        type: boolean
        required: false
        default: false
      run_runtime_acceptance:
        description: 'Run the final combined-source serial runtime acceptance.'
        type: boolean
        required: false
        default: false
    outputs:
      agent_production_result:
        description: 'Passed only after the dedicated production receipt and encrypted upload.'
        value: ${{ jobs.agent-production-acceptance.outputs.result }}
      brand_acceptance_result:
        description: 'Passed only after the dedicated BRAND receipt and encrypted upload.'
        value: ${{ jobs.brand-acceptance.outputs.result }}
      runtime_acceptance_result:
        description: 'Passed only after the checked private receipt and encrypted upload.'
        value: ${{ jobs.runtime-acceptance.outputs.result }}
  schedule:
    - cron: "17 2 * * *" # Nightly 02:17 UTC

# Include the workflow name in the group so a full-suite.yml workflow_call on the
# same ref does not cancel the weekly cron run of this workflow (and vice versa).
# The `e2e-` prefix is REQUIRED — same reason as ci.yml. `github.workflow`
# resolves to the top-level workflow name inside a `workflow_call`, so without a
# distinct prefix this group collides with the caller (full-suite.yml → the
# production deploy) that uses the same `${{ github.workflow }}-${{ github.ref }}`
# shape. On the deploy path E2E runs UNDER full-suite; both computed the same
# group with cancel-in-progress, so the nested E2E cancelled itself at startup
# (0 jobs) and failed the deploy. The prefix keeps E2E dedup while never matching
# a caller group.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && inputs.acceptance_diagnostic || 'none' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Static source-reference inventory. Browser/API execution owns QA pass/fail.
  # This job validates inventory generation, not a route-coverage percentage.
  e2e-route-coverage:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) }}
    name: E2E Route Reference Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Report route references
        run: node scripts/e2e-route-coverage.mjs

  # API E2E core tier — stable release/deploy smoke gate for the real API test
  # graph. Keep this bounded until the full tier has demonstrated reliability.
  # The #702 blockers are resolved in-source: E2ETestModule provides the
  # files client mock, API E2E resolves the OSS billing provider alias, and the
  # payment integration spec uses the canonical subscription DI token.
  e2e-api:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) }}
    name: API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      # Mock all external service keys
      REPLICATE_API_TOKEN: test-mock-key
      STRIPE_SECRET_KEY: test-mock-key
      BETTER_AUTH_SECRET: test-better-auth-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      # Provision the schema on the ephemeral Postgres service container.
      # The E2E suite assumes a migrated DB (it truncates + reseeds per test,
      # it does not create the schema itself).
      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Run API E2E core tier
        run: bun run --cwd apps/server/api test:e2e:core
        env:
          NODE_ENV: test

      - name: Upload API E2E core report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-core-report
          path: apps/server/api/test-results/api-e2e/
          retention-days: 7

  # API E2E full tier — discovery-based coverage for every compatible API E2E
  # and integration spec. It runs on manual/nightly workflows, never inside the
  # production workflow_call path, so release deploys remain gated by core.
  e2e-api-full:
    name: API E2E Full
    outputs:
      partition: ${{ steps.partition.outputs.partition }}
      partition_mode: ${{ steps.partition.outputs.mode }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && ((github.event_name == 'schedule' && github.workflow == 'E2E Tests') || inputs.run_api_full == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUNTIME_ACCEPTANCE_PARTITION_MODE: ${{ inputs.run_runtime_acceptance == true && 'final' || 'shared' }}
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      REPLICATE_API_TOKEN: test-mock-key
      STRIPE_SECRET_KEY: test-mock-key
      BETTER_AUTH_SECRET: test-better-auth-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      # The skill package import concurrency spec migrates its own empty
      # database and refuses the shared test database.
      - name: Create disposable skill package import database
        env:
          PGPASSWORD: genfeed_local
        run: psql -h localhost -U genfeed -d test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE genfeed_skill_package_import_test'

      - name: Run API E2E full tier
        env:
          SKILL_PACKAGE_IMPORT_TEST_DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/genfeed_skill_package_import_test
        run: |
          set -euo pipefail
          excluded=(
            --exclude test/integration/proactive-agent-production-turn.integration.spec.ts
            --exclude test/integration/branded-generation/branded-generation-receipts.integration.spec.ts
          )
          if [ "$RUNTIME_ACCEPTANCE_PARTITION_MODE" = final ]; then
            excluded+=(
              --exclude test/integration/content-learning/content-learning-runtime.integration.spec.ts
              --exclude test/integration/content-learning/content-learning-publication-races.integration.spec.ts
            )
          else
            test "$RUNTIME_ACCEPTANCE_PARTITION_MODE" = shared
          fi
          env -u PROACTIVE_AGENT_PRODUCTION_TURN_EXCLUSIVE_DB -u BRANDED_GENERATION_TEST_DATABASE_URL bun run --cwd apps/server/api test:e2e:full "${excluded[@]}"

      - name: Check exact shared full partition
        id: partition
        run: |
          node --input-type=module -e 'import { verifySharedApiFullPartition } from "./scripts/ci/runtime-acceptance.mjs"; await verifySharedApiFullPartition(process.cwd(), process.env.RUNTIME_ACCEPTANCE_PARTITION_MODE);'
          echo 'partition=passed' >> "$GITHUB_OUTPUT"
          echo "mode=$RUNTIME_ACCEPTANCE_PARTITION_MODE" >> "$GITHUB_OUTPUT"

      - name: Upload API E2E full report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-full-report
          path: apps/server/api/test-results/api-e2e/
          retention-days: 7

  # Isolated-DB publish lane — mint, enqueue, fake publish, fail-closed.
  # Nightly + workflow_dispatch only. Never attached to mocked Playwright core
  # or the production workflow_call path (#3836).
  e2e-isolated-publish:
    name: Isolated Publish E2E
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && ((github.event_name == 'schedule' && github.workflow == 'E2E Tests') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      REPLICATE_API_TOKEN: test-mock-key
      STRIPE_SECRET_KEY: test-mock-key
      BETTER_AUTH_SECRET: test-better-auth-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"

      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Run isolated publish suite
        run: bun run --cwd apps/server/api test:e2e:isolated-publish

      - name: Upload isolated publish report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-isolated-publish-report
          path: apps/server/api/test-results/api-e2e/
          retention-days: 7

  # Frontend Core E2E — sharded 4-way. The CI "core" scope is only ~7 spec files
  # (smoke/ + core/ + one shell contract; see scripts/e2e-sharded.mjs), whose
  # actual test time is ~1 min. 12 shards spun up 12 VMs — 12 installs, 12 app
  # builds, 12 independent flake dice — for that ~1 min of work, and each job
  # rolls the ffmpeg/browser/timing dice that, via cancel-doomed-run, can cancel
  # the whole deploy. 4 shards (~2 files each) is the right balance: ~2 min more
  # test wall on a gate whose CI stage already takes 20+ min, minus 8 flake
  # sources from the deploy AND-gate. Each shard is independent (fail-fast:false),
  # so "Re-run failed jobs" carries the green shards forward unchanged.
  e2e-frontend:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) }}
    name: Frontend E2E (Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build app for Playwright
        uses: ./.github/actions/setup-playwright-app
        with:
          better-auth-secret: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          better-auth-enabled: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Run core E2E shard ${{ matrix.shard }}/4
        # --reporter=blob (passed inline, overriding the config reporter) so the
        # merge job can stitch all shards into one HTML report. The helper keeps
        # local and CI sharding behavior identical.
        run: bun run test:e2e:sharded -- --reporter=blob
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          E2E_EXPECT_TIMEOUT_MS: "15000"
          # Retry policy is split by trigger, and E2E_RETRIES is now the SINGLE
          # source of truth (playwright.config.ts reads it directly;
          # scripts/e2e-sharded.mjs no longer injects a competing --retries=0).
          #  - deploy/dispatch/full-suite path → 2: this suite gates the whole
          #    production release via cancel-doomed-run, so one browser/timing
          #    flake would otherwise cancel the deploy. Playwright only retries on
          #    failure, so green shards pay zero cost.
          #  - nightly cron (schedule) → 0: retries there would mask flake and
          #    silence the alarm the nightly exists to raise. Keep it honest.
          # Written as `!= 'schedule' && '2' || '0'` on purpose: GitHub Actions
          # coerces the string '0' to falsy, so a `== 'schedule' && '0' || '2'`
          # form would wrongly yield 2 for the nightly. Keeping '0' in the `||`
          # fallback position (never the `&&` result) sidesteps that coercion.
          E2E_RETRIES: ${{ !(github.event_name == 'schedule' && github.workflow == 'E2E Tests') && '2' || '0' }}
          E2E_SHARD_INDEX: ${{ matrix.shard }}
          E2E_TOTAL_SHARDS: "4"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'test-better-auth-secret' }}
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: ${{ secrets.NEXT_PUBLIC_BETTER_AUTH_ENABLED || 'true' }}

      - name: Upload blob report (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Always upload so the merge job has every shard, even failed ones.
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: error

  # Merge the per-shard blob reports into a single browsable HTML report.
  e2e-merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [e2e-frontend]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env

      # Download one exact current-run artifact at a time. The wildcard form
      # transfers matches concurrently, so one transient blob failure obscures
      # which required shard was unavailable and aborts otherwise green reports.
      - name: Download blob report (shard 1)
        id: download-blob-report-1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blob-report-1
          path: all-blob-reports/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download blob report (shard 2)
        id: download-blob-report-2
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blob-report-2
          path: all-blob-reports/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download blob report (shard 3)
        id: download-blob-report-3
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blob-report-3
          path: all-blob-reports/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download blob report (shard 4)
        id: download-blob-report-4
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blob-report-4
          path: all-blob-reports/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate required blob reports
        if: always()
        shell: bash
        env:
          BLOB_REPORT_1_RESULT: ${{ steps.download-blob-report-1.outcome }}
          BLOB_REPORT_2_RESULT: ${{ steps.download-blob-report-2.outcome }}
          BLOB_REPORT_3_RESULT: ${{ steps.download-blob-report-3.outcome }}
          BLOB_REPORT_4_RESULT: ${{ steps.download-blob-report-4.outcome }}
        run: |
          set -euo pipefail
          missing=()
          for shard in 1 2 3 4; do
            result_name="BLOB_REPORT_${shard}_RESULT"
            if [ "${!result_name}" != "success" ]; then
              missing+=("blob-report-${shard}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### E2E report infrastructure failure"
              echo
              echo "Classification: report-infrastructure"
              echo
              echo "Workflow run: \`${GITHUB_RUN_ID}\`"
              echo
              echo "Missing or unavailable required artifacts:"
              for artifact in "${missing[@]}"; do
                echo "- \`${artifact}\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::E2E report infrastructure failure: ${missing[*]}"
            exit 1
          fi

          {
            echo "### E2E report artifacts ready"
            echo
            echo "Selected \`blob-report-1\` through \`blob-report-4\` from workflow run \`${GITHUB_RUN_ID}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter=html,github ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  # Gate aggregator — the single job that represents the E2E suite's pass/fail.
  runtime-acceptance:
    name: Serial Runtime Acceptance
    if: ${{ (!(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && inputs.run_runtime_acceptance == true) || (github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance') && inputs.acceptance_diagnostic == 'final') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ steps.complete.outputs.result }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TOKEN: ''
      RUNTIME_ACCEPTANCE_CI_RUN_ID: ${{ github.run_id }}
      RUNTIME_ACCEPTANCE_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      RUNTIME_ACCEPTANCE_CI_JOB: ${{ github.job }}
      RUNTIME_ACCEPTANCE_POSTGRES_USER: genfeed
      RUNTIME_ACCEPTANCE_POSTGRES_PASSWORD: genfeed_local
      RUNTIME_ACCEPTANCE_PUBLIC_KEY: ${{ vars.RUNTIME_ACCEPTANCE_PUBLIC_KEY }}
      ACCEPTANCE_REPO: ${{ github.workspace }}
      CANDIDATE_SHA: ${{ github.sha }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - name: Anchor acceptance job deadline
        run: |
          {
            echo "RUNTIME_ACCEPTANCE_JOB_STARTED_MS=$(date +%s%3N)"
            echo "ACCEPTANCE_STATE=$RUNNER_TEMP/runtime-acceptance"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup preflight Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Validate final prerequisites before dependency setup
        id: preflight
        run: node scripts/ci/runtime-acceptance.mjs preflight --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA" --group final
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Build packages
        run: bunx turbo run build --filter="./packages/*"
      - name: Run serial runtime acceptance
        env:
          RUNTIME_ACCEPTANCE_POSTGRES_ID: ${{ job.services.postgres.id }}
          RUNTIME_ACCEPTANCE_REDIS_ID: ${{ job.services.redis.id }}
        run: node scripts/ci/runtime-acceptance.mjs final --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA"
      - name: Seal available runtime evidence
        id: seal
        if: always() && steps.preflight.outputs.prepared == 'true'
        run: node scripts/ci/runtime-acceptance.mjs seal --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA"
      - name: Retain encrypted runtime evidence
        id: upload
        if: always() && steps.preflight.outputs.prepared == 'true' && steps.seal.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-acceptance/public/receipt.json
            ${{ runner.temp }}/runtime-acceptance/public/evidence.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Confirm checked receipt and encrypted upload
        id: complete
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && steps.seal.outputs.result == 'passed' && steps.upload.outcome == 'success' }}
        run: echo 'result=passed' >> "$GITHUB_OUTPUT"

  agent-production-acceptance:
    name: Proactive Production Turn Acceptance
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && ((github.event_name == 'schedule' && github.workflow == 'E2E Tests') || inputs.run_api_full == true || inputs.run_runtime_acceptance == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result: ${{ steps.complete.outputs.result }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TOKEN: ''
      RUNTIME_ACCEPTANCE_POSTGRES_USER: genfeed
      RUNTIME_ACCEPTANCE_POSTGRES_PASSWORD: genfeed_local
      RUNTIME_ACCEPTANCE_PUBLIC_KEY: ${{ vars.RUNTIME_ACCEPTANCE_PUBLIC_KEY }}
      ACCEPTANCE_REPO: ${{ github.workspace }}
      CANDIDATE_SHA: ${{ github.sha }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - name: Anchor acceptance job deadline
        run: |
          {
            echo "RUNTIME_ACCEPTANCE_JOB_STARTED_MS=$(date +%s%3N)"
            echo "ACCEPTANCE_STATE=$RUNNER_TEMP/agent-production"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup preflight Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Validate final prerequisites before dependency setup
        id: preflight
        run: node scripts/ci/runtime-acceptance.mjs preflight --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA" --group agent-production
      - name: Require remaining dedicated setup budget
        id: agent-setup-budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_ACCEPTANCE_JOB_STARTED_MS" =~ ^[0-9]+$ ]]
          remaining_ms=$((RUNTIME_ACCEPTANCE_JOB_STARTED_MS + 300000 - $(date +%s%3N)))
          remaining_minutes=$((remaining_ms / 60000))
          test "$remaining_ms" -ge 60000
          test "$remaining_minutes" -ge 1
          echo "minutes=$remaining_minutes" >> "$GITHUB_OUTPUT"
      - name: Setup Bun environment
        timeout-minutes: ${{ fromJSON(steps.agent-setup-budget.outputs.minutes) }}
        uses: ./.github/actions/setup-bun-env
      - name: Generate Prisma and build within dedicated setup budget
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(((300000 + RUNTIME_ACCEPTANCE_JOB_STARTED_MS - $(date +%s%3N)) / 1000))
          test "$remaining" -gt 0
          timeout "${remaining}s" bash <<'BUILD'
            set -euo pipefail
            export DATABASE_URL="$(node --input-type=module -e 'import { databaseUrl, readPostgresCredentials } from "./scripts/ci/runtime-acceptance.mjs"; process.stdout.write(databaseUrl("test", readPostgresCredentials(process.env)))')"
            bun run --cwd packages/prisma db:generate
            bunx turbo run build --filter="./packages/*"
          BUILD
          test "$((300000 + RUNTIME_ACCEPTANCE_JOB_STARTED_MS - $(date +%s%3N)))" -gt 0
      - name: Run serial runtime acceptance
        env:
          RUNTIME_ACCEPTANCE_POSTGRES_ID: ${{ job.services.postgres.id }}
          RUNTIME_ACCEPTANCE_REDIS_ID: ${{ job.services.redis.id }}
        run: node scripts/ci/runtime-acceptance.mjs agent-production --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA"
      - name: Seal available runtime evidence
        id: seal
        if: always() && steps.preflight.outputs.prepared == 'true'
        run: node scripts/ci/runtime-acceptance.mjs seal --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA"
      - name: Retain encrypted runtime evidence
        id: upload
        if: always() && steps.preflight.outputs.prepared == 'true' && steps.seal.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-production/public/receipt.json
            ${{ runner.temp }}/agent-production/public/evidence.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Confirm checked receipt and encrypted upload
        id: complete
        if: steps.seal.outputs.result == 'passed' && steps.upload.outcome == 'success'
        run: echo 'result=passed' >> "$GITHUB_OUTPUT"

  brand-acceptance:
    name: BRAND Receipt and Relocation Acceptance
    if: ${{ (!(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && ((github.event_name == 'schedule' && github.workflow == 'E2E Tests') || inputs.run_api_full == true || inputs.run_runtime_acceptance == true)) || (github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance') && inputs.acceptance_diagnostic == 'brand-acceptance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result: ${{ steps.complete.outputs.result }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TOKEN: ''
      RUNTIME_ACCEPTANCE_POSTGRES_USER: genfeed
      RUNTIME_ACCEPTANCE_POSTGRES_PASSWORD: genfeed_local
      RUNTIME_ACCEPTANCE_PUBLIC_KEY: ${{ vars.RUNTIME_ACCEPTANCE_PUBLIC_KEY }}
      ACCEPTANCE_REPO: ${{ github.workspace }}
      CANDIDATE_SHA: ${{ github.sha }}
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - name: Anchor acceptance job deadline
        run: |
          {
            echo "RUNTIME_ACCEPTANCE_JOB_STARTED_MS=$(date +%s%3N)"
            echo "ACCEPTANCE_STATE=$RUNNER_TEMP/brand-acceptance"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup preflight Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - name: Validate final prerequisites before dependency setup
        id: preflight
        run: node scripts/ci/runtime-acceptance.mjs preflight --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA" --group brand-acceptance
      - name: Require remaining dedicated setup budget
        id: brand-setup-budget
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_ACCEPTANCE_JOB_STARTED_MS" =~ ^[0-9]+$ ]]
          remaining_ms=$((RUNTIME_ACCEPTANCE_JOB_STARTED_MS + 300000 - $(date +%s%3N)))
          remaining_minutes=$((remaining_ms / 60000))
          test "$remaining_ms" -ge 60000
          test "$remaining_minutes" -ge 1
          echo "minutes=$remaining_minutes" >> "$GITHUB_OUTPUT"
      - name: Setup Bun environment
        timeout-minutes: ${{ fromJSON(steps.brand-setup-budget.outputs.minutes) }}
        uses: ./.github/actions/setup-bun-env
      - name: Generate Prisma and build within dedicated setup budget
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(((300000 + RUNTIME_ACCEPTANCE_JOB_STARTED_MS - $(date +%s%3N)) / 1000))
          test "$remaining" -gt 0
          timeout "${remaining}s" bash <<'BUILD'
            set -euo pipefail
            export DATABASE_URL="$(node --input-type=module -e 'import { databaseUrl, readPostgresCredentials } from "./scripts/ci/runtime-acceptance.mjs"; process.stdout.write(databaseUrl("test", readPostgresCredentials(process.env)))')"
            bun run --cwd packages/prisma db:generate
            bunx turbo run build --filter="./packages/*"
          BUILD
          test "$((300000 + RUNTIME_ACCEPTANCE_JOB_STARTED_MS - $(date +%s%3N)))" -gt 0
      - name: Run serial runtime acceptance
        env:
          RUNTIME_ACCEPTANCE_POSTGRES_ID: ${{ job.services.postgres.id }}
        run: node scripts/ci/runtime-acceptance.mjs brand-acceptance --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA"
      - name: Seal available runtime evidence
        id: seal
        if: always() && steps.preflight.outputs.prepared == 'true'
        run: node scripts/ci/runtime-acceptance.mjs seal --repo "$ACCEPTANCE_REPO" --state "$ACCEPTANCE_STATE" --candidate-sha "$CANDIDATE_SHA" --control-sha "$CONTROL_SHA"
      - name: Retain encrypted runtime evidence
        id: upload
        if: always() && steps.preflight.outputs.prepared == 'true' && steps.seal.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brand-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/brand-acceptance/public/receipt.json
            ${{ runner.temp }}/brand-acceptance/public/evidence.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Confirm checked receipt and encrypted upload
        id: complete
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && steps.seal.outputs.result == 'passed' && steps.upload.outcome == 'success' }}
        run: echo 'result=passed' >> "$GITHUB_OUTPUT"

  e2e-api-full-gate:
    name: API E2E Full Gate
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && ((github.event_name == 'schedule' && github.workflow == 'E2E Tests') || inputs.run_api_full == true) }}
    needs: [e2e-api-full, agent-production-acceptance, brand-acceptance, runtime-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require checked full partition and both dedicated receipts
        env:
          EXPECTED_MODE: ${{ inputs.run_runtime_acceptance == true && 'final' || 'shared' }}
          PARTITION_MODE: ${{ needs.e2e-api-full.outputs.partition_mode }}
          SERIAL_RESULT: ${{ needs.runtime-acceptance.result }}
          FULL_RESULT: ${{ needs.e2e-api-full.result }}
          PARTITION: ${{ needs.e2e-api-full.outputs.partition }}
          AGENT_RESULT: ${{ needs.agent-production-acceptance.result }}
          AGENT_RECEIPT: ${{ needs.agent-production-acceptance.outputs.result }}
          BRAND_RESULT: ${{ needs.brand-acceptance.result }}
          BRAND_RECEIPT: ${{ needs.brand-acceptance.outputs.result }}
        run: |
          set -euo pipefail
          test "$FULL_RESULT" = success
          test "$PARTITION" = passed
          test "$PARTITION_MODE" = "$EXPECTED_MODE"
          if [ "$PARTITION_MODE" = final ]; then
            test "$SERIAL_RESULT" = success
          else
            test "$PARTITION_MODE" = shared
          fi
          test "$AGENT_RESULT" = success
          test "$AGENT_RECEIPT" = passed
          test "$BRAND_RESULT" = success
          test "$BRAND_RECEIPT" = passed

  # All applicable jobs must finish successfully; skipped and cancelled jobs
  # do not provide browser/API evidence or a complete inventory.
  e2e-gate:
    name: E2E Gate (all shards)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-route-coverage, e2e-frontend, e2e-api, runtime-acceptance]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) }}
    steps:
      - name: Check shard results
        run: |
          echo "Route reference inventory: ${{ needs.e2e-route-coverage.result }}"
          echo "Frontend matrix: ${{ needs.e2e-frontend.result }}"
          echo "API E2E: ${{ needs.e2e-api.result }}"
          if [[ "${{ needs.e2e-route-coverage.result }}" != "success" ]]; then
            echo "Route reference inventory did not complete" && exit 1
          fi
          if [[ "${{ needs.e2e-frontend.result }}" != "success" ]]; then
            echo "One or more E2E shards did not pass" && exit 1
          fi
          if [[ "${{ needs.e2e-api.result }}" != "success" ]]; then
            echo "API E2E boot gate did not pass" && exit 1
          fi
          if [[ "${{ inputs.run_runtime_acceptance == true }}" == "true" ]]; then
            test "${{ needs.runtime-acceptance.result }}" = success
            test "${{ needs.runtime-acceptance.outputs.result }}" = passed
          else
            test "${{ needs.runtime-acceptance.result }}" = skipped
          fi
          echo "All required E2E checks passed."

  # Hermetic real-Better Auth authenticated smoke (Playwright `app-authed`
  # project). Exercises the GENUINE authMiddleware path — no proxy.ts bypass —
  # against a fully job-local stack: Postgres + Redis service containers,
  # migrated schema, and the real compiled API on :3010. auth.setup.ts mints a
  # fresh session per run (sign-up → onboarding completion), so the job needs
  # NO repo secrets and never touches production (#1448 — the previous design
  # validated sessions against api.genfeed.ai with a static prod token).
  # Gated behind the E2E_AUTHED_ENABLED repo variable. GATING on the nightly
  # cron — a real regression turns the nightly red and trips
  # nightly-failure-report below, instead of rotting unseen behind
  # continue-on-error (it sat red for 5+ June nightlies that way). On the
  # deploy path it stays non-gating so a flake can never cancel a production
  # release: continue-on-error is true for every event EXCEPT the scheduled
  # nightly.
  e2e-frontend-authed:
    name: Frontend Authed E2E (real Better Auth)
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'E2E Tests' && (inputs.acceptance_diagnostic == 'final' || inputs.acceptance_diagnostic == 'brand-acceptance')) && (vars.E2E_AUTHED_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ !(github.event_name == 'schedule' && github.workflow == 'E2E Tests') }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: genfeed
          POSTGRES_PASSWORD: genfeed_local
        ports:
          - 5432:5432
        # Gate job start on container readiness so the first DB touch can
        # never race container startup (deferred CodeRabbit finding on #1615).
        options: >-
          --health-cmd "pg_isready -U genfeed -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://genfeed:genfeed_local@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      # Synthetic signing secret — the whole auth stack is job-local, so this
      # is deliberately a literal, not a credential.
      BETTER_AUTH_SECRET: e2e-hermetic-better-auth-secret
      E2E_API_ENDPOINT: http://localhost:3010/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build app with real Better Auth (bypass off)
        uses: ./.github/actions/setup-playwright-app
        with:
          test-mode: 'false'
          api-endpoint: http://localhost:3010/v1
          better-auth-secret: ${{ env.BETTER_AUTH_SECRET }}

      - name: Build API (compiled bundle)
        run: bunx turbo run build --filter=@genfeedai/api

      # Provision the schema on the ephemeral Postgres service container —
      # same pattern as e2e-api above.
      - name: Apply Prisma migrations to test DB
        run: bun x prisma migrate deploy
        working-directory: packages/prisma

      - name: Start API (hermetic backend on :3010)
        # Boot the compiled webpack bundle directly (same invocation
        # build-verify.yml's boot gate uses). The api package's start:prod
        # preloads tsconfig-paths/register, which is not a declared dependency
        # anywhere in the workspace — path aliases are compiled into the bundle.
        run: |
          set -euo pipefail
          (node apps/server/dist/apps/api/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3010/v1/health >/dev/null 2>&1; then
              echo "API healthy after ~$((attempt * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy within 120s"
          tail -n 200 "$RUNNER_TEMP/api.log"
          exit 1
        env:
          NODE_ENV: test
          PORT: "3010"
          # Mock external provider keys — the spec's network guard blocks any
          # real external call regardless.
          REPLICATE_API_TOKEN: test-mock-key
          STRIPE_SECRET_KEY: test-mock-key

      - name: Run authed E2E (Better Auth setup + app-authed)
        run: bun run test:e2e:authed
        env:
          CI: true
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_PLAYWRIGHT_TEST: "false"
          NEXT_PUBLIC_BETTER_AUTH_ENABLED: "true"
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:3010/v1
          # Unlocks the better-auth-setup + app-authed projects in
          # playwright.config.ts, which gate on process.env.E2E_AUTHED_ENABLED.
          # The job-level `if` checks the GitHub repo var; this plumbs the value
          # into the runner process so --project=app-authed actually resolves.
          E2E_AUTHED_ENABLED: "1"

      - name: Upload API log (on failure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: api-log-authed
          path: ${{ runner.temp }}/api.log
          retention-days: 7

      - name: Upload authed Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-authed
          path: playwright/artifacts/report/
          retention-days: 7

      - name: Upload authed traces (on failure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces-authed
          path: playwright/artifacts/results/
          retention-days: 7

  # Nightly-only failure reporter. Each failed job becomes one stable fingerprint;
  # repeated runs update its canonical bounded tracker, while the sibling recovery
  # job closes it only after three consecutive scheduled greens. Reporter failures
  # stay visible on their own step without replacing the source job result.
  # Runs ONLY on the standalone cron. A workflow_call inherits the caller's
  # event, so a cron-triggered caller would also read 'schedule' here. Every
  # nightly-only gate in this file therefore also requires
  # `github.workflow == 'E2E Tests'` (a called workflow reports its caller's
  # name there).
  # Deploy gating is untouched. Keys off the aggregated gate AND the two
  # nightly-only jobs — the authed job and the API full tier — so any red
  # nightly surfaces exactly one issue. The full tier is deliberately absent
  # from e2e-gate (that gate is the deploy contract and must stay core-only),
  # so watching the gate alone let a red "API E2E Full" report nothing: on
  # 2026-08-01 the full tier failed and this job was skipped.
  nightly-failure-report:
    name: Report nightly E2E failure
    needs: [e2e-gate, e2e-frontend-authed, e2e-api-full, e2e-isolated-publish, agent-production-acceptance, brand-acceptance, e2e-api-full-gate]
    # `!cancelled()` rather than `always()`: both keep the reporter eligible when
    # an upstream job goes red, but `always()` also fires when the whole run is
    # cancelled — which marks every job 'cancelled' and would file a phantom
    # failure issue. A job-level timeout does not cancel the run, so the
    # e2e-api-full 'cancelled' arm below still catches a hung full tier.
    if: >-
      !cancelled()
      && (github.event_name == 'schedule' && github.workflow == 'E2E Tests')
      && (needs.e2e-gate.result == 'failure'
        || needs.e2e-frontend-authed.result == 'failure'
        || needs.e2e-api-full.result == 'failure'
        || needs.e2e-api-full.result == 'cancelled'
        || needs.e2e-isolated-publish.result == 'failure'
        || needs.e2e-isolated-publish.result == 'cancelled'
        || needs.agent-production-acceptance.result != 'success'
        || needs.brand-acceptance.result != 'success'
        || needs.e2e-api-full-gate.result != 'success')
    # Serialize the complete label lookup + issue lookup/mutation path across
    # scheduled runs and rerun attempts. Keep all pending reporters queued.
    concurrency:
      group: nightly-e2e-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint reporter token (Genfeed bot App)
        id: reporter-token
        uses: ./.github/actions/reporter-token
        with:
          client-id: ${{ secrets.GENFEED_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GENFEED_BOT_PRIVATE_KEY }}

      - name: Create or update bounded nightly-failure trackers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.e2e-gate.result }}
          AUTHED_RESULT: ${{ needs.e2e-frontend-authed.result }}
          API_FULL_RESULT: ${{ needs.e2e-api-full.result }}
          ISOLATED_PUBLISH_RESULT: ${{ needs.e2e-isolated-publish.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.reporter-token.outputs.token }}
          script: |
            const repositoryGithub = getOctokit(process.env.REPOSITORY_TOKEN);
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              collectScheduledRunFailures,
              reportNightlyE2eFailure,
            } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/nightly-e2e-failure-reporter.mjs',
                ),
              ).href,
            );
            const { owner, repo } = context.repo;
            const jobs = await repositoryGithub.paginate(
              repositoryGithub.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: Number(process.env.RUN_ID),
                filter: 'latest',
                per_page: 100,
              },
            );
            const sourceName = /^(?:E2E Route Reference Inventory|API E2E Tests|API E2E Full|Isolated Publish E2E|Proactive Production Turn Acceptance|BRAND Receipt and Relocation Acceptance|API E2E Full Gate|Frontend E2E \(Shard \d+\/4\)|Frontend Authed E2E \(real Better Auth\)|E2E Gate \(all shards\))$/;
            const failedJobs = jobs.filter(
              (job) =>
                sourceName.test(job.name) &&
                ['failure', 'cancelled', 'timed_out'].includes(job.conclusion),
            );
            const specificJobs = failedJobs.filter(
              (job) =>
                job.name !== 'E2E Gate (all shards)' &&
                job.name !== 'API E2E Full Gate',
            );
            const selectedJobs = specificJobs.length > 0 ? specificJobs : failedJobs;
            const trackerJob = (name) => {
              if (/^Frontend E2E \(Shard/u.test(name)) return 'e2e-frontend';
              if (name === 'Frontend Authed E2E (real Better Auth)') return 'e2e-frontend-authed';
              if (name === 'Proactive Production Turn Acceptance') return 'agent-production-acceptance';
              if (name === 'BRAND Receipt and Relocation Acceptance') return 'brand-acceptance';
              if (name === 'API E2E Full Gate') return 'e2e-api-full';
              if (name === 'API E2E Full') return 'e2e-api-full';
              if (name === 'API E2E Tests') return 'e2e-api';
              if (name === 'Isolated Publish E2E') return 'e2e-isolated-publish';
              if (name === 'E2E Route Reference Inventory') return 'e2e-route-coverage';
              return 'e2e-gate';
            };
            const failures = await collectScheduledRunFailures({
              github: repositoryGithub,
              owner,
              repo,
              jobs: selectedJobs.map((job) => ({
                ...job,
                trackerJob: trackerJob(job.name),
                fallbackExcerpt:
                  job.conclusion === 'failure'
                    ? `Test suite failed: ${job.name}.`
                    : `Timed out or cancelled: ${job.name}.`,
              })),
              core,
            });
            await reportNightlyE2eFailure({
              github: repositoryGithub,
              projectGithub: github,
              owner,
              repo,
              failures,
              sha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runAttempt: Number(process.env.RUN_ATTEMPT),
              runUrl: process.env.RUN_URL,
              core,
            });

  nightly-recovery-report:
    name: Record nightly E2E recovery
    needs: [e2e-gate, e2e-frontend-authed, e2e-api-full, e2e-isolated-publish, agent-production-acceptance, brand-acceptance, e2e-api-full-gate]
    if: >-
      !cancelled()
      && (github.event_name == 'schedule' && github.workflow == 'E2E Tests')
      && needs.e2e-gate.result == 'success'
      && (needs.e2e-frontend-authed.result == 'success'
        || needs.e2e-frontend-authed.result == 'skipped')
      && needs.e2e-api-full.result == 'success'
      && needs.e2e-isolated-publish.result == 'success'
      && needs.agent-production-acceptance.result == 'success'
      && needs.brand-acceptance.result == 'success'
      && needs.e2e-api-full-gate.result == 'success'
    concurrency:
      group: nightly-e2e-failure-reporter
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record one consecutive scheduled green
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { resolveNightlyE2eFailures } = await import(
              pathToFileURL(
                path.join(
                  process.env.GITHUB_WORKSPACE,
                  'scripts/ci/nightly-e2e-failure-reporter.mjs',
                ),
              ).href,
            );
            const { owner, repo } = context.repo;
            await resolveNightlyE2eFailures({
              github,
              owner,
              repo,
              sha: process.env.SOURCE_SHA,
              runId: Number(process.env.RUN_ID),
              runUrl: process.env.RUN_URL,
              core,
            });
