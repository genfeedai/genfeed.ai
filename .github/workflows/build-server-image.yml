# Canonical immutable server image builder. Verify Server Runtime calls it on
# master/release validation; weekly vulnerability scans reuse the same digest.
# Manual dispatch remains available for staging candidates and recovery.
name: Build Server Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Candidate scope. staging also moves :staging; production channels move only after a verified deployment.'
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    outputs:
      image_digest:
        description: Verified immutable server image manifest digest
        value: ${{ jobs.build.outputs.image_digest }}
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
    inputs:
      force_build:
        description: Build explicitly requested images even when the caller inherited an unchanged push range.
        type: boolean
        required: false
        default: true
      environment:
        type: string
        required: false
        default: production

concurrency:
  # Serialize builds for a ref: concurrent runs writing the shared
  # server:buildcache (mode=max) ref can clobber each other's cache manifest.
  group: build-server-image-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  changes:
    name: Resolve server image inputs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_BUILD: ${{ inputs.force_build || github.event_name != 'push' }}
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then BASE_SHA=""; fi
          node scripts/ci/server-image-inputs.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Build & Push Server Image
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build & push unified server image
        id: image
        uses: ./.github/actions/build-unified-image
        with:
          image_prefix: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          environment: ${{ inputs.environment || 'production' }}
