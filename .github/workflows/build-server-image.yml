# Build Server Image — builds + pushes the unified production server image
# (docker/Dockerfile.server) so DEPLOYS PULL A PRE-BUILT IMAGE instead of
# building inline.
#
# Why this exists: the deploy used to build the image inside the deploy run, and
# the shared `server:buildcache` was only written by those deploy builds — so it
# went stale between deploys and every deploy paid a near-cold ~30-min build.
# This workflow builds on master-push (async, non-blocking) and writes
# `server:buildcache` (mode=max) every run via the composite, keeping layers hot
# so builds drop to ~5-10 min and `server:<sha>` is ready before any deploy.
#
# Triggers:
#   push:master (input-policy-gated) — publish `server:<sha>` + warm the cache for every
#     server-affecting commit, preparing deployable server revisions.
#   workflow_dispatch — manual/test rebuild. Pick `environment: staging` when
#     testing to also label the candidate :staging.
#   workflow_call — let release/preview callers build on demand.

name: Build Server Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Candidate scope. staging also moves :staging; production channels move only after a verified deployment.'
        type: choice
        options: [production, staging]
        default: production
  workflow_call:
    inputs:
      force_build:
        description: Build explicitly requested images even when the caller inherited an unchanged push range.
        type: boolean
        required: false
        default: true
      environment:
        type: string
        required: false
        default: production

concurrency:
  # Serialize builds for a ref: concurrent runs writing the shared
  # server:buildcache (mode=max) ref can clobber each other's cache manifest.
  group: build-server-image-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  changes:
    name: Resolve server image inputs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_BUILD: ${{ inputs.force_build || github.event_name != 'push' }}
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then BASE_SHA=""; fi
          node scripts/ci/server-image-inputs.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    name: Build & Push Server Image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build & push unified server image
        uses: ./.github/actions/build-unified-image
        with:
          image_prefix: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          environment: ${{ inputs.environment || 'production' }}
