name: Publish Packages

# Reusable npm release lane. `release.yml` calls this for every stable release so
# tagged releases publish whatever package versions merged to master, and the
# registry can no longer silently fall months behind the repo.
#
# npm trusted publishing matches the CALLER workflow filename and allows one per
# package, so `release.yml` is the registered publisher. A direct dispatch here
# is therefore preflight-only: it proves a release would publish cleanly without
# touching the registry.
on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Pinned release SHA verified by the canonical Release workflow'
        required: true
        type: string
      dry_run:
        description: 'Preflight only, no registry writes'
        required: false
        default: true
        type: boolean
      trusted_release_call:
        description: 'True only when the registered release workflow invokes this reusable workflow'
        required: false
        default: false
        type: boolean
      validated_historical_recovery:
        description: 'Validate a historical release only when its npm plan is empty'
        required: false
        default: false
        type: boolean
      recovery_run_id:
        description: 'Previously validated failed Release run; required for historical recovery'
        required: false
        default: ''
        type: string
      packages_json:
        description: 'Optional explicit release set; empty means detect registry drift'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      packages_json:
        description: 'Optional override, e.g. [{"path":"packages/ui","version":"2.0.2"}]. Empty detects drift automatically.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Must stay true — real publishes run through the Release workflow'
        required: false
        default: true
        type: boolean

concurrency:
  group: package-publish
  cancel-in-progress: false

# Least-privilege default token; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  plan:
    name: Plan npm release from registry drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_packages: ${{ steps.plan.outputs.has_packages }}
      packages_json: ${{ steps.plan.outputs.packages_json }}
    steps:
      # npm authorizes the caller workflow, so a dispatched publish would fail at
      # the registry with an opaque auth error. Reusable workflows inherit the
      # caller's originating event, so github.event_name cannot distinguish a
      # direct dispatch from release.yml. Use an explicit workflow_call-only
      # trust input instead (the direct-dispatch schema cannot set it).
      - name: Reject real publishes outside the release workflow
        if: ${{ inputs.dry_run == false && inputs.trusted_release_call != true }}
        run: |
          echo "::error::Real package publishes run through the Release workflow, which is the registered npm trusted publisher. Dispatch this workflow with dry_run=true for preflight only."
          exit 1

      - name: Require a master ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Package releases must run from master. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pinned release source
        if: ${{ inputs.dry_run == false || inputs.validated_historical_recovery == true }}
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          TRUSTED_RELEASE_CALL: ${{ inputs.trusted_release_call }}
          VALIDATED_HISTORICAL_RECOVERY: ${{ inputs.validated_historical_recovery }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Package releases are only allowed from master. Current ref: ${GITHUB_REF}"
            exit 1
          fi
          if ! [[ "${CHECKOUT_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Real package publishes require an exact 40-character checkout SHA."
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${CHECKOUT_REF}" ]; then
            echo "::error::Checked out ${HEAD_SHA}, expected the pinned release SHA ${CHECKOUT_REF}."
            exit 1
          fi

          git fetch --no-tags origin master
          MASTER_SHA="$(git rev-parse origin/master)"

          if [ "${VALIDATED_HISTORICAL_RECOVERY}" = 'true' ]; then
            if [ "${TRUSTED_RELEASE_CALL}" != 'true' ] || [ "${DRY_RUN}" != 'false' ]; then
              echo "::error::Historical package recovery requires a trusted real Release workflow call."
              exit 1
            fi
            if ! [[ "${RECOVERY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Historical package recovery requires a positive recovery_run_id."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${HEAD_SHA}" "${MASTER_SHA}"; then
              echo "::error::The recovered release SHA must remain an ancestor of current master."
              exit 1
            fi
          else
            if [ -n "${RECOVERY_RUN_ID}" ]; then
              echo "::error::recovery_run_id is only valid with validated_historical_recovery=true."
              exit 1
            fi
            if [ "${HEAD_SHA}" != "${MASTER_SHA}" ]; then
              echo "::error::Master advanced after this release was dispatched. Run a new release from current master."
              exit 1
            fi
          fi

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: '24.x'

      - name: Validate npm release enrollment
        run: bun run check:npm-release

      - name: Resolve packages to publish
        id: plan
        env:
          PACKAGES_JSON_OVERRIDE: ${{ inputs.packages_json }}
        run: |
          set -euo pipefail
          if [ -n "${PACKAGES_JSON_OVERRIDE}" ]; then
            echo "Using the explicitly supplied release set."
            {
              echo "has_packages=true"
              echo "packages_json=${PACKAGES_JSON_OVERRIDE}"
            } >>"${GITHUB_OUTPUT}"
          else
            node scripts/npm-release-plan.mjs
          fi

      - name: Checkout current release controller
        if: ${{ inputs.validated_historical_recovery == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Require an empty npm plan for historical recovery
        if: ${{ inputs.validated_historical_recovery == true }}
        env:
          HAS_PACKAGES: ${{ steps.plan.outputs.has_packages }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          VALIDATED_HISTORICAL_RECOVERY: ${{ inputs.validated_historical_recovery }}
        run: node .release-controller/scripts/ci/recovery-npm-plan-guard.mjs

  preflight:
    name: Preflight immutable package tarballs
    needs: plan
    if: ${{ inputs.validated_historical_recovery != true && needs.plan.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_DIR: ${{ github.workspace }}/.package-release
    steps:
      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: '24.x'

      - name: Require npm trusted-publishing support
        run: |
          # shellcheck disable=SC2016
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (
              major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
            ) {
              throw new Error(`npm >=11.5.1 is required for OIDC trusted publishing; found ${process.argv[1]}`);
            }
          ' "$(npm --version)"

      - name: Build, pack, and dry-run the complete release
        env:
          PACKAGES_JSON: ${{ needs.plan.outputs.packages_json }}
        run: |
          node scripts/publish-packages-from-json.mjs \
            --packages-json "${PACKAGES_JSON}" \
            --output-dir "${RELEASE_DIR}"

      - name: Upload immutable release plan and tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-release-${{ github.run_id }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

      - name: Preflight summary
        if: always()
        run: |
          if [ -f "${RELEASE_DIR}/release-status.json" ]; then
            {
              echo '## Package release preflight'
              echo '```json'
              cat "${RELEASE_DIR}/release-status.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  publish:
    name: Publish preflighted package tarballs
    if: ${{ inputs.validated_historical_recovery != true && inputs.dry_run == false && inputs.trusted_release_call == true && needs.plan.outputs.has_packages == 'true' }}
    needs: [plan, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_DIR: ${{ github.workspace }}/.package-release
    steps:
      - name: Checkout the preflighted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate real publication source
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Package releases are only allowed from master. Current ref: ${GITHUB_REF}"
            exit 1
          fi
          if ! [[ "${CHECKOUT_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Real package publishes require an exact 40-character checkout SHA."
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${HEAD_SHA}" != "${CHECKOUT_REF}" ]; then
            echo "::error::Checked out ${HEAD_SHA}, expected the pinned release SHA ${CHECKOUT_REF}."
            exit 1
          fi

          git fetch --no-tags origin master
          MASTER_SHA="$(git rev-parse origin/master)"

          if [ "${HEAD_SHA}" != "${MASTER_SHA}" ]; then
            echo "::error::Master advanced after this release was dispatched. Run a new release from current master."
            exit 1
          fi

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: '24.x'
          install-command: 'bun install --frozen-lockfile'

      - name: Require npm trusted-publishing support
        run: |
          # shellcheck disable=SC2016
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (
              major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
            ) {
              throw new Error(`npm >=11.5.1 is required for OIDC trusted publishing; found ${process.argv[1]}`);
            }
          ' "$(npm --version)"

      - name: Download immutable release plan and tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-release-${{ github.run_id }}
          path: ${{ env.RELEASE_DIR }}

      - name: Publish dependency-first with resumable collision checks
        run: |
          node scripts/publish-packages-from-json.mjs \
            --publish-plan "${RELEASE_DIR}/release-plan.json"

      - name: Publication summary
        if: always()
        run: |
          if [ -f "${RELEASE_DIR}/release-status.json" ]; then
            {
              echo '## Package publication status'
              echo '```json'
              cat "${RELEASE_DIR}/release-status.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload publication journal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-publication-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_DIR }}/release-status.json
          if-no-files-found: warn
          retention-days: 7
