name: Deploy hosted SaaS Vercel frontends

# Canonical production deploy path for Vercel-hosted frontends.
# Vercel Git auto-deploy is disabled in each app's vercel.json; production
# frontends deploy only through this workflow, after the public hosted-SaaS
# engine has migrated, boot-smoked, and rolled the API/services.
#
on:
  workflow_call:
    inputs:
      source_sha:
        description: "exact public genfeed.ai source commit to build"
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      NEXT_PUBLIC_POSTHOG_KEY:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      TURBO_TOKEN:
        required: false
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        label: [app, web, docs]
    env:
      # Git auto-deploy is disabled in each vercel.json, so `vercel build` runs
      # without Git deployment context and Vercel leaves VERCEL_GIT_COMMIT_SHA="".
      # An empty buildId makes the App Router hard-reload on every navigation, so
      # feed the exact selected source commit SHA as BUILD_ID (apps/app's next.config reads
      # it first). The other frontends ignore this and keep Next's default buildId.
      # Resolve project ids here, after `environment: production`, not in strategy.matrix
      # — environment vars are empty during matrix expansion.
      BUILD_ID: ${{ inputs.source_sha }}
      DOMAIN: ${{ vars.DOMAIN }}
      FRONTEND_REPOSITORY: ${{ github.repository }}
      FRONTEND_SHA: ${{ inputs.source_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.label == 'app' && vars.VERCEL_PROJECT_APP || matrix.label == 'web' && vars.VERCEL_PROJECT_WEB || matrix.label == 'docs' && vars.VERCEL_PROJECT_DOCS || '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      STRIPE_PRICE_SUBSCRIPTION_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_SUBSCRIPTION_PRO_MONTHLY }}
      STRIPE_PRICE_SUBSCRIPTION_SCALE_MONTHLY: ${{ vars.STRIPE_PRICE_SUBSCRIPTION_SCALE_MONTHLY }}
      # Same remote cache as public CI. Empty token is a no-op (turbo still builds).
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::VERCEL_TOKEN is missing on this repository. Public deploys used secrets.VERCEL_TOKEN here before #2844; it was moved to console and never restored."
            exit 1
          fi

      - name: Require app and web Vercel project ids
        if: ${{ matrix.label == 'app' || matrix.label == 'web' }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_PROJECT_${LABEL} is required on the production environment."
            exit 1
          fi
          if [ -z "${VERCEL_ORG_ID}" ]; then
            echo "::error::VERCEL_ORG_ID is required on the production environment."
            exit 1
          fi
        env:
          LABEL: ${{ matrix.label }}

      - name: Skip optional frontend
        if: ${{ matrix.label == 'docs' && env.VERCEL_PROJECT_ID == '' }}
        run: echo "No Vercel project configured for ${{ matrix.label }}; skipping."

      - name: Checkout exact frontend source
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_SHA }}
          persist-credentials: false
          token: ${{ github.token }}

      - if: ${{ env.VERCEL_PROJECT_ID != '' }}
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: HUSKY=0 bun install --frozen-lockfile --ignore-scripts

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: bun add --global vercel@54.4.1

      - name: Pull Vercel production environment
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Validate and inject production frontend environment
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: |
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::Vercel production environment file is missing."
            exit 1
          fi

          if ! printf '%s' "$NEXT_PUBLIC_POSTHOG_KEY" | grep -Eq '^phc_[A-Za-z0-9]+$'; then
            echo "::error::NEXT_PUBLIC_POSTHOG_KEY must be a valid PostHog project token."
            exit 1
          fi

          awk '!/^(NEXT_PUBLIC_POSTHOG_KEY|NEXT_PUBLIC_POSTHOG_HOST)=/' "$env_file" > "${env_file}.tmp"
          {
            printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "$NEXT_PUBLIC_POSTHOG_KEY"
            printf 'NEXT_PUBLIC_POSTHOG_HOST=%s\n' "$NEXT_PUBLIC_POSTHOG_HOST"
          } >> "${env_file}.tmp"

          if [ "${{ matrix.label }}" = "app" ]; then
            if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
              echo "::error::SENTRY_AUTH_TOKEN is required to upload app source maps."
              exit 1
            fi

            if [ -z "${DOMAIN}" ]; then
              echo "::error::DOMAIN is required to configure the app API proxy."
              exit 1
            fi

            if ! printf '%s' "$STRIPE_PRICE_SUBSCRIPTION_PRO_MONTHLY" | grep -Eq '^price_[A-Za-z0-9]+$'; then
              echo "::error::Production Pro checkout is not configured."
              exit 1
            fi

            if ! printf '%s' "$STRIPE_PRICE_SUBSCRIPTION_SCALE_MONTHLY" | grep -Eq '^price_[A-Za-z0-9]+$'; then
              echo "::error::Production Scale checkout is not configured."
              exit 1
            fi

            awk '!/^(API_URL|NEXT_PUBLIC_GENFEED_CLOUD|NEXT_PUBLIC_STRIPE_PRICE_SUBSCRIPTION_PRO_MONTHLY|NEXT_PUBLIC_STRIPE_PRICE_SUBSCRIPTION_SCALE_MONTHLY)=/' "${env_file}.tmp" > "${env_file}.app"
            {
              printf 'API_URL=https://api.%s\n' "$DOMAIN"
              printf 'NEXT_PUBLIC_GENFEED_CLOUD=1\n'
              printf 'NEXT_PUBLIC_STRIPE_PRICE_SUBSCRIPTION_PRO_MONTHLY=%s\n' "$STRIPE_PRICE_SUBSCRIPTION_PRO_MONTHLY"
              printf 'NEXT_PUBLIC_STRIPE_PRICE_SUBSCRIPTION_SCALE_MONTHLY=%s\n' "$STRIPE_PRICE_SUBSCRIPTION_SCALE_MONTHLY"
            } >> "${env_file}.app"
            mv "${env_file}.app" "$env_file"
          else
            mv "${env_file}.tmp" "$env_file"
          fi

      - name: Preserve runner PATH for local Vercel build
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: |
          env_file=".vercel/.env.production.local"
          if [ -f "$env_file" ] && grep -q '^PATH=' "$env_file"; then
            awk '!/^PATH=/' "$env_file" > "${env_file}.tmp"
            mv "${env_file}.tmp" "$env_file"
            echo "Removed reserved PATH from ${env_file}"
          fi
          command -v sh
          command -v bun
          command -v vercel

      - name: Build ${{ matrix.label }}
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy ${{ matrix.label }}
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          echo "${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Deployment URL
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        env:
          LABEL: ${{ matrix.label }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "${LABEL} -> ${DEPLOY_URL}"
