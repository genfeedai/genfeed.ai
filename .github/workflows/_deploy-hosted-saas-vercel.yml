name: Deploy hosted SaaS Vercel frontends

# Canonical production deploy path for Vercel-hosted frontends.
# Vercel Git auto-deploy is disabled in each app's vercel.json; production
# frontends deploy only through this workflow, after the public hosted-SaaS
# engine has migrated, boot-smoked, and rolled the API/services.
#
on:
  workflow_call:
    inputs:
      source_sha:
        description: "exact public genfeed.ai source commit to build"
        required: true
        type: string
      marketplace_source_sha:
        description: "exact marketplace.genfeed.ai source commit to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: app
            project_id: ${{ vars.VERCEL_PROJECT_APP }}
            repository: ${{ github.repository }}
            source_sha: ${{ inputs.source_sha }}
          - label: web
            project_id: ${{ vars.VERCEL_PROJECT_WEB }}
            repository: ${{ github.repository }}
            source_sha: ${{ inputs.source_sha }}
          - label: docs
            project_id: ${{ vars.VERCEL_PROJECT_DOCS }}
            repository: ${{ github.repository }}
            source_sha: ${{ inputs.source_sha }}
          - label: marketplace
            project_id: ${{ vars.VERCEL_PROJECT_MARKETPLACE }}
            repository: ${{ vars.MARKETPLACE_REPOSITORY }}
            source_sha: ${{ inputs.marketplace_source_sha }}
    env:
      # Git auto-deploy is disabled in each vercel.json, so `vercel build` runs
      # without Git deployment context and Vercel leaves VERCEL_GIT_COMMIT_SHA="".
      # An empty buildId makes the App Router hard-reload on every navigation, so
      # feed the exact selected source commit SHA as BUILD_ID (apps/app's next.config reads
      # it first). The other frontends ignore this and keep Next's default buildId.
      BUILD_ID: ${{ matrix.source_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      # Same remote cache as public CI. Empty token is a no-op (turbo still builds).
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Skip unset frontend
        if: ${{ matrix.project_id == '' }}
        run: echo "No Vercel project configured for ${{ matrix.label }}; skipping."

      - name: Checkout exact frontend source
        if: ${{ matrix.project_id != '' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_sha }}
          persist-credentials: false
          token: ${{ github.token }}

      - if: ${{ matrix.project_id != '' }}
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: HUSKY=0 bun install --frozen-lockfile --ignore-scripts

      - name: Install Vercel CLI
        if: ${{ matrix.project_id != '' }}
        run: bun add --global vercel@54.4.1

      - name: Pull Vercel production environment
        if: ${{ matrix.project_id != '' }}
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Validate and inject production frontend environment
        if: ${{ matrix.project_id != '' }}
        run: |
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::Vercel production environment file is missing."
            exit 1
          fi

          if ! printf '%s' "$NEXT_PUBLIC_POSTHOG_KEY" | grep -Eq '^phc_[A-Za-z0-9]+$'; then
            echo "::error::NEXT_PUBLIC_POSTHOG_KEY must be a valid PostHog project token."
            exit 1
          fi

          awk '!/^(NEXT_PUBLIC_POSTHOG_KEY|NEXT_PUBLIC_POSTHOG_HOST)=/' "$env_file" > "${env_file}.tmp"
          {
            printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "$NEXT_PUBLIC_POSTHOG_KEY"
            printf 'NEXT_PUBLIC_POSTHOG_HOST=%s\n' "$NEXT_PUBLIC_POSTHOG_HOST"
          } >> "${env_file}.tmp"

          if [ "${{ matrix.label }}" = "app" ]; then
            awk '!/^NEXT_PUBLIC_GENFEED_CLOUD=/' "${env_file}.tmp" > "${env_file}.app"
            printf 'NEXT_PUBLIC_GENFEED_CLOUD=1\n' >> "${env_file}.app"
            mv "${env_file}.app" "$env_file"
          else
            mv "${env_file}.tmp" "$env_file"
          fi

      - name: Preserve runner PATH for local Vercel build
        if: ${{ matrix.project_id != '' }}
        run: |
          env_file=".vercel/.env.production.local"
          if [ -f "$env_file" ] && grep -q '^PATH=' "$env_file"; then
            awk '!/^PATH=/' "$env_file" > "${env_file}.tmp"
            mv "${env_file}.tmp" "$env_file"
            echo "Removed reserved PATH from ${env_file}"
          fi
          command -v sh
          command -v bun
          command -v vercel

      - name: Build ${{ matrix.label }}
        if: ${{ matrix.project_id != '' }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy ${{ matrix.label }}
        if: ${{ matrix.project_id != '' }}
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          echo "${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Deployment URL
        if: ${{ matrix.project_id != '' }}
        run: echo "${{ matrix.label }} -> ${{ steps.deploy.outputs.url }}"
