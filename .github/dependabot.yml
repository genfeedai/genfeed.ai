version: 2

# Dependabot was producing alerts only for `.deepsec/pnpm-lock.yaml` — a vendored,
# dev-only scanning workspace that never ships — while `bun.lock` (the lockfile that
# actually describes production dependencies) went unscanned. Declaring the bun
# ecosystem explicitly closes that gap; `.deepsec` is deliberately not listed.
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
