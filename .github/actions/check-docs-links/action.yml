name: Check Docs Links
description: Run the existing Markdown lychee workload.
inputs:
  github-token:
    description: Read-only GitHub token for lychee
    required: true
runs:
  using: composite
  steps:
    - name: Run lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: >-
          --config lychee.toml
          --remap 'https://github.com/genfeedai/genfeed.ai/blob/master file://${{ github.workspace }}'
          'apps/docs/content/**/*.md'
          'apps/docs/content/**/*.mdx'
          'README.md'
          'apps/marketing/README.md'
        fail: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
