name: 'Build and Push Unified Server Image'
description: 'Reuse a verified exact-SHA server image or build and publish it once.'

# Canonical GHCR builder used by runtime verification and vulnerability scans.
# Reuse is allowed only after inspecting the immutable digest and OCI revision;
# registry/auth failures fail closed rather than overwriting a SHA tag.

inputs:
  registry:
    description: 'Container registry'
    required: false
    default: 'ghcr.io'
  image_prefix:
    description: 'Image name prefix (e.g. genfeedai/genfeed.ai)'
    required: true
  github_token:
    description: 'GitHub token for registry authentication'
    required: true
  sentry_auth_token:
    description: 'Sentry auth token for sourcemap injection/upload during build'
    required: false
    default: ''
  environment:
    description: 'Candidate scope (staging adds a staging tag; production channels are promoted after deployment)'
    required: false
    default: 'production'

outputs:
  image_tags:
    description: 'Generated image tags'
    value: ${{ steps.meta.outputs.tags }}
  image_digest:
    description: 'Image digest'
    value: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
  image_tag:
    description: 'Immutable image tag for this workflow run'
    value: ${{ github.sha }}

runs:
  using: 'composite'
  steps:
    - name: Normalize server image identity
      id: image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_PREFIX: ${{ inputs.image_prefix }}
      run: |
        set -euo pipefail
        printf 'registry=%s\nrepository=%s/%s/server\n' "${REGISTRY,,}" "${REGISTRY,,}" "${IMAGE_PREFIX,,}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ steps.image.outputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Resolve exact server image
      id: existing
      shell: bash
      env:
        SERVER_IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        SOURCE_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        node scripts/ci/resolve-server-image.mjs

    - name: Free runner disk space
      if: steps.existing.outputs.exists != 'true'
      shell: bash
      run: |
        # Uncached unified-image builds need >20 GB; ubuntu-latest ships with
        # ~14 GB free. Drop preinstalled toolchains we never use.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h / | tail -1

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.image.outputs.repository }}
        flavor: latest=false
        # Production channels advance only after deployment and live smoke.
        tags: |
          type=raw,value=${{ github.sha }}
          type=raw,value=staging,enable=${{ inputs.environment == 'staging' }}
          type=ref,event=tag
        labels: |
          org.opencontainers.image.title=Genfeed Server
          org.opencontainers.image.description=Unified Genfeed server image (all services)
          org.opencontainers.image.vendor=GenFeedAI

    - name: Build and push image
      if: steps.existing.outputs.exists != 'true'
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/Dockerfile.server
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Runtime verification and scanning consume this exact image digest.
        cache-from: type=registry,ref=${{ steps.image.outputs.repository }}:buildcache
        cache-to: type=registry,ref=${{ steps.image.outputs.repository }}:buildcache,mode=max
        secrets: |
          SENTRY_AUTH_TOKEN=${{ inputs.sentry_auth_token }}
        platforms: linux/amd64
        provenance: true
        sbom: true

    - name: Label reused staging candidate
      if: steps.existing.outputs.exists == 'true' && inputs.environment == 'staging'
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        IMAGE_DIGEST: ${{ steps.existing.outputs.digest }}
      run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE_REPOSITORY:staging" "$IMAGE_REPOSITORY@$IMAGE_DIGEST"

    - name: Generate build summary
      shell: bash
      run: |
        echo "## Unified Server Image Built" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "**Digest:** \`${{ steps.existing.outputs.digest || steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
