name: Setup Bun Environment
description: Standardize Node, rolling stable Bun, and cache setup for GitHub Actions jobs.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24.x'
  install-command:
    description: Dependency install command to run after toolchain setup
    required: false
    default: 'bun install --frozen-lockfile'
  cache-turbo:
    description: Whether to cache the local Turbo directory
    required: false
    default: 'true'
  cache-playwright:
    description: |
      Whether to cache Playwright browser binaries (chromium) and install
      them when the cache is cold. Defaults to false so existing callers are
      unaffected.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Cache bun modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

    - name: Cache Turbo
      if: ${{ inputs.cache-turbo == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('turbo.json', '**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    # ffmpeg-static@5.3.0 downloads a ~40 MB binary during install unless
    # FFMPEG_BIN points at an existing file. CI does not execute ffmpeg: the
    # files-service specs mock ffmpeg-static, while production Docker images
    # install ffmpeg and set FFMPEG_BIN themselves. /bin/false therefore skips
    # the flaky download without installing OS packages on every runner, and
    # fails closed if a future CI test accidentally tries to execute it.
    #
    # ffprobe-static@3.1.0 already ships its binary in the package and has no
    # install hook, so it needs no CI override.
    - name: Disable ffmpeg-static binary download in CI
      shell: bash
      run: |
        echo "FFMPEG_BIN=/bin/false" >> "$GITHUB_ENV"

    # Retry with exponential backoff as defense against generic registry/CDN
    # transients (the supported ffmpeg-static download is neutralized above via
    # FFMPEG_BIN; ffprobe-static@3.1.0 has no install-time CDN download).
    # bun install is idempotent, so re-running only re-attempts what is missing. A
    # cold-cache release/deploy runs this across ~35 parallel jobs where a single
    # job's failure cancels the whole deploy via cancel-doomed-run, so 5 attempts
    # with 10/20/40/80s backoff keeps a lone transient from taking the run down.
    - name: Install dependencies
      shell: bash
      env:
        MAX_ATTEMPTS: '5'
      run: |
        for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
          echo "::group::install attempt ${attempt}/${MAX_ATTEMPTS}: ${{ inputs.install-command }}"
          if ${{ inputs.install-command }}; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
            backoff=$((10 * 2 ** (attempt - 1)))
            echo "::warning::install attempt ${attempt}/${MAX_ATTEMPTS} failed; retrying in ${backoff}s"
            sleep "${backoff}"
          fi
        done
        echo "::error::install failed after ${MAX_ATTEMPTS} attempts"
        exit 1

    # Playwright browser binaries — key matches the strategy used by the inline
    # e2e jobs so warm cache entries are reused when jobs migrate here.
    - name: Cache Playwright browsers
      if: ${{ inputs.cache-playwright == 'true' }}
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}

    # GitHub's ubuntu-latest image already contains Chromium's required shared
    # libraries. `install --with-deps` and `install-deps` also apt-install large
    # optional font packs; a throttled Ubuntu mirror made one release shard spend
    # 40+ minutes here. Cache only the browser and never mutate runner packages.
    - name: Install Playwright browser (cache miss)
      if: ${{ inputs.cache-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: npx playwright install chromium
