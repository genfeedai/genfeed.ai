# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# The changelog is generated, never hand-edited (RELEASING.md → Version
# contract). Under squash-only merge every commit subject on master is a PR
# title, so the Conventional Commits type in the PR title decides the section.
#
# Used by:
#   .github/workflows/release.yml  — release body (unreleased section) and the
#                                    full CHANGELOG.md attached to the release
#   locally                        — `bunx git-cliff --unreleased --tag vX.Y.Z`

[changelog]
header = """
# Changelog

Generated by [git-cliff](https://git-cliff.org) from Conventional Commit PR
titles on `master`. Do not edit by hand — fix the PR title before merge.
"""
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}](<REPO>/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [unreleased]
{% endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}

### ⚠ Upgrade note

Breaking changes for self-hosters. Read before upgrading.
{% for commit in breaking %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{%- if commit.breaking_description %} — {{ commit.breaking_description | trim }}{% endif %}
{%- endfor %}
{%- endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/genfeedai/genfeed.ai" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
# `(#1234)` from squash merges → PR link. `<REPO>` is expanded by postprocessors.
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/pull/${2}))" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
skip_tags = "desktop-v.*|mobile-v.*|extension-browser-v.*"

# The `<!-- N -->` prefix is stripped by `striptags`; it only fixes section order.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)|^build\\(deps\\)", group = "<!-- 7 -->Dependencies" },
  { message = "^chore", group = "<!-- 8 -->Maintenance" },
  { message = "^Merge ", skip = true },
  { message = ".*", group = "<!-- 9 -->Other" },
]
