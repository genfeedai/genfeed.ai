margin-bottom:10px}.faq p{color:var(--muted);font-size:13px}.footer{border-top:1px solid rgb(var(--edge)/.15);padding:30px 0 140px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;border:1px solid rgb(var(--edge)/.4);background:hsl(var(--gray-200));box-shadow:0 10px 40px #0009;border-radius:30px;display:flex;align-items:center;gap:16px;padding:10px 16px;white-space:nowrap;font-size:12px;color:rgb(var(--surface))}.switcher a{font-size:18px;line-height:1;padding:6px 12px;border-radius:50%;background:hsl(var(--gray-300))}.switcher .label{min-width:220px;text-align:center}.switcher small{display:block;font-size:9px;color:rgb(var(--surface)/.6);letter-spacing:.06em}.state{background:hsl(var(--card));color:rgb(var(--surface)/.7);padding:18px;margin-top:24px;border:1px solid rgb(var(--edge)/.2);border-radius:6px;font-family:monospace;font-size:11px;white-space:pre-wrap}.service-led{display:grid;grid-template-columns:1.1fr 1fr;border:1px solid rgb(var(--edge)/.4);border-radius:8px;overflow:hidden}.service-led .managed{border:0;border-radius:0}.service-led .managed .body{padding:34px}.service-led .managed h2{font-size:37px}.service-led .scene{position:relative;background:hsl(var(--card));min-height:500px}.scene img{width:100%;height:100%;position:absolute;object-fit:cover}.scene .caption{position:absolute;bottom:0;left:0;right:0;padding:70px 30px 28px;background:linear-gradient(transparent,hsl(var(--background)));font-size:14px}.self-heading{margin:48px 0 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.self-heading h2{font-size:27px}.self-heading p{font-size:13px;color:var(--muted)}.variant-b .self-grid{height:auto}.variant-b .plan{min-height:390px}.variant-b .plan .price.payg{font-size:40px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:22px}.comparison .managed .body{padding:32px}.compact-self{border:1px solid rgb(var(--edge)/.15);border-radius:8px;padding:30px}.compact-self h2{margin:14px 0 10px}.compact-self>p{font-size:14px;color:var(--muted);margin-bottom:26px}.plan-row{padding:20px 0;border-top:1px solid rgb(var(--edge)/.15);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.plan-row h3{font-size:18px}.plan-row p{font-size:11px;color:var(--muted);margin-top:5px}.plan-row .row-price{font-size:23px;letter-spacing:-.03em}.plan-row .row-price small{font-size:12px;color:var(--muted)}.plan-row a{font-size:12px;text-decoration:underline}.compact-self .features{margin-top:22px;font-size:13px}.toast{position:fixed;top:95px;right:30px;max-width:320px;padding:18px 22px;background:hsl(var(--card));color:rgb(var(--surface));border:1px solid rgb(var(--edge)/.3);border-radius:6px;z-index:100;font-size:13px}.book{margin:32px 0;padding:36px;border:1px solid rgb(var(--edge)/.4);border-radius:8px;background:hsl(var(--card))}.book h2{font-size:28px;margin-bottom:16px}.book p{max-width:650px;font-size:14px;color:var(--muted);margin-bottom:18px}.offer-page .hero{max-width:900px}

</style></head><body>
<header><div class="wrap topbar"><a class="logo" href="/pricing">genfeed<span class="muted">.ai</span></a><nav aria-label="Main navigation"><a href="#how">How it works</a><a href="/pricing">Pricing</a><a href="/done-for-you">Done for you</a></nav><a href="#" data-stub="Create your account" class="btn">Start creating ↗</a></div></header>
<main class="wrap" id="app"></main><nav class="switcher" aria-label="Prototype variants"><a id="prev" href="?variant=C" aria-label="Previous variant">←</a><div class="label" id="variant-label"></div><a id="next" href="?variant=B" aria-label="Next variant">→</a></nav>
<script type="application/json" id="prototype-data">__PROTOTYPE_DATA__</script>
<script>
const data = JSON.parse(document.getElementById('prototype-data').textContent);
const keys = ['A', 'B', 'C'];
const names = { A: 'Two lanes · software + service', B: 'Service first · lead with the outcome', C: 'Two choices · compact comparison' };
const verdicts = { A: 'Selected by Vincent: layout A with Genfeed web tokens, a white call CTA, and PAYG $0.01 /credit aligned with subscription prices.', B: 'Maximum service visibility; software pricing follows the managed offer.', C: 'Simpler self-serve / managed decision with less plan detail up front.' };
const image = 'https://cdn.genfeed.ai/assets/branding/website/editorial/page-done-for-you-v1.webp';
const imageAlt = 'Creative production team arranging a campaign shoot in a dark studio';
const fmt = n => new Intl.NumberFormat('en-US').format(n);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const list = items => `<ul class="features">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
function getVariant() { const key = new URL(location.href).searchParams.get('variant'); return keys.includes(key) ? key : 'A'; }
function offerHref() { return `${data.bookingHref.split('#')[0]}?variant=${getVariant()}#book`; }
function offerPrice() { return `<div class="price"><span>From </span>$${fmt(data.service.price)}<small> /month</small></div><p class="note">${escapeHtml(data.service.priceNote)}</p>`; }
function callCta() { return `<a class="btn btn-amber full" href="${offerHref()}">${escapeHtml(data.service.cta)} ↗</a><p class="micro">30 minutes to discuss goals, channels, and scope.</p>`; }
function managedBody(isHero = false) { return `<div class="body"><div class="titleline">${isHero ? '<h2>We run your content.</h2>' : '<h3>Done for you</h3>'}<span class="pill">With our team</span></div><p class="lead">You bring the expertise. We handle strategy, production, and publishing. You approve what goes out.</p><div>${offerPrice()}</div>${list(data.service.includes)}${callCta()}</div>`; }
function managed() { return `<article class="managed"><img src="${image}" alt="${imageAlt}">${managedBody()}</article>`; }
function planCard(plan) {
 const isPayg = plan.tier === 'payg';
 const price = isPayg ? `<div class="price">$${data.creditValue.toFixed(2)}<small> /credit</small></div><p class="sub">No monthly fee · top up from $10</p>` : `<div class="price">$${fmt(plan.launchPrice ?? plan.price)}<small> /mo</small></div><p class="sub">${fmt(plan.includedCredits)} credits / month</p>`;
 return `<article class="plan ${plan.tier}"><h3 class="name">${isPayg ? 'PAYG' : escapeHtml(plan.label)}</h3><div>${price}</div><p class="desc">${isPayg ? 'Buy credits when you need them. Pay for the output you generate.' : escapeHtml(plan.valueProposition)}</p>${plan.launchNote ? `<p class="promo">${escapeHtml(plan.launchNote)}</p>` : ''}${list(plan.features.slice(1, 5))}<a class="btn ${plan.tier === 'pro' ? 'btn-primary' : ''} full" href="#" data-stub="${isPayg ? 'PAYG signup' : escapeHtml(plan.label) + ' signup'}">${isPayg ? 'Get started' : 'Start ' + escapeHtml(plan.label)} ↗</a></article>`;
}
function plans() { return `<div class="self-grid">${data.plans.filter(p => ['payg','pro','scale'].includes(p.tier)).map(planCard).join('')}</div>`; }
function hero() { return `<section class="hero"><p class="eyebrow">Pricing</p><h1>Your content.<br>Your way of working.</h1><p>Run it yourself with credits, or let our team handle the content. Same Genfeed workspace. Choose how hands-on you want to be.</p></section>`; }
function VariantA() { return `${hero()}<div class="lanes"><section><div class="lane-label eyebrow">Self-serve · you run it</div>${plans()}</section><section><div class="lane-label eyebrow accent">Done for you · we run it</div>${managed()}</section></div>`; }
function VariantB() { return `<section class="hero"><p class="eyebrow accent">Software when you need it. A team when you don't have one.</p><h1>Content handled.<br>Keep building.</h1><p>Choose a managed content retainer, or create and publish yourself with Genfeed.</p></section><section class="service-led"><article class="managed">${managedBody(true)}</article><div class="scene"><img src="${image}" alt="${imageAlt}"><p class="caption">Your brand. Your workspace.<br><strong>A team that takes it from idea to published.</strong></p></div></section><div class="self-heading"><h2>Prefer to run it yourself?</h2><p>PAYG for occasional output. Pro and Scale for steady publishing.</p></div>${plans()}`; }
function VariantC() {
 const rows = data.plans.filter(p => ['payg','pro','scale'].includes(p.tier)).map(plan => `<div class="plan-row"><div><h3>${plan.tier === 'payg' ? 'Pay as you go' : escapeHtml(plan.label)}</h3><p>${plan.tier === 'payg' ? 'No monthly fee · top up from $10' : fmt(plan.includedCredits) + ' monthly credits'}${plan.launchNote ? '<br>' + escapeHtml(plan.launchNote) : ''}</p></div><div><div class="row-price">${plan.tier === 'payg' ? '$0.01<small> /credit</small>' : '$' + fmt(plan.launchPrice ?? plan.price) + '<small> /mo</small>'}</div><a href="#" data-stub="${escapeHtml(plan.label)} signup">Get started ↗</a></div></div>`).join('');
 return `${hero()}<div class="comparison"><section class="compact-self"><p class="eyebrow">01 · Do it yourself</p><h2>You create. Genfeed helps.</h2><p>Generate, review, and publish in your own workspace. Pay for output as you go, or subscribe for included credits.</p>${rows}${list(['Unlimited brands and connected channels','PAYG: 1 seat, 1 organization, app access','Pro: unlimited seats, 1 organization, API','Scale: shared credits, multiple organizations, higher API limits'])}</section><section class="managed">${managedBody()}</section></div>`;
}
function enterprise() { return `<aside class="enterprise"><div><h3>Enterprise · Custom terms</h3><p>For organization-wide governance: SSO, white-label, custom API limits, and an SLA.</p></div><a href="${offerHref()}" class="btn">Talk to sales ↗</a></aside><div class="summary"><span>No monthly fee on PAYG. Top up from $10.</span><span>Paid plans include API access. Credits cover generated output.</span></div>`; }
function serviceProcess() { return `<section class="section" id="how"><div class="section-intro"><h2>From your expertise<br>to published content.</h2><p>A monthly service with a scope you agree on before we start. Your team keeps final approval.</p></div><div class="steps">${data.service.process.map((step,index) => `<article class="step"><span class="eyebrow accent">0${index+1}</span><h3>${escapeHtml(step.step)}</h3><p>${escapeHtml(step.description)}</p></article>`).join('')}</div><div class="offer-details"><p><strong style="color:var(--text)">Agree on the scope before we start.</strong><br>Deliverables, channels, timing, review rounds, and the treatment of software credits are confirmed on the call.</p><a class="btn" href="/done-for-you?variant=${getVariant()}">Explore Done for you ↗</a></div></section>`; }
function outputs() { return `<section class="section"><div class="section-intro"><h2>What self-serve output costs.</h2><p>1 credit = $${data.creditValue.toFixed(2)} at the PAYG rate. Every job shows its price before you run it.</p></div><div class="outputs">${data.outputs.map(row => `<div class="output"><p>${escapeHtml(row.label)}</p><strong>$${(row.credits * data.creditValue).toFixed(2)}</strong><small>${fmt(row.credits)} credits</small></div>`).join('')}</div></section>`; }
function faq() { return `<section class="section faq"><article><h3>Is PAYG a free plan?</h3><p>There is no monthly subscription fee. Account creation is free; generated content uses credits that you buy. Start with a $10 top-up.</p></article><article><h3>Is Done for you a software subscription?</h3><p>It is a monthly content service starting at $${fmt(data.service.price)}. We agree on output, channels, timing, review rounds, and how software credits are covered before you start.</p></article></section>`; }
function offerPage() { return `<div class="offer-page"><section class="hero"><p class="eyebrow accent">Done for you · Monthly content retainer</p><h1>We run your content.<br>You run your business.</h1><p>You bring the expertise, raw ideas, and final approvals. We handle strategy, production, and publishing.</p></section><section class="service-led"><article class="managed"><div class="body"><div>${offerPrice()}</div>${list(data.service.includes)}${callCta()}</div></article><div class="scene"><img src="${image}" alt="${imageAlt}"><p class="caption">A service built around your channels and your content volume.</p></div></section>${serviceProcess()}<section class="book" id="book"><p class="eyebrow accent">Book a call</p><h2>Let's scope your content.</h2><p>30 minutes on your goals, audience, channels, and output target. We'll agree on deliverables, timing, review rounds, and how credits are covered. The retainer starts at $${fmt(data.service.price)}/month.</p><a class="btn btn-amber" href="#" data-stub="Call booking">Choose a time ↗</a><p class="micro" style="margin-top:18px">Prototype: booking is a preview. Production uses the existing calendar on /done-for-you#book.</p></section></div>`; }
function render() {
 const variant = getVariant(); const isOffer = location.pathname === '/done-for-you';
 document.getElementById('app').innerHTML = `<div class="prototype-note"><span>LOCAL DESIGN PROTOTYPE · ${isOffer ? 'Done for you' : 'Pricing'}</span><a href="${isOffer ? '/pricing?variant=' + variant : '/done-for-you?variant=' + variant}">${isOffer ? 'Back to pricing' : 'Preview service page'} ↗</a></div><div class="variant-${variant.toLowerCase()}">${isOffer ? offerPage() : ({A:VariantA,B:VariantB,C:VariantC}[variant])() + enterprise() + serviceProcess() + outputs() + faq()}</div><div class="state" aria-label="Prototype state">${escapeHtml(JSON.stringify({variant, layout:names[variant], page:location.pathname, payg:'$0.01 / credit · no monthly fee', retainer:'From $2,500 / month', cta:'Book a call', bookingTarget:data.bookingHref, source:'Existing pricing contract + shared service offering', writes:'None: signup and booking are previews', verdict:verdicts[variant]},null,2))}</div><footer class="footer"><span>© 2026 GENFEED.AI</span><span>One workspace. Software or a team.</span></footer>`;
 document.getElementById('variant-label').innerHTML = `${variant} · ${names[variant]}<small>THROWAWAY PROTOTYPE · ← → TO COMPARE</small>`;
 const index=keys.indexOf(variant); for(const [id,offset] of [['prev',-1],['next',1]]) { const url=new URL(location.href);url.searchParams.set('variant',keys[(index+offset+keys.length)%keys.length]);document.getElementById(id).href=url.pathname+url.search; }
 if(location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
document.querySelector('.switcher').addEventListener('click', event => { const link=event.target.closest('a');if(!link || event.metaKey || event.ctrlKey)return;event.preventDefault();history.pushState({},'',link.href);render(); });
document.addEventListener('keydown', event => { if(event.target.closest('input,textarea,select,[contenteditable]') || event.altKey || event.ctrlKey || event.metaKey || !['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();document.getElementById(event.key==='ArrowLeft'?'prev':'next').click(); });
document.addEventListener('click', event => { const link=event.target.closest('[data-stub]');if(!link)return;event.preventDefault();document.querySelector('.toast')?.remove();const toast=document.createElement('div');toast.className='toast';toast.setAttribute('role','status');toast.textContent=link.dataset.stub + ' preview — no signup, payment, or booking is submitted.';document.body.append(toast);setTimeout(()=>toast.remove(),4500); });
addEventListener('popstate',render);render();
