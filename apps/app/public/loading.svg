<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title">
  <title id="title">Loading Genfeed</title>
  <style>
    svg {
      color: #090909;
      opacity: 0;
      animation: reveal 180ms ease 220ms forwards;
    }
    .trace {
      fill: none;
      stroke: currentColor;
      stroke-width: 62;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 2.4s cubic-bezier(0.72, 0, 0.2, 1) 220ms infinite;
    }
    .fill {
      fill: currentColor;
      opacity: 0;
      animation: fill 2.4s cubic-bezier(0.22, 1, 0.36, 1) 220ms infinite;
    }
    @keyframes reveal { to { opacity: 1; } }
    @keyframes draw {
      0% { stroke-dashoffset: 1; opacity: 1; }
      62% { stroke-dashoffset: 0; opacity: 1; }
      74%, 88% { stroke-dashoffset: 0; opacity: 0; }
      89% { stroke-dashoffset: 1; opacity: 0; }
      100% { stroke-dashoffset: 1; opacity: 1; }
    }
    @keyframes fill {
      0%, 57% { opacity: 0; }
      70%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) { svg { color: #f1eee7; } }
    @media (prefers-reduced-motion: reduce) {
      svg { animation: none; opacity: 1; }
      .trace { display: none; }
      .fill { animation: none; opacity: 1; }
    }
  </style>
