<!-- Reconstructed fixture from inspected class names; not captured successful publication DOM. -->
<div class="feed-shared-update-v2" data-urn="urn:li:activity:{{POST}}">
  <div class="update-components-actor"><a href="/in/post-author/">Post Author</a></div>
  <div class="update-components-text">The post being replied to</div>
  <form class="comments-comment-box__form">
    <div class="comments-comment-box-comment__text-editor">
      <div class="ql-editor" contenteditable="true" role="textbox"><p>Own reply</p></div>
    </div>
    <button class="comments-comment-box__submit-button comments-comment-box__submit-button--cr" type="submit"><span>Comment</span></button>
  </form>
  <div class="comments-comments-list">
    <article class="comments-comment-entity" data-id="urn:li:comment:(urn:li:activity:{{POST}},{{OLD_COMMENT}})">
      <div class="comments-comment-meta"><a href="/in/commenter/">Commenter</a></div>
      <span class="comments-comment-item__main-content">An earlier comment</span>
    </article>
  </div>
</div>
