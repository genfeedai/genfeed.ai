<!-- Reconstructed from LinkedIn's newer feed layout as inspected live on 2026-10-26 (component keys, test ids, labels); not a captured publication. -->
<div role="list" data-testid="mainFeed">
  <div role="listitem" componentkey="update-card-focusCARD">
    <button aria-label="Open control menu for post by Post Author"></button>
    <p data-testid="expandable-text-box">The post being answered</p>
    <div componentkey="commentsSectionContainerCARD">
      <div data-testid="commentListCARD">
        <div componentkey="replaceableComment_urn:li:comment:(ugcPost:{{POST}},{{OLD_COMMENT}})">
          <div componentkey="CommentComponentReference_urn:li:comment:(ugcPost:{{POST}},{{OLD_COMMENT}})">
            <a href="https://www.linkedin.com/in/someone-else/">Someone Else</a>
            <span data-testid="expandable-text-box">An earlier comment</span>
            <button type="button">Reply</button>
          </div>
        </div>
      </div>
      <div id="feed-comment-box">
        <div data-testid="ui-core-tiptap-text-editor-wrapper">
          <div contenteditable="true" role="textbox" aria-label="Text editor for creating comment">Own reply</div>
        </div>
        <div>
          <button aria-label="Show Emoji Picker"></button>
          <button aria-label="Share photo"></button>
          <div><button type="button" id="feed-comment-submit"><span>Comment</span></button></div>
        </div>
      </div>
    </div>
  </div>
</div>
